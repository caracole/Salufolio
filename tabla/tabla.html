/* ═══════════════════════════════════════════════════════════════════════
   TABLA DETALLADA — programa autónomo de Salufolio V2
   Versión 2026.11.05-13:12:33
   (05/11/2026 : el tableau ocupa toda la altura de la ventana — P-H.)
   (05/11/2026 : el constat de un año, etapa 2 — el comentario de la IA.)
   (05/11/2026 : las curvas nuevas con un color de la paleta común, no negras — P-H.)
   (05/11/2026 : el clic derecho, la curva y el comentario de la IA en la ventana común — P-H.)
   (05/11/2026 : el constat de un año, sin la IA — P-H.)
   (05/11/2026 : años sin análisis en gris ; título « Análisis detallados » — P-H.)
   (04/11/2026 : por la tabla de sinónimos ; textos en 4 lenguas — P-H.)

   Extraído de la V1: core-table-js.js (36 funciones — la tabla, el filtro,
   los comentarios clínicos), core-panels-html.html (líneas 110-127), y sus
   dependencias tomadas en su fuente.
   ═══════════════════════════════════════════════════════════════════════ */
const VERSION_PROGRAMA = SF_CONFIG.version;
const APP_VERSION = SF_CONFIG.version;
const APP_VERSION_DATE = SF_CONFIG.version;

/* ══ LES PONTS vers mf.js ══ */
var _DATOS=null;
function loadData(){   return (_DATOS && (MF.mesuresCanon ? MF.mesuresCanon(_DATOS) : _DATOS.mesures)) || []; }   /* por la tabla de sinónimos (P-H, 04/11/2026) */
function loadEvents(){ return (_DATOS && _DATOS.events) || []; }
function loadMeds(){   return (_DATOS && _DATOS.medicaments) || []; }
function getPatientLabel(){ var p=MF.paciente(); return p.etiqueta || p.matricula || ''; }
function saveData(){ if(_DATOS) MF.tocado(); }
function showPanel(){}           /* un seul panneau ici : rien à changer */
function grupoDeCle(k){ return (typeof grupoDe==='function')? grupoDe(k) : ''; }




/* ================================================================
   UTILITAIRES
================================================================ */
/* Petit toast de statut (bas de l'écran, auto-disparition) — utilisé par
   les actions rapides (vaccins, changement de statut médicament, etc.)
   pour confirmer une action sans bloquer avec une alert(). Historiquement
   appelé mais jamais défini nulle part -> "status is not a function". */
function status(msg) {
  var el = document.getElementById('mf-status-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'mf-status-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);' +
      'background:var(--surface2);color:var(--text);border:1px solid var(--accent);' +
      'border-radius:8px;padding:10px 18px;font-size:13px;z-index:20000;' +
      'box-shadow:0 4px 16px rgba(0,0,0,0.35);opacity:0;transition:opacity .2s;pointer-events:none';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(function() { el.style.opacity = '0'; }, 2600);
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function getStatus(key, val) {
  const p = PARAMS[key];
  if (!p || !p.ref) return 'ok';
  const [lo, hi] = p.ref;
  if (lo !== null && val < lo) return 'bad';
  if (hi !== null && val > hi) return 'bad';
  return 'ok';
}
function getSeriesForParam(data, key) {
  /* v2026.7.21.10 — chaque point porte sa ROCHE-MÈRE : pdf_id + pdf voyagent
     avec la valeur (Lavoisier appliqué aux graphiques). */
  return data.filter(m => m.vals && (m.vals||{})[key] !== undefined)
             .map(m => ({ x: m.date, y: (m.vals||{})[key], src: m.src, pdf_id: m.pdf_id, pdf: m.pdf }))
             .sort((a,b) => a.x.localeCompare(b.x));
}

/* v2026.7.21.10 — « el médico no se lo creerá: ¿dónde está el informe? » (P-H) :
   un clic sur un point OUVRE le document source (résolu via le registre pdfs).
   Sans carpeta configurée, on affiche au moins le nom du document. */
/* P-H 09/08 : le PDF s'affiche dans un POPUP MAISON — déplaçable par sa
   poignée, redimensionnable par le coin bas-droit (poignée native du
   navigateur), fermable par ✕. Le document est rendu par la visionneuse
   PDF intégrée de Brave, DANS le popup. Pur HTML, zéro serveur. */
/* P-H 09/08-10/08 : « mets en relief HEMOGLOBINA dans le pdf » — la
   visionneuse de Brave ne surligne pas sur commande, alors l'app dessine
   ELLE-MÊME la page avec pdf.js (déjà embarqué pour l'OCR) et pose des
   surlignages dorés sur chaque occurrence du paramètre ET de sa valeur.
   Navigation ◀ ▶ entre les pages, redessin au redimensionnement du popup.
   Sans pdf.js ou PDF illisible (scan) : repli sur la visionneuse embed. */
function _pdfPopupShell(titulo, info) {
  document.querySelectorAll('.pdf-popup-maison').forEach(function(o) { o.remove(); });
  var pop = document.createElement('div');
  pop.className = 'pdf-popup-maison';
  pop.style.cssText = 'position:fixed;z-index:10002;width:min(900px,94vw);height:82vh;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:4px;display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:280px;min-height:160px';
  pop.style.left = 'calc(50% - min(450px,47vw))';
  pop.style.top = '40px';
  var banda = info ? '<div class="pdf-popup-banda" style="flex:0 0 auto;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--border)">🔍 Verificar en el documento: <b style="color:' + info.color + '">' + info.label + '</b> = <b>' + info.valor + '</b> ' + info.unidad + ' (' + (typeof fmtDate === 'function' ? fmtDate(info.fecha) : info.fecha) + ')<span class="pdf-popup-extra"></span></div>' : '';
  pop.innerHTML =
    '<div class="pdf-popup-drag" style="cursor:move;user-select:none;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 6px;border-bottom:1px solid var(--border)">' +
    '<b style="font-size:13px">📄 ' + titulo + '</b>' +
    '<span style="cursor:pointer;color:var(--muted);font-size:16px" onclick="this.closest(\'.pdf-popup-maison\').remove()">✕</span></div>' + banda +
    '<div class="pdf-popup-cuerpo" style="flex:1;min-height:0;overflow:auto;position:relative"></div>';
  document.body.appendChild(pop);
  (function() {
    var poignee = pop.querySelector('.pdf-popup-drag');
    var dragging = false, sx = 0, sy = 0, ol = 0, ot = 0;
    function pt(e) { return e.touches && e.touches[0] ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }
    function down(e) { if (e.target.tagName === 'SPAN' && e.target.getAttribute('onclick')) return; dragging = true; var p = pt(e); sx = p.x; sy = p.y; var r = pop.getBoundingClientRect(); ol = r.left; ot = r.top; e.preventDefault(); }
    function move(e) { if (!dragging) return; var p = pt(e); pop.style.left = Math.max(0, Math.min(window.innerWidth - 80, ol + p.x - sx)) + 'px'; pop.style.top = Math.max(0, Math.min(window.innerHeight - 40, ot + p.y - sy)) + 'px'; }
    function up() { dragging = false; }
    poignee.addEventListener('mousedown', down);
    poignee.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  })();
  return { pop: pop, cuerpo: pop.querySelector('.pdf-popup-cuerpo'), extra: pop.querySelector('.pdf-popup-extra') };
}

function _pdfPopupAbrir(url, titulo, info) {
  var sh = _pdfPopupShell(titulo, info);
  sh.cuerpo.innerHTML = '<embed src="' + url + '" type="application/pdf" style="width:100%;height:100%;border:0">';
}

/* P-H 06/10/2026 : el PDF vive en pacientes/<matrícula>/sources/ — la Casa lo sirve ; si no está, se dice dónde debería estar */
function _pdfSinArchivo(nom, motivo) {
  var mat = ''; try { mat = (MF.paciente().matricula || ''); } catch (e) {}
  var porque = (window.MF && MF.motivoPdf) ? MF.motivoPdf(motivo) : 'archivo no encontrado en sources/';
  var msg = '📄 ' + ((window.MF && MF.tituloPdf) ? MF.tituloPdf(nom) : nom) + ' — ' + porque + ' (pacientes/' + (mat || '<matrícula>') + '/sources/)';
  var det = document.getElementById('xz-cmt-detalle');
  if (det) { det.textContent = '🧪 ' + msg; return; }
  document.querySelectorAll('.sf-pdf-aviso').forEach(function(o) { o.remove(); });
  var o = document.createElement('div'); o.className = 'sf-pdf-aviso';
  o.style.cssText = 'position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:10003;max-width:min(520px,90vw);background:var(--surface);color:var(--text);border:2px solid var(--accent);border-radius:10px;padding:16px 20px;font-size:13px;line-height:1.6;box-shadow:0 12px 40px rgba(0,0,0,.5)';
  o.textContent = msg + ' ';
  var b = document.createElement('button'); b.className = 'btn'; b.textContent = (window.MF && MF.palabra) ? MF.palabra('cerrar') : 'Cerrar'; b.style.cssText = 'font-size:12px;padding:3px 14px;margin-top:10px;display:block';
  b.onclick = function() { o.remove(); }; o.appendChild(b); document.body.appendChild(o);
}

async function _pdfPopupAbrirEnPagina(url, titulo, info, nom) {
  if (typeof pdfjsLib === 'undefined') {
    /* sin pdf.js : se pide el archivo a la Casa y se muestra con el visor del navegador */
    if (!url && nom && window.MF && MF.pdfRespuesta) {
      var mo = ''; try { var rr = await MF.pdfRespuesta(nom); if (rr.ok) { _pdfPopupAbrir(URL.createObjectURL(await rr.blob()), titulo, info); return; } mo = rr.headers.get('X-Sf-Motivo') || ''; } catch (e) {}
      _pdfSinArchivo(nom, mo); return;
    }
    _pdfPopupAbrir(url, titulo, info); return;
  }
  var doc;
  /* P-H 10/08 : un file:// ne peut PAS être lu par fetch NI par le worker
     pdf.js depuis une page file:// (CORS « origin null », mur définitif).
     La seule voie propre pour récupérer les OCTETS (nécessaires au rendu
     maison + surlignage) est le serveur, qui sert le PDF en http:// —
     guichet /api/pdf déjà là. Repli sur l'embed file:// si pas de serveur
     (l'embed, lui, le navigateur l'autorise). */
  try {
    var buf = null;
    if (nom) {
      var srv = (typeof baseSalufolio === 'function' && baseSalufolio()) ? baseSalufolio() : 'http://localhost:7777';
      var stem = /\.pdf$/i.test(nom) ? nom.slice(0, -4) : nom;
      var r = await (window.MF && MF.pdfRespuesta ? MF.pdfRespuesta(stem) : fetch(srv + '/api/pdf?n=' + encodeURIComponent(stem)));
      if (r.ok) buf = await r.arrayBuffer();
    }
    if (!buf && url) buf = await (await fetch(url)).arrayBuffer(); /* dernier recours file:// */
    if (!buf) throw new Error('sin-pdf:' + ((typeof r !== 'undefined' && r && r.headers && r.headers.get('X-Sf-Motivo')) || ''));
    doc = await pdfjsLib.getDocument({ data: buf }).promise;
  }
  catch (e) { if (url) { _pdfPopupAbrir(url, titulo, info); return; } _pdfSinArchivo(nom, String((e && e.message) || '').replace(/^sin-pdf:?/, '')); return; }
  try {
    var labelMin = (info && info.label) ? info.label.toLowerCase() : null;
    /* Les formes sous lesquelles le laboratoire peut écrire CETTE valeur.
       P-H 11/08 : le feutre ratait les valeurs > 1000 — le .sf porte 2583
       mais le PDF imprime « 2.583,00 » (point de milliers à l'espagnole).
       Faute de la trouver, le feutre continuait et surlignait le LABEL sur
       une autre page (« elevación de Dímero D... » p4 au lieu du 2.583 p2).
       On fabrique donc toutes les écritures plausibles de la même valeur. */
    var valores = [];
    if (info) {
      var n = Number(info.valor);
      var brut = String(info.valor);
      valores.push(brut);                         /* 2583   ·  13.8   */
      valores.push(brut.replace('.', ','));       /* 2583   ·  13,8   */
      if (isFinite(n) && Math.abs(n) >= 1000) {
        /* séparateur de milliers espagnol : le point */
        var ent = Math.trunc(Math.abs(n));
        var dec = brut.indexOf('.') >= 0 ? brut.split('.')[1] : '';
        var mil = String(ent).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        valores.push(mil);                        /* 2.583            */
        valores.push(mil + ',' + (dec || '00'));  /* 2.583,00         */
        valores.push(mil + ',' + (dec || '0'));   /* 2.583,0          */
      } else if (isFinite(n) && Number.isInteger(n)) {
        /* un entier peut être imprimé avec décimales : 235 → 235,00 */
        valores.push(brut + ',00');
        valores.push(brut + ',0');
      }
      valores = valores.filter(function (v, i, a) { return v && a.indexOf(v) === i; });
    }
    /* P-H 10/08 : « affiche la page qui tient le 1er feutre ». On ouvre
       donc la première page où quelque chose SERA surligné — c.-à-d. la
       valeur (le repère le plus sûr) ou, à défaut, le label. On cherche
       la valeur en priorité (page du vrai feutre), le label ne servant
       que de repli s'il n'y a aucune valeur nulle part. */
    var pagina = 1, pageValeur = 0, pageLabel = 0, textoVacio = true;
    if (labelMin || valores.length) {
      for (var pnum = 1; pnum <= doc.numPages; pnum++) {
        var pg = await doc.getPage(pnum);
        var tc0 = await pg.getTextContent();
        var texto = tc0.items.map(function(it) { return it.str; }).join(' ');
        if (texto.trim()) textoVacio = false;
        var tl = texto.toLowerCase();
        if (!pageValeur && valores.some(function(v) { return v && texto.indexOf(v) !== -1; })) pageValeur = pnum;
        if (!pageLabel && labelMin && tl.indexOf(labelMin) !== -1) pageLabel = pnum;
        if (pageValeur) break; /* la page du feutre-valeur trouvée, on s'arrête */
      }
      pagina = pageValeur || pageLabel || 1;
    }
    if (textoVacio) { try { doc.destroy(); } catch (e) {} _pdfPopupAbrir(url, titulo, info); return; } /* scan sans OCR */
    var sh = _pdfPopupShell(titulo, info);
    var barra = document.createElement('div');
    barra.style.cssText = 'flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:3px 6px;border-bottom:1px solid var(--border);font-size:12px';
    barra.innerHTML = '<button class="pdf-pg-prev" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 8px">◀</button>' +
      '<span class="pdf-pg-info"></span>' +
      '<button class="pdf-pg-next" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 8px">▶</button>' +
      '<span class="pdf-pg-nb" style="color:var(--muted)"></span>';
    sh.pop.insertBefore(barra, sh.cuerpo);
    sh.cuerpo.style.background = colorDe('visor_fondo', 'background-color', '--surface2');
    sh.cuerpo.style.textAlign = 'center';
    var actual = pagina;
    async function dibujar(pnum) {
      actual = pnum;
      sh.cuerpo.innerHTML = '';
      var page = await doc.getPage(pnum);
      var vp1 = page.getViewport({ scale: 1 });
      var ancho = Math.max(300, sh.cuerpo.clientWidth - 20);
      var scale = ancho / vp1.width;
      var vp = page.getViewport({ scale: scale });
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:relative;display:inline-block;margin:8px 0;box-shadow:0 2px 10px rgba(0,0,0,.4)';
      var canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height;
      wrapper.appendChild(canvas);
      sh.cuerpo.appendChild(wrapper);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      var tc = await page.getTextContent();
      var nb = 0, premierTop = null;
      tc.items.forEach(function(it) {
        var s = (it.str || '');
        var hit = (labelMin && s.toLowerCase().indexOf(labelMin) !== -1) ||
                  valores.some(function(v) { return v && s.indexOf(v) !== -1; });
        if (!hit) return;
        nb++;
        var tx = pdfjsLib.Util.transform(vp.transform, it.transform);
        var h = Math.hypot(tx[2], tx[3]) || 12;
        var d = document.createElement('div');
        d.style.cssText = 'position:absolute;background:rgba(255,200,0,.45);outline:1.5px solid rgba(230,150,0,.9);border-radius:2px;pointer-events:none;left:' + (tx[4] - 2) + 'px;top:' + (tx[5] - h) + 'px;width:' + (it.width * scale + 4) + 'px;height:' + (h * 1.2) + 'px';
        wrapper.appendChild(d);
        if (premierTop === null) premierTop = tx[5] - h;
      });
      barra.querySelector('.pdf-pg-info').textContent = 'página ' + pnum + ' / ' + doc.numPages;
      barra.querySelector('.pdf-pg-nb').textContent = nb ? ('🟡 ' + nb + ' resaltado' + (nb > 1 ? 's' : '')) : '';
      if (premierTop !== null) sh.cuerpo.scrollTop = Math.max(0, premierTop - 60);
    }
    barra.querySelector('.pdf-pg-prev').onclick = function() { if (actual > 1) dibujar(actual - 1); };

/* v2026.7.21.4 — échelle par courbe : Lin (par défaut) ⇄ Log (natif Chart.js).
   Le BNP à 11924 (TEP 2022, valeur RÉELLE et grave) écrasait les valeurs
   récentes en linéaire ; en log, le pic ET les variations fines cohabitent.
   L'état vit dans _chartScale[key] ; le bouton dans le titre bascule et redessine. */
window._chartScale = window._chartScale || {};

/* v2026.7.21.17 — P-H avait RAISON sur l'échelle : l'app applique un zoom CSS
   (document.body.style.zoom, module languages) que Chart.js ignore dans ses
   calculs de souris → mauvais point détecté, doigt posé à côté. On calcule
   donc NOUS-MÊMES la position du curseur, auto-calibrée par le rapport
   rect/offsetWidth — juste quel que soit le zoom/l'échelle en vigueur. */
function _chartPosEvento(chart, ev) {
  var rect = chart.canvas.getBoundingClientRect();
  var f = (rect.width / (chart.canvas.offsetWidth || rect.width)) || 1;
  return { x: (ev.clientX - rect.left) / f, y: (ev.clientY - rect.top) / f };
}
function _chartPuntoCercano(chart, ev) {
  var pos = _chartPosEvento(chart, ev);
  var meta = chart.getDatasetMeta(0);
  var best = -1, bd = Infinity, dist = Infinity;
  (meta && meta.data || []).forEach(function(el, i) {
    var d = Math.abs(el.x - pos.x);
    if (d < bd) { bd = d; best = i; dist = Math.hypot(el.x - pos.x, el.y - pos.y); }
  });
  return { index: best, precis: dist <= 16 };
}
function makeChart(canvasId, key, data, opts) {
  opts = opts || {};
  /* v2026.7.21.8 — les opts sont mémorisées par canvas : les redraws
     (bascule d'échelle, resize) conservent l'habillage d'origine. */
  window._chartOpts = window._chartOpts || {};
  _chartOpts[canvasId] = opts;
  var rejilla = opts.claro ? '#e6e6de' : colorDe('curva_rejilla', 'color', '--border');
  const p = PARAMS[key];
  const series = getSeriesForParam(data, key);
  if (!series.length) return;
  const esLog = (_chartScale[key] === 'log');
  const labels = series.map(s => fmtDate(s.x));
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (chartInstances[canvasId]) { chartInstances[canvasId].destroy(); }
  window._chartSeries = window._chartSeries || {};
  _chartSeries[canvasId] = series;
  chartInstances[canvasId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: p.label,
        data: series.map(s => s.y),
        borderColor: p.color,
        backgroundColor: p.color + '18',
        pointBackgroundColor: series.map(s => getStatus(key, s.y) === 'bad' ? colorDe('curva_mal', 'color', '--danger') : p.color),
        pointRadius: 5, pointHoverRadius: (opts.sinTooltip ? 5 : 7), pointHitRadius: 14, tension: 0.3, fill: false,
      }]
    },
    options: {
      responsive: true,
      /* v2026.7.21.10 — clic sur un point → ver informe (le survol l'annonce) */
      /* v2026.7.21.16 (P-H : « manque de sensibilité » + « un doigt à la
         place du curseur ») : le SURVOL est généreux — n'importe où sur la
         courbe, c'est le point le plus proche en X qui parle au pavé ; le
         CLIC reste précis — il n'ouvre l'informe que pile sur le rond ; et
         le curseur devient un DOIGT 👆 quand un rond est saisi. */
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      onClick: (e, els, chart) => {
        try {
          const pc = _chartPuntoCercano(chart, e.native || e);
          if (pc.precis) { const s = series[pc.index]; if (s && (s.pdf_id || s.pdf)) _chartVerInforme(s, key); }
        } catch (er) {}
      },
      /* v2026.7.21.15 (conception P-H : « affiche le texte dans la popup et
         point final ») : le survol d'un point nourrit le pavé DIRECTEMENT,
         sans dépendre de l'infobulle — que celle-ci soit activée ou non. */
      onHover: (e, els, chart) => {
        const ev = e.native || e;
        let pc = { index: -1, precis: false };
        try { pc = _chartPuntoCercano(chart, ev); } catch (er) {}
        try { const cible = ev.target || chart.canvas; if (cible) cible.style.cursor = pc.precis ? 'pointer' : 'default'; } catch (er) {}
        if (pc.index < 0 || typeof window._chartPuntoHover !== 'function') return;
        const s = series[pc.index] || {};
        const v = s.y;
        const doc = (typeof pdfNombre === 'function' && (s.pdf_id || s.pdf)) ? pdfNombre(s.pdf_id || s.pdf) : (s.src || '');
        try { _chartPuntoHover({ param: (p.label || key), fecha: s.x, valor: v, unidad: p.unit || '', fuera: getStatus(key, v) === 'bad', doc: doc, tienePdf: !!(s.pdf_id || s.pdf) }); } catch (er) {}
      },
      plugins: { legend: { display: false }, tooltip: { enabled: !opts.sinTooltip, callbacks: {
        afterLabel: c => {
          const s = series[c.dataIndex] || {};
          const fuera = getStatus(key, c.raw) === 'bad';
          const l = [fuera ? '⚠ Fuera de rango' : '✓ Normal'];
          const doc = (typeof pdfNombre === 'function' && (s.pdf_id || s.pdf)) ? pdfNombre(s.pdf_id || s.pdf) : (s.src || '');
          if (doc) l.push('📄 ' + doc);
          if (s.pdf_id || s.pdf) l.push('(clic: ver informe)');
          return l;
        }
      }}},
      scales: {
        x: { grid: { color: rejilla } },
        y: { type: esLog ? 'logarithmic' : 'linear',
             grid: { color: rejilla }, ticks: { maxTicksLimit: 6 },
             title: { display: true, text: p.unit + ' — ' + _tblTx('vista') + ' ' + (esLog ? 'LOG' : 'LIN') } }
      }
    },
    plugins: [{
      id: 'ref', beforeDraw(chart) {
        if (!p.ref) return;
        const [lo, hi] = p.ref;
        if (lo === null && hi === null) return;
        const { ctx, chartArea: { left, right, top, bottom }, scales: { y } } = chart;
        ctx.save(); ctx.fillStyle = 'rgba(30,180,100,0.06)';
        const yTop = hi !== null ? y.getPixelForValue(Math.min(hi, y.max)) : top;
        const yBot = lo !== null ? y.getPixelForValue(Math.max(lo, y.min)) : bottom;
        ctx.fillRect(left, yTop, right - left, yBot - yTop);
        ctx.restore();
      }
    }]
  });
}

/* Helper: tooltip interactif pour les noms de paramètres */
function paramTip(key) {
  const p = PARAMS[key];
  if (!p) return '';
  const ref = p.ref ? p.ref.filter(v=>v!==null).join('–') + ' ' + p.unit : 'sin rango definido';
  return p.desc + '\nRef: ' + ref;
}
/* Tooltip global : un seul élément fixé au body, mesuré puis positionné —
   jamais rogné, jamais étroit (délégation : fonctionne pour tout .param-tip). */
(function initParamTip() {
  if (typeof document === 'undefined') return;
  let box = null;
  function ensureBox() {
    if (!box) { box = document.createElement('div'); box.id = 'param-tipbox'; document.body.appendChild(box); }
    return box;
  }
  document.addEventListener('mouseover', function (e) {
    const t = e.target && e.target.closest ? e.target.closest('[data-ptip]') : null;
    if (!t || !t.getAttribute('data-ptip')) return;
    const b = ensureBox();
    /* livrée : or-sur-bleu pour les corrélations (P-H), défaut sinon */
    if (t.classList && t.classList.contains('corr-tip')) {
      b.style.background = 'linear-gradient(135deg, var(--corr-tip-bg1), var(--corr-tip-bg2))';
      b.style.color = 'var(--corr-tip-color)';
      b.style.border = '1.5px solid var(--corr-tip-border)';
    } else {
      b.style.background = ''; b.style.color = ''; b.style.border = '';
    }
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    b.innerHTML = (t.getAttribute('data-ptip') || '').split('\n')
      .map(l => l.indexOf('Ref:') === 0
        ? '<span style="color:' + colorDe('curva_ref', 'color', '--ok') + ';font-weight:600">' + esc(l) + '</span>'
        : esc(l)).join('<br>');
    b.classList.remove('on');
    b.style.left = '0px'; b.style.top = '-9999px';   /* mesurer hors écran */
    const r = t.getBoundingClientRect();
    const bw = b.offsetWidth, bh = b.offsetHeight;
    let x = Math.min(Math.max(6, r.left), window.innerWidth - bw - 6);
    let y = r.top - bh - 8;
    if (y < 6) y = r.bottom + 8;                      /* pas de place en haut → dessous */
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.classList.add('on');
  });
  document.addEventListener('mouseout', function (e) {
    const t = e.target && e.target.closest ? e.target.closest('[data-ptip]') : null;
    if (t && box) box.classList.remove('on');
  });
  document.addEventListener('scroll', function () { if (box) box.classList.remove('on'); }, true);
})();

function paramSpan(key, shortLabel, extraStyle) {
  const p = PARAMS[key];
  if (!p) return key;
  const ref = p.ref ? p.ref.filter(v=>v!==null).join(' – ') + ' ' + p.unit : '';
  /* P-H 07/08 : fondu avec l'indication clic droit dans LA MÊME bulle
     rapide (data-ptip) — l'ancien title="" natif du <td> parent avait un
     délai imposé par le navigateur, impossible à raccourcir en JS. */
  const tip = (p.desc || p.label) + (ref ? '\nRef: ' + ref : '') + '\n🖱️ ' + _tblTx('tip_clics');
  const label = shortLabel || p.label;
  return '<span class="param-tip" data-ptip="' + tip.replace(/"/g, '&quot;') + '" onclick="glosarioMostrarToast(\'' + key.replace(/'/g,"") + '\', event)" style="cursor:pointer' + (extraStyle ? ';'+extraStyle : '') + '">' + label + '</span>';
}

/* Alias court pour templates */
function paramTip(key, short) {
  return paramSpan(key, short);
}

function fillParamSelect() {
  const sel = document.getElementById('m-param');
  if (!sel) return;
  sel.innerHTML = '<option value="">— ' + (t('lbl_param')||'Parámetro') + ' —</option>';

  /* Paramètres prédéfinis — triés alphabétiquement */
  const optGroup1 = document.createElement('optgroup');
  optGroup1.label = 'Parámetros estándar';
  Object.entries(PARAMS)
    .sort((a, b) => a[1].label.localeCompare(b[1].label))
    .forEach(([k,p]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = p.label + ' (' + p.unit + ')';
      optGroup1.appendChild(opt);
    });
  sel.appendChild(optGroup1);

  /* Paramètres personnalisés */
  const customs = loadCustomParams();
  if (Object.keys(customs).length) {
    const optGroup2 = document.createElement('optgroup');
    optGroup2.label = 'Mis parámetros';
    Object.entries(customs).forEach(([k,p]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = p.label + ' (' + p.unit + ')';
      optGroup2.appendChild(opt);
    });
    sel.appendChild(optGroup2);
  }

  /* Option pour ajouter un nouveau */
  const sep = document.createElement('option');
  sep.disabled = true; sep.textContent = '────────────────';
  sel.appendChild(sep);
  const addOpt = document.createElement('option');
  addOpt.value = '__NEW__'; addOpt.textContent = '➕ Nuevo parámetro...';
  addOpt.style.color = 'var(--accent)';
  sel.appendChild(addOpt);

  /* Remplir la datalist des sources */
  fillSourceList();
}

function fillSourceList() {
  const sel = document.getElementById('m-source-select');
  if (!sel) return;

  /* Collecter toutes les sources connues */
  const sources = new Set();
  loadData().forEach(d => { if (d.src) sources.add(d.src); });
  loadEvents().forEach(e => { if (e.src) sources.add(e.src); });
  loadCustomSources().forEach(s => sources.add(s));

  /* Garder la sélection actuelle */
  const prev = sel.value;

  sel.innerHTML = '<option value="">— Seleccionar fuente —</option>';

  /* Sources existantes */
  [...sources].sort().forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });

  /* Séparateur + option nouvelle */
  if (sources.size > 0) {
    const sep = document.createElement('option');
    sep.disabled = true; sep.textContent = '────────────────';
    sel.appendChild(sep);
  }
  const addOpt = document.createElement('option');
  addOpt.value = '__NEW_SOURCE__'; addOpt.textContent = '➕ Nueva fuente...';
  sel.appendChild(addOpt);

  /* Restaurer sélection si possible */
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function onSourceChange() {
  const sel = document.getElementById('m-source-select');
  const inp = document.getElementById('m-source-new');
  if (sel.value === '__NEW_SOURCE__') {
    inp.style.display = 'block';
    inp.focus();
  } else {
    inp.style.display = 'none';
    inp.value = '';
  }
}

function getSelectedSource() {
  const sel = document.getElementById('m-source-select');
  if (sel.value === '__NEW_SOURCE__') {
    return document.getElementById('m-source-new').value.trim() || '';
  }
  return sel.value || '';
}

/* Gestion des paramètres personnalisés */
const CUSTOM_PARAMS_KEY = 'mt_custom_params';
const CUSTOM_SOURCES_KEY = 'mt_custom_sources';

function loadCustomParams() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_PARAMS_KEY) || '{}'); } catch { return {}; }
}
function saveCustomParams(p) { localStorage.setItem(CUSTOM_PARAMS_KEY, JSON.stringify(p)); }
function loadCustomSources() {

function addCustomSource(src) {

/* ══ LA TABLA DE SINÓNIMOS (P-H, 04/11/2026 : « Tableau détaillé, il apporte quoi ? ») ══
   Con DSF2026 solo salían « Constantes (2) » : sus mesures dicen HEMOGLOBINA, SODIO, UREA — como el documento —
   y aquí solo se conocían las claves del programa. Ahora loadData() pasa por MF.mesuresCanon (como Courbes),
   y las claves que la tabla común conoce y este catálogo no (gasometría, proteinograma, escalas…) entran
   con su etiqueta en la lengua de la casa, su unidad y su grupo ; sin rango de referencia (nadie lo ha dado). */
(function(){
  if (!window.SF_SINONIMOS_PARAMETROS || !MF.parametro || !MF.parametros) return;
  /* un color de VERDAD para cada curva nueva (P-H, 05/11/2026 : « la couleur de la courbe est en noir ») : Chart.js no entiende
     « var(--accent) » y pinta en negro. Un pavé de la paleta común, por turno, como en Courbes ; si falta, el acento tal como se ve. */
  let _iCol = 0;
  window._tblColorNuevo = function(){ const P = (window.SF_PALETA_COLORES && SF_PALETA_COLORES.paves) || [];
    if (P.length) return P[_iCol++ % P.length].color;
    return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#4a8fe8'; };
  const otros = GRUPOS.OTROS; delete GRUPOS.OTROS;
  MF.parametros().forEach(k => {
    const e = MF.parametro(k);
    if (!e || !e.curva) return;
    const g = e.grupo || 'OTROS';
    if (!PARAMS[k]) PARAMS[k] = { get label() { const x = MF.parametro(k); return (x && x.etiqueta) || k; }, unit: e.unidad || '', ref: null, color: _tblColorNuevo(),
                                  get desc() { const x = MF.parametro(k); return (x && x.etiqueta) || k; } };
    if (g === 'OTROS') { if (otros.indexOf(k) < 0 && grupoDe(k) === 'OTROS') otros.push(k); return; }
    if (!GRUPOS[g]) GRUPOS[g] = [];
    if (grupoDe(k) === 'OTROS' && GRUPOS[g].indexOf(k) < 0) GRUPOS[g].push(k);
  });
  GRUPOS.OTROS = otros;
})();
/* los textos de la página, en la lengua de la casa (tabla.idiomas.js) ; un grupo : su nombre en la tabla, o en la tabla común */
function _tblTx(k){ const T = (window.SF_TEXTOS && SF_TEXTOS.textos) || {}; let lg = 'es'; try { lg = MF.idioma() || 'es'; } catch (e) {} return (T[lg] && T[lg][k]) || (T.es && T.es[k]) || k; }

  const x = (T[lg] && T[lg]['grupo_' + g]) || (((window.SF_SINONIMOS_PARAMETROS || {}).grupos || {})[g] || {})[lg] || g;

/* ══ EL CONSTAT DE UN AÑO (P-H, 05/11/2026 : « si on clique sur une année, un commentaire d'évolution ? » — GO 1) ══
   Sin la IA, al instante, cada línea sale directamente de las cifras :
   · lo que está fuera de las normas ese año ;
   · los mayores cambios frente al año anterior que tiene análisis ;
   · las anomalías que duran (fuera de las normas varios años seguidos, entre los años en que se midió).
   Lo regulable en tabla.js (« constat ») ; los textos en tabla.idiomas.js. La IA vendrá después (etapa 2). */
function _tblCfgConstat(){ return Object.assign({ cambio: 0.2, banda: 0.5, max_cambios: 10, min_anios_dura: 2 }, (window.SF_CONFIG && SF_CONFIG.constat) || {}); }
function _tblEsc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function _tblF(d){ return d && d.length >= 10 ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : (d || ''); }
function _tblUltimo(k, anio){   /* la última toma de ese parámetro en ese año : [fecha, valor, n tomas, n fuera] */
  const L = (tblState.data || []).filter(m => m.date && m.date.slice(0, 4) === anio && m.vals && m.vals[k] !== undefined && !isNaN(parseFloat(m.vals[k])))
    .sort((a, b) => a.date < b.date ? -1 : 1);
  if (!L.length) return null;
  const u = L[L.length - 1], M = L.filter(m => getStatus(k, parseFloat(m.vals[k])) === 'bad'), um = M[M.length - 1];
  /* [fecha, valor, n tomas, n fuera, fecha y valor de la última FUERA de las normas] */
  return [u.date, parseFloat(u.vals[k]), L.length, M.length, um ? um.date : null, um ? parseFloat(um.vals[k]) : null];
}
function _tblRefTxt(r){   /* [lo, hi] → « 70–110 », « ≤ 116 », « ≥ 60 » */
  if (!r) return ''; const lo = r[0], hi = r[1];
  return lo !== null && hi !== null ? lo + '–' + hi : hi !== null ? '≤ ' + hi : lo !== null ? '≥ ' + lo : '';
}
function _tblConstat(anio){
  const C = _tblCfgConstat(), keys = (tblState.filter && tblState.filter.length) ? tblState.filter : (tblState.keys || []);
  const anios = [...new Set((tblState.data || []).map(m => (m.date || '').slice(0, 4)).filter(Boolean))].sort().reverse();
  const prev = anios.find(a => a < anio);                       /* el año anterior QUE TIENE análisis */
  const nom = k => _tblEsc((PARAMS[k] && PARAMS[k].label) || k), uni = k => _tblEsc((PARAMS[k] && PARAMS[k].unit) || '');
  const ref = k => { const s = _tblRefTxt(PARAMS[k] && PARAMS[k].ref); return s ? ' <span class="tc-ref">' + _tblEsc(_tblTx('tc_normes').split('{r}').join(s)) + '</span>' : ''; };
  /* 1 · fuera de las normas */
  const fuera = [];
  keys.forEach(k => { const u = _tblUltimo(k, anio); if (u && u[3]) fuera.push({ k: k, u: u }); });
  /* 2 · los mayores cambios frente a prev */
  const cambios = [];
  if (prev) keys.forEach(k => {
    const u = _tblUltimo(k, anio), p = _tblUltimo(k, prev); if (!u || !p) return;
    const c = (u[1] - p[1]) / (Math.abs(p[1]) || 1); if (Math.abs(c) < C.cambio) return;
    /* lo que cuenta para un médico : cruzar el límite de las normas, o moverse una buena parte de su anchura —
       0.1 → 0 basófilos es un -100 % que no dice nada */
    const r = PARAMS[k] && PARAMS[k].ref, ancho = (r && r[0] !== null && r[1] !== null) ? (r[1] - r[0]) : null;
    const cruza = getStatus(k, u[1]) !== getStatus(k, p[1]), peso = ancho ? Math.abs(u[1] - p[1]) / ancho : Math.abs(c);
    if (!cruza && ancho && peso < C.banda) return;
    cambios.push({ k: k, u: u, p: p, c: c, cruza: cruza, peso: peso });
  });
  cambios.sort((a, b) => (b.cruza - a.cruza) || (b.peso - a.peso));
  /* 3 · lo que dura : fuera de las normas este año y los años anteriores en que se midió, seguidos */
  const dura = [];
  fuera.forEach(x => {
    const serie = anios.filter(a => a <= anio && _tblUltimo(x.k, a)); let n = 0, desde = anio;
    for (const a of serie) { const u = _tblUltimo(x.k, a); if (u && u[3]) { n++; desde = a; } else break; }
    if (n >= C.min_anios_dura) dura.push({ k: x.k, n: n, desde: desde });
  });
  dura.sort((a, b) => b.n - a.n);
  /* la ventana */
  let h = '<div class="tc-ayuda">' + _tblEsc(_tblTx('tc_ayuda')) + '</div>';
  h += '<div class="tc-tit">' + _tblEsc(_tblTx('tc_fuera')) + ' · ' + fuera.length + '</div>';
  h += fuera.length ? fuera.map(x => '<div class="tc-fila"><span class="tc-n">' + nom(x.k) + '</span><span class="tc-v tc-mal">' + _tblEsc(x.u[5]) + ' <span class="tc-u">' + uni(x.k) + '</span></span>'
       + '<span class="tc-d">' + _tblF(x.u[4]) + (x.u[2] > 1 ? ' · ' + _tblEsc(_tblTx(x.u[3] === 1 ? 'tc_n_fuera_1' : 'tc_n_fuera').split('{a}').join(x.u[3]).split('{b}').join(x.u[2])) : '') + '</span>' + ref(x.k) + '</div>').join('')
     : '<div class="tc-nada">' + _tblEsc(_tblTx('tc_ninguno')) + '</div>';
  h += '<div class="tc-tit">' + _tblEsc(prev ? _tblTx('tc_cambios').split('{a}').join(prev) : _tblTx('tc_sin_prev')) + (prev ? ' · ' + Math.min(cambios.length, C.max_cambios) : '') + '</div>';
  if (prev) h += cambios.length ? cambios.slice(0, C.max_cambios).map(x => '<div class="tc-fila"><span class="tc-n">' + nom(x.k) + '</span>'
       + '<span class="tc-v">' + _tblEsc(x.p[1]) + ' → <b class="' + (getStatus(x.k, x.u[1]) === 'bad' ? 'tc-mal' : '') + '">' + _tblEsc(x.u[1]) + '</b> <span class="tc-u">' + uni(x.k) + '</span></span>'
       + '<span class="tc-fl ' + (x.c > 0 ? 'tc-sube' : 'tc-baja') + '">' + (x.c > 0 ? '↑ +' : '↓ ') + Math.round(x.c * 100) + ' %</span>'
       + (x.cruza ? '<span class="tc-cruza">' + _tblEsc(_tblTx(getStatus(x.k, x.u[1]) === 'bad' ? 'tc_sale' : 'tc_vuelve')) + '</span>' : '') + '</div>').join('')
     : '<div class="tc-nada">' + _tblEsc(_tblTx('tc_sin_cambios').split('{p}').join(Math.round(C.cambio * 100))) + '</div>';
  h += '<div class="tc-tit">' + _tblEsc(_tblTx('tc_dura')) + ' · ' + dura.length + '</div>';
  h += dura.length ? dura.map(x => '<div class="tc-fila"><span class="tc-n">' + nom(x.k) + '</span><span class="tc-d">'
       + _tblEsc(_tblTx('tc_n_anios').split('{n}').join(x.n).split('{a}').join(x.desde).split('{b}').join(anio)) + '</span></div>').join('')
     : '<div class="tc-nada">' + _tblEsc(_tblTx('tc_nada_dura')) + '</div>';
  /* lo que la IA recibirá : los parámetros del constat, desde el año de comparación (o el comienzo de « lo que dura ») */
  const _ks = [...new Set(fuera.map(x => x.k).concat(cambios.slice(0, C.max_cambios).map(x => x.k)).concat(dura.map(x => x.k)))];
  const _desde = [prev || anio].concat(dura.map(x => x.desde)).sort()[0];
  _tcUltimo = { anio: anio, prev: prev || '', desde: _desde, ks: _ks,
    huella: _ks.map(k => { const u = _tblUltimo(k, anio); return k + ':' + (u ? u[0] + '=' + u[1] : ''); }).join(',') };
  h += _tblConstatIAHtml(anio);
  if (_tcVentana && _tcVentana.cierra) { try { _tcVentana.cierra(); } catch (e) {} }
  _tcVentana = MF.ventana('📅 ' + _tblEsc(_tblTx('tc_titulo').split('{a}').join(anio)), h, { ancho: '640px' });
}

/* ── EL CONSTAT, ETAPA 2 : EL COMENTARIO DE LA IA (P-H, 05/11/2026) ──
   El texto de la demanda vive en comun/prompt-comentario-anio.js, nunca aquí. Se envían los valores
   del año, del año de comparación (y desde el comienzo de « lo que dura »), con sexo, edad y — si la

   Se guarda por paciente y por año ; se imprime con o sin nombre y SIP, como el de las curvas. */
let _tcVentana = null, _tcUltimo = null;

async function _tblConstatIA(anio){
  const u = _tcUltimo; if (!u || u.anio !== anio) return;
  if (!(MF.claveIA && MF.claveIA())) { MF.pideClave(function(){ _tblConstat(anio); }); return; }

  SF_COMENTARIO_IA.preguntaImpresion(f => SF_COMENTARIO_IA.imprime({ titulo: _tblTx('tc_titulo').split('{a}').join(anio), paciente: f.nombre ? (pa.etiqueta || '') : '', sip: f.sip ? sip : '',

function registerCustomParam() {
  const label = document.getElementById('cp-label').value.trim();
  const unit  = document.getElementById('cp-unit').value.trim() || '';
  const refStr = document.getElementById('cp-ref').value.trim();

  if (!label) return null;

  /* Générer une clé machine depuis le label */
  const key = 'custom_' + label.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

  /* Parser ref "min-max" */
  let ref = null;
  if (refStr) {
    const parts = refStr.split(/[-–—]/);
    if (parts.length === 2) {
      ref = [parseFloat(parts[0]) || null, parseFloat(parts[1]) || null];
    }
  }

  /* Sauvegarder dans PARAMS (runtime) et localStorage */
  const customs = loadCustomParams();
  const paramDef = { label, unit, ref, color: '#7f8c8d', desc: 'Parámetro personalizado: ' + label };
  customs[key] = paramDef;
  PARAMS[key] = paramDef;
  saveCustomParams(customs);

  /* Reset les champs */
  document.getElementById('cp-label').value = '';
  document.getElementById('cp-unit').value = '';
  document.getElementById('cp-ref').value = '';
  document.getElementById('custom-param-box').style.display = 'none';

  /* Recharger le select et sélectionner le nouveau */
  fillParamSelect();
  document.getElementById('m-param').value = key;

  return key;
}



function grupoDe(key) {
  for (const [g, cles] of Object.entries(GRUPOS)) if (cles.includes(key)) return g;
  return 'OTROS';
}

function unitOf(key) { return ((PARAMS[key] && PARAMS[key].unit) || '').trim(); }

          '<button id="_btn-cancel" class="btn" style="padding:8px 16px">' + t('confirm_send_cancel') + '</button>' +

        '</div>' +

      if (document.getElementById('_skip-confirm-cb')?.checked) _skipConfirmThisSession = true;

/* ══ AGARRAR Y MOVER (P-H 18/07, depuis l'hôpital : « plutôt qu'utiliser
   ascenseur horizontal et vertical, pourquoi pas click+move ») ══
   La table se prend en main : clic maintenu + mouvement = panoramique
   dans les deux axes. Seuil de 4 px : un clic simple reste un clic
   (les cellules gardent leurs actions), un glisser ne déclenche rien. */
function mfDragScroll(el) {
  if (!el || el._mfDrag) return;
  el._mfDrag = true;
  el.style.cursor = 'grab';
  var sx, sy, sl, st, down = false, moved = false;
  el.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    down = true; moved = false;
    sx = e.clientX; sy = e.clientY; sl = el.scrollLeft; st = el.scrollTop;
    el.style.cursor = 'grabbing';
    e.preventDefault();                       /* pas de sélection de texte en route */
  });
  window.addEventListener('mousemove', function(e) {
    if (!down) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) moved = true;
    if (moved) { el.scrollLeft = sl - dx; el.scrollTop = st - dy; }
  });
  window.addEventListener('mouseup', function() {
    if (!down) return;
    down = false; el.style.cursor = 'grab';
    if (moved) {                              /* on a glissé : le clic qui suit est avalé */
      var kill = function(ev) { ev.stopPropagation(); ev.preventDefault(); el.removeEventListener('click', kill, true); };
      el.addEventListener('click', kill, true);
      setTimeout(function() { el.removeEventListener('click', kill, true); }, 60);
    }
  });
}
/* toutes les tables larges de la maison reçoivent la poignée */
window.addEventListener('load', function() {
  setTimeout(function() {
    document.querySelectorAll('.data-table-wrap').forEach(mfDragScroll);
    /* P-H 18/07 : le glisser remplace les ascenseurs — ils disparaissent
       (la molette déroule toujours ; Maj+molette = horizontal, natif). */
    var st = document.createElement('style');
    st.textContent = '.data-table-wrap{scrollbar-width:none}.data-table-wrap::-webkit-scrollbar{display:none}';
    document.head.appendChild(st);
  }, 400);
});

/* ── Courbe en popup depuis la table (idée P-H 13/07 soir) : clic droit sur
   un paramètre → sa courbe d'évolution + commentaire calculé. ── */
/* Mise en forme légère du texte de Claude (P-H 07/08 : « GENIAL !!! » puis
   « mettre en caractères llamativos ») — convertit le **gras** Markdown en
   vrai gras, et met en évidence les lignes-titres en gras (comme "Preguntas
   sugeridas para el médico:") avec une couleur qui accroche l'œil. Jamais
   de texte exact recherché — Claude ne formule pas toujours pareil. */
function formatearComentarioClaude(texto) {
  const escapado = texto.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const formatearGras = t => t.split('\n').map(function(ligne) {
    const lt = ligne.trim();
    const m = /^\*\*(.+?):?\*\*\s*:?\s*$/.exec(lt);
    const mDiese = /^#{1,3}\s+(.+)$/.exec(lt); /* # Titre Markdown (P-H 08/08) */
    if (m) return '<div style="margin-top:6px;margin-bottom:2px;font-weight:700;color:var(--accent2, #8a6fd8);font-size:12.5px">' + m[1] + '</div>';
    if (mDiese) return '<div style="margin-top:6px;margin-bottom:2px;font-weight:700;color:var(--accent2, #8a6fd8);font-size:12.5px">' + mDiese[1] + '</div>';
    return ligne.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  }).join('<br>').replace(/<\/div><br>/g, '</div>');
  /* P-H 08/08 : « c'est pourtant pas difficile, tu compliques » — le
     prompt impose maintenant le libellé EXACT "Preguntas sugeridas para
     el médico:" (voir tblCurveComentario) ; ici, on cherche ce texte
     précis. Tout avant → gauche. Lui et tout ce qui suit → droite. CQFD. */
  const REPERE = 'Preguntas sugeridas para el médico:';
  const idx = escapado.indexOf(REPERE);
  if (idx === -1) return '<div style="flex:1;min-height:0;overflow-y:auto;box-sizing:border-box;font-size:12px;line-height:1.5">' + formatearGras(escapado) + '</div>';

  /* Si Claude a quand même entouré le repère de **, retirer les
     astérisques orphelins des deux côtés de la coupure (P-H 08/08,
     trouvé par mon propre test). */
  let gauche = escapado.slice(0, idx).replace(/\*\*\s*$/, '').trim();
  let apresRepere = escapado.slice(idx + REPERE.length).replace(/^\s*\*\*/, '').trim();
  const droiteHtml = '<div style="margin-bottom:2px;font-weight:700;color:var(--accent2, #8a6fd8);font-size:12.5px">' +
    REPERE.replace(/:$/, '') + '</div>' + formatearGras(apresRepere);

  /* P-H 08/08 : « j'ai peur » — plus jamais de table ici, ton modèle
     n'en a aucune. Exactement ton patron .col / .col-content : deux
     div côte à côte (flex), chacune avec sa propre zone défilante. */
  return '<div style="display:flex;flex:1;min-height:0;font-size:12px;line-height:1.5;border:1px solid var(--border);overflow:hidden">' +
    '<div style="flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)">' +
      '<div style="flex:1 1 auto;overflow-y:auto;padding:10px 12px;box-sizing:border-box">' + formatearGras(gauche) + '</div></div>' +
    '<div style="flex:1;display:flex;flex-direction:column">' +
      '<div style="flex:1 1 auto;overflow-y:auto;padding:10px 12px;box-sizing:border-box">' + droiteHtml + '</div></div>' +
    '</div>';
}

  document.body.appendChild(toast);
  (function() {
    var poignee = toast.querySelector('.tblcurve-toast-drag');
    if (!poignee) return;
    var dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
    function getPoint(e) { return e.touches && e.touches[0] ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }
    function onDown(e) { dragging = true; var p = getPoint(e); startX = p.x; startY = p.y; var r = toast.getBoundingClientRect(); origLeft = r.left; origTop = r.top; e.preventDefault(); e.stopPropagation(); }
    function onMoveDrag(e) { if (!dragging) return; var p = getPoint(e); var w = toast.offsetWidth, h = toast.offsetHeight; toast.style.left = Math.max(0, Math.min(window.innerWidth - w, origLeft + (p.x - startX))) + 'px'; toast.style.top = Math.max(0, Math.min(window.innerHeight - h, origTop + (p.y - startY))) + 'px'; }
    function onUp() { dragging = false; }
    poignee.addEventListener('mousedown', onDown);
    poignee.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('mousemove', onMoveDrag);
    window.addEventListener('touchmove', onMoveDrag, { passive: false });
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp);
  })();
  setTimeout(function() {
    document.addEventListener('mousedown', function fermer(e) {
      if (!toast.contains(e.target)) { toast.remove(); document.removeEventListener('mousedown', fermer); }

function _tblDocAttr(k, pt) {

  return ' data-doc="' + e(pt.pdf) + '" data-k="' + e(k) + '" data-v="' + e(pt.v) + '" data-f="' + e(pt.date) + '" data-ptip="' + e(_tblTx('tip_doc')) + '"';
}

function tblToggleMulti(td) {
  /* P-H 07/08, 3e passe : « moins gênant de voir la table changer de
     dimensions » — le détail s'affiche en SUPERPOSITION (overlay fixe,
     près de la cellule), la table ne bouge plus jamais d'un pixel. */
  document.querySelectorAll('.tbl-multi-overlay').forEach(o => o.remove());
  if (td.dataset.ouvert === '1') { td.dataset.ouvert = '0'; return; }
  td.dataset.ouvert = '1';
  const r = td.getBoundingClientRect();
  const overlay = document.createElement('div');
  overlay.className = 'tbl-multi-overlay';
  overlay.dataset.pourCellule = td.id;

  const left = Math.min(r.left, window.innerWidth - 150);
  const top = Math.min(r.bottom + 4, window.innerHeight - 150);
  overlay.style.left = Math.max(6, left) + 'px';
  overlay.style.top = top + 'px';
  overlay.innerHTML = td.dataset.expanded.replace(/&quot;/g, '"');
  document.body.appendChild(overlay);
  setTimeout(function() {
    document.addEventListener('mousedown', function fermer(e) {
      if (!overlay.contains(e.target) && e.target !== td) {
        overlay.remove(); td.dataset.ouvert = '0';
        document.removeEventListener('mousedown', fermer);

}

/* LA ALTURA (P-H, 05/11/2026 : « la table n'occupe pas toute la hauteur du container ») — la hoja común lo limitaba a 75vh.
   El marco llega al pie de la ventana : menos lo que hay debajo (el letrero de demostración) y un margen ; la página no se desplaza. */
function _tblAltura(){
  const w = document.querySelector('.data-table-wrap'); if (!w) return;
  const cs = getComputedStyle(document.documentElement), marge = parseInt(cs.getPropertyValue('--tbl-marge-bas')) || 12;
  const demo = document.getElementById('sf-demo'), abajo = demo ? demo.getBoundingClientRect().height : 0;
  let h = Math.max(200, window.innerHeight - w.getBoundingClientRect().top - abajo - marge);
  w.style.maxHeight = h + 'px'; w.style.height = h + 'px';
  const exc = document.documentElement.scrollHeight - window.innerHeight;   /* lo que aún sobresale (márgenes del panel) */
  if (exc > 0) { h = Math.max(200, h - exc); w.style.maxHeight = h + 'px'; w.style.height = h + 'px'; }
}
window.addEventListener('resize', function(){ clearTimeout(window._tblAT); window._tblAT = setTimeout(_tblAltura, 120); });
function renderTable() {
  setTimeout(_tblAltura, 0);   /* cada vez que se dibuja : filtro, plegado, lengua */
  /* ── COLONNES-ANNÉES (P-H 07/08, pensé au déjeuner) : une seule colonne
     par année, plus jamais de répétition — fini le "année en gris" qui
     ne faisait que déguiser plusieurs colonnes-dates pour la même année.
     Une cellule peut contenir 0, 1 ou PLUSIEURS valeurs (même paramètre,
     même année, dates différentes) — 1 seule → badge normal comme avant ;
     plusieurs → petit badge "N valores" cliquable, ouvre une bulle avec
     le détail daté, chaque ligne colorée selon son propre statut. ── */
  const { keys, data } = tblState;
  const head = document.getElementById('tbl-head');
  const body = document.getElementById('tbl-body');
  const visKeys = tblState.filter || keys;

  const parDate = {};
  data.forEach(m => {
    if (!parDate[m.date]) parDate[m.date] = { vals: {}, srcs: [] };
    Object.assign(parDate[m.date].vals, m.vals || {});
    if (m.pdf_id) Object.keys(m.vals || {}).forEach(k => { (parDate[m.date].pdf = parDate[m.date].pdf || {})[k] = m.pdf_id; });   /* P-H 06/11/2026 : el documento de cada valor */
    if (m.src) parDate[m.date].srcs.push(m.src);
  });
  const _conDatos = [...new Set(data.map(m => m.date.slice(0, 4)))]
    .filter(a => visKeys.some(k => data.some(m => m.date.slice(0, 4) === a && m.vals && m.vals[k] !== undefined)))
    .sort().reverse();
  /* P-H, 05/11/2026 : « étrange qu'en 2019 il n'y a rien ? » — todos los años entre el primero y el último ;
     un año sin análisis queda a la vista, estrecho y gris (« ça évite les questions ») */
  const anneesUtiles = [];
  if (_conDatos.length) for (let y = +_conDatos[0]; y >= +_conDatos[_conDatos.length - 1]; y--) anneesUtiles.push(String(y));
  /* toutes les dates d'une année donnée, triées chronologiquement */
  const datesDeAnnee = {};
  anneesUtiles.forEach(a => { datesDeAnnee[a] = [...new Set(data.map(m => m.date))].filter(d => d.slice(0, 4) === a).sort(); });

  const stickyTh = 'position:sticky;left:0;top:0;z-index:5;background:var(--surface);text-align:left;padding:6px 10px;min-width:170px;border-right:1px solid var(--border)';
  const stickyTd = 'position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:5px 10px;white-space:nowrap;border-right:1px solid var(--border)';

  const sep = 'border-left:1px solid var(--border);';   /* séparateur de colonnes (P-H) */
  head.innerHTML = '';
  const tr = document.createElement('tr');
  tr.innerHTML = '<th style="' + stickyTh + ';cursor:pointer" onclick="tblToggleTodo()" data-ptip="' + _tblTx('tip_todo') + '">' + _tblTx('lbl_param') + ' ⇕</th>' +
    anneesUtiles.map(a => {
      const srcTip = datesDeAnnee[a].flatMap(d => parDate[d].srcs).join(String.fromCharCode(10)).replace(/"/g, '&quot;');
      if (!datesDeAnnee[a].length) return '<th class="tbl-vacio" data-ptip="' + _tblTx('anio_vacio') + '" style="' + sep + '">' + a + '</th>';
      return '<th class="param-tip tc-clic" onclick="_tblConstat(\'' + a + '\')" data-ptip="' + _tblTx('tc_tip') + '&#10;' + srcTip + '" style="' + sep + 'padding:6px 8px;white-space:nowrap;font-size:11px;vertical-align:bottom;text-align:center;font-weight:700;color:var(--accent)">' + a + '</th>';
    }).join('');
  head.appendChild(tr);

  /* lignes dans l ordre des rubriques */
  const ordre = Object.keys(GRUPOS).concat('OTROS');
  const grupoDeCle = k => { for (const [g, cs] of Object.entries(GRUPOS)) if (cs.includes(k)) return g; return 'OTROS'; };
  const parGrupo = {};
  visKeys.forEach(k => { const g = grupoDeCle(k); (parGrupo[g] = parGrupo[g] || []).push(k); });

  body.innerHTML = '';
  const fermesStock = tblGroupesFermes();
  tblState.grupos = ordre.filter(g => parGrupo[g]);
  tblState.grupos.forEach(g => {
    const ferme = fermesStock === null ? true : fermesStock.includes(g);
    const trg = document.createElement('tr');
    trg.style.cursor = 'pointer';
    trg.title = ferme ? 'Ver' : 'Ocultar';
    trg.onclick = function() { tblToggleGrupo(g); };
    /* Rubrique REPLIÉE = carte thermique : par année, vert si tout est dans
       les normes, rouge si tout est hors normes, orange si mélange (P-H
       13/07) — désormais agrégée sur TOUTES les dates de l'année. */
    const cellules = anneesUtiles.map(a => {
      if (!datesDeAnnee[a].length) return '<td class="tbl-vacio" style="' + sep + '"></td>';
      if (!ferme) return '<td style="' + sep + 'background:rgba(128,128,128,.05)"></td>';
      let ok = 0, mal = 0;
      datesDeAnnee[a].forEach(d => {
        parGrupo[g].forEach(k => {
          const v = parDate[d].vals[k];
          if (v === undefined) return;
          getStatus(k, v) === 'bad' ? mal++ : ok++;
        });
      });
      if (!ok && !mal) return '<td style="' + sep + '"></td>';
      const r = mal / (ok + mal);
      const R = Math.round(63 + (248 - 63) * r);
      const G = Math.round(185 + (81 - 185) * r);
      const B = Math.round(80 + (73 - 80) * r);
      const fond = 'rgba(' + R + ',' + G + ',' + B + ',.58)';
      const info = ok + ' ' + _tblTx('dentro_rango') + (mal ? ' · ' + mal + ' ' + _tblTx('fuera_rango') + ' (' + Math.round(r * 100) + '%)' : '');
      return '<td style="' + sep + 'background:' + fond + '" data-ptip="' + info + '"></td>';
    }).join('');
    trg.innerHTML = '<td style="' + stickyTd + ';font-size:10px;letter-spacing:.6px;color:var(--accent);font-weight:700;padding-top:10px">' +
      (ferme ? '▸ ' : '▾ ') + _tblGrupoNom(g) + ' <span style="color:var(--muted);font-weight:400">(' + parGrupo[g].length + ')</span></td>' + cellules;
    body.appendChild(trg);
    if (ferme) return;
    parGrupo[g].forEach(k => {
      const p = PARAMS[k] || {};
      const trp = document.createElement('tr');
      trp.oncontextmenu = function(e) { e.preventDefault(); tblShowCurve(k); };
      trp.innerHTML = '<td style="' + stickyTd + ';cursor:context-menu">' + paramSpan(k) +
        ' <span style="color:var(--muted);font-size:9px">' + (p.unit || '') + '</span></td>' +
        anneesUtiles.map(a => {
          const puntos = datesDeAnnee[a].map(d => ({ date: d, v: parDate[d].vals[k], pdf: (parDate[d].pdf || {})[k] })).filter(x => x.v !== undefined);
          if (!puntos.length) return datesDeAnnee[a].length ? '<td style="' + sep + 'color:var(--border);text-align:center">·</td>' : '<td class="tbl-vacio" style="' + sep + '"></td>';
          if (puntos.length === 1) {
            const st = getStatus(k, puntos[0].v);
            return '<td style="' + sep + 'text-align:center;white-space:nowrap"><span class="' + (st === 'bad' ? 'badge-bad' : 'badge-ok') + '"' + _tblDocAttr(k, puntos[0]) + '>' + puntos[0].v + '</span></td>';
          }
          /* PLUSIEURS valeurs la même année (P-H 07/08, 2e passe : « pas de
             toast » — la cellule s'ouvre sur elle-même) : affiche la plus
             récente, colorée normalement + un petit repère (point) qui dit
             "il y en a d'autres" ; un clic déplie la liste datée dans la
             cellule elle-même, un second clic replie. */
          const derniere = puntos[puntos.length - 1];
          const stD = getStatus(k, derniere.v);
          const collapseHtml = '<span class="' + (stD === 'bad' ? 'badge-bad' : 'badge-ok') + '">' + derniere.v + '</span><span style="color:var(--accent2, #8a6fd8);font-size:8px;vertical-align:top;margin-left:1px">●' + puntos.length + '</span>';
          const expandHtml = puntos.slice().reverse().map(pt => {
            const st = getStatus(k, pt.v);
            const jm = pt.date.slice(8, 10) + '/' + pt.date.slice(5, 7);
            return '<div style="display:flex;justify-content:space-between;gap:6px;font-size:9px;line-height:1.5"><span style="color:var(--muted)">' + jm + '</span><span class="' + (st === 'bad' ? 'badge-bad' : 'badge-ok') + '"' + _tblDocAttr(k, pt) + '>' + pt.v + '</span></div>';
          }).join('');
          const cellId = 'tblc-' + k + '-' + a;
          return '<td style="' + sep + 'text-align:center;white-space:nowrap;cursor:pointer" id="' + cellId + '" data-collapsed="' + collapseHtml.replace(/"/g, '&quot;') + '" data-expanded="' + expandHtml.replace(/"/g, '&quot;') + '" onclick="tblToggleMulti(this)">' + collapseHtml + '</td>';
        }).join('');
      body.appendChild(trp);
    });
  });
}
