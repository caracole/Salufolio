/* ═══════════════════════════════════════════════════════════════════════
   MEDICAMENTOS — programa autónomo de Salufolio V2
   Versión 2026.09.07-14:51:20

   Extraído de la V1: medications-js.js (38 funciones — la lista, la ficha,
   los prescriptores, las recetas), medications-html.html, y sus
   dependencias tomadas en su fuente.

   ESTE PROGRAMA ESCRIBE. Lo que se modifica va al expediente en memoria
   y enciende el 💾 de la banda; nada se escribe en el disco hasta que se
   toca. Es voluntario: se ve lo que se ha cambiado antes de guardarlo.
   ═══════════════════════════════════════════════════════════════════════ */
const VERSION_PROGRAMA = SF_CONFIG.version;
const APP_VERSION = SF_CONFIG.version;
const APP_VERSION_DATE = SF_CONFIG.version;

/* ══ LES PONTS vers mf.js ══
   Celui-ci ÉCRIT : saveMeds range dans le dossier et allume le 💾 de la
   bande du lanceur. Rien n'est écrit sur le disque tant qu'on ne le
   touche pas — la mémoire de travail garde le brouillon. */
var _DATOS=null;
function loadData(){   return (_DATOS && _DATOS.mesures) || []; }
function loadEvents(){ return (_DATOS && _DATOS.events) || []; }
function loadMeds(){   return (_DATOS && _DATOS.medicaments) || []; }
function saveMeds(lista){
  if(!_DATOS) return;
  _DATOS.medicaments = lista || _DATOS.medicaments;
  MF.tocado();                     /* le 💾 s'allume */
}
function saveData(){ if(_DATOS) MF.tocado(); }
function getPatientLabel(){ var p=MF.paciente(); return p.etiqueta || p.matricula || ''; }
function showPanel(){}
/* les prescripteurs vivent dans le dossier */
function loadPrescriptores(){ return (_DATOS && _DATOS.mt_prescripteurs) || []; }
function savePrescriptores(l){ if(_DATOS){ _DATOS.mt_prescripteurs = l; MF.tocado(); } }




/* ================================================================
   UTILITAIRES
================================================================ */
/* Petit toast de statut (bas de l'écran, auto-disparition) — utilisé par
   les actions rapides (vaccins, changement de statut médicament, etc.)
   pour confirmer une action sans bloquer avec une alert(). Historiquement
   appelé mais jamais défini nulle part -> "status is not a function". */
function status(msg) {
  var el = document.getElementById('mf-status-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'mf-status-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);' +
      'background:var(--surface2);color:var(--text);border:1px solid var(--accent);' +
      'border-radius:8px;padding:10px 18px;font-size:13px;z-index:20000;' +
      'box-shadow:0 4px 16px rgba(0,0,0,0.35);opacity:0;transition:opacity .2s;pointer-events:none';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(function() { el.style.opacity = '0'; }, 2600);
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function getStatus(key, val) {
  const p = PARAMS[key];
  if (!p || !p.ref) return 'ok';
  const [lo, hi] = p.ref;
  if (lo !== null && val < lo) return 'bad';
  if (hi !== null && val > hi) return 'bad';
  return 'ok';
}
function getSeriesForParam(data, key) {
  /* v2026.7.21.10 — chaque point porte sa ROCHE-MÈRE : pdf_id + pdf voyagent
     avec la valeur (Lavoisier appliqué aux graphiques). */
  return data.filter(m => m.vals && (m.vals||{})[key] !== undefined)
             .map(m => ({ x: m.date, y: (m.vals||{})[key], src: m.src, pdf_id: m.pdf_id, pdf: m.pdf }))
             .sort((a,b) => a.x.localeCompare(b.x));
}

/* v2026.7.21.10 — « el médico no se lo creerá: ¿dónde está el informe? » (P-H) :
   un clic sur un point OUVRE le document source (résolu via le registre pdfs).
   Sans carpeta configurée, on affiche au moins le nom du document. */
/* P-H 09/08 : le PDF s'affiche dans un POPUP MAISON — déplaçable par sa
   poignée, redimensionnable par le coin bas-droit (poignée native du
   navigateur), fermable par ✕. Le document est rendu par la visionneuse
   PDF intégrée de Brave, DANS le popup. Pur HTML, zéro serveur. */
/* P-H 09/08-10/08 : « mets en relief HEMOGLOBINA dans le pdf » — la
   visionneuse de Brave ne surligne pas sur commande, alors l'app dessine
   ELLE-MÊME la page avec pdf.js (déjà embarqué pour l'OCR) et pose des
   surlignages dorés sur chaque occurrence du paramètre ET de sa valeur.
   Navigation ◀ ▶ entre les pages, redessin au redimensionnement du popup.
   Sans pdf.js ou PDF illisible (scan) : repli sur la visionneuse embed. */
function _pdfPopupShell(titulo, info) {
  document.querySelectorAll('.pdf-popup-maison').forEach(function(o) { o.remove(); });
  var pop = document.createElement('div');
  pop.className = 'pdf-popup-maison';
  pop.style.cssText = 'position:fixed;z-index:10002;width:min(900px,94vw);height:82vh;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:4px;display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:280px;min-height:160px';
  pop.style.left = 'calc(50% - min(450px,47vw))';
  pop.style.top = '40px';
  var banda = info ? '<div class="pdf-popup-banda" style="flex:0 0 auto;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--border)">🔍 Verificar en el documento: <b style="color:' + info.color + '">' + info.label + '</b> = <b>' + info.valor + '</b> ' + info.unidad + ' (' + (typeof fmtDate === 'function' ? fmtDate(info.fecha) : info.fecha) + ')<span class="pdf-popup-extra"></span></div>' : '';
  pop.innerHTML =
    '<div class="pdf-popup-drag" style="cursor:move;user-select:none;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 6px;border-bottom:1px solid var(--border)">' +
    '<b style="font-size:13px">📄 ' + titulo + '</b>' +
    '<span style="cursor:pointer;color:var(--muted);font-size:16px" onclick="this.closest(\'.pdf-popup-maison\').remove()">✕</span></div>' + banda +
    '<div class="pdf-popup-cuerpo" style="flex:1;min-height:0;overflow:auto;position:relative"></div>';
  document.body.appendChild(pop);
  (function() {
    var poignee = pop.querySelector('.pdf-popup-drag');
    var dragging = false, sx = 0, sy = 0, ol = 0, ot = 0;
    function pt(e) { return e.touches && e.touches[0] ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }
    function down(e) { if (e.target.tagName === 'SPAN' && e.target.getAttribute('onclick')) return; dragging = true; var p = pt(e); sx = p.x; sy = p.y; var r = pop.getBoundingClientRect(); ol = r.left; ot = r.top; e.preventDefault(); }
    function move(e) { if (!dragging) return; var p = pt(e); pop.style.left = Math.max(0, Math.min(window.innerWidth - 80, ol + p.x - sx)) + 'px'; pop.style.top = Math.max(0, Math.min(window.innerHeight - 40, ot + p.y - sy)) + 'px'; }
    function up() { dragging = false; }
    poignee.addEventListener('mousedown', down);
    poignee.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  })();
  return { pop: pop, cuerpo: pop.querySelector('.pdf-popup-cuerpo'), extra: pop.querySelector('.pdf-popup-extra') };
}

function _pdfPopupAbrir(url, titulo, info) {
  var sh = _pdfPopupShell(titulo, info);
  sh.cuerpo.innerHTML = '<embed src="' + url + '" type="application/pdf" style="width:100%;height:100%;border:0">';
}

async function _pdfPopupAbrirEnPagina(url, titulo, info, nom) {
  if (typeof pdfjsLib === 'undefined') { _pdfPopupAbrir(url, titulo, info); return; }
  var doc;
  /* P-H 10/08 : un file:// ne peut PAS être lu par fetch NI par le worker
     pdf.js depuis une page file:// (CORS « origin null », mur définitif).
     La seule voie propre pour récupérer les OCTETS (nécessaires au rendu
     maison + surlignage) est le serveur, qui sert le PDF en http:// —
     guichet /api/pdf déjà là. Repli sur l'embed file:// si pas de serveur
     (l'embed, lui, le navigateur l'autorise). */
  try {
    var buf = null;
    if (nom) {
      var srv = (typeof baseSalufolio === 'function' && baseSalufolio()) ? baseSalufolio() : 'http://localhost:7777';
      var stem = /\.pdf$/i.test(nom) ? nom.slice(0, -4) : nom;
      var r = await fetch(srv + '/api/pdf?n=' + encodeURIComponent(stem));
      if (r.ok) buf = await r.arrayBuffer();
    }
    if (!buf) buf = await (await fetch(url)).arrayBuffer(); /* dernier recours file:// */
    doc = await pdfjsLib.getDocument({ data: buf }).promise;
  }
  catch (e) { _pdfPopupAbrir(url, titulo, info); return; }
  try {
    var labelMin = (info && info.label) ? info.label.toLowerCase() : null;
    /* Les formes sous lesquelles le laboratoire peut écrire CETTE valeur.
       P-H 11/08 : le feutre ratait les valeurs > 1000 — le .sf porte 2583
       mais le PDF imprime « 2.583,00 » (point de milliers à l'espagnole).
       Faute de la trouver, le feutre continuait et surlignait le LABEL sur
       une autre page (« elevación de Dímero D... » p4 au lieu du 2.583 p2).
       On fabrique donc toutes les écritures plausibles de la même valeur. */
    var valores = [];
    if (info) {
      var n = Number(info.valor);
      var brut = String(info.valor);
      valores.push(brut);                         /* 2583   ·  13.8   */
      valores.push(brut.replace('.', ','));       /* 2583   ·  13,8   */
      if (isFinite(n) && Math.abs(n) >= 1000) {
        /* séparateur de milliers espagnol : le point */
        var ent = Math.trunc(Math.abs(n));
        var dec = brut.indexOf('.') >= 0 ? brut.split('.')[1] : '';
        var mil = String(ent).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        valores.push(mil);                        /* 2.583            */
        valores.push(mil + ',' + (dec || '00'));  /* 2.583,00         */
        valores.push(mil + ',' + (dec || '0'));   /* 2.583,0          */
      } else if (isFinite(n) && Number.isInteger(n)) {
        /* un entier peut être imprimé avec décimales : 235 → 235,00 */
        valores.push(brut + ',00');
        valores.push(brut + ',0');
      }
      valores = valores.filter(function (v, i, a) { return v && a.indexOf(v) === i; });
    }
    /* P-H 10/08 : « affiche la page qui tient le 1er feutre ». On ouvre
       donc la première page où quelque chose SERA surligné — c.-à-d. la
       valeur (le repère le plus sûr) ou, à défaut, le label. On cherche
       la valeur en priorité (page du vrai feutre), le label ne servant
       que de repli s'il n'y a aucune valeur nulle part. */
    var pagina = 1, pageValeur = 0, pageLabel = 0, textoVacio = true;
    if (labelMin || valores.length) {
      for (var pnum = 1; pnum <= doc.numPages; pnum++) {
        var pg = await doc.getPage(pnum);
        var tc0 = await pg.getTextContent();
        var texto = tc0.items.map(function(it) { return it.str; }).join(' ');
        if (texto.trim()) textoVacio = false;
        var tl = texto.toLowerCase();
        if (!pageValeur && valores.some(function(v) { return v && texto.indexOf(v) !== -1; })) pageValeur = pnum;
        if (!pageLabel && labelMin && tl.indexOf(labelMin) !== -1) pageLabel = pnum;
        if (pageValeur) break; /* la page du feutre-valeur trouvée, on s'arrête */
      }
      pagina = pageValeur || pageLabel || 1;
    }
    if (textoVacio) { try { doc.destroy(); } catch (e) {} _pdfPopupAbrir(url, titulo, info); return; } /* scan sans OCR */
    var sh = _pdfPopupShell(titulo, info);
    var barra = document.createElement('div');
    barra.style.cssText = 'flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:3px 6px;border-bottom:1px solid var(--border);font-size:12px';
    barra.innerHTML = '<button class="pdf-pg-prev" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 8px">◀</button>' +
      '<span class="pdf-pg-info"></span>' +
      '<button class="pdf-pg-next" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 8px">▶</button>' +
      '<span class="pdf-pg-nb" style="color:var(--muted)"></span>';
    sh.pop.insertBefore(barra, sh.cuerpo);
    sh.cuerpo.style.background = '#8a8a8a';
    sh.cuerpo.style.textAlign = 'center';
    var actual = pagina;
    async function dibujar(pnum) {
      actual = pnum;
      sh.cuerpo.innerHTML = '';
      var page = await doc.getPage(pnum);
      var vp1 = page.getViewport({ scale: 1 });
      var ancho = Math.max(300, sh.cuerpo.clientWidth - 20);
      var scale = ancho / vp1.width;
      var vp = page.getViewport({ scale: scale });
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:relative;display:inline-block;margin:8px 0;box-shadow:0 2px 10px rgba(0,0,0,.4)';
      var canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height;
      wrapper.appendChild(canvas);
      sh.cuerpo.appendChild(wrapper);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      var tc = await page.getTextContent();
      var nb = 0, premierTop = null;
      tc.items.forEach(function(it) {
        var s = (it.str || '');
        var hit = (labelMin && s.toLowerCase().indexOf(labelMin) !== -1) ||
                  valores.some(function(v) { return v && s.indexOf(v) !== -1; });
        if (!hit) return;
        nb++;
        var tx = pdfjsLib.Util.transform(vp.transform, it.transform);
        var h = Math.hypot(tx[2], tx[3]) || 12;
        var d = document.createElement('div');
        d.style.cssText = 'position:absolute;background:rgba(255,200,0,.45);outline:1.5px solid rgba(230,150,0,.9);border-radius:2px;pointer-events:none;left:' + (tx[4] - 2) + 'px;top:' + (tx[5] - h) + 'px;width:' + (it.width * scale + 4) + 'px;height:' + (h * 1.2) + 'px';
        wrapper.appendChild(d);
        if (premierTop === null) premierTop = tx[5] - h;
      });
      barra.querySelector('.pdf-pg-info').textContent = 'página ' + pnum + ' / ' + doc.numPages;
      barra.querySelector('.pdf-pg-nb').textContent = nb ? ('🟡 ' + nb + ' resaltado' + (nb > 1 ? 's' : '')) : '';
      if (premierTop !== null) sh.cuerpo.scrollTop = Math.max(0, premierTop - 60);
    }
    barra.querySelector('.pdf-pg-prev').onclick = function() { if (actual > 1) dibujar(actual - 1); };
    barra.querySelector('.pdf-pg-next').onclick = function() { if (actual < doc.numPages) dibujar(actual + 1); };
    /* redessin quand P-H redimensionne le popup (poignée du coin) */
    var roT = null;
    new ResizeObserver(function() { clearTimeout(roT); roT = setTimeout(function() { dibujar(actual); }, 200); }).observe(sh.cuerpo);
    await dibujar(pagina);
  } catch (e) {
    try { doc.destroy(); } catch (e2) {}
    _pdfPopupAbrir(url, titulo, info);
  }
}

function _chartVerInforme(s, key) {
  var id = s && (s.pdf_id || s.pdf); if (!id) return;
  /* P-H 09/08 : le popup annonce CE QU'ON EST VENU VÉRIFIER — paramètre,
     valeur, date — et l'URL porte #search= (honoré par certains visores). */
  var info = null;
  if (key && typeof PARAMS === 'object' && PARAMS[key]) {
    info = { label: PARAMS[key].label || key, valor: s.y, unidad: PARAMS[key].unit || '', fecha: s.x, color: PARAMS[key].color || 'var(--accent)' };
  }
  /* P-H 09/08 (« je n'ai pas besoin d'un serveur pour lire un pdf ») :
     ouverture DIRECTE en file:// — les fichiers de sources/ portent
     désormais leur nom exact PDFxxx.pdf, il suffisait d'ajouter
     l'extension que l'ancien code n'ajoutait pas. Zéro dépendance. */
  var nom = /\.pdf$/i.test(String(id)) ? String(id) : String(id) + '.pdf';
  var dir = (typeof pdfCarpeta === 'function') ? pdfCarpeta(id) : '';
  if (dir) {
    var base = dir.replace(/\/+$/, '');
    var url = (base.indexOf('://') !== -1 ? base : 'file://' + (base.charAt(0) === '/' ? '' : '/') + base) + '/' + encodeURIComponent(nom);
    try { _pdfPopupAbrirEnPagina(url, nom, info, nom); return; } catch (e) {}
  }
  /* v2026.7.21.20 — plus d'aboiement du navigateur (demande P-H) : le repli
     passe par la BANDE DU PAVÉ quand elle existe, et nomme le bon guichet
     (« Auditoría », pas « Trazabilidad »). L'alerte native ne sert que si
     aucune bande n'est à l'écran. */
  var msg = '📄 ' + nom + (dir
    ? ' — carpeta: ' + dir + ' (no se pudo abrir)'
    : ' — para abrirlo con un clic, defina la «carpeta de PDF» en la vista AUDITORÍA.');
  var det = document.getElementById('xz-cmt-detalle');
  if (det) { det.innerHTML = '🧪 ' + msg; return; }
  alert(msg);
}

const chartInstances = {};

/* v2026.7.21.4 — échelle par courbe : Lin (par défaut) ⇄ Log (natif Chart.js).
   Le BNP à 11924 (TEP 2022, valeur RÉELLE et grave) écrasait les valeurs
   récentes en linéaire ; en log, le pic ET les variations fines cohabitent.
   L'état vit dans _chartScale[key] ; le bouton dans le titre bascule et redessine. */
window._chartScale = window._chartScale || {};

/* v2026.7.21.17 — P-H avait RAISON sur l'échelle : l'app applique un zoom CSS
   (document.body.style.zoom, module languages) que Chart.js ignore dans ses
   calculs de souris → mauvais point détecté, doigt posé à côté. On calcule
   donc NOUS-MÊMES la position du curseur, auto-calibrée par le rapport
   rect/offsetWidth — juste quel que soit le zoom/l'échelle en vigueur. */
function _chartPosEvento(chart, ev) {
  var rect = chart.canvas.getBoundingClientRect();
  var f = (rect.width / (chart.canvas.offsetWidth || rect.width)) || 1;
  return { x: (ev.clientX - rect.left) / f, y: (ev.clientY - rect.top) / f };
}
function _chartPuntoCercano(chart, ev) {
  var pos = _chartPosEvento(chart, ev);
  var meta = chart.getDatasetMeta(0);
  var best = -1, bd = Infinity, dist = Infinity;
  (meta && meta.data || []).forEach(function(el, i) {
    var d = Math.abs(el.x - pos.x);
    if (d < bd) { bd = d; best = i; dist = Math.hypot(el.x - pos.x, el.y - pos.y); }
  });
  return { index: best, precis: dist <= 16 };
}
function makeChart(canvasId, key, data, opts) {
  opts = opts || {};
  /* v2026.7.21.8 — les opts sont mémorisées par canvas : les redraws
     (bascule d'échelle, resize) conservent l'habillage d'origine. */
  window._chartOpts = window._chartOpts || {};
  _chartOpts[canvasId] = opts;
  var rejilla = opts.claro ? '#e6e6de' : '#2a3348';
  const p = PARAMS[key];
  const series = getSeriesForParam(data, key);
  if (!series.length) return;
  const esLog = (_chartScale[key] === 'log');
  const labels = series.map(s => fmtDate(s.x));
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (chartInstances[canvasId]) { chartInstances[canvasId].destroy(); }
  window._chartSeries = window._chartSeries || {};
  _chartSeries[canvasId] = series;
  chartInstances[canvasId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: p.label,
        data: series.map(s => s.y),
        borderColor: p.color,
        backgroundColor: p.color + '18',
        pointBackgroundColor: series.map(s => getStatus(key, s.y) === 'bad' ? '#c0392b' : p.color),
        pointRadius: 5, pointHoverRadius: (opts.sinTooltip ? 5 : 7), pointHitRadius: 14, tension: 0.3, fill: false,
      }]
    },
    options: {
      responsive: true,
      /* v2026.7.21.10 — clic sur un point → ver informe (le survol l'annonce) */
      /* v2026.7.21.16 (P-H : « manque de sensibilité » + « un doigt à la
         place du curseur ») : le SURVOL est généreux — n'importe où sur la
         courbe, c'est le point le plus proche en X qui parle au pavé ; le
         CLIC reste précis — il n'ouvre l'informe que pile sur le rond ; et
         le curseur devient un DOIGT 👆 quand un rond est saisi. */
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      onClick: (e, els, chart) => {
        try {
          const pc = _chartPuntoCercano(chart, e.native || e);
          if (pc.precis) { const s = series[pc.index]; if (s && (s.pdf_id || s.pdf)) _chartVerInforme(s, key); }
        } catch (er) {}
      },
      /* v2026.7.21.15 (conception P-H : « affiche le texte dans la popup et
         point final ») : le survol d'un point nourrit le pavé DIRECTEMENT,
         sans dépendre de l'infobulle — que celle-ci soit activée ou non. */
      onHover: (e, els, chart) => {
        const ev = e.native || e;
        let pc = { index: -1, precis: false };
        try { pc = _chartPuntoCercano(chart, ev); } catch (er) {}
        try { const cible = ev.target || chart.canvas; if (cible) cible.style.cursor = pc.precis ? 'pointer' : 'default'; } catch (er) {}
        if (pc.index < 0 || typeof window._chartPuntoHover !== 'function') return;
        const s = series[pc.index] || {};
        const v = s.y;
        const doc = (typeof pdfNombre === 'function' && (s.pdf_id || s.pdf)) ? pdfNombre(s.pdf_id || s.pdf) : (s.src || '');
        try { _chartPuntoHover({ param: (p.label || key), fecha: s.x, valor: v, unidad: p.unit || '', fuera: getStatus(key, v) === 'bad', doc: doc, tienePdf: !!(s.pdf_id || s.pdf) }); } catch (er) {}
      },
      plugins: { legend: { display: false }, tooltip: { enabled: !opts.sinTooltip, callbacks: {
        afterLabel: c => {
          const s = series[c.dataIndex] || {};
          const fuera = getStatus(key, c.raw) === 'bad';
          const l = [fuera ? '⚠ Fuera de rango' : '✓ Normal'];
          const doc = (typeof pdfNombre === 'function' && (s.pdf_id || s.pdf)) ? pdfNombre(s.pdf_id || s.pdf) : (s.src || '');
          if (doc) l.push('📄 ' + doc);
          if (s.pdf_id || s.pdf) l.push('(clic: ver informe)');
          return l;
        }
      }}},
      scales: {
        x: { grid: { color: rejilla } },
        y: { type: esLog ? 'logarithmic' : 'linear',
             grid: { color: rejilla }, ticks: { maxTicksLimit: 6 },
             title: { display: true, text: p.unit + ' — vista ' + (esLog ? 'LOG' : 'LIN') } }
      }
    },
    plugins: [{
      id: 'ref', beforeDraw(chart) {
        if (!p.ref) return;
        const [lo, hi] = p.ref;
        if (lo === null && hi === null) return;
        const { ctx, chartArea: { left, right, top, bottom }, scales: { y } } = chart;
        ctx.save(); ctx.fillStyle = 'rgba(30,180,100,0.06)';
        const yTop = hi !== null ? y.getPixelForValue(Math.min(hi, y.max)) : top;
        const yBot = lo !== null ? y.getPixelForValue(Math.max(lo, y.min)) : bottom;
        ctx.fillRect(left, yTop, right - left, yBot - yTop);
        ctx.restore();
      }
    }]
  });
}

/* Helper: tooltip interactif pour les noms de paramètres */
function paramTip(key) {
  const p = PARAMS[key];
  if (!p) return '';
  const ref = p.ref ? p.ref.filter(v=>v!==null).join('–') + ' ' + p.unit : 'sin rango definido';
  return p.desc + '\nRef: ' + ref;
}
/* Tooltip global : un seul élément fixé au body, mesuré puis positionné —
   jamais rogné, jamais étroit (délégation : fonctionne pour tout .param-tip). */
(function initParamTip() {
  if (typeof document === 'undefined') return;
  let box = null;
  function ensureBox() {
    if (!box) { box = document.createElement('div'); box.id = 'param-tipbox'; document.body.appendChild(box); }
    return box;
  }
  document.addEventListener('mouseover', function (e) {
    const t = e.target && e.target.closest ? e.target.closest('[data-ptip]') : null;
    if (!t || !t.getAttribute('data-ptip')) return;
    const b = ensureBox();
    /* livrée : or-sur-bleu pour les corrélations (P-H), défaut sinon */
    if (t.classList && t.classList.contains('corr-tip')) {
      b.style.background = 'linear-gradient(135deg, var(--corr-tip-bg1), var(--corr-tip-bg2))';
      b.style.color = 'var(--corr-tip-color)';
      b.style.border = '1.5px solid var(--corr-tip-border)';
    } else {
      b.style.background = ''; b.style.color = ''; b.style.border = '';
    }
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    b.innerHTML = (t.getAttribute('data-ptip') || '').split('\n')
      .map(l => l.indexOf('Ref:') === 0
        ? '<span style="color:#3fb950;font-weight:600">' + esc(l) + '</span>'
        : esc(l)).join('<br>');
    b.classList.remove('on');
    b.style.left = '0px'; b.style.top = '-9999px';   /* mesurer hors écran */
    const r = t.getBoundingClientRect();
    const bw = b.offsetWidth, bh = b.offsetHeight;
    let x = Math.min(Math.max(6, r.left), window.innerWidth - bw - 6);
    let y = r.top - bh - 8;
    if (y < 6) y = r.bottom + 8;                      /* pas de place en haut → dessous */
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.classList.add('on');
  });
  document.addEventListener('mouseout', function (e) {
    const t = e.target && e.target.closest ? e.target.closest('[data-ptip]') : null;
    if (t && box) box.classList.remove('on');
  });
  document.addEventListener('scroll', function () { if (box) box.classList.remove('on'); }, true);
})();

function paramSpan(key, shortLabel, extraStyle) {
  const p = PARAMS[key];
  if (!p) return key;
  const ref = p.ref ? p.ref.filter(v=>v!==null).join(' – ') + ' ' + p.unit : '';
  /* P-H 07/08 : fondu avec l'indication clic droit dans LA MÊME bulle
     rapide (data-ptip) — l'ancien title="" natif du <td> parent avait un
     délai imposé par le navigateur, impossible à raccourcir en JS. */
  const tip = (p.desc || p.label) + (ref ? '\nRef: ' + ref : '') + '\n🖱️ Clic izq.: glosario · Clic der.: curva';
  const label = shortLabel || p.label;
  return '<span class="param-tip" data-ptip="' + tip.replace(/"/g, '&quot;') + '" onclick="glosarioMostrarToast(\'' + key.replace(/'/g,"") + '\', event)" style="cursor:pointer' + (extraStyle ? ';'+extraStyle : '') + '">' + label + '</span>';
}

/* Alias court pour templates */
function paramTip(key, short) {
  return paramSpan(key, short);
}

function fillParamSelect() {
  const sel = document.getElementById('m-param');
  if (!sel) return;
  sel.innerHTML = '<option value="">— ' + (t('lbl_param')||'Parámetro') + ' —</option>';

  /* Paramètres prédéfinis — triés alphabétiquement */
  const optGroup1 = document.createElement('optgroup');
  optGroup1.label = 'Parámetros estándar';
  Object.entries(PARAMS)
    .sort((a, b) => a[1].label.localeCompare(b[1].label))
    .forEach(([k,p]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = p.label + ' (' + p.unit + ')';
      optGroup1.appendChild(opt);
    });
  sel.appendChild(optGroup1);

  /* Paramètres personnalisés */
  const customs = loadCustomParams();
  if (Object.keys(customs).length) {
    const optGroup2 = document.createElement('optgroup');
    optGroup2.label = 'Mis parámetros';
    Object.entries(customs).forEach(([k,p]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = p.label + ' (' + p.unit + ')';
      optGroup2.appendChild(opt);
    });
    sel.appendChild(optGroup2);
  }

  /* Option pour ajouter un nouveau */
  const sep = document.createElement('option');
  sep.disabled = true; sep.textContent = '────────────────';
  sel.appendChild(sep);
  const addOpt = document.createElement('option');
  addOpt.value = '__NEW__'; addOpt.textContent = '➕ Nuevo parámetro...';
  addOpt.style.color = 'var(--accent)';
  sel.appendChild(addOpt);

  /* Remplir la datalist des sources */
  fillSourceList();
}

function fillSourceList() {
  const sel = document.getElementById('m-source-select');
  if (!sel) return;

  /* Collecter toutes les sources connues */
  const sources = new Set();
  loadData().forEach(d => { if (d.src) sources.add(d.src); });
  loadEvents().forEach(e => { if (e.src) sources.add(e.src); });
  loadCustomSources().forEach(s => sources.add(s));

  /* Garder la sélection actuelle */
  const prev = sel.value;

  sel.innerHTML = '<option value="">— Seleccionar fuente —</option>';

  /* Sources existantes */
  [...sources].sort().forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });

  /* Séparateur + option nouvelle */
  if (sources.size > 0) {
    const sep = document.createElement('option');

/* Gestion des paramètres personnalisés */
const CUSTOM_PARAMS_KEY = 'mt_custom_params';
const CUSTOM_SOURCES_KEY = 'mt_custom_sources';

function loadCustomParams() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_PARAMS_KEY) || '{}'); } catch { return {}; }
}
function saveCustomParams(p) { localStorage.setItem(CUSTOM_PARAMS_KEY, JSON.stringify(p)); }
function loadCustomSources() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_SOURCES_KEY) || '[]'); } catch { return []; }
}
function saveCustomSources(s) { localStorage.setItem(CUSTOM_SOURCES_KEY, JSON.stringify(s)); }

function addCustomSource(src) {
  if (!src || src === 'Manuel') return;
  const sources = loadCustomSources();
  if (!sources.includes(src)) {
    sources.push(src);
    sources.sort();
    saveCustomSources(sources);
  }
}

  const sel = document.getElementById('m-param');
  const box = document.getElementById('custom-param-box');
  if (sel.value === '__NEW__') {

    document.getElementById('cp-label').focus();
  } else {
    box.style.display = 'none';
  }

function registerCustomParam() {
  const label = document.getElementById('cp-label').value.trim();
  const unit  = document.getElementById('cp-unit').value.trim() || '';
  const refStr = document.getElementById('cp-ref').value.trim();

  if (!label) return null;

  /* Générer une clé machine depuis le label */
  const key = 'custom_' + label.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

  /* Parser ref "min-max" */
  let ref = null;
  if (refStr) {
    const parts = refStr.split(/[-–—]/);
    if (parts.length === 2) {
      ref = [parseFloat(parts[0]) || null, parseFloat(parts[1]) || null];
    }
  }

  /* Sauvegarder dans PARAMS (runtime) et localStorage */
  const customs = loadCustomParams();
  const paramDef = { label, unit, ref, color: '#7f8c8d', desc: 'Parámetro personalizado: ' + label };
  customs[key] = paramDef;
  PARAMS[key] = paramDef;
  saveCustomParams(customs);

  /* Reset les champs */
  document.getElementById('cp-label').value = '';
  document.getElementById('cp-unit').value = '';
  document.getElementById('cp-ref').value = '';
  document.getElementById('custom-param-box').style.display = 'none';

  /* Recharger le select et sélectionner le nouveau */
  fillParamSelect();
  document.getElementById('m-param').value = key;

  return key;
}

function prescriptorNombre(id) {
  if (!id) return '';
  return loadPrescriptores()[id] || id;
}

function prescriptorResolverId(nombre) {
  nombre = (nombre || '').trim();
  if (!nombre) return null;
  var reg = loadPrescriptores();
  var norm = normNombre(nombre);
  var found = Object.keys(reg).find(function(id) { return normNombre(reg[id]) === norm; });
  if (found) return found;
  var max = 0;
  Object.keys(reg).forEach(function(id) {
    var m = /^PR(\d+)$/.exec(id);
    if (m) max = Math.max(max, parseInt(m[1]));
  });
  var nuevoId = 'PR' + (max + 1);
  reg[nuevoId] = nombre;
  savePrescriptores(reg);
  return nuevoId;
}

function protoBuildRxView() {
  var L = protoListaPrescripcion();
  var dispositivos = L.dispositivos, rx = L.rx;
  var el = document.getElementById('proto-rx-list');
  protoFillRxMeasures();
  if (!rx.length && !dispositivos.length && !L.defacto.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:12px;text-align:center">' +
      'Ningún medicamento en curso.<br>Añada medicamentos desde el panel <b>💊 Medicamentos</b> (botón Editar → Posología y Horarios).</div>';
    return;
  }
  var html = '';
  rx.forEach(function(m) {
    var slots = m.slots || [];
    var hasSlots = slots.length > 0;
    var laDosis = (m.dosis && m.dosis !== '0' && m.dosis.trim() !== '') ? m.dosis : (m.dose || '');
    var hasDosis = laDosis.trim() !== '';
    /* Ergonomie P-H 18/07 : la ZONE D'ACTION vit à GAUCHE, à position fixe
       (⚡ 🕐 dosis horaires) — le médicament, de longueur variable, vient en
       5e et s'étale à droite. La souris ne voyage plus. */
    html += '<div class="proto-rx-card">';
    html += '<button class="proto-rx-remove" onclick="quickMedAction(\'' + m.nom.replace(/'/g,"\\'") + '\', this)" title="Acción rápida (estado)">⚡</button>';
    html += '<button class="proto-rx-remove" onclick="protoQuickHorarios(\'' + m.nom.replace(/'/g,"\\'") + '\')" title="Cambiar horarios de toma">🕐</button>';
    if (hasDosis) html += '<span class="proto-rx-dosis">' + laDosis + '</span>';
    if (hasSlots) {
      html += '<span class="proto-rx-schedule">';
      slots.forEach(function(sid) {
        var s = PROTO_SLOTS.find(function(x){return x.id===sid;});
        if (s) html += '<span class="proto-rx-slot" title="'+s.label+'">' + s.icon + '</span>';
      });
      html += '</span>';
    } else {
      html += '<span style="font-size:13px;color:var(--warn);font-family:var(--mono)">⚠</span>';
    }
    html += '<span class="proto-rx-med">' + m.nom + '</span>';
    if (m.prescriptor) html += '<span class="proto-rx-notes">👨‍⚕️ ' + prescriptorNombre(m.prescriptor) + '</span>';
    html += '</div>';
  });
  /* ── Prescripción de hecho (P-H 18/07) : medicamentos que el cuidador
     REGISTRA en el Protocolo pero que NO constan en la receta electrónica
     (ej. memantina). Forman parte de la prescripción real — se muestran
     con su aviso, para que ninguna consulta los olvide. ── */
  L.defacto.forEach(function(nom) {
    html += '<div class="proto-rx-card" style="border-color:var(--warn)">' +
      '<span class="proto-rx-med">' + nom + '</span>' +
      '<span class="proto-rx-notes" style="color:var(--warn)">⚠ no consta en receta electrónica — registrado por el cuidador</span></div>';
  });

  /* ── Dispositivos y material ── */
  if (dispositivos.length) {
    html += '<div style="font-size:11px;letter-spacing:.6px;color:var(--accent);font-weight:700;margin:14px 0 6px">🩹 DISPOSITIVOS Y MATERIAL</div>';
    dispositivos.forEach(function(m) {
      var laDosis = (m.dosis && m.dosis !== '0' && (m.dosis||'').trim() !== '') ? m.dosis : (m.dose || '');
      html += '<div class="proto-rx-card">' +
        '<button class="proto-rx-remove" onclick="quickMedAction(\'' + m.nom.replace(/'/g,"\\'") + '\', this)" title="Acción rápida (estado)">⚡</button>' +
        (laDosis ? '<span class="proto-rx-dosis">' + laDosis + '</span>' : '') +
        '<span class="proto-rx-med">' + m.nom + '</span>' +
        (m.prescriptor ? '<span class="proto-rx-notes">👨‍⚕️ ' + prescriptorNombre(m.prescriptor) + '</span>' : '') +
        '</div>';
    });
    html += '<div style="font-size:10px;color:var(--muted);margin:2px 0 4px">Cantidad/frecuencia según necesidad (O₂ en L/min) — sin horarios de toma.</div>';
  }
  /* P-H 18/07 (depuis l'hôpital) : les résolus/anciens ne s'affichent PLUS
     dans la Prescripción — même pas en bannière. Leur clôture vit dans
     💊 Medicamentos (⚡), leur histoire dans les données. */
  html += '<div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;text-align:center">' +
    '💡 Para modificar posología u horarios → panel 💊 Medicamentos → botón Editar</div>';
  el.innerHTML = html;
}

function updateMedFilterCounts() {
  var container = document.getElementById('meds-content');
  if (!container) return;
  var cards = container.querySelectorAll('[id^="med-card-"]');
  var counts = { '': 0, 'en_cours': 0, 'nouveau': 0, 'a_demanda': 0, 'suspendu': 0, 'abandonne': 0, 'terminado': 0 };
  cards.forEach(function(card) {
    var s = card.getAttribute('data-statut') || '';

    if (counts[s] !== undefined) counts[s]++;

  var labels = {
    '': 'Todos', 'en_cours': '🟢 En curso', 'nouveau': '🆕 Nuevo',
    'a_demanda': '💊 Si necesario', 'suspendu': '⏸️ Suspendido',

    sel.querySelectorAll('option').forEach(function(opt) {

    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('quick-razon-ok').onclick(); }
    if (e.key === 'Escape') ov.remove();
  };
  ov.onclick = function(e) { if (e.target === ov) ov.remove(); };

function applyQuickMedStatutForEntry(entry, statut, razon) {
  var allMeds = loadMeds();
  var idx = allMeds.findIndex(function(m) {
    return m.nom === entry.nom && m.date === entry.date && (m.source||'') === (entry.source||'') && (m.dose||'') === (entry.dose||'');
  });
  if (idx === -1) { status('⚠ No se encontró la entrada exacta'); return; }
  allMeds[idx].statut = statut;
  if (razon) allMeds[idx].motif_suspension = razon;
  if (statut === 'terminado' || statut === 'abandonne' || statut === 'suspendu') allMeds[idx].date_fin = new Date().toISOString().slice(0,10);
  saveMeds(allMeds);
  buildMedicamentos();
  status('⚡ ' + entry.nom + ' (' + fmtDate(entry.date) + ') → ' + statut);
}

function applyQuickMedStatut(medName, statut, razon) {
  var allMeds = loadMeds();
  var changed = false;
  for (var i = 0; i < allMeds.length; i++) {
    var m = allMeds[i];
    if (medKeyCanon(m.nom) === medKeyCanon(medName.replace(/\s*\(\d+\)$/, ''))) {
      m.statut = statut;
      if (razon) m.motif_suspension = razon;
      if (statut === 'terminado' || statut === 'abandonne' || statut === 'suspendu') {
        m.date_fin = new Date().toISOString().slice(0,10);
      }
      changed = true;
    }
  }
  if (changed) {
    saveMeds(allMeds);
    buildMedicamentos();
    status('⚡ ' + medName + ' → ' + statut);
  }
}

function medsFiltroGet() {
  try { return JSON.parse(localStorage.getItem(MEDS_FILTRO_KEY)) || { mode: '12m' }; }
  catch { return { mode: '12m' }; }
}
/* ════ SOURCE DE VÉRITÉ UNIQUE (P-H 15/07 : incohérence Medicamentos/Protocolo) ════
   Une seule clé de regroupement et une seule règle d'état pour TOUS les panneaux :
   · medKeyCanon : 1er mot du nom normalisé, sans accents ni parenthèses
   · medGruposCanon : groupes {displayName, entries triées CHRONOLOGIQUEMENT}
   · l'état actuel d'un médicament = statut de sa dernière entrée par DATE
     (plus jamais l'ordre d'insertion du tableau). */
/* Synonymes marque↔générique (P-H 05/08, ex. Xarelto=Rivaroxabán) — une
   ligne par paire, à enrichir toi-même au fil des découvertes. Sans cette
   table, deux noms de la même molécule sont vus comme deux médicaments
   différents (ex. le faux « no consta en receta electrónica »). */
const MED_SINONIMOS = {
  'xarelto': 'rivaroxaban',
};
function medKeyCanon(s) {
  s = (s || '').replace(/\s*\(.*?\)/g, '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const primera = (s.split(/\s+/)[0] || s);
  return MED_SINONIMOS[primera] || primera;
}
/* Dispositifs & matériel (P-H 15/07) : l'oxygène et les Incopack ne sont pas
   des médicaments — catégorie propre, unités propres (L/min, unidades/día). */
const DISPOSITIVO_PAT = ['oxigen', 'incopack', 'panal', 'pañal', 'absorbente', 'aposito',
  'apósito', 'tiras react', 'lanceta', 'aguja', 'jeringa', 'camara inhal', 'cámara inhal',
  'aerochamber', 'sonda', 'colector', 'nebulizador', 'andador', 'colchon', 'colchón'];
function esDispositivo(nom) {
  const n = (nom || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  return DISPOSITIVO_PAT.some(function(p) {
    return n.indexOf(p.normalize('NFD').replace(/[\u0300-\u036f]/g, '')) !== -1;
  });
}
/* Ancienneté : une prescription non renouvelée depuis N mois n'est pas un
   traitement courant (les cures d'antibiotiques jamais clôturées). */
function medEsAntiguo(entry, meses) {
  const d = entry.date || entry.date_debut || '';
  if (!d) return false;
  const lim = new Date(); lim.setMonth(lim.getMonth() - (meses || 12));
  return d < lim.toISOString().slice(0, 10);
}
function medGruposCanon() {
  const meds = loadMeds();
  const byName = {};
  meds.forEach(function(m) {
    const key = medKeyCanon(m.nom);
    if (!byName[key]) byName[key] = { displayName: (m.nom || '').trim().split(/\s+/)[0].toUpperCase(), entries: [] };
    byName[key].entries.push(m);
  });
  Object.values(byName).forEach(function(g) {
    g.entries.sort(function(a, b) {
      return String(a.date || a.date_debut || '').localeCompare(String(b.date || b.date_debut || ''));
    });
  });
  return byName;
}

  if (!window._medFiltroUsuarioEligio) {

/* Afficher/masquer la barre fixed quand la listbox normale sort de l'écran */
var _medScrollWatchActive = false;
function medInitScrollWatch() {
  if (_medScrollWatchActive) return;
  _medScrollWatchActive = true;
  var anchor = document.getElementById('meds-bar-anchor');
  var fixedBar = document.getElementById('meds-fixed-bar');
  if (!anchor || !fixedBar) return;
  
  /* Ajuster le top de la barre fixe selon la hauteur réelle de la navbar */
  var navBar = document.querySelector('.nav');
  var navH = navBar ? navBar.offsetHeight : 44;
  fixedBar.style.top = navH + 'px';
  
  /* IntersectionObserver : quand l'ancre sort de l'écran → afficher la barre fixe */
  var observer = new IntersectionObserver(function(entries) {
    var panel = document.getElementById('panel-medicamentos');
    if (!panel || !panel.classList.contains('active')) { fixedBar.style.display = 'none'; return; }
    entries.forEach(function(entry) {
      fixedBar.style.display = entry.isIntersecting ? 'none' : 'block';
    });
  }, { threshold: 0, rootMargin: '-' + navH + 'px 0px 0px 0px' });
  
  observer.observe(anchor);
}

function medNavTop() {
  var nav = document.getElementById('meds-quicknav');
  var navFixed = document.getElementById('meds-quicknav-fixed');
  if (nav) nav.selectedIndex = 0;
  if (navFixed) navFixed.value = '';
  var panel = document.getElementById('panel-medicamentos');
  if (panel) {
    var navBar = document.querySelector('.nav');
    var navHeight = navBar ? navBar.offsetHeight : 48;
    var panelRect = panel.getBoundingClientRect();
    window.scrollTo({ top: window.pageYOffset + panelRect.top - navHeight - 4, behavior: 'smooth' });
  }
}

/* Filtrer les cartes par statut */
function medFilterStatus(statut) {
  var container = document.getElementById('meds-content');
  if (!container) return;
  var cards = container.querySelectorAll('[id^="med-card-"]');
  var nav = document.getElementById('meds-quicknav');
  var navFixed = document.getElementById('meds-quicknav-fixed');
  /* Synchroniser les deux filtres */
  var filterMain = document.getElementById('meds-filter');
  var filterFixed = document.getElementById('meds-filter-fixed');
  if (filterMain) filterMain.value = statut;
  if (filterFixed) filterFixed.value = statut;

  cards.forEach(function(card) {
    if (!statut) { card.style.display = ''; return; }
    var cardStatut = card.getAttribute('data-statut') || '';
    card.style.display = (cardStatut === statut) ? '' : 'none';
  });

  /* Mettre à jour la listbox pour n'afficher que les médicaments visibles */
  if (nav) {
    for (var i = 1; i < nav.options.length; i++) {
      var cardId = nav.options[i].value;
      var card = document.getElementById(cardId);
      nav.options[i].style.display = (card && card.style.display !== 'none') ? '' : 'none';
    }
    nav.selectedIndex = 0;
  }
  if (navFixed) {
    for (var i = 1; i < navFixed.options.length; i++) {
      var cardId = navFixed.options[i].value;
      var card = document.getElementById(cardId);
      navFixed.options[i].style.display = (card && card.style.display !== 'none') ? '' : 'none';
    }
    navFixed.selectedIndex = 0;
  }
}

/* Navigation précédent/suivant dans la listbox */
function medNavPrev() {
  var nav = document.getElementById('meds-quicknav');
  if (!nav || nav.selectedIndex <= 1) return;
  nav.selectedIndex--;
  jumpToMed(nav.value);
  var navFixed = document.getElementById('meds-quicknav-fixed');
  if (navFixed) navFixed.value = nav.value;
}
function medNavNext() {
  var nav = document.getElementById('meds-quicknav');
  if (!nav || nav.selectedIndex >= nav.options.length - 1) return;
  if (nav.selectedIndex === 0) nav.selectedIndex = 1; else nav.selectedIndex++;
  jumpToMed(nav.value);
  var navFixed = document.getElementById('meds-quicknav-fixed');
  if (navFixed) navFixed.value = nav.value;
}

function jumpToMed(id) {
  if (!id) return;
  var el = document.getElementById(id);
  if (!el) return;
  /* Synchroniser les deux listbox */
  var nav = document.getElementById('meds-quicknav');
  var navFixed = document.getElementById('meds-quicknav-fixed');
  if (nav) nav.value = id;
  if (navFixed) navFixed.value = id;
  /* Calculer la position : sous la barre (fixed ou normale) */
  var topOffset = 52; /* hauteur navbar */
  var fixedBar = document.getElementById('meds-fixed-bar');
  if (fixedBar && fixedBar.style.display !== 'none') {
    topOffset = fixedBar.getBoundingClientRect().bottom;
  }
  var cardRect = el.getBoundingClientRect();
  window.scrollBy({ top: cardRect.top - topOffset - 8, behavior: 'smooth' });
  /* Surbrillance */
  el.style.transition = 'outline .2s, box-shadow .2s';
  el.style.outline = '3px solid var(--accent)';
  el.style.boxShadow = '0 0 20px rgba(74,143,232,0.3)';
  setTimeout(function() { el.style.outline = ''; el.style.boxShadow = ''; }, 2000);
}

function medDeducirPrescriptores() {
  /* MOULINETTE (P-H 06/08) : les medicaments extraits des PDF n'ont jamais
     porte de prescripteur ligne a ligne — le signataire vit au niveau du
     DOCUMENT (cartouche). Rapprochement : par pdf_id, puis par date, et
     l'ecrire MARQUE COMME DEDUCTION (prescriptor_origen:'deducido') —
     jamais en silence. Validation humaine = rouvrir la fiche et Actualizar
     (le flag tombe). Doctrine : senala, no juzga. */
  var meds = loadMeds();
  var events = (typeof loadEvents === 'function') ? loadEvents() : [];
  var episodios = [];
  try {
    var mtRaw = localStorage.getItem('mt_mf_structure');
    if (mtRaw) { episodios = (JSON.parse(mtRaw).episodios) || []; }
  } catch (e) {}

  function firmante(med) {
    if (med.pdf_id) {
      var ev = events.find(function(e) { return e.pdf_id === med.pdf_id && (e.prescriptor || e.facultativo); });
      if (ev) return { nombre: ev.prescriptor || ev.facultativo, via: 'documento ' + med.pdf_id };
    }
    var fecha = med.date || med.date_debut;
    if (fecha) {
      var ev2 = events.find(function(e) { return e.date === fecha && (e.prescriptor || e.facultativo); });
      if (ev2) return { nombre: ev2.prescriptor || ev2.facultativo, via: 'episodio del ' + fecha };
      var ep = episodios.find(function(x) { return (x.date === fecha || x.fecha === fecha) && (x.prescriptor || x.facultativo); });
      if (ep) return { nombre: ep.prescriptor || ep.facultativo, via: 'episodio del ' + fecha };
    }
    return null;
  }

  var deducciones = [];
  meds.forEach(function(m) {
    if (m.prescriptor) return;
    var f = firmante(m);
    if (f) {
      m.prescriptor = prescriptorResolverId(f.nombre);
      m.prescriptor_origen = 'deducido';
      deducciones.push({ med: m.nom, medico: f.nombre, via: f.via });
    }
  });
  if (deducciones.length) saveMeds(meds);

  var ov = document.createElement('div');

function medNuevoMedicamento() {
  /* École de P-H (05/08), adoptée : PAS de popup native moche pour
     demander le nom. On crée une fiche vide dans le JSON (statut
     "nouveau", qui existe déjà dans le filtre), elle apparaît dans la
     liste comme n'importe quel médicament, puis on simule le clic sur
     Editar — le nom se corrige alors DANS le beau formulaire habituel,
     pas dans un prompt(). C'est aussi la seule façon qui marche vraiment :
     le bouton Guardar ne fait rien s'il ne trouve aucune entrée à
     l'avance portant ce nom (vérifié dans le code). */
  var meds = loadMeds();
  var existentes = {};
  meds.forEach(function(m) { existentes[m.nom] = true; });
  var base = 'Nuevo medicamento', nombre = base, n = 1;
  while (existentes[nombre]) { n++; nombre = base + ' (' + n + ')'; }
  meds.push({ nom: nombre, statut: 'nouveau', dosis: '', date_debut: new Date().toISOString().slice(0, 10),
              _borrador: 1 /* brouillon : n'existe vraiment qu'une fois Actualizar cliqué (P-H 06/08 : fantômes) */ });
  saveMeds(meds);
  buildMedicamentos();
  /* appel DIRECT (P-H 06/08) : le setTimeout de 150ms ne servait qu'à laisser
     peindre la liste — inutile, et un timer est fragile par nature. */
  editMedStatut(nombre);
}

/* PURGE DES BROUILLONS ORPHELINS (P-H 06/08 : « Nuevo medicamento (2) » vides
   dans le patrimoine) : un Cancelar ou une fermeture d'app avant Actualizar
   laissait la fiche vide créée par ➕ Nuevo. On purge au chargement :
   ① les _borrador d'une session passée ② les fantômes d'AVANT ce correctif
   (nom auto ET fiche vierge — aucune donnée saisie). */
(function medPurgarBorradores() {
  try {
    var meds = loadMeds();
    var limpios = meds.filter(function(m) {
      if (m._borrador) return false;
      var nomAuto = /^Nuevo medicamento( \(\d+\))?$/.test(m.nom || '');
      var vierge = !m.dosis && !m.prescriptor && !m.receta && !m.concentracion &&
                   !(m.slots && m.slots.length) && !m.comida && !m.frecuencia;
      return !(nomAuto && vierge);
    });
    if (limpios.length !== meds.length) {
      saveMeds(limpios);
      console.log('[Medicamentos] ' + (meds.length - limpios.length) + ' borrador(es) huérfano(s) purgado(s)');
    }
  } catch (e) {}
})();

        ov.style.display = 'block'; /* enlever le flex pour permettre position absolue */
        bx.style.position = 'fixed';
        bx.style.left = r.left + 'px';
        bx.style.top = r.top + 'px';
        bx.style.margin = '0';
        bx.dataset.detached = '1';
      }
      dragging = true;
      var p = getPoint(e);
      startX = p.x; startY = p.y;
      var rect = bx.getBoundingClientRect();
      origLeft = rect.left; origTop = rect.top;
      e.preventDefault();
    }
    function onMove(e) {
      if (!dragging) return;
      var p = getPoint(e);
      var newLeft = origLeft + (p.x - startX);
      var newTop = origTop + (p.y - startY);
      var w = bx.offsetWidth, h = bx.offsetHeight;
      newLeft = Math.max(0, Math.min(window.innerWidth - w, newLeft));
      newTop = Math.max(0, Math.min(window.innerHeight - h, newTop));
      bx.style.left = newLeft + 'px';
      bx.style.top = newTop + 'px';
    }
    function onUp() { dragging = false; }
    titleBar.addEventListener('mousedown', onDown);
    titleBar.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp);
  })();

  /* Pré-remplir avec les données existantes */
  var meds = loadMeds();
  var entries = meds.filter(function(m) { 
    return m.nom === medName || 
           (m.nom && m.nom.toUpperCase().startsWith(medName.toUpperCase().replace(/\s*\(\d+\)$/,'')));
  });
  var last = entries.length ? entries[entries.length - 1] : {};

  /* Pré-remplir */
  setTimeout(function() {
    document.getElementById('med-edit-statut').value = last.statut || 'en_cours';
    document.getElementById('med-edit-debut').value = last.date_debut || entries[0].date || '';
    document.getElementById('med-edit-prescriptor').value = last.prescriptor ? prescriptorNombre(last.prescriptor) : '';
    if (last.prescriptor_origen === 'deducido') {
      var _pEl = document.getElementById('med-edit-prescriptor');
      _pEl.style.fontStyle = 'italic';
      _pEl.style.color = 'var(--warn)';
      _pEl.title = 'Deducido del documento firmante \u2014 pulse Actualizar para confirmar, o corrija';
    }
    document.getElementById('med-edit-receta').value = last.receta || '';
    /* Posología : décomposer le champ dosis en quantité + forme */
    var dosis = last.dosis || last.dose || '';   /* les DEUX colonnes d'origine (P-H 15/07) */
    var dosisMatch = dosis.match(/^([\d.,]+)\s*(\S+)/);
    if (dosisMatch) {
      document.getElementById('med-edit-dosis-qty').value = dosisMatch[1];
      /* Normaliser la forme : capsula→cápsula, etc. */
      var formaMap = {
        'capsula':'cápsula','capsulas':'cápsula','comprimidos':'comprimido',
        'gotas':'gotas','sobres':'sobre','ampollas':'ampolla',
        'parches':'parche','supositorios':'supositorio',
        'inhalaciones':'inhalación','inyecciones':'inyección'
      };
      var formaRaw = dosisMatch[2].toLowerCase();
      var formaNorm = formaMap[formaRaw] || formaRaw;
      document.getElementById('med-edit-dosis-form').value = formaNorm;
    }
    document.getElementById('med-edit-concentracion').value = last.concentracion || '';
    /* Horarios */
    var slots = last.slots || [];
    ['am', 'almuerzo', 'mid', 'pm', 'cena', 'night', 'libre'].forEach(function(sid) {
      if (slots.indexOf(sid) >= 0) {
        var el = document.getElementById('med-edit-slot-' + sid);
        if (el) el.checked = true;
      }
    });
    document.getElementById('med-edit-frecuencia').value = last.frecuencia || 'diario';
    document.getElementById('med-edit-comida').value = last.comida || '';
    document.getElementById('med-edit-duracion').value = last.duracion || '0';

    var finInput = document.getElementById('med-edit-fin');
    var hint = document.getElementById('med-edit-fin-hint');
    var savedFin = last.date_fin || '';
    if (savedFin) {
      finInput.value = savedFin;
      finInput.style.color = 'var(--text)';
      finInput.style.fontWeight = '700';
      finInput.style.fontStyle = 'normal';
      hint.textContent = '';
    } else {
      var startDateStr = last.date_debut || entries[0].date || '';
      var duree = parseInt(last.duree_jours);
      if (startDateStr && duree && !isNaN(duree)) {
        var start = new Date(startDateStr);
        start.setDate(start.getDate() + duree);
        finInput.value = start.toISOString().slice(0, 10);
        finInput.style.color = 'var(--muted)';
        finInput.style.fontWeight = '400';
        finInput.style.fontStyle = 'italic';
        hint.textContent = '(prevista)';
        finInput.dataset.prevista = '1';
      } else {
        finInput.value = '';
        finInput.style.color = 'var(--text)';
        hint.textContent = '';
      }
    }

    finInput.addEventListener('input', function() {
      finInput.style.color = 'var(--text)';
      finInput.style.fontWeight = '700';
      finInput.style.fontStyle = 'normal';
      hint.textContent = '';
      delete finInput.dataset.prevista;
    });

    /* Appliquer la logique d'activation/désactivation selon le statut */
    medStatutChange();
    medReordenarDoctores();
  }, 50);

  bo.onclick = function() {
    var nuevoNombre = document.getElementById('med-edit-nombre').value.trim() || medName;
    var statut = document.getElementById('med-edit-statut').value;
    var debut = document.getElementById('med-edit-debut').value;
    var finInput = document.getElementById('med-edit-fin');
    var fin = (finInput.dataset.prevista === '1') ? '' : finInput.value;
    var prescriptor = document.getElementById('med-edit-prescriptor').value.trim();
    var receta = document.getElementById('med-edit-receta').value;
    /* LISTE QUI APPREND, vraiment (P-H 06/08 : « le médecin privé antérieur a
       disparu ») : la suggestion ne doit JAMAIS dépendre de l'état courant des
       fiches — un nom tapé une fois entre pour toujours dans le registre
       mt_prescripteurs (déjà lu par le datalist), même si la fiche change de
       médecin ensuite. Un traitement passe entre plusieurs mains (Xarelto...). */
    if (prescriptor) {
      try {
        var _reg = JSON.parse(localStorage.getItem('mt_prescripteurs') || '[]');
        if (_reg.indexOf(prescriptor) === -1) {
          _reg.push(prescriptor);
          localStorage.setItem('mt_prescripteurs', JSON.stringify(_reg));
        }
        /* apprendre aussi le COUPLE nom↔type de recette (P-H 06/08) : sert à
           proposer d'abord les médecins du type choisi, sans cacher les autres */
        if (receta) {
          var _regT = JSON.parse(localStorage.getItem('mt_prescriptores_receta') || '{}');
          if (!_regT[prescriptor]) _regT[prescriptor] = [];
          if (_regT[prescriptor].indexOf(receta) === -1) {
            _regT[prescriptor].push(receta);
            localStorage.setItem('mt_prescriptores_receta', JSON.stringify(_regT));
          }
        }
      } catch (e) {}
    }
    /* Composer la posologie */
    var dosisQty = document.getElementById('med-edit-dosis-qty').value.trim();
    var dosisForm = document.getElementById('med-edit-dosis-form').value;
    var concentracion = document.getElementById('med-edit-concentracion').value.trim();
    var dosis = '';
    if (dosisQty && dosisForm) dosis = dosisQty + ' ' + dosisForm;
    else if (dosisQty) dosis = dosisQty;
    else if (dosisForm) dosis = dosisForm;
    var slots = [];
    ['am', 'almuerzo', 'mid', 'pm', 'cena', 'night', 'libre'].forEach(function(sid) {
      var el = document.getElementById('med-edit-slot-' + sid);
      if (el && el.checked) slots.push(sid);
    });

    var allMeds = loadMeds();
    for (var i = allMeds.length - 1; i >= 0; i--) {
      if (allMeds[i].nom === medName || (allMeds[i].nom && allMeds[i].nom.toUpperCase().startsWith(medName.toUpperCase().replace(/\s*\(\d+\)$/,'')))) {
        allMeds[i].nom = nuevoNombre;
        delete allMeds[i]._borrador; /* geste humain = la fiche existe pour de vrai */
        allMeds[i].statut = statut;
        if (debut) allMeds[i].date_debut = debut;
        if (fin) allMeds[i].date_fin = fin;
        /* motif / remplace_par : plus dans l'UI (maquette 06/08) — préservés tels quels */
        if (prescriptor) {
          allMeds[i].prescriptor = prescriptorResolverId(prescriptor); /* nom tapé -> id (P-H 06/08) */
          delete allMeds[i].prescriptor_origen; /* geste humain = validation, le flag deducido tombe */
        }
        if (receta) allMeds[i].receta = receta;
        allMeds[i].dosis = dosis;
        allMeds[i].concentracion = concentracion;
        allMeds[i].slots = slots;
        allMeds[i].comida = document.getElementById('med-edit-comida').value;
        allMeds[i].duracion = document.getElementById('med-edit-duracion').value;
        allMeds[i].frecuencia = document.getElementById('med-edit-frecuencia').value;
        break;
      }
    }
    saveMeds(allMeds);
    document.body.removeChild(ov);
    buildMedicamentos();
    /* Rafraîchir le Protocolo si la fonction existe */
    if (typeof protoBuildRxView === 'function') protoBuildRxView();
    /* P-H 06/08 (trouvé par lui-même) : sauter vers la fiche n'a de sens que
       pour une VRAIE édition — pour une création, la fiche peut très bien
       être filtrée hors de vue (statut « nouveau » sous le filtre par
       défaut « En curso »), et le saut vers un élément invisible produisait
       un défilement erroné au lieu d'un simple rafraîchissement propre. */
    if (!_esNuevo) {
      var normKey = nuevoNombre.replace(/\s*\(.*?\)/g,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
      setTimeout(function() { jumpToMed('med-card-' + normKey); }, 200);
    }
  };
  bc.onclick = function() { document.body.removeChild(ov); };
  ov.onclick = function(e) { if (e.target === ov) document.body.removeChild(ov); };
}

    box.style.top = (e.clientY - dragY) + 'px';
  });
  document.addEventListener('mouseup', function() { isDragging = false; });

  content.style.cssText = 'padding:14px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:4px';

  }

    cb.style.cssText = 'accent-color:var(--accent);cursor:pointer;width:16px;height:16px';
    cb.addEventListener('change', function() {
      label.style.borderColor = cb.checked ? 'var(--accent)' : 'var(--border)';
      label.style.background = cb.checked ? 'rgba(74,143,232,0.15)' : 'var(--surface2)';

  ov.appendChild(box);
  ov.addEventListener('click', function(e) { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov);

  /* Mettre à jour le compteur initial */
  updateCounter();
}

/* Calcul auto de Fecha fin à partir de Fecha inicio + durée */
function medDuracionChange() {
  var durEl = document.getElementById('med-edit-duracion');
  if (!durEl) return; /* champ retiré de l'UI (maquette 06/08) — appel depuis Fecha inicio devenu inoffensif */
  var dur = parseInt(durEl.value);
  var debut = document.getElementById('med-edit-debut').value;
  if (dur > 0 && debut) {
    var d = new Date(debut);
    d.setDate(d.getDate() + dur);
    var finInput = document.getElementById('med-edit-fin');
    finInput.value = d.toISOString().slice(0, 10);
    finInput.style.color = 'var(--accent)';
    var hint = document.getElementById('med-edit-fin-hint');
    if (hint) hint.textContent = '(calculada: ' + dur + ' días)';
  }
}

/* Copier les données du médicament dans le presse-papiers */
function medCopyRx(medName) {
  var meds = loadMeds().filter(function(m) { return m.nom === medName; });
  var last = meds.length ? meds[meds.length - 1] : {};
  var slotsLabels = {am:'Desayuno',almuerzo:'Almuerzo',mid:'Comida',pm:'Merienda',cena:'Cena',night:'Noche',libre:'Libre'};
  var comidaLabels = {antes:'Antes de comer',durante:'Durante la comida',despues:'Después de comer',ayunas:'En ayunas',lejos:'Lejos de comidas',si_necesario:'Si necesario (PRN)'};
  var text = '══════════════════════════════════\n';
  text += '  PRESCRIPCIÓN — ' + medName + '\n';
  text += '══════════════════════════════════\n';
  if (last.dosis) text += '  Posología: ' + last.dosis + (last.concentracion ? ' (' + last.concentracion + ' mg)' : '') + '\n';
  if (last.slots && last.slots.length) text += '  Horarios: ' + last.slots.map(function(s){return slotsLabels[s]||s;}).join(', ') + '\n';
  if (last.comida) text += '  Instrucciones: ' + (comidaLabels[last.comida]||last.comida) + '\n';
  if (last.prescriptor) text += '  Prescrito por: ' + prescriptorNombre(last.prescriptor) + '\n';
  if (last.date_debut) text += '  Desde: ' + last.date_debut + '\n';
  if (last.date_fin) text += '  Hasta: ' + last.date_fin + '\n';
  text += '\n── Salufolio · Medicamentos v1.8.5 ──\n';
  navigator.clipboard.writeText(text).then(function() {
    if (typeof customAlert === 'function') customAlert('✓ Copiado', 'Prescripción copiada al portapapeles.', '📋', 'var(--accent2)');
  });
}

/* Incrémenter/décrémenter la quantité de dosis et activer/désactiver la forme */
function medReordenarDoctores() {
  /* P-H 06/08 : choisir un type de recette PROPOSE D'ABORD les médecins
     appris avec ce type (registre mt_prescriptores_receta, nourri à chaque
     sauvegarde) — sans jamais cacher les autres : un filtre strict qui vide
     la liste ferait croire à une panne au premier médecin nouveau. */
  try {
    var dl = document.getElementById('med-edit-doctors');
    var tipo = document.getElementById('med-edit-receta');
    if (!dl || !tipo) return;
    var regT = JSON.parse(localStorage.getItem('mt_prescriptores_receta') || '{}');
    var opciones = Array.prototype.slice.call(dl.querySelectorAll('option')).map(function(o) { return o.value; });
    var t = tipo.value;
    opciones.sort(function(a, b) {
      var aT = t && regT[a] && regT[a].indexOf(t) !== -1 ? 0 : 1;
      var bT = t && regT[b] && regT[b].indexOf(t) !== -1 ? 0 : 1;
      if (aT !== bT) return aT - bT;
      return a.localeCompare(b);
    });
    dl.innerHTML = opciones.map(function(n) { return '<option value="' + n.replace(/"/g, '&quot;') + '">'; }).join('');
  } catch (e) {}
}

/* Désactiver Motivo et Fecha fin quand le statut est actif, remplir date fin si abandon/suspension */
function medStatutChange() {
  var statut = document.getElementById('med-edit-statut').value;
  var actif = (statut === 'en_cours' || statut === 'nouveau' || statut === 'a_demanda');
  var motifBlock = document.getElementById('med-edit-motif-block');
  var finBlock = document.getElementById('med-edit-fin-block');
  var motifInput = document.getElementById('med-edit-motif');
  var finInput = document.getElementById('med-edit-fin');
  if (motifBlock) motifBlock.style.opacity = actif ? '0.4' : '1';
  if (motifInput) motifInput.disabled = actif;
  if (finBlock) {
    var hint = document.getElementById('med-edit-fin-hint');
    if (actif) {
      finBlock.style.opacity = '0.4';
      finInput.disabled = true;
      if (hint) hint.textContent = '(sin límite)';
    } else {
      finBlock.style.opacity = '1';
      finInput.disabled = false;
      if (hint && !finInput.value) hint.textContent = '';
      /* Si abandon/suspension/terminé et pas de date fin → mettre aujourd'hui */
      if (!finInput.value && (statut === 'suspendu' || statut === 'abandonne' || statut === 'terminado')) {
        finInput.value = new Date().toISOString().slice(0, 10);
        if (hint) hint.textContent = '(fecha de hoy)';
        finInput.style.color = 'var(--warn)';
      }
    }
  }
}
