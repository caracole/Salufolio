<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ayuda · La casa</title>
<link rel="stylesheet" href="../comun/salufolio.css">
<style>
body{margin:0;padding:22px 26px 50px;background:var(--bg);color:var(--text);
     font-family:var(--sans,system-ui,sans-serif);line-height:1.72}
.env{max-width:680px;margin:0 auto}
h1{font-family:var(--serif);font-size:21px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:22px}
h2{font-family:var(--serif);font-size:15px;color:var(--accent);margin:24px 0 7px;
   border-bottom:1px solid var(--border);padding-bottom:4px}
p{margin:0 0 12px;font-size:14px}
.sordo{color:var(--muted);font-size:13px}
.nota{background:var(--surface);border-left:3px solid var(--accent);
      border-radius:0 8px 8px 0;padding:11px 15px;font-size:13px;
      color:var(--muted);margin:16px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 18px}
td{padding:7px 10px 7px 0;border-bottom:1px solid var(--border);vertical-align:top}
td:first-child{white-space:nowrap;width:1%;padding-right:16px;font-size:16px;
               text-align:center}
.b{font-weight:600}

/* ── les drapeaux, en haut à droite ── */
#lenguas{position:fixed;top:12px;right:16px;display:flex;gap:5px;z-index:10}
#lenguas button{border:1px solid var(--border);background:var(--surface);
  border-radius:7px;padding:3px 8px;cursor:pointer;font-size:14px;line-height:1.4;
  opacity:.5;transition:all .18s}
#lenguas button:hover{opacity:.85}
#lenguas button.on{opacity:1;border-color:var(--accent)}
[data-lg]{display:none}
[data-lg].on{display:block}
</style>
</head>
<body>

<div id="lenguas"></div>
<div class="env" id="cuerpo"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   LA AYUDA DE LA CASA — en las cuatro lenguas (P-H, 16/09/2026)

   « Dans les langues supportées. »

   UN SOLO FICHERO, cuatro lenguas dentro. Cuando la casa cambia, se
   corrige un documento, no cuatro — y ninguno se queda atrás.

   La lengua viene de donde la dejó el usuario (sf_idioma); si no hay
   nada, del navegador; si tampoco, castellano.
   ══════════════════════════════════════════════════════════════════════ */

var LENGUAS = [
  { id:'es', bandera:'🇪🇸', nombre:'Castellano' },
  { id:'ca', bandera:'🏳️',  nombre:'Valencià'   },
  { id:'fr', bandera:'🇫🇷', nombre:'Français'   },
  { id:'en', bandera:'🇬🇧', nombre:'English'    }
];

var AYUDA = {

es: `
<h1>🏠 La casa</h1>
<div class="sub">Aquí se elige a quién se mira, y con qué se mira</div>

<p>Esta pantalla no muestra datos: los reparte. Elija un paciente arriba,
y las tarjetas de abajo se encienden.</p>

<h2>Arriba — de quién se trata</h2>
<p>La lista de <b>pacientes conocidos</b> trae los que ya tienen
expediente. Elija uno: debajo aparecen sus expedientes, el más reciente
primero.</p>
<table>
  <tr><td>➕</td><td><span class="b">Nuevo</span><br>
      <span class="sordo">Nombre, apellidos y SIP — la matrícula se forma
      sola con las iniciales y las cuatro últimas cifras. Se crea su
      carpeta y se empieza de cero.</span></td></tr>
  <tr><td>📂</td><td><span class="b">Un fichero suelto</span><br>
      <span class="sordo">Para abrir un expediente que esté en otro sitio
      — una llave USB, la carpeta de descargas.</span></td></tr>
</table>
<div class="nota">Mientras no haya expediente abierto, las tarjetas que
necesitan datos esperan apagadas. El <b>glosario</b> funciona siempre:
no necesita ninguno.</div>

<h2>Abajo — con qué mirarlo</h2>
<table>
  <tr><td>👁</td><td><span class="b">Ver</span><br>
      <span class="sordo">Consultan y no tocan nada: el resumen, las
      curvas, la cronología, el radar, las correlaciones.</span></td></tr>
  <tr><td>✍️</td><td><span class="b">Ver y modificar</span><br>
      <span class="sordo">Escriben en el expediente: los tratamientos,
      la revisión, la auditoría, y las tres adquisiciones.</span></td></tr>
</table>
<p class="sordo">Toque una tarjeta y el programa se abre aquí mismo, con
el expediente ya cargado. El 🏠 lo trae de vuelta.</p>

<h2>La banda de arriba</h2>
<table>
  <tr><td>🐝</td><td>Volver al panal — la entrada de la casa</td></tr>
  <tr><td>💾</td><td>Guardar el expediente. Se escribe un fichero nuevo:
      lo de antes no se toca</td></tr>
  <tr><td>🌐</td><td>El idioma — toda la casa lo sigue</td></tr>
  <tr><td>🌓</td><td>La paleta de colores</td></tr>
  <tr><td>💬</td><td>Las burbujas de ayuda: encendidas o apagadas.
      Vale para todos los programas</td></tr>
  <tr><td>❔</td><td>Esta página</td></tr>
</table>

<h2>Lo que hay que saber</h2>
<p><b>Nada sale de su ordenador.</b> Ni a una nube, ni a un servidor, ni
a nosotros. El expediente es un fichero suyo, en su disco.</p>
<p><b>Guardar no borra.</b> Cada vez se escribe un fichero nuevo, con su
fecha. El anterior sigue donde estaba — si algo sale mal, se vuelve.</p>
<p><b>Con el servidor, todo se coloca solo.</b> Sin él, el navegador
descarga el fichero y hay que ponerlo usted en la carpeta del paciente:
un navegador no puede escribir en el disco, y está bien que sea así.</p>
<div class="nota">Si una tarjeta está apagada y cree que no debería,
mire arriba: casi siempre es que falta elegir el expediente.</div>
`,

<div class="sub">Ici l'on choisit qui l'on regarde, et avec quoi</div>

<p>Cet écran ne montre pas de données : il les répartit. Choisissez un

<h2>En bas — avec quoi le regarder</h2>
<table>
  <tr><td>👁</td><td><span class="b">Consulter</span><br>

      résumé, les courbes, la chronologie, le radar, les

  <tr><td>✍️</td><td><span class="b">Voir et modifier</span><br>

</table>
<p class="sordo">Touchez une carte et le programme s'ouvre ici même, le

<h2>La bande du haut</h2>
<table>
  <tr><td>🐝</td><td>Revenir au panal — l'entrée de la maison</td></tr>
  <tr><td>💾</td><td>Garder le dossier. Un fichier neuf s'écrit : ce
      qu'il y avait avant n'est pas touché</td></tr>
  <tr><td>🌐</td><td>La langue — toute la maison la suit</td></tr>
  <tr><td>🌓</td><td>La palette de couleurs</td></tr>
  <tr><td>💬</td><td>Les bulles d'aide : allumées ou éteintes. Vaut pour

  <tr><td>❔</td><td>Cette page</td></tr>

<h2>Ce qu'il faut savoir</h2>
<p><b>Rien ne sort de votre ordinateur.</b> Ni vers un nuage, ni vers un
serveur, ni vers nous. Le dossier est un fichier à vous, sur votre
disque.</p>
<p><b>Garder n'efface pas.</b> Chaque fois un fichier neuf s'écrit, avec
sa date. Le précédent reste où il était — si quelque chose tourne mal,
on revient.</p>
<p><b>Avec le serveur, tout se range tout seul.</b> Sans lui, le
navigateur télécharge le fichier et c'est à vous de le poser dans le
dossier du patient : un navigateur ne peut pas écrire sur le disque, et
c'est bien ainsi.</p>
<div class="nota">Si une carte est éteinte et que vous croyez qu'elle ne
devrait pas, regardez en haut : c'est presque toujours qu'il manque le
choix du dossier.</div>
`,

};

/* ── la lengua : la que dejó el usuario, o la del navegador ── */
function lenguaDe(){
  var l = '';
  try{ l = localStorage.getItem('sf_idioma') || localStorage.getItem('mf_idioma') || ''; }catch(e){}
  if(!l) l = (navigator.language || 'es').substring(0,2).toLowerCase();
  return AYUDA[l] ? l : 'es';
}

function pon(l){
  document.getElementById('cuerpo').innerHTML = AYUDA[l] || AYUDA.es;
  document.documentElement.lang = l;
  document.querySelectorAll('#lenguas button').forEach(function(b){
    b.classList.toggle('on', b.dataset.l === l);
  });
  try{ localStorage.setItem('sf_idioma', l); }catch(e){}
}

document.getElementById('lenguas').innerHTML = LENGUAS.map(function(x){
  return '<button data-l="' + x.id + '" onclick="pon(\'' + x.id + '\')" '
       + 'title="' + x.nombre + '">' + x.bandera + '</button>';
}).join('');

pon(lenguaDe());
</script>
</body>
</html>
