<script>

   Salufolio tiene dos entradas (P-H, 11/09/2026):
     · el PANAL   para descubrir y aprender

(function(){
  var conoce = false;
  try{ conoce = localStorage.getItem('sf_visita_hecha') === 'si'; }catch(e){}

})();
</script>
