/* ══ PolygoneReg ══ */
class PolygoneReg{
  constructor(n,R,rot){this.n=n;this.R=R;this.a=2*R*Math.sin(Math.PI/n);this.r=R*Math.cos(Math.PI/n);this.rotation=rot||0}
  vertices(cx,cy){var p=[],r=this.rotation*Math.PI/180;for(var i=0;i<this.n;i++){var a=2*Math.PI*i/this.n+r;p.push({x:cx+this.R*Math.cos(a),y:cy+this.R*Math.sin(a)})}return p}
  svgPoints(cx,cy){return this.vertices(cx,cy).map(function(p){return(Math.round(p.x*10)/10)+','+(Math.round(p.y*10)/10)}).join(' ')}
  static fit(aW,aH,n,rot){var t=new PolygoneReg(n,100,rot),v=t.vertices(0,0),xs=v.map(function(p){return p.x}),ys=v.map(function(p){return p.y});var tw=Math.max.apply(null,xs)-Math.min.apply(null,xs),th=Math.max.apply(null,ys)-Math.min.apply(null,ys);return new PolygoneReg(n,100*Math.min(aW/tw,aH/th),rot)}
}
class Hexagon extends PolygoneReg{
  constructor(R,o){super(6,R,o==='flat'?0:-90);this.orientation=o||'pointy'}
  static fit(aW,aH,o){return new Hexagon(PolygoneReg.fit(aW,aH,6,o==='flat'?0:-90).R,o)}
}

/* ══ SVG artistique ══ */
function hexSVG(R,cx,cy,color,orient,id){
  var hex=new Hexagon(R,orient),pts=hex.svgPoints(cx,cy),g='g_'+id,gl='gl_'+id;

  s+='<filter id="'+gl+'"><feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  s+='<polygon points="'+pts+'" fill="rgba(0,0,0,.25)" transform="translate(1.5,2.5)"/>';
  s+='<polygon points="'+pts+'" fill="url(#'+g+')" stroke="'+color+'" stroke-width="1.8" filter="url(#'+gl+')"/>';
  var v=hex.vertices(cx,cy);
  s+='<polygon points="'+v.slice(0,3).concat([{x:cx,y:cy}]).map(function(p){return Math.round(p.x)+','+Math.round(p.y)}).join(' ')+'" fill="rgba(255,255,255,.03)"/>';
  var inn=new Hexagon(R*.91,orient);
  s+='<polygon points="'+inn.svgPoints(cx,cy)+'" fill="none" stroke="'+color+'" stroke-width=".4" opacity=".25"/>';
  return s;
}

/* v2026.7.22b — DRAPEAUX comme dans Protocolo (demande P-H, 2e rappel !) :

function pLangEtiqueta(l){ return ({es:'🇪🇸 ES', ca:'🇦🇩 CA', fr:'🇫🇷 FR', en:'🇬🇧 EN'})[l] || l.toUpperCase(); }

/* ══ GRILLE homothétique ══ */
/* ══ HOMOTHÉTIE VRAIE (P-H 17/07 : « en redimensionnant l'écran, on devrait
   redimensionner homothétiquement l'essaim ») ══
   La ruche est bâtie UNE seule fois au rayon de référence R0.
   Redimensionner = UN transform:scale(k) — pas de reconstruction, pas de
   recalcul : la proportion est préservée par construction (k est LE rapport
   d'homothétie), le centre reste le centre, le texte suit exactement. */
var R0=120, _zoom=1;
/* Découverte de P-H (17/07) officialisée : Maj+molette règle la taille du
   texte DANS l'alvéole ouverte — et nulle part ailleurs. Gravée dans le code
   pour marcher pareil sur toute machine ; mémorisée entre les visites. */
var _txtZoom=parseFloat(localStorage.getItem('panal_txtzoom')||'1');
function aplicarTxtZoom(){
  var b=document.getElementById('pop-body');
  if(b)b.style.zoom=_txtZoom;
  try{localStorage.setItem('panal_txtzoom',_txtZoom)}catch(e){}
}
function fitHive(){
  var hive=document.getElementById('hive');
  var S3=Math.sqrt(3);
  var visW=3*S3*R0, visH=5*R0;              /* dimensions visuelles de référence */
  var r=hive.parentElement.getBoundingClientRect();   /* le hublot, fixe à l'écran */
  var k=Math.min((r.height-8)/visH, (r.width-8)/visW)*_zoom;   /* LE rapport d'homothétie */
  hive.style.transform='translate(-50%,-50%) scale('+k+')';
  /* le hublot ne bouge pas : l'essaim se dilate en son centre, le débord est
     rogné pareillement des quatre côtés — l'alvéole centrale reste au centre */
}

function buildHive(){
  var el=document.getElementById('hive');
  el.innerHTML='';
  var R=R0;                                  /* taille de référence — l'écran n'entre plus ici */
  var S3=Math.sqrt(3);
  var sp=1; /* espacement entre centres (1=collés) */
  var hexW=S3*R, hexH=2*R;
  var totalW=3*S3*R*sp+S3*R, totalH=5*R*sp;
  var cx=totalW/2, cy=totalH/2;
  var positions=[
    /* Rangée 0: 2 hexagones */
    {x:cx-S3*R*sp/2, y:cy-1.5*R*sp},
    {x:cx+S3*R*sp/2, y:cy-1.5*R*sp},
    /* Rangée 1: 3 hexagones */
    {x:cx-S3*R*sp,   y:cy},
    {x:cx,            y:cy},       /* CENTRE */
    {x:cx+S3*R*sp,   y:cy},
    /* Rangée 2: 2 hexagones */
    {x:cx-S3*R*sp/2, y:cy+1.5*R*sp},
    {x:cx+S3*R*sp/2, y:cy+1.5*R*sp}
  ];
  el.style.width=Math.round(totalW)+'px';
  el.style.height=Math.round(totalH)+'px';
  fitHive();                                 /* projection homothétique immédiate */

  for(var i=0;i<ACTIVE.length;i++){
    var c=ACTIVE[i],pos=positions[i];
    var div=document.createElement('div');
    div.className='hex'+(i===3?' center':'');
    div.style.left=Math.round(pos.x-hexW/2)+'px';
    div.style.top=Math.round(pos.y-hexH/2)+'px';
    div.style.width=Math.round(hexW)+'px';
    div.style.height=Math.round(hexH)+'px';
    div.onclick=(function(idx){return function(){cellClick(idx)}})(i);
    /* Tailles adaptatives */
    var icoSize=Math.max(20,Math.round(R/2.5));
    var lblSize=Math.max(12,Math.round(R/5));
    var subSize=Math.max(9,Math.round(R/7));
    if(i===3){icoSize=Math.round(icoSize*1.3);lblSize=Math.round(lblSize*1.3)}
    var svgContent=hexSVG(R,hexW/2,hexH/2,c.color,'pointy','g'+i);
    div.innerHTML='<svg viewBox="0 0 '+Math.round(hexW)+' '+Math.round(hexH)+'" style="width:100%;height:100%;position:absolute">'+svgContent+'</svg>'
      +'<div class="hex-ct"><span class="hex-ico" style="font-size:'+icoSize+'px">'+(c.icon||'')+'</span><span class="hex-lbl" style="font-size:'+lblSize+'px">'+(c.label||'')+'</span><span class="hex-sub" style="font-size:'+subSize+'px">'+(ptr(c,'sub')||'')+'</span></div>';
    el.appendChild(div);
  }
  /* L'ABEILLE (P-H 19/07, spec du triangle isocèle : encoche du bas,
     b + h/2 → (cx, cy+2R+R/4)) — créée APRÈS les alvéoles et z-index roi :
     les boîtes rectangulaires des hexagones voisins ne la couvrent plus. */
  var bee=document.createElement('div');
  bee.className='bee-swap';
  bee.textContent='🐝';
  bee.title='Cambiar de panal';
  bee.onclick=function(ev){ev.stopPropagation();swapHive();};
  bee.style.left=Math.round(cx)+'px';
  bee.style.top=Math.round(cy + 2*R + R/4)+'px';
  el.appendChild(bee);
}

/* ══ Zoom molette ══ */
document.addEventListener('wheel',function(e){
  var abierto=document.getElementById('pov').classList.contains('show');
  if(abierto){
    if(e.shiftKey){                          /* Maj+molette : le texte de l'alvéole */
      e.preventDefault();
      var d=e.deltaY||e.deltaX;              /* Maj permute parfois les axes */
      _txtZoom=Math.max(0.7,Math.min(2,_txtZoom+(d<0?0.08:-0.08)));
      aplicarTxtZoom();
    }
    return;                                  /* molette seule : le contenu défile */
  }
  e.preventDefault();
  _zoom=Math.max(0.5,Math.min(2,_zoom-e.deltaY*0.001));
  fitHive();                                 /* zoom = même homothétie, autre k */
},{passive:false});

/* ══ POPUP ══ */
var _cur=0;
function cellClick(i){var c=ACTIVE[i];if(c.action){c.action();return}if(c.content)openP(i)}
function openP(i){
  /* Animation: origin depuis la position du hex cliqué */
  var hexEl=document.querySelectorAll('.hex')[i];
  if(hexEl){
    var rect=hexEl.getBoundingClientRect();
    var popup=document.getElementById('popup');
    popup.style.transformOrigin=Math.round(rect.left+rect.width/2)+'px '+Math.round(rect.top+rect.height/2)+'px';
    setTimeout(function(){popup.style.transformOrigin='center center'},600);
  }
  _cur=i;var c=ACTIVE[i];resizeP(c.color);
  document.getElementById('pop-title').textContent=(c.icon||'')+' '+(c.label||'');
  document.getElementById('pop-title').style.color=c.color;
  document.getElementById('pop-body').innerHTML=ptr(c,'content')||'';
  document.getElementById('pov').classList.add('show');
  /* ⌄ seulement si ça déborde — et il s'efface dès qu'on déroule */
  var body=document.getElementById('pop-body'), hint=document.getElementById('scroll-hint');
  body.scrollTop=0;
  setTimeout(function(){hint.classList.toggle('show', body.scrollHeight>body.clientHeight+8)},250);
  body.onscroll=function(){hint.classList.remove('show')};
  aplicarTxtZoom();                       /* la taille de texte choisie te suit */
}
function resizeP(color){
  var popup=document.getElementById('popup');
  var hex=Hexagon.fit(window.innerWidth*.9,window.innerHeight*.82,'flat');
  var v=hex.vertices(0,0),xs=v.map(function(p){return p.x}),ys=v.map(function(p){return p.y});
  var w=Math.max.apply(null,xs)-Math.min.apply(null,xs),h=Math.max.apply(null,ys)-Math.min.apply(null,ys);
  var cx=w/2,cy=h/2;
  popup.style.width=Math.round(w)+'px';popup.style.height=Math.round(h)+'px';
  color=color||ACTIVE[_cur].color;
  document.getElementById('popup-svg').setAttribute('viewBox','0 0 '+Math.round(w)+' '+Math.round(h));
  document.getElementById('popup-svg').innerHTML=hexSVG(hex.R,cx,cy,color,'flat','pop');
  /* Hotspots aux 6 sommets */
  var verts=hex.vertices(cx,cy);
  /* Table des sommets (P-H 17/07 : « pas tout à fait à mon goût » + « le > pourrait
     activer un autre essaim ! ») — 4 hotspots nets au lieu de 6 répétés.
     Indice du sommet (hexágono flat) : 0=derecha 1=abajo-dcha 2=abajo-izq
     3=izquierda 4=arriba-izq 5=arriba-dcha */
  var VERTS=[
    {i:3, ico:'◀',  act:'prev',  lab:'Anterior'},
    {i:0, ico:'▶',  act:'next',  lab:'Siguiente'},
    {i:5, ico:'✕',  act:'close', lab:'Cerrar'},
    {i:1, ico:'🐝', act:'hive',  lab:_isMain?'Ver perfiles':'Ver soluciones'}
  ];
  var icoSize=Math.min(26,Math.max(18,Math.round(hex.R/6)));   /* plafonné : l'icône reste dans sa pastille */
  var hs='';VERTS.forEach(function(vd){var v=verts[vd.i];
    hs+='<div class="vertex-hs" style="left:'+Math.round(v.x/w*100)+'%;top:'+Math.round(v.y/h*100)+'%" onclick="hsA(\''+vd.act+'\')" title="'+vd.lab+'"><span class="v-ico" style="font-size:'+icoSize+'px">'+vd.ico+'</span><span class="v-lab">'+vd.lab+'</span></div>'});
  document.getElementById('vertex-hotspots').innerHTML=hs;
}
function hsA(a){
  if(a==='prev'){navP(-1);return}
  if(a==='next'){navP(1);return}
  if(a==='hive'){cP();setTimeout(function(){swapHive()},450);return}   /* le popup se referme, l'essaim permute */
  cP();
}
function cP(){
  var pov=document.getElementById('pov');
  var popup=document.getElementById('popup');
  popup.style.transform='scale(0)';
  popup.style.opacity='0';
  function onEnd(){
    pov.classList.remove('show');
    popup.style.transform='';
    popup.style.opacity='';
    popup.removeEventListener('transitionend',onEnd);
  }
  popup.addEventListener('transitionend',onEnd);
  /* Fallback si transitionend ne se déclenche pas */
  setTimeout(onEnd,2200);
}
function navP(d){var n=ACTIVE.length,i=_cur;for(var k=0;k<n;k++){i=(i+d+n)%n;if(ACTIVE[i].content){openP(i);return}}}

/* ══ SUB-HIVE — Même grille, contenu qui change ══ */
var SUB=[
  {icon:'🧑',label:'Paciente',sub:'Su historial',color:'#4ae8a4',action:function(){location.href='Salufolio.html?tour=0&perfil=paciente'}},
  {icon:'👨‍⚕️',label:'Profesional',sub:'Vista completa',color:'#e8e84a',action:function(){location.href='Salufolio.html?tour=0&perfil=medico'}},
  {icon:'👨‍👩‍👧',label:'Cuidador',sub:'Protocolo',color:'#e84a8a',action:function(){location.href='Salufolio_Protocolo_movil.html'}},

  {icon:'🎓',label:'Visita guiada',sub:'22 etapas',color:'#4ae8e8',action:function(){location.href='Salufolio.html?tour=1'}},
  {icon:'📊',label:'Saber más',sub:'En números',color:'#e8a44a',content:'<div class="sr"><div class="si"><span class="sn">10</span><span class="slab">Años</span></div><div class="si"><span class="sn">79</span><span class="slab">Módulos</span></div><div class="si"><span class="sn">510</span><span class="slab">Valores</span></div><div class="si"><span class="sn">36</span><span class="slab">PDF leídos</span></div></div><h3>¿Qué es Salufolio?</h3><p>Expediente médico longitudinal. Un único archivo HTML, sin conexión, sin servidor, sin nube. GNU GPL v3 · DOI 10.5281/zenodo.19973451</p>'},
  {icon:'📧',label:'Contacto',sub:'MediFolio@proton.me',color:'#8a4ae8',content:'PFB'}
];

var _isMain=true;
function swapHive(){
  var hexEls=document.querySelectorAll('.hex');
  var target=_isMain?SUB:CELLS;
  /* Phase 1: gonflement + disparition progressive */
  hexEls.forEach(function(el){
    el.style.transition='transform .8s ease, opacity .6s ease';
    el.style.transform='scale(1.08)';
    el.style.opacity='0.15';
  });
  /* Phase 2: changer le contenu (invisible) */
  setTimeout(function(){
    ACTIVE=target;                       /* l'essaim actif change ICI, avec le contenu */
    var R=R0;
    var hexW=Math.sqrt(3)*R, hexH=2*R;
    hexEls.forEach(function(el,i){
      if(i>=target.length)return;
      var t=target[i];
      var icoSize=Math.max(20,Math.round(R/2.5));
      var lblSize=Math.max(12,Math.round(R/5));
      var subSize=Math.max(9,Math.round(R/7));
      if(i===3){icoSize=Math.round(icoSize*1.3);lblSize=Math.round(lblSize*1.3)}
      el.querySelector('svg').innerHTML=hexSVG(R,hexW/2,hexH/2,t.color,'pointy','g'+i);
      el.querySelector('.hex-ico').textContent=t.icon;
      el.querySelector('.hex-ico').style.fontSize=icoSize+'px';
      el.querySelector('.hex-lbl').textContent=t.label;
      el.querySelector('.hex-lbl').style.fontSize=lblSize+'px';
      el.querySelector('.hex-sub').textContent=t.sub;
      el.querySelector('.hex-sub').style.fontSize=subSize+'px';
      el.onclick=(function(idx){return function(){cellClick(idx)}})(i);   /* cellClick lit ACTIVE */
    });
  },500);
  /* Phase 3: réapparition progressive + dégonflement */
  setTimeout(function(){
    hexEls.forEach(function(el){
      el.style.transform='scale(1)';
      el.style.opacity='1';
    });
  },600);
  /* Phase 4: reset */
  setTimeout(function(){
    hexEls.forEach(function(el){el.style.transition='all .3s'});
    _isMain=!_isMain;
  },1400);
}

document.addEventListener('keydown',function(e){if(e.key==='Escape')cP();if(e.key==='ArrowLeft')navP(-1);if(e.key==='ArrowRight')navP(1)});
window.addEventListener('resize',function(){
  fitHive();                                 /* redimensionner = re-projeter, rien d'autre */
  if(document.getElementById('pov').classList.contains('show'))resizeP();   /* le popup suit */
});
buildHive();
</script>
