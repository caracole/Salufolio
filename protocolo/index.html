  const idx = _cDraftB[tipo];
  if (Object.values(vals).every(x => x === null)) {   /* plus rien : la fiche s'efface */
    if (idx !== null && cs[idx]) { cs.splice(idx, 1); lsSet('mfp_constantes', cs); _reindexar(idx); }
    _cDraftB[tipo] = null; estadoConst(''); pintaSelBloques(); return;
  }
  if (B.extra.indexOf('arritmia') >= 0) vals.arritmia = _arrit ? true : null;
  if (B.extra.indexOf('o2') >= 0 && vals.spo2 !== null) vals.o2 = !!_o2;
  const horaPrev = (idx !== null && cs[idx]) ? cs[idx].hora : null;
  const rec = Object.assign({ fecha: diaKey(), hora: (hEl && horaValide(hEl.value)) || horaPrev || ahora() }, vals);
  if (idx === null || !cs[idx]) { cs.push(rec); _cDraftB[tipo] = cs.length - 1; }
  else cs[idx] = Object.assign({}, cs[idx], rec);
  lsSet('mfp_constantes', cs); estadoConst('✓ guardado · ' + rec.hora);
  /* 26/08 — NE JAMAIS réécrire l'heure pendant la frappe : on ne la pose que
     si le champ est VIDE. Le contrôle se fait à la sortie (focusout, plus bas).
     Avant : toute heure incomplète (« 1:30 » après un backspace) était aussitôt
     « réparée » — le geste d'effacer était annulé dans la milliseconde. */
  if (hEl && hEl.value.trim() === '') hEl.value = rec.hora;
  pintaSelBloques();
}

/* Retirer une fiche décale les indices : sans cela, les brouillons des
   autres blocs pointeraient sur la mauvaise ligne. */
function _reindexar(quitado) {
  Object.keys(_cDraftB).forEach(k => {
    if (_cDraftB[k] === null) return;
    if (_cDraftB[k] === quitado) _cDraftB[k] = null;
    else if (_cDraftB[k] > quitado) _cDraftB[k]--;
  });
}
/* P-H, 25/08 : « on devrait pouvoir visualiser une liste déroulante des
   heures de mesure ». Chaque bloc montre les siennes, plus « nouvelle ». */
/* Charger une fiche dans un bloc — ou vider le bloc si idx est null.
   C'est le geste commun au bouton « nouvelle mesure » et au clic sur une
   ligne du récapitulatif : un seul endroit, une seule vérité. */
function _cargarBloque(tipo, idx) {
  const B = BLOQUES_CONST[tipo]; if (!B) return;
  const cs = getConstantes(), c = (idx === null) ? null : cs[idx];
  const hEl = document.getElementById('c-' + tipo + '-hora');
  _cDraftB[tipo] = c ? idx : null;
  Object.keys(B.campos).forEach(k => { const e = document.getElementById(B.campos[k]);
    if (e) e.value = (!c || c[k] === null || c[k] === undefined) ? '' : c[k]; });
  if (tipo === 'ta') { _arrit = !!(c && c.arritmia); pintaArritmia(); }
  if (tipo === 'ps') { _o2 = !!(c && c.o2 === true); pintaO2(); }
  if (hEl) hEl.value = c ? (c.hora || '') : (esHoy() ? ahora() : '');
}
/* Le bouton : il ouvre une mesure neuve, rien d'autre. Éteint tant qu'il
   n'y a rien à prolonger — P-H, 26/08 : « actif dès que la première est
   validée ». Tº et Poids n'en ont pas : on ne se pèse pas dix fois. */
function nuevaMedida(tipo) {
  _cargarBloque(tipo, null);
  estadoConst('');
  const e = document.getElementById(BLOQUES_CONST[tipo].campos[Object.keys(BLOQUES_CONST[tipo].campos)[0]]);
  if (e) e.focus();
}
/* Cliquer une ligne du récapitulatif la ramène dans les champs. La ligne
   peut réunir plusieurs fiches (tension + pouls + température d'un même
   moment) : chaque bloc reprend LA SIENNE, les autres ne bougent pas. */
function abrirGrupo(ids) {
  const lista = String(ids || '').split(',').map(x => parseInt(x, 10)).filter(x => !isNaN(x));
  const cs = getConstantes();
  Object.keys(BLOQUES_CONST).forEach(tipo => {
    const i = lista.find(j => cs[j] && _fichaDeBloque(cs[j], tipo));
    if (i !== undefined) _cargarBloque(tipo, i);
  });
  estadoConst('');
  const p = document.getElementById('p-const'); if (p) p.scrollIntoView({ block: 'nearest' });
}
function pintaSelBloques() {
  /* ⚠ 26/08 (P-H) : « on ne peut pas corriger l'heure de tension ».
     Trouvé : chaque frappe enregistre, chaque enregistrement REPEIGNAIT la
     liste — et refaire le contenu d'un <select> lui rend le focus sur
     certains navigateurs. Le curseur quittait donc la boîte de l'heure en
     pleine frappe. On ne repeint plus une liste tant que le doigt est
     posé dans un champ de son bloc ; elle se remettra à jour en sortant. */
  Object.keys(BLOQUES_CONST).forEach(tipo => {
    const b = document.getElementById('c-' + tipo + '-add'); if (!b) return;
    b.textContent = t('c_nueva');
    /* éteint tant qu'aucune mesure n'existe, et pendant qu'on en saisit
       une neuve — il n'y aurait rien à ouvrir */
    b.disabled = (_fichasDia(tipo).length === 0) || (_cDraftB[tipo] === null);
  });
}
/* 26/08 : le texte le plus long décide de la largeur du menu déroulant —
   sur un téléphone il occupait tout l'écran. On le resserre. */
function _resumenBloque(c, tipo) {
  if (tipo === 'ta') return (c.ta_sis != null ? c.ta_sis : '—') + '/' + (c.ta_dia != null ? c.ta_dia : '—');
  if (tipo === 'ps') { const p = [];
    if (c.fc != null) p.push(c.fc);
    if (c.spo2 != null) p.push(c.spo2 + '%' + (c.o2 === true ? '↑' : ''));
    return p.join('·'); }
  if (tipo === 'peso') return (c.peso != null ? c.peso : '');
  return (c.temp != null ? c.temp : '');
}
function estadoConst(s) {
  const e = document.getElementById('const-estado'); if (e) e.textContent = s;
  pintaConstHoy();
}
/* Une mesure en une ligne, sans étiquettes : les unités se lisent seules
   dans les quatre langues. */
function _resumenConst(c) {
  const p = [];
  if (c.ta_sis != null || c.ta_dia != null)
    p.push((c.ta_sis != null ? c.ta_sis : '—') + '/' + (c.ta_dia != null ? c.ta_dia : '—') + ' mmHg');
  if (c.fc != null) p.push(c.fc + ' lpm');
  if (c.spo2 != null) p.push(c.spo2 + ' %' + (c.o2 === true ? ' (O₂)' : (c.o2 === false ? ' (aire)' : '')));
  if (c.peso != null) p.push(c.peso + ' kg');
  if (c.temp != null) p.push(c.temp + ' °C');
  if (c.arritmia) p.push('⚡ ' + t('c_arritmia'));
  return p.join(' · ');
}
/* Les champs de Constantes se reposent D'UN SEUL ENDROIT — que l'on
   change de patient ou que l'on change de jour. Avant, la navigation
   par jour laissait les champs (et _cDraft) sur le jour précédent : une
   mesure tapée ensuite allait silencieusement déménager l'ancienne fiche. */
/* 25/08 — CHAQUE BLOC REPREND LA SIENNE. Auparavant on cherchait « la »
   fiche du jour et on la posait dans les six champs ; avec plusieurs
   mesures par jour, cela mélangeait la tension du matin et la température
   du soir. Chaque bloc va chercher SA dernière fiche, et l'heure affichée
   est celle de cette mesure-là. */
function recargarConst() {
  const cs = getConstantes();
  const pon = (id, v) => { const e = document.getElementById(id); if (e) e.value = (v === null || v === undefined) ? '' : v; };
  let ult = null;
  Object.keys(BLOQUES_CONST).forEach(tipo => {
    const B = BLOQUES_CONST[tipo], idxs = _fichasDia(tipo);
    const idx = idxs.length ? idxs[idxs.length - 1] : null;
    const c = idx !== null ? cs[idx] : null;
    Object.keys(B.campos).forEach(k => pon(B.campos[k], c && c[k]));
    const hEl = document.getElementById('c-' + tipo + '-hora');
    if (hEl) hEl.value = (c && c.hora) || (esHoy() ? ahora() : '');
    _cDraftB[tipo] = idx;
    if (tipo === 'ta') { _arrit = !!(c && c.arritmia); pintaArritmia(); }
    if (tipo === 'ps') { _o2 = !!(c && c.o2 === true); pintaO2(); }
    if (c) ult = c;
  });
  pon('c-fecha', fmtDiaLargo(diaKey()));
  ['c-tas','c-tad','c-fc','c-spo2','c-peso','c-temp'].forEach(function (id) {
    const e = document.getElementById(id); if (e && typeof avisarDudoso === 'function') avisarDudoso(e);
  });
  pintaSelBloques();
  estadoConst(ult ? '✓ guardado · ' + ult.hora : '');
}
/* ═══ 26/08 (P-H) — LES SEUILS ═══
   Deux degrés, pas un : l'AMBRE dit « regarde », le ROUGE dit « agis ».
   ⚠ ILS NE JUGENT PAS LA PERSONNE, ILS JUGENT UNE MESURE. P-H, 26/08 :
   « la persona cuidada parle beaucoup, elle s'essouffle, alors le pouls augmente et
   la tension aussi — j'attends le calme avant de mesurer ». Une couleur
   invite donc à REGARDER la valeur, jamais à conclure : c'est le cuidador
   qui sait si elle venait de parler. Pour la même raison le Protocolo
   n'écrit JAMAIS « hypertension » ni « fièvre » — il colore, il ne
   diagnostique pas.
   Valeurs arrêtées avec P-H le 26/08 (seuil domicile, pas celui du
   cabinet). `bajo`/`bajo_r` : en dessous ; `alto`/`alto_r` : au-dessus. */
const SEUILS_CONST = {
  ta_sis: { bajo_r: 90,  bajo: 100, alto: 130,  alto_r: 140 },
  ta_dia: { bajo_r: 60,  bajo: 65,  alto: 85,   alto_r: 90 },
  fc:     { bajo_r: 55,  bajo: 58,  alto: 86,   alto_r: 100 },
  spo2:   { bajo_r: 90,  bajo: 94 },
  temp:   { bajo_r: 35,  bajo: 35.5, alto: 37.5, alto_r: 38 }
};
function _nivel(k, v) {
  const S = SEUILS_CONST[k];
  if (!S || v === null || v === undefined || isNaN(v)) return '';
  if (S.bajo_r !== undefined && v < S.bajo_r) return 'rojo';
  if (S.alto_r !== undefined && v >= S.alto_r) return 'rojo';
  if (S.bajo !== undefined && v < S.bajo) return 'ambar';
  if (S.alto !== undefined && v >= S.alto) return 'ambar';
  return '';
}
function _pinta(k, v, txt) {
  const n = _nivel(k, v);
  return n ? '<span class="v-' + n + '">' + txt + '</span>' : txt;
}
/* ═══ LE FIL DE LA JOURNÉE ═══
   P-H, 26/08 : « afficher les mesures dans l'ordre des heures, ligne par
   ligne, heure en gras, anomalies en rouge — tout sur la même ligne ».
   Les listes déroulantes montrent chacune leur appareil ; ceci montre la
   JOURNÉE, tous appareils mêlés, dans l'ordre où les choses se sont
   passées. C'est la seule vue qui donne la suite des événements. */
function pintaConstHoy() {
  const el = document.getElementById('const-hoy'); if (!el) return;
  /* on garde l'INDICE de chaque fiche : c'est lui qu'on rendra au clic */
  const hoy = getConstantes().map((c, i) => (c && c.fecha === diaKey()) ? Object.assign({ _i: i }, c) : null)
    .filter(Boolean).sort((a, b) => String(a.hora || '').localeCompare(String(b.hora || '')));
  if (!hoy.length) { el.innerHTML = ''; return; }
  /* 24/08 (P-H) : elle listait les fiches du JOUR AFFICHÉ en les annonçant
     « aujourd'hui ». Le mot ne se dit que s'il est vrai — sinon la date. */
  /* ═══ 26/08 (P-H) — REGROUPER CE QUI EST UN SEUL MOMENT ═══
     « avant, une même heure s'affichait sur la même ligne ». Quatre
     appareils sortis d'affilée, c'est UNE lecture, pas quatre lignes.
     ⚠ MAIS PAS N'IMPORTE COMMENT : « quand je prends la tension de
     la persona cuidada je mesure en deux fois, ou même trois si un doute, et en
     moins de cinq minutes ». Une tranche de temps seule fondrait ces
     reprises et effacerait justement ce qui a motivé la seconde mesure.
     LA RÈGLE EST DONC DOUBLE : deux fiches se fondent si elles sont
     proches DANS LE TEMPS **ET** SI ELLES NE SE RECOUVRENT PAS — aucune
     valeur présente dans les deux. Tension, pouls, température et poids
     d'un même moment se rassemblent ; deux tensions d'affilée restent
     deux lignes. */
  const _min = h => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(h || ''));
                      return m ? (+m[1]) * 60 + (+m[2]) : null; };
  const CLAVES = ['ta_sis','ta_dia','fc','spo2','temp','peso'];
  const grupos = [];
  hoy.forEach(c => {
    const g = grupos[grupos.length - 1];
    const t1 = _min(c.hora), t0 = g ? _min(g.hora) : null;
    const cerca = (g && t0 !== null && t1 !== null && (t1 - t0) <= 5);
    const choca = g && CLAVES.some(k => c[k] != null && g[k] != null);
    if (cerca && !choca) {
      CLAVES.concat(['o2','arritmia']).forEach(k => { if (c[k] != null && g[k] == null) g[k] = c[k]; });
      g._ids.push(c._i);
    } else { grupos.push(Object.assign({ _ids: [c._i] }, c)); }
  });
  el.innerHTML = '<div class="ch-tit">' + (esHoy() ? t('tri_hoy') : _fechaCorta(diaKey()) + ' :') + '</div>' +
    grupos.map(c => {
      const p = [];
      if (c.ta_sis != null || c.ta_dia != null)
        p.push(_pinta('ta_sis', c.ta_sis, c.ta_sis != null ? c.ta_sis : '—') + '/' +
               _pinta('ta_dia', c.ta_dia, c.ta_dia != null ? c.ta_dia : '—'));
      if (c.fc != null) p.push(_pinta('fc', c.fc, c.fc + '<i>lpm</i>'));
      if (c.spo2 != null) p.push(_pinta('spo2', c.spo2, c.spo2 + '<i>%</i>') +
        (c.o2 === true ? '<i>O₂</i>' : (c.o2 === false ? '<i>aire</i>' : '')));
      if (c.temp != null) p.push(_pinta('temp', c.temp, c.temp + '<i>°</i>'));
      if (c.peso != null) p.push(c.peso + '<i>kg</i>');
      /* le symbole suffit — P-H, 26/08 : « inutile de mettre tout le texte
         en clair + rythme irrégulier » */
      if (c.arritmia) p.push('⚡');
      return '<div class="ch-lin" data-ids="' + (c._ids || []).join(',') + '">' +
             '<b>' + (c.hora || '--:--') + '</b> ' + p.join(' · ') + '</div>';
    }).join('');
  /* la vue descend d'elle-même sur la dernière : quatre lignes visibles,
     et c'est toujours la mesure qu'on vient de prendre qu'on voit */
  el.scrollTop = el.scrollHeight;
}
/* ═══ 26/08 (P-H) — « les champs se remplissent sans que je touche à rien » ═══
   Trouvé : une ligne du récapitulatif est À LA FOIS déroulante
   (overflow-x, pour lire la fin d'une longue mesure) ET cliquable. Sur un
   écran tactile, faire glisser pour lire déclenchait le clic au lever du
   doigt — donc abrirGrupo, donc une vieille fiche remontait dans les
   champs. On ne compte donc plus un clic, mais un TOUCHER : le doigt doit
   être reparti d'où il est venu (moins de 10 px) et n'avoir pas traîné. */
(function () {
  let x0 = 0, y0 = 0, t0 = 0;
  document.addEventListener('pointerdown', ev => {
    const l = ev.target.closest && ev.target.closest('.const-hoy .ch-lin');
    if (!l) return;
    x0 = ev.clientX; y0 = ev.clientY; t0 = Date.now();
  }, true);
  document.addEventListener('pointerup', ev => {
    const l = ev.target.closest && ev.target.closest('.const-hoy .ch-lin');
    if (!l || !t0) return;
    const bougé = Math.abs(ev.clientX - x0) > 10 || Math.abs(ev.clientY - y0) > 10;
    const long  = (Date.now() - t0) > 700;
    t0 = 0;
    if (bougé || long) return;          /* c'était un défilement, pas un choix */
    const ids = l.getAttribute('data-ids');
    if (ids) abrirGrupo(ids);
  }, true);
})();

/* ═══ UNE SEULE ÉCOUTE POUR TOUTE LA MAISON (forme proposée par P-H,
   29/07) ═══ Plutôt que de brancher un écouteur sur chaque champ — qu'on
   oubliera le jour où l'on en ajoutera un —, une seule écoute déléguée sur
   le document, et une TABLE qui dit ce que chaque champ doit faire.
   Ajouter un champ demain, c'est ajouter une ligne.

   « input » et non « change » : « change » n'arrive qu'à la sortie du
   champ, donc rien n'est écrit tant que le doigt y est. Les deux sont
   écoutés — « change » rattrape les listes déroulantes et les sélecteurs
   de date sur les navigateurs qui n'émettent pas « input ». Les fonctions
   appelées sont des upsert : écrire cent fois ne crée pas cent fiches. */
const CAMPOS_GUARDA = {
  /* 25/08 : chaque champ dit maintenant À QUEL BLOC il appartient. */
  'c-tas': e => { avisarDudoso(e); upsertBloque('ta'); },
  'c-tad': e => { avisarDudoso(e); upsertBloque('ta'); },
  'c-fc': e => { avisarDudoso(e); upsertBloque('ps'); },
  'c-spo2': e => { avisarDudoso(e); upsertBloque('ps'); },
  'c-peso': e => { avisarDudoso(e); upsertBloque('peso'); },
  'c-temp': e => { avisarDudoso(e); upsertBloque('temp'); },
  'c-ta-hora': () => upsertBloque('ta'),
  'c-ps-hora': () => upsertBloque('ps'),
  'c-peso-hora': () => upsertBloque('peso'),
  'c-temp-hora': () => upsertBloque('temp'),
  /* 15/08 — OUBLI RÉPARÉ : la boîte de l'heure de Notes s'affichait et se
     formatait, mais n'était déclarée nulle part ici : rien ne l'enregistrait.
     L'heure tapée mourait à l'écran et la fiche gardait son 12:00. */
  /* Une seule boîte d'heure pour toute la maison : elle s'adresse à l'écran
     ouvert. C'est l'écran qui dit de quelle heure il s'agit, pas la boîte. */
  /* 25/08 : Constantes a désormais une heure PAR BLOC — la barre partagée
     ne s'adresse plus qu'aux Notes. */
  'b-hora': () => { if (pantallaActiva() === 'notas') upsertObs(); },
  'nota-libre': () => upsertObs(),
  'cfg-patient2': e => renombrarActivo(e.value, null),
  'cfg-sip': e => renombrarActivo(null, e.value),
  'cfg-pc': e => setPc(e.value)
};
function ponerEscuchaUnica() {
  /* `blur` ne remonte pas : on l'écoute en phase de capture. */
  document.addEventListener('blur', _blurHora, true);
  const guarda = ev => {
    const t = ev.target;
    if (!t || !t.id) return;
    /* ⚠ 26/08 (P-H) : « impossible de corriger une heure — sélection +
       nouvelle frappe, ou effacement arrière ». C'était ceci : reformater
       À CHAQUE FRAPPE repose la valeur du champ, ce qui détruit la
       sélection et rejette le curseur à la fin. On formate donc À LA
       SORTIE du champ — la frappe reste libre, et l'heure se met en forme
       quand on la quitte. */
    if (ev.type === 'change' && /-hora$/.test(t.id)) formatHora(t);
    const f = CAMPOS_GUARDA[t.id];
    if (!f) return;
    /* Ne jamais avaler une erreur : un enregistrement qui échoue en silence
       est pire qu'un enregistrement qui manque, car on le croit fait. */
    try { f(t); }
    catch (err) {
      if (window.console) console.error('Protocolo — échec d\'enregistrement sur ' + t.id, err);
      const e2 = document.getElementById('const-estado');
      if (e2 && t.id.indexOf('c-') === 0) e2.textContent = '⚠ ' + (err && err.message ? err.message : 'error');
    }
  };
  /* Le champ de l'heure est toujours plein — cinq caractères, sa limite —
     donc aucune frappe n'y entrait. On sélectionne tout à l'entrée : le
     premier chiffre tapé remplace l'ancienne heure. Sur un téléphone,
     c'est la différence entre corrigible et impossible. */
  document.addEventListener('focusin', ev => {
    const t = ev.target;
    if (t && t.id && /-hora$/.test(t.id) && t.select) setTimeout(() => { try { t.select(); } catch (e) {} }, 0);
  }, true);
  document.addEventListener('input', guarda, true);
  document.addEventListener('change', guarda, true);
}
/* ═══════════════════════════════════════════════════════════════════
   LE MÉCANISME (maquette du 29/07, porté mot pour mot).
   ① poser ce qui est à l'écran · ② changer de casier · ③ relire et repeindre
   Aucun rechargement de page.
   ═══════════════════════════════════════════════════════════════════ */

/* ① Poser. Tout est déjà écrit à la frappe : ceci ne rattrape que ce qui
   serait encore sous le doigt. */
function guardarActual() {
  try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) {}
  try { Object.keys(BLOQUES_CONST).forEach(k => upsertBloque(k)); } catch (e) {}
  try { upsertObs(); } catch (e) {}
}

/* ③ Relire le casier du patient courant et repeindre les champs. C'est ce
   qui manquait : le programme n'avait jamais eu d'étape de RESTAURATION,
   il s'en remettait au rechargement de la page. */
function restaurarCampos() {
  /* — les constantes : la fiche du jour, si elle existe — */
  recargarConst();

  /* — la note libre : le brouillon du jour, reconnu à sa marque — */
  const obs = getObs();
  let oi = -1;
  for (let i = obs.length - 1; i >= 0; i--) {
    const o = obs[i];
    if (o && o.fecha === diaKey() && o.libre) { oi = i; break; }
  }
  const nl = document.getElementById('nota-libre');
  if (nl) nl.value = oi >= 0 ? (obs[oi].nota || '') : '';
  _oDraft = oi >= 0 ? oi : null;
  estadoObs(oi >= 0 ? '✓ guardado · ' + obs[oi].hora : '');

  if (typeof pintaConstHoy === 'function') pintaConstHoy();
}

/* La bascule elle-même. */
function cambiarPaciente(id) {
  guardarActual();
  setActivo(id);
  restaurarCampos();
  render(); renderDatos();
  if (typeof renderPacientes === 'function') renderPacientes();
}
function cerrarConstDraft() {
  pintaConstHoy();
  if (_cDraft === null) return;
  ['c-tas','c-tad','c-fc','c-spo2','c-peso','c-temp'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
  Object.keys(_cDraftB).forEach(k => _cDraftB[k] = null);
  _o2 = false; if (typeof pintaO2 === 'function') pintaO2();
  _cDraft = null; estadoConst('');
  const ef = document.getElementById('c-fecha'); if (ef) ef.value = fmtDiaLargo(diaKey());

  const hace_falta = (baseSalufolio() !== '');

/* ═══════════════════════════════════════════════════════════════════
   LE RÉSUMÉ POUR LA CONSULTATION
   Parcourir trente jours coûte la même boucle que sept : les journées
   sont rangées par date. La période n'est donc qu'une question posée.
   ═══════════════════════════════════════════════════════════════════ */
function _diasAtras(n) {
  const out = [], hoy = new Date();
  for (let i = 0; i < n; i++) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - i);
    out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
             '-' + String(d.getDate()).padStart(2, '0'));
  }
  return out;                                   /* du plus récent au plus ancien */
}
function _med(a) { return a.length ? (a.reduce((x, y) => x + y, 0) / a.length) : null; }
function _r1(x) { return x == null ? null : Math.round(x * 10) / 10; }

function reunirResumen(dias) {
  const fechas = _diasAtras(dias), enRango = f => fechas.indexOf(f) >= 0;
  const R = { dias: dias, desde: fechas[fechas.length - 1], hasta: fechas[0] };

  /* les prises : dues et données */
  const meds = getMeds(), tomas = getTomas();
  let debidas = 0, dadas = 0; const faltan = [];
  /* La journée en cours n'est pas finie : ses prises ne manquent pas encore,
     et les compter fausserait le pourcentage. On ne totalise que les jours
     achevés — et on le dit sur la feuille. */
  const _hoy = diaKey();
  fechas.filter(f => f !== _hoy).forEach(function (f) {
    meds.forEach(function (m) {
      if (m.momento === 'demanda') return;
      if (!medActivo(m, f) || !tocaHoy(m, f)) return;
      debidas++;
      if ((tomas[f] || {})[m.id]) dadas++;
      else if (faltan.length < 6) faltan.push({ f: f, n: m.nombre, mom: m.momento });
    });
  });
  R.tomas = { debidas: debidas, dadas: dadas, faltan: faltan };

  /* les constantes */
  const cs = getConstantes().filter(c => enRango(c.fecha));
  const col = k => cs.map(c => c[k]).filter(x => x != null).map(Number);
  R.const = { n: cs.length,
    ta_sis: _r1(_med(col('ta_sis'))), ta_dia: _r1(_med(col('ta_dia'))),
    fc: _r1(_med(col('fc'))), spo2: _r1(_med(col('spo2'))),
    peso_ini: null, peso_fin: null, temp_max: null, arritmia: 0, ta_max: null };
  const pesos = cs.filter(c => c.peso != null).sort((a, b) => a.fecha.localeCompare(b.fecha));
  if (pesos.length) { R.const.peso_ini = pesos[0].peso; R.const.peso_fin = pesos[pesos.length - 1].peso; }
  const temps = col('temp'); if (temps.length) R.const.temp_max = Math.max.apply(null, temps);
  R.const.arritmia = cs.filter(c => c.arritmia).length;
  let mx = null; cs.forEach(function (c) {
    if (c.ta_sis != null && (!mx || Number(c.ta_sis) > Number(mx.ta_sis))) mx = c;
  });
  R.const.ta_max = mx;

  /* les observations */
  const obs = getObs().filter(o => enRango(o.fecha));
  const cuenta = {}, dias_con = {};
  obs.forEach(function (o) {
    const e = String((o.tipos && o.tipos[0]) || '');
    cuenta[e] = (cuenta[e] || 0) + (o.cant ? Number(o.cant) : 1);
    (dias_con[e] = dias_con[e] || {})[o.fecha] = 1;
  });
  R.cuerpo = {};
  [['💧 Hidratación', 'hid'], ['🩹 Cambio de pañal', 'pan'],
   ['🚽 Deposición', 'dep'], ['💦 Micción', 'mic']].forEach(function (par) {
    R.cuerpo[par[1]] = _r1((cuenta[par[0]] || 0) / dias);
  });
  R.obs = Object.keys(cuenta)
    .filter(e => ['💧 Hidratación', '🩹 Cambio de pañal', '🚽 Deposición', '💦 Micción'].indexOf(e) < 0)
    .map(e => ({ e: e, n: cuenta[e], d: Object.keys(dias_con[e]).length }))
    .sort((a, b) => b.d - a.d || b.n - a.n);
  R.revisadas = obs.filter(o => o.rev).length;
  R.total_obs = obs.length;

  /* l'oxygène */
  const mat = getMaterial(), uso = (mat && mat._uso && mat._uso.oxigeno) || {};
  let minutos = 0, sesiones = 0, abiertas = 0;
  fechas.forEach(function (f) {
    (uso[f] || []).forEach(function (ss) {
      sesiones++;
      if (!ss.fin) { abiertas++; return; }
      const dd = durSesion(ss, f);
      if (dd != null) minutos += dd;
    });
  });
  R.oxigeno = { horas: _r1(minutos / 60), sesiones: sesiones, abiertas: abiertas,
                por_dia: _r1(minutos / 60 / dias) };
  return R;
}

function pendientesRevision() {
  const obs = getObs();
  const out = [];
  for (let i = 0; i < obs.length; i++) {
    const o = obs[i];
    if (!o || !o.hora || o.rev) continue;
    if (cuandoDe(String((o.tipos && o.tipos[0]) || '')) !== 'instante') continue;
    out.push({ i: i, o: o });
  }
  out.sort(function (a, b) {
    return String(b.o.fecha + b.o.hora).localeCompare(String(a.o.fecha + a.o.hora));
  });
  return out;
}
function _fechaCorta(f) {
  return f && f.length >= 10 ? f.slice(8, 10) + '/' + f.slice(5, 7) : (f || '');
}
/* La page elle-même. Pas de bibliothèque PDF : on compose, et l'impression
   du téléphone en fait un PDF — c'est natif, et le fichier reste unique. */
function _fila(k, v) {
  return v ? '<tr><td style="padding:3px 10px 3px 0;vertical-align:top;color:#555;white-space:nowrap">' + k +
             '</td><td style="padding:3px 0">' + v + '</td></tr>' : '';
}
function pintarResumen(R) {

  h += '<table style="width:100%;border-collapse:collapse">';
  h += _fila(t('res_medic'), R.tomas.debidas
        ? (R.tomas.dadas + ' / ' + R.tomas.debidas + (pct != null ? ' (' + pct + ' %)' : '') +
           ' <span style="color:#777;font-size:11px">' + t('res_completos') + '</span>') : '—');
  if (R.tomas.faltan.length) {
    h += _fila('', '<span style="color:#a33">' + t('res_faltan') + ' : ' +
         R.tomas.faltan.map(x => x.f.slice(8, 10) + '/' + x.f.slice(5, 7) + ' ' + x.n).join(' · ') + '</span>');
  }
  if (c.n) {

    if (c.ta_sis) h += _fila(t('res_ta'), t('res_media') + ' ' + c.ta_sis + '/' + c.ta_dia + ' mmHg' +
         (c.ta_max ? ' · ' + t('res_max') + ' ' + c.ta_max.ta_sis + '/' + c.ta_max.ta_dia +
          ' (' + c.ta_max.fecha.slice(8, 10) + '/' + c.ta_max.fecha.slice(5, 7) + ')' : ''));
    if (c.fc)   h += _fila(t('c_fc'),   t('res_media') + ' ' + c.fc + ' lpm');
    if (c.spo2) h += _fila(t('c_spo2'), t('res_media') + ' ' + c.spo2 + ' %');
    if (c.peso_ini != null) h += _fila(t('c_peso'), c.peso_ini + ' → ' + c.peso_fin + ' kg');
    if (c.temp_max != null) h += _fila(t('c_temp'), t('res_max') + ' ' + c.temp_max + ' °C');
    if (c.arritmia) h += _fila('⚡ ' + t('c_arritmia'),
         '<b>' + c.arritmia + ' / ' + c.n + '</b> ' + t('res_medidas'));
  }
  const cuerpo = [];
  if (cu.hid) cuerpo.push(cu.hid + ' ' + t('l_hid').toLowerCase());
  if (cu.dep) cuerpo.push(cu.dep + ' ' + t('l_dep').toLowerCase());
  if (cu.mic) cuerpo.push(cu.mic + ' ' + t('l_mic').toLowerCase());
  if (cu.pan) cuerpo.push(cu.pan + ' ' + t('l_panal').toLowerCase());
  if (cuerpo.length) h += _fila(t('res_cuerpo'), cuerpo.join(' · ') + ' <span style="color:#777">' + t('res_pordia') + '</span>');
  if (ox.sesiones) h += _fila(t('res_oxigeno'), ox.horas + ' h · ' + ox.por_dia + ' h/' + t('res_dia') +
       ' · ' + ox.sesiones + ' ' + t('res_sesiones') + (ox.abiertas ? ' (' + ox.abiertas + ' ' + t('res_abiertas') + ')' : ''));
  if (R.obs.length) {
    h += _fila(t('res_observado') + '<br><span style="font-size:11px">(' + t('res_dias_con') + ')</span>',
      R.obs.slice(0, 14).map(function (x) {
        return obsLabel(x.e) + ' <b>' + x.d + '</b>';

  h += '</table>';

  h += '<div style="margin-top:16px;padding-top:10px;border-top:1px solid #ddd;font-size:11px;color:#666;line-height:1.45">' +

       t('res_revisadas') + ' : ' + R.revisadas + ' / ' + R.total_obs + '<br>' +
       'Salufolio · Protocolo móvil v' + MFP_VERSION + ' · ' + new Date().toLocaleString(LOCALES[getLang()] || 'es-ES') +
       '</div></div>';
  return h;
}

/* EFFACER UNE OBSERVATION FAUTIVE (P-H, 31/07 : « dans reviser il faut

function borrarObs(idx, despues) {

function pantallaRevision(sinAtajo, soloDia) {
  let lista = pendientesRevision();
  if (soloDia) lista = lista.filter(function (x) { return x.o.fecha === soloDia; });
  /* P-H : « pourquoi afficher cette information si tout est à jour ?
     pollution de l'esprit ». On enregistre et on envoie, sans écran.
     Mais après une suppression, on ne déclenche rien : l'usager venait
     corriger, pas envoyer. */
  if (!lista.length) {
    if (sinAtajo === true) { toast('✓ ' + t('rev_nada')); return; }
    cerrarRevision([]); return;
  }
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:96;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px';

      }
      return cab + '<button class="btn sec" data-rev="' + x.i + '" style="text-align:left;margin-top:0">' +
        '<b style="font-variant-numeric:tabular-nums">' + (x.o.hora || '--:--') + '</b> · ' +
        obsLabel(String((x.o.tipos && x.o.tipos[0]) || '')) +
        (x.o.nota ? ' <span style="color:var(--muted)">· ' + x.o.nota + '</span>' : '') +
        ' <span style="float:right;opacity:.55">🕐</span></button>';
    }).join('');
  }
  ov.innerHTML = '<div class="dlg lista">' +
    '<div class="lista-tit">🔎 ' + t('rev_tit') + '</div>' +
    '<div class="lista-cuerpo">' + cuerpo + '</div>' +
    (lista.length ? '<div class="lista-pie">' + t('rev_pie') + '</div>' : '') +
    '<button class="btn" data-ok="1">' + t('rev_ok') + '</button>' +
    '<button class="btn sec" style="margin-top:8px" data-can="1">' + t('d_can') + '</button></div>';
  document.body.appendChild(ov);
  ajustaLista(ov);
  ov.querySelector('button[data-can]').onclick = function () { ov.remove(); };
  /* toucher une ligne corrige son heure, puis l'écran se refait */
  ov.querySelectorAll('button[data-rev]').forEach(function (b) {
    b.onclick = function () { ov.remove(); corregirHoraEv(+b.dataset.rev, function () { pantallaRevision(true, soloDia); }); };
  });
  ov.querySelector('button[data-ok]').onclick = function () {
    ov.remove();
    cerrarRevision(lista);
  };
}
/* Le tampon, puis la sauvegarde, puis l'envoi si le PC répond.
   La sauvegarde n'est pas conditionnelle — seul l'envoi l'est. */
function cerrarRevision(lista) {
  if (lista && lista.length) {
    const obs = getObs();
    const sello = new Date().toISOString().slice(0, 16);
    lista.forEach(function (x) { if (obs[x.i]) obs[x.i].rev = sello; });
    lsSet('mfp_obs', obs);
  }
  /* ㉘ : la parole et l'envoi ne partent qu'au RETOUR AU PREMIER PLAN —
     les deux issues du sélecteur sont couvertes, zéro minuterie. On dit ce
     qu'on a fait dans les deux cas (P-H : « on ne sait pas si ça a été
     envoyé automatiquement ? »), et le volet des jours se repeint. */
  exportarJSON(function () {
    if (_pcVivo === true) { toast('✓ JSON descargado'); enviarSalufolio(); }
    else { toast('💾 ' + t('rev_solo_local')); }
    pintarEnvio();
    if (typeof renderDatos === 'function') renderDatos();
  });
}
/* ═══ CORRIGER UN REGISTRE DU CORPS (la persona cuidada, 01/08) ═══
   Les puces à choix se corrigent en retouchant le choix allumé, mais ces
   quatre lignes sont des COMPTEURS : chaque toucher ajoutait, rien ne
   retirait. Le correcteur existait, mais à part — et le geste naturel est
   de toucher la ligne qu'on veut corriger. C'est elle qui a raison. */
function corregirRegistro(clave) {
  const obs = getObs(), hoy = [];
  obs.forEach(function (o, i) {

  ov.style.cssText = 'position:fixed;inset:0;z-index:96;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML = '<div class="dlg lista">' +
    '<div class="lista-tit">🕐 ' + (hoy.length ? obsLabel(hoy[0].o.tipos[0]) : t('corr_tit')) + '</div>' +
    (hoy.length
      ? '<div class="lista-cuerpo">' + hoy.map(function (x) {
          return '<button class="btn sec" data-n="' + x.i + '" style="text-align:left;margin-top:0">' +
            '<b style="font-variant-numeric:tabular-nums">' + (x.o.hora || '--:--') + '</b>' +
            (x.o.nota ? ' <span style="color:var(--muted)">· ' + detLabel(String(x.o.nota).replace('aspecto ', ''), x.o.nota) + '</span>' : '') +
            ' <span style="float:right;opacity:.55">🕐</span></button>';
        }).join('') + '</div>' +
        '<div class="lista-pie">' + t('reg_pie') + '</div>'
      : '<div style="font-size:13.5px;color:var(--muted);text-align:center;padding:10px 0">' + t('corr_nada') + '</div>') +
    '<button class="btn" data-fin="1">' + t('d_can') + '</button></div>';
  document.body.appendChild(ov);
  ajustaLista(ov);
  ov.querySelectorAll('button[data-n]').forEach(function (b) {
    b.onclick = function () { ov.remove(); corregirHoraEv(+b.dataset.n, function () { corregirRegistro(clave); }); };
  });
  ov.querySelector('button[data-fin]').onclick = function () { ov.remove(); };
  ov.onclick = function (e) { if (e.target === ov) ov.remove(); };
}
function pedirCorrigeHora() {
  const obs = getObs();
  const hoy = [];
  obs.forEach((o, n) => { if (o && o.fecha === diaKey() && o.tipos && o.tipos.length) hoy.push({ o: o, n: n }); });

/* Le correcteur prévient quand il se referme, au lieu qu'on devine son
   temps par une minuterie : c'est ce qui le faisait recouvrir par l'écran
   de révision, qui se rouvrait 420 ms plus tard sans savoir. Et il monte
   au-dessus de tout le reste, pour ne plus jamais être enterré. */
function corregirHoraEv(idx, despues) {
  const obs = getObs(); const e = obs[idx];
  if (!e) { if (despues) despues(); return; }
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:18px';
  ov.innerHTML = '<div class="dlg">' +
    /* P-H, 31/07 : la fenêtre ne disait que le TYPE. Sur cinq hydratations
       dans la journée, rien ne disait laquelle on tenait. Elle rappelle
       maintenant la précision et le jour — on doit reconnaître la ligne
       qu'on s'apprête à corriger ou à effacer. */
    '<div style="font-size:17px;font-weight:700">🕐 ' + (e.tipos && e.tipos[0] ? obsLabel(e.tipos[0]) : '') + '</div>' +
    (e.nota ? '<div style="font-size:14px;color:var(--muted);margin-top:2px">· ' + e.nota + '</div>' : '') +
    '<div style="font-size:12px;color:var(--muted);margin:4px 0 10px">' + _fechaCorta(e.fecha) + '</div>' +
    '<label class="nota-campo">' + t('d_hora') + '</label>' +
    '<div style="display:flex;gap:6px;align-items:center;margin-top:4px">' +
    '<input class="txt" id="ev-hora" type="text" inputmode="numeric" placeholder="hh:mm" value="' + e.hora + '" style="flex:1">' +
    '<button type="button" class="hbtn2" onclick="reloj(\'ev-hora\')">🕐</button></div>' +
    /* P-H, 31/07 : « 2 boutons suffisent ! cancelar et supprimer ».
       C'est sa propre doctrine qui supprime le troisième : l'heure
       s'enregistre À LA FRAPPE, donc « Conserver » n'a plus d'objet. Il ne
       reste qu'à DÉFAIRE — Annuler rend l'heure d'origine — ou à EFFACER. */
    '<div style="font-size:11.5px;color:var(--muted);margin-top:8px" id="ev-aviso"></div>' +
    /* P-H, 31/07 : « si j'ai changé la valeur alors je ne peux enregistrer ».
       Juste : « Annuler » défaisait la correction, et la seule sortie qui la
       gardait était de toucher hors de la fenêtre — ce que personne ne devine.
       Or, puisque l'heure s'écrit À LA FRAPPE, fermer et annuler sont le même
       geste quand on n'a rien changé. Un seul bouton suffit donc : celui qui
       ferme en gardant. Deux boutons, comme il le voulait. */
    '<div style="display:flex;gap:8px;margin-top:12px">' +
      '<button class="btn" id="ev-ok" style="flex:1">' + t('d_ok') + '</button>' +
      '<button class="btn sec" id="ev-del" style="flex:1;color:#c0392b;border-color:#c0392b">🗑 ' + t('rev_borrar') + '</button>' +
    '</div></div>';
  document.body.appendChild(ov);
  const horaOrigen = e.hora;                       /* pour pouvoir défaire */
  const campo = ov.querySelector('#ev-hora');
  const aviso = ov.querySelector('#ev-aviso');
  const cerrar = () => { ov.remove(); if (despues) despues(); };
  /* l'heure se grave à la frappe, comme partout ailleurs dans la maison.
     VERROU : quand on annule, la fenêtre se retire et le champ perd le
     focus — son événement « change » part APRÈS, et réécrirait la valeur
     qu'on vient de défaire. Même famille que la minuterie entre deux
     fenêtres : un événement qui arrive quand on se croyait fini. */
  let anulado = false;                  /* la suppression fige l'écriture */
  const grabar = () => {
    if (anulado) return;
    const h = horaValide(campo.value);
    if (!h || h === e.hora) return;
    e.hora = h; lsSet('mfp_obs', obs);
    if (aviso) aviso.textContent = '✓ ' + h;
    trioTotales(); if (typeof renderChips === 'function') renderChips();
  };
  campo.addEventListener('input', function () { formatHora(campo); grabar(); });
  campo.addEventListener('change', grabar);
  ov.querySelector('#ev-ok').onclick = () => {      /* fermer en gardant */
    grabar();                                       /* au cas où le clavier n'ait pas rendu la main */
    if (e.hora !== horaOrigen) toast('✓ ' + e.hora);
    cerrar();
  };
  ov.querySelector('#ev-del').onclick = () => { anulado = true; ov.remove(); borrarObs(idx, despues); };
  /* toucher hors de la fenêtre : on garde la correction et l'on ferme */
  ov.addEventListener('click', function (ev2) { if (ev2.target === ov) cerrar(); });
}

let _oDraft = null;
function upsertObs() {
  const nEl = document.getElementById('nota-libre'), oEl = document.getElementById('b-hora');
  const nota = (nEl ? nEl.value : '').trim();
  const obs = getObs();
  if (!_chipsSel.size && !nota) {
    if (_oDraft !== null && obs[_oDraft]) { obs.splice(_oDraft, 1); lsSet('mfp_obs', obs); }
    _oDraft = null; estadoObs(''); return;
  }
  const horaPrev = (_oDraft !== null && obs[_oDraft]) ? obs[_oDraft].hora : null;
  /* 24/08 — même règle que Constantes, pour que la boîte partagée ne mente
     pas : on retient l'heure courante, et elle reste corrigeable. */
  const rec = { fecha: diaKey(), hora: (oEl && horaValide(oEl.value)) || horaPrev || ahora(),
                tipos: [..._chipsSel].map(i => CHIP_TIPOS[i]), nota: nota || null, libre: true };
  if (_oDraft === null || !obs[_oDraft]) { obs.push(rec); _oDraft = obs.length - 1; }
  else obs[_oDraft] = rec;
  lsSet('mfp_obs', obs); estadoObs('✓ guardado · ' + rec.hora);
  if (oEl && !horaValide(oEl.value)) oEl.value = rec.hora;
}
function estadoObs(s) { const e = document.getElementById('obs-estado'); if (e) e.textContent = s; }
/* Comme dans Constantes : les champs de l'observation se reposent d'un
   seul endroit, et l'observation en cours SUIT SA DATE quand on la
   corrige — l'empreinte du pèlerin vaut ici aussi. */
function recargarObs() {
  const obs = getObs();
  let idx = -1;
  for (let i = obs.length - 1; i >= 0; i--) if (obs[i] && obs[i].fecha === diaKey() && obs[i].libre) { idx = i; break; }
  const o = idx >= 0 ? obs[idx] : null;
  const nEl = document.getElementById('nota-libre'); if (nEl) nEl.value = (o && o.nota) || '';
  const hEl = document.getElementById('b-hora');
  if (hEl && pantallaActiva() === 'notas') { const hAnt = hEl.value || '';
    hEl.value = (o && o.hora) || (horaValide(hAnt) ? hAnt : (esHoy() ? ahora() : '')); }
  const fEl = document.getElementById('o-fecha');    if (fEl) fEl.value = fmtDiaLargo(diaKey());
  _chipsSel = new Set();
  if (o && o.tipos) o.tipos.forEach(function (tp) { const i = CHIP_TIPOS.indexOf(tp); if (i >= 0) _chipsSel.add(i); });
  if (typeof renderChips === 'function') renderChips();
  _oDraft = idx >= 0 ? idx : null;
  estadoObs(o ? '✓ guardado · ' + o.hora : '');
}
function obsFijaFecha(el) {
  const k = parseFechaLibre(el && el.value);
  if (!k) return;                        /* saisie en cours : on ne bouge pas */
  if (!fechaEnRango(k) || k === diaKey()) return;
  const obs = getObs();
  if (_oDraft !== null && obs[_oDraft]) {
    const rec = obs.splice(_oDraft, 1)[0];   /* l'observation suit sa date… */
    rec.fecha = k;
    obs.push(rec);                           /* …et reste celle du jour */

/* ── export : le pont vers Salufolio ── */
/* ═══ v2026.7.24.1 — FORMATO 2 (scellé par P-H) : le jour en clé partout,
   l'absence est le silence (jamais de null ni de clé vide), tomas unifiée
   (momento = régulière, med = puntual), material avec sessions inicio/fin. ═══ */
function _f2limpio(e) {
  const o = {};
  Object.keys(e).forEach(k => {
    if (k === 'fecha') return;
    const v = e[k];
    if (v === null || v === undefined || v === '') return;
    if (Array.isArray(v) && !v.length) return;
    o[k] = v;
  });
  return o;
}
function _f2agrupa(arr) {
  const g = {};
  (arr || []).forEach(e => { if (!e || !e.fecha) return; (g[e.fecha] = g[e.fecha] || []).push(_f2limpio(e)); });
  return g;
}
function payloadExport() {
  const tomasF2 = {};
  const tm = getTomas();
  /* ⚠ 24/08 — LA CLÉ S'APPELAIT « momento » ET CONTENAIT UN IDENTIFIANT DE
     MÉDICAMENT (« medicamento_385 »). Salufolio, lui, la lisait comme un
     moment de la journée et n'appariait donc JAMAIS rien : aucune prise
     n'arrivait dans le dossier. Le mot dit maintenant ce qu'il désigne.
     « momento » reste écrit à côté, pour les lecteurs d'avant. */
  Object.keys(tm).forEach(dia => Object.keys(tm[dia] || {}).forEach(mid => {
    const h = tm[dia][mid]; if (!h) return;
    (tomasF2[dia] = tomasF2[dia] || []).push({ med_id: mid, momento: mid, hora: h });
  }));
  getPuntuales().forEach(pu => {
    if (!pu || !pu.fecha) return;
    (tomasF2[pu.fecha] = tomasF2[pu.fecha] || []).push({ med: pu.nombre, hora: pu.hora });
  });
  const pac = { nombre: getPatient() }; if (getSip()) pac.sip = getSip();
  return {
    formato: 2,
    version: 'Salufolio-Protocolo-' + MFP_VERSION,
    exportado: new Date().toLocaleString('es-ES', { timeZone: 'Europe/Madrid' }),
    paciente: pac,
    medicamentos: getMeds().map(m => {
      /* l'identifiant voyage : c'est par lui que les prises se rattachent.
         Et les moments PRESCRITS voyagent aussi — sans eux le lecteur ne
         peut pas déduire l'oubli (prescrit sans prise). */
      const o = { id: m.id, nombre: m.nombre, dosis: m.dosis };
      const _ms = momsDe(m); if (_ms.length) o.momentos = _ms;
      if (m.momento === 'demanda') o.puntual = true; else o.momento = m.momento;
      if (m.desde) o.desde = m.desde;
      if (m.dias) o.dias = m.dias;
      if (m.hasta) o.hasta = m.hasta;   /* écrite en clair : le lecteur du .sf ne calcule pas */
      return o;
    }),
    tomas: tomasF2,
    material: (function(){

      if (m._uso) { const u = {}; Object.keys(m._uso).forEach(id => { const dias = {}; Object.keys(m._uso[id]).forEach(f => { if ((m._uso[id][f]||[]).length) dias[f] = m._uso[id][f]; }); if (Object.keys(dias).length) u[id] = dias; }); if (Object.keys(u).length) out.uso = u; }
      return out;
    })(),

    observaciones: _f2agrupa(getObs())

}
/* ═══ RESTAURAR — lit le formato 2 et tolère le 1 (Lavoisier : rien ne se perd) ═══ */
function _nn(v) { return v === undefined ? null : v; }
function restaurarDesdeObj(d) {
  const F2 = d && d.formato === 2;
  const nom = F2 ? (d.paciente && d.paciente.nombre) : d.patient_label;
  const sip = F2 ? (d.paciente && d.paciente.sip) : d.patient_sip;
  /* ═══ 24/08 — OUVRIR LE CASIER AVANT D'Y RANGER ═══
     Défaut trouvé par P-H : restaurer sur un appareil neuf ne restaurait
     RIEN, et la fenêtre « Restaurar una copia » revenait sans fin.
     Le guichet du 17/08 refuse en silence toute écriture patient quand
     aucun patient n'est actif (lsSet : « if (…) return »). Or la
     restauration est PRÉCISÉMENT le cas où le casier n'existe pas encore
     — c'est le premier geste d'un téléphone neuf. On l'ouvre donc ici,
     du nom lu dans le fichier, comme le fait pacienteNuevo. */
  if (!getActivo()) {
    const nomP = (nom || '').trim() || 'Paciente';
    const id = _idPaciente(nomP);
    const l = getPacientes(); l.push({ id: id, nombre: nomP, sip: (sip || '').trim() });
    setPacientes(l); setActivo(id);
  }
  renombrarActivo(nom || null, sip || '');
  const medsIn = (F2 ? d.medicamentos : d.medicamentos_config) || [];
  lsSet('mfp_meds', medsIn.map((m, i) => ({
    id: m.id || ('med' + Date.now() + '_' + i),
    nombre: m.nombre, dosis: m.dosis || '',
    momento: m.puntual ? 'demanda' : (m.momento || 'desayuno'),
    desde: m.desde || null, dias: m.dias || null,
    hasta: m.hasta || null
  })));
  if (d.material) {
    const mat = Object.assign({}, d.material);
    if (mat.uso) { mat._uso = mat.uso; delete mat.uso; }
    lsSet('mfp_material', mat);
  }
  if (d.material_config) lsSet('mfp_material_cfg', d.material_config);
  if (F2) {
    const tm = {}, pun = [];
    Object.keys(d.tomas || {}).forEach(f => (d.tomas[f] || []).forEach(e => {
      if (e.momento) { (tm[f] = tm[f] || {})[e.momento] = e.hora || null; }
      else if (e.med) pun.push({ fecha: f, hora: e.hora, nombre: e.med });
    }));
    lsSet('mfp_tomas', tm); lsSet('mfp_puntuales', pun);
    const cs = [];
    Object.keys(d.constantes || {}).forEach(f => (d.constantes[f] || []).forEach(c => cs.push({
      fecha: f, hora: c.hora || null, ta_sis: _nn(c.ta_sis), ta_dia: _nn(c.ta_dia),
      fc: _nn(c.fc), spo2: _nn(c.spo2), peso: _nn(c.peso), temp: _nn(c.temp),
      /* la condition voyage avec la mesure : 93 % sous oxygène n'est pas
         93 % à l'air, et le dossier doit pouvoir le dire */
      o2: (c.o2 === true || c.o2 === false) ? c.o2 : undefined
    })));
    lsSet('mfp_constantes', cs);
    const ob = [];
    Object.keys(d.observaciones || {}).forEach(f => (d.observaciones[f] || []).forEach(o => {
      const e = { fecha: f, hora: o.hora || null, tipos: o.tipos || [], nota: o.nota || null };
      if (o.cant !== undefined) e.cant = o.cant;
      ob.push(e);
    }));
    lsSet('mfp_obs', ob);
  } else {
    if (d.tomas) lsSet('mfp_tomas', d.tomas);
    if (d.tomas_puntuales) lsSet('mfp_puntuales', d.tomas_puntuales);
    if (d.constantes) lsSet('mfp_constantes', d.constantes);
    if (d.observaciones) lsSet('mfp_obs', d.observaciones);
  }
}

/* ㉘ (P-H 03/08) — LE DERNIER MOT ATTEND SON TOUR : quand a.click() ouvre
   le sélecteur du système (« où ranger ? »), la page perd le premier plan
   et un toast paraîtrait SOUS lui. On ne parle qu'au retour — le rappel
   part aux DEUX issues (rangé ou annulé). Aucune minuterie entre fenêtres. */
function alVolverAlPrimerPlano(cb) {
  if (document.hasFocus() && document.visibilityState === 'visible') { cb(); return; }
  let hecho = false;
  const una = function () {
    if (hecho) return; hecho = true;
    window.removeEventListener('focus', una);
    document.removeEventListener('visibilitychange', visi);
    cb();
  };
  const visi = function () { if (document.visibilityState === 'visible') una(); };
  window.addEventListener('focus', una);
  document.addEventListener('visibilitychange', visi);
}
function exportarJSON(alFinal) {

    '_' + String(d.getHours()).padStart(2,'0') + 'h' + String(d.getMinutes()).padStart(2,'0');
  const blob = new Blob([JSON.stringify(payloadExport(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');

  a.download = 'Salufolio_Protocolo_' + getPatient().split(' ')[0].replace(/[^A-Za-z0-9]/g, '') + '_v' + stamp + '.json';
  a.click();
  alVolverAlPrimerPlano(function () {
    if (typeof alFinal === 'function') alFinal();
    else toast('✓ JSON descargado');
  });
}

/* ═══ LES TITRES PORTENT LE JOUR (P-H, 14/08 : « un seul mécanisme pour
   tous les écrans ») ═══ Doctrine de 1966 : le comportement se déclare
   dans une table que le code parcourt. Un écran = son titre + trois clés.
   Ajouter un écran demain, c'est ajouter UNE LIGNE ici, rien d'autre.
   Le titre change aussi de TEMPS quand on recule : si « maintenant »
   n'existe pas un autre jour, « aujourd'hui » non plus. */
const TITULOS_DIA = { 'i-thoy':'th', 'i-tconst':'tc', 'i-tnotas':'tn' };

       répéter allongeait le titre au point d'obliger P-H à rapetisser
       toute la police (14/08). Le jour en toutes lettres n'apparaît donc
       QUE lorsqu'on n'est pas sur aujourd'hui — là il est indispensable. */
    const tete = hoy ? t(b + '_hoy') : t(b + '_dia') + ' ' + larga + (b === 'tn' ? ' ?' : '');
    e.innerHTML = tete + '<br><span class="t2">' + t(b + '_fin') + '</span>';
  });

async function sincronizarPaciente() {
  /* Le patient vient de Salufolio (P-H 15/07) : le PC publie label+SIP via
     /api/paciente, l'app les adopte. Modifiable ensuite dans Datos. */
  const base = baseSalufolio();
  if (base === null || (base === '' && location.protocol.indexOf('http') !== 0)) return;
  try {
    const r = await fetch(base + '/api/paciente');
    const p = await r.json();
    /* Le PC ne renomme plus personne : c'est le Protocolo qui tient la
       liste des patients de la maison. On n'adopte l'étiquette du dossier
       que si la maison est encore vide — au tout premier branchement. */
    if (!getPacientes().length) {
      if (p && p.label) lsSet('mfp_patient', p.label);
      if (p && p.sip) lsSet('mfp_sip', String(p.sip));
      if (p && (p.label || p.sip)) render();
    }
  } catch (e) { /* serveur muet : on garde le patient local */ }
}

  trioTotales(); pintaConstHoy(); recargarConst(); recargarObs(); pintaBarraHora(); bienvenida();
  if (sinArmoire()) {
    /* P-H, 17/08 : le bandeau masquait les boutons du haut. Un avertissement
       qui empêche d'agir est pire que pas d'avertissement — il prend donc la
       place du sous-titre, où il ne gêne personne. */
    const sb = document.getElementById('hdr-sub');
    if (sb) { sb.textContent = '⚠ ' + t('sin_mem'); sb.style.color = 'var(--warn)'; sb.style.opacity = '1'; }
  }
  /* P-H, 31/07 : « on saura au moins au démarrage si Salufolio est
     disponible ». La sonde part donc à l'ouverture, revient quand on revient
     à l'application, et se rafraîchit d'elle-même — un serveur qu'on éteint
     ne doit pas laisser une antenne verte mentir. */
  if (!window._sondaPuesta) {
    window._sondaPuesta = true;
    setTimeout(function () { sondearPc(); }, 700);
    setInterval(function () { if (!document.hidden) sondearPc(); }, 60000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) sondearPc();
    });
  }
  /* ═══ DOCTRINE (P-H, 29/07) : « changement d'état d'un paramètre, on doit
     OBLIGATOIREMENT enregistrer — pas de confirmation ». « change » n'arrive
     qu'à la sortie du champ : tant que le doigt y est encore, rien n'est
     écrit, et si l'écran bascule avant, la valeur s'évapore. On écoute donc
     « input », qui arrive à chaque frappe. Les deux fonctions sont des
     upsert : écrire cent fois ne crée pas cent fiches. ═══ */
  if (!window._escuchasPuestas) {
    window._escuchasPuestas = true;
    ponerEscuchaUnica();
  }
  const _oh = document.getElementById('b-hora'); if (_oh) _oh.addEventListener('change', upsertObs);
  setTimeout(sondearPc, 400);
  document.querySelectorAll('details.acc').forEach(d => d.addEventListener('toggle', () => {
    if (d.open) document.querySelectorAll('details.acc[open]').forEach(o => { if (o !== d) o.open = false; });
  }));
  if (_arm().getItem('mfp_bienv2')) setTimeout(arranqueInicial, 350);

     mémorise son adresse pour les ouvertures locales futures */

  document.getElementById('hdr-fecha').textContent =

  aplicarTheme(); aplicarZoom(); aplicarIdiomas();
  window.addEventListener('resize', ajustarPie);

  /* Ces deux lignes posaient l'heure courante à chaque repeinture et

     même champ. C'est la restauration qui décide, elle seule. */
  const bc = document.getElementById('i-bcomp');
  if (bc) bc.style.display = (navigator.share ? '' : 'none');
  const be = document.getElementById('i-benv');
  if (be) { be.textContent = t('b_env'); be.style.display = (location.protocol.indexOf('http') === 0 || getPc()) ? '' : 'none'; }
  const lp = document.getElementById('i-lpc'); if (lp) lp.textContent = t('pc_label');

}
