<title>Salufolio Protocolo</title>
<style>
:root{
  --bg:#141b2b; --surface:#212a3d; --surface2:#2c3750; --border:#3d4a66;
  --text:#e8ecf4; --muted:#8b94a8; --ok:#3fb950; --accent:#4f8ff7;
  --warn:#d99922; --bad:#f85149; --radius:14px;
}
html[data-theme="light"]{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f4f6fa; --border:#c3cddd;
  --text:#1b2330; --muted:#5b6577;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.dlg::-webkit-scrollbar,
.lista-cuerpo::-webkit-scrollbar,h2 .t2{font-weight:400;opacity:.7;letter-spacing:0}
.bv-langs{display:flex;gap:7px;justify-content:center;margin:0 0 12px;flex-shrink:0}
.bv-lang{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;
  padding:5px 9px;font-size:19px;line-height:1;cursor:pointer;min-height:38px;font-family:inherit}
.bv-lang.on{border-color:var(--accent);background:var(--bg)}
body,.dlg,.lista-cuerpo,.bv-cuerpo{scrollbar-width:none}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px}
body{padding-top:112px;padding-bottom:150px;min-height:100vh}
.mono{font-family:'IBM Plex Mono',Menlo,monospace}

/* ── en-tête ── */
header{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--bg);
  border-bottom:1px solid var(--border);padding:6px 8px 6px}
/* Les boutons du haut : MÊME LARGEUR pour tous (P-H, 16/08), et le vide entre
   eux resserré — c'est la marge qui rend la police, pas la lisibilité. */
.ctrls{display:flex;gap:3px;justify-content:flex-end;margin-bottom:2px;flex-wrap:nowrap}
.hbtn{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  width:32px;min-width:32px;height:32px;font-size:15px;cursor:pointer;color:var(--text);padding:0;font-weight:700;flex:0 0 32px}
/* ── dialogues maison (adieu prompt/confirm agressifs) ── */
/* ═══ LE CALENDRIER MAISON (P-H, 17/08) ═══ Le sélecteur natif nous a lâchés
   deux fois : sous le transform du banc, puis collé au bas du pied où il
   s'ouvrait hors de l'écran. Celui-ci est dessiné par l'app, donc il s'ouvre
   où l'on veut, partout pareil. Sept colonnes en 1fr — la semaine est une
   structure, on ne la replie pas — et 44 px minimum pour le pouce. Aucune
   media query : le mfp_zoom fausse les seuils, 1fr n'a pas ce défaut. */
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase}
.cal td{padding:1px;text-align:center}
.cal td button{width:100%;min-height:44px;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:8px;font-size:15px;font-weight:700;
  font-family:inherit;cursor:pointer;padding:0;position:relative}
.cal td button.hoy{border-color:var(--accent);border-width:2px}
.cal td button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal td button.med::before,.cal td button.con::after{content:'';position:absolute;
  top:4px;width:9px;height:9px;border-radius:50%;box-sizing:border-box}
.cal td button.med::before{left:4px;background:#f2c230}          /* les prises */
.cal td button.con::after{right:4px;background:var(--ok)}        /* ce qu'on a noté */
/* Creux = commencé mais incomplet : la forme le dit, pas la couleur. */
.cal td button.medinc::before{background:transparent;border:2.5px solid #f2c230}
.cal td button.notinc::after{background:transparent;border:2.5px solid var(--ok)}
.cal td button.sel.med::before,.cal td button.sel.con::after{background:#fff;border-color:#fff}
.cal td button.sel.medinc::before,.cal td button.sel.notinc::after{background:transparent}
.cal td span{display:block;min-height:44px;line-height:44px;font-size:15px;color:var(--border)}
.cal-mes{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-mes b{flex:1;text-align:center;font-size:15px}
.cal-mes button{flex:0 0 44px;min-height:38px;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:8px;font-size:16px;cursor:pointer;font-family:inherit}
.dlg-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.dlg{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:20px;width:100%;max-width:400px;box-shadow:0 14px 44px rgba(0,0,0,.5)}
.dlg h3{margin:0 0 14px;font-size:18px}
.dlg label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.dlg input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-size:20px;padding:12px}
.dlg .dbtns{display:flex;gap:10px;margin-top:18px}
.dlg .dbtns button{flex:1;border-radius:12px;font-size:17px;font-weight:700;padding:14px;cursor:pointer}
.dlg .dok{background:var(--accent);border:none;color:#fff}
.dlg .dcan{background:none;border:2px solid var(--border);color:var(--muted)}
.aviso{background:rgba(217,153,34,.13);border:1.5px solid var(--warn);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:14px;font-size:15px}
.aviso .abtns{display:flex;gap:8px;margin-top:8px}
.aviso button{flex:1;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:14px;padding:10px;cursor:pointer}
.aviso button.si{border-color:var(--ok);color:var(--ok);font-weight:700}
.aviso button.no{border-color:var(--bad);color:var(--bad);font-weight:700}
.fin{opacity:.55}
.punt{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--border);
  border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;font-size:15px}
/* Le logo est posé en absolu à gauche : la ligne de la date lui laisse
   sa place au lieu de passer dessous (P-H, 17/08). */
h2 .t2{font-weight:400;opacity:.7;letter-spacing:0}
.marcas{display:flex;gap:3px;align-items:center;flex-shrink:0}
/* 24/08 (P-H) : « plus clair c'est pris, plus lumineux c'est à prendre ».
   L'éclat allait au travail FAIT — l'œil était tiré par ce qui n'appelle
   plus rien. Il va désormais à ce qui reste à donner. */
.mq{font-size:19px;opacity:1;line-height:1}
.mq.ok{opacity:.3;filter:grayscale(1)}
.dose-dlg{color:var(--muted);font-size:13px;margin:-4px 0 10px}
.basc{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:11px 13px;font-size:14.5px;margin-bottom:7px;
  font-family:inherit;cursor:pointer;min-height:46px}
.basc.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.basc .sw{font-size:17px}
.basc .quita{background:none;border:none;color:var(--bad);font-size:16px;cursor:pointer;padding:0 4px}
.mchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.mchip{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  border-radius:16px;padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit;min-height:38px}
.mchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
input.dudoso{border-color:var(--warn) !important;box-shadow:0 0 0 2px rgba(217,153,34,.25)}
header .fecha{font-size:26px;font-weight:700;text-transform:capitalize;padding-left:46px;text-align:center}
header .sub{font-size:13px;color:var(--muted);margin-top:2px}
header .lema{font-size:11px;color:var(--muted);font-style:italic;margin-top:6px;opacity:.8}

/* ── navigation basse (pouce) ── */
/* ═══ LE PIED (P-H, 16/08) ═══ Trois bandes empilées, toujours sous le pouce :
   l'heure, le jour, la navigation. Le bandeau des jours qui vivait en haut de
   chaque écran a disparu — une rangée rendue à tous les écrans. */
#pie{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
/* P-H, 18/08 : l'intitulé était comprimé à gauche et se coupait en trois.
   Il passe AU-DESSUS, en entier ; la boîte garde sa largeur de doigt. */
#barra-hora{display:flex;align-items:center;gap:10px;padding:5px 10px;border-bottom:1px solid var(--border)}
/* Dans Notes l'ensemble intitulé + heure se centre (P-H, carnet note 3) ;
   dans Constantes il garde l'intitulé à gauche et l'heure calée à droite,
   comme il l'a demandé le 18/08 au matin. */
#barra-hora.centrado{justify-content:center}
#barra-hora.centrado label{flex:0 1 auto;text-align:right}
#barra-hora label{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.25;flex:1 1 auto;min-width:0;white-space:normal}
#barra-hora input{font-size:19px;font-weight:700;flex:0 0 auto;width:104px;min-width:104px;max-width:104px;text-align:center;
  background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:4px 0;font-family:inherit}
#barra-quando{display:flex;align-items:stretch;gap:6px;padding:5px 8px;border-bottom:1px solid var(--border)}
#barra-quando button{background:var(--bg);color:var(--text);border:1px solid var(--border);
  border-radius:9px;flex:0 0 44px;font-size:17px;cursor:pointer;font-family:inherit}
#dia-etiqueta{flex:1 1 auto;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);
  border-radius:9px;background:var(--bg);padding:6px 4px;min-width:0}
nav{display:flex;background:var(--surface)}
nav button{flex:1;background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;
  padding:10px 0 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ico{font-size:27px}
/* à cinq boutons, l'étroit se resserre plutôt que de déborder */
@media (max-width:380px){ nav button{font-size:12px} nav button .ico{font-size:23px} }
nav button.act{color:var(--accent)}
nav button.act .ico{transform:scale(1.12)}

main{padding:14px 14px 20px}
.panel{display:none}.panel.act{display:block}
/* P-H, carnet du 18/08 (notes 1 et 3) : les titres se centrent — les deux
   lignes du titre d'écran comme les intitulés de section. */
h2{font-size:16px;letter-spacing:.5px;color:var(--muted);font-weight:700;
  text-transform:uppercase;margin:18px 0 10px;text-align:center}

/* ── LA SIGNATURE : pastilles de prises ── */
.toma{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;cursor:pointer;color:var(--text);font-size:18px;
  transition:border-color .15s,background .15s}
.toma .pastilla{width:46px;height:46px;border-radius:50%;border:3px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  transition:all .15s}
.toma .info{flex:1;min-width:0}
.toma .nombre{font-weight:700}
.toma .detalle{font-size:13px;color:var(--muted);margin-top:2px}
.toma .hora{font-size:15px;color:var(--muted);white-space:nowrap}
.toma.hecha{border-color:var(--ok);background:rgba(63,185,80,.08)}
.toma.hecha .pastilla{border-color:var(--ok);background:var(--ok);color:#fff}
.toma.hecha .hora{color:var(--ok);font-weight:700}

/* ── constantes : gros pavés numériques ── */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.cbox label{display:block;font-size:16px;color:var(--text);font-weight:600;margin-bottom:6px}
.cbox input{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:26px;padding:10px;text-align:center;font-weight:700}
.cbox input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.cbox .unit{font-size:14px;color:var(--muted);text-align:center;margin-top:4px}
/* ═══ 26/08 — LA TABLE DES CONSTANTES ═══
   `table-layout:fixed` + un <colgroup> à 50/50 : les colonnes ne se
   négocient plus avec le contenu, elles sont POSÉES. C'est toute la
   différence avec une grille de DIV — et c'est pourquoi rien ne bouge
   plus d'un écran à l'autre. Chaque élément occupe SA cellule et prend
   100 % de sa largeur : plus une seule largeur à calculer à la main. */
.ctab{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:5px 0;margin-bottom:4px}
.ctab td{padding:0;vertical-align:middle}
.ctab .cb{border-bottom:1px solid var(--border)}
.cb-t td{padding:14px 0 2px;text-align:center}
.cb-e td{padding:4px 0 2px;text-align:center}
.cb-h td{padding:3px 0}
.ctab tr:last-child td{padding-bottom:12px}
/* 26/08 (P-H) : « augmenter la taille des titres en BLEU ». Ceux de Tº et
   Poids gardent leur taille mais prennent la même couleur — l'œil doit
   reconnaître un titre de bloc sans avoir à lire le mot. */
.cb-tit{font-family:var(--mono);font-size:17px;letter-spacing:1.6px;
  color:var(--accent);text-transform:uppercase;white-space:nowrap;font-weight:700}
.cb-e .cb-tit{font-size:14px;letter-spacing:1px}
/* les en-têtes de colonne : le titre du bloc dit déjà de quoi il s'agit,
   ceux-ci nomment seulement les deux moitiés — P-H, 26/08 */
.cb-e span{font-size:14px;color:var(--text);font-weight:600;white-space:nowrap}
.cb-hora{width:100%;box-sizing:border-box;background:var(--surface2);
  border:1px solid var(--border);border-radius:8px}
/* le bouton prend la place de l'ancienne liste : même cellule, même
   largeur — la table n'a rien à recalculer. */
.cb-add{width:100%;box-sizing:border-box;background:var(--surface2);
  border:1px solid var(--border);border-radius:8px;color:var(--accent);
  font-family:var(--mono);font-size:12px;font-weight:700;padding:8px 2px;cursor:pointer}
.cb-add:disabled{color:var(--muted);opacity:.4;cursor:default}
.cb-add:not(:disabled):active{background:var(--accent);color:#fff}
.cb-hora{color:var(--text);font-size:17px;font-weight:700;padding:7px 2px;
  text-align:center;font-family:var(--mono)}
.cb-hora:focus{outline:2px solid var(--accent);border-color:var(--accent)}
/* le champ de saisie sans son cadre : la cellule EST le cadre */
/* ═══ 26/08 — L'UNITÉ SE MET À CÔTÉ DU CHIFFRE, PLUS EN DESSOUS ═══
   Remarque de Mattieu : on lit « 136 mmHg » d'un coup d'œil ; « 136 » avec
   « mmHg » sur la ligne d'en dessous demande de recoller les deux. Et elle
   n'apparaît QUE dès le premier chiffre — un champ vide n'a pas d'unité.
   C'est le CSS qui le sait (:placeholder-shown), pas une ligne de code :
   tant que le champ montre son tiret, l'unité reste invisible.
   Le CADRE est sur la boîte .cval : chiffre et unité vivent DEDANS. */
.cval{display:flex;align-items:baseline;justify-content:center;gap:5px;
  box-sizing:border-box;background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;padding:10px 4px;margin-top:4px}
.cval:focus-within{outline:2px solid var(--accent);border-color:var(--accent)}
.cnum{width:3.4ch;background:none;border:0;padding:0;color:var(--text);
  font-size:26px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cnum.dec{width:4.6ch}
.cnum:focus{outline:none}
.ctab .unit{font-size:13px;color:var(--muted);margin:0;white-space:nowrap;
  transition:opacity .12s}
.cnum:placeholder-shown + .unit{opacity:0}

/* ── observations : jetons tactiles ── */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--surface);border:2px solid var(--border);border-radius:24px;
  color:var(--text);font-size:16px;padding:12px 18px;cursor:pointer}
.chip.sel{border-color:var(--warn);background:rgba(217,153,34,.14);font-weight:700}
/* Choix en cours dans la fenêtre : même feu que la chip. On le retouche
   pour l'éteindre — c'est l'annulation, sans bouton supplémentaire. */
.btn.sec.op-on{border-color:var(--warn);background:rgba(217,153,34,.18);font-weight:700}
textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:17px;padding:12px;min-height:80px;margin-top:12px}

/* ── boutons génériques ── */
.btn{display:block;width:100%;background:var(--accent);border:none;border-radius:var(--radius);
  color:#fff;font-size:19px;font-weight:700;padding:16px;margin-top:14px;cursor:pointer}
.btn.sec{background:var(--surface);border:2px solid var(--border);color:var(--text);font-weight:600}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}

/* ── historial ── */
.dia{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px}
.dia .df{font-weight:700;margin-bottom:6px;text-transform:capitalize}
.dia .linea{font-size:14px;color:var(--muted);padding:3px 0;border-top:1px dashed var(--border)}
.dia .linea b{color:var(--text)}
.vacio{color:var(--muted);text-align:center;padding:40px 10px;font-size:15px}

/* ── liste médicaments (Datos) ── */
.medrow{display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.medrow .mi{flex:1}.medrow .mn{font-weight:700}.medrow .md{font-size:13px;color:var(--muted)}
.medrow button{background:none;border:none;color:var(--bad);font-size:20px;cursor:pointer;padding:6px}
input.txt,select.txt{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:17px;padding:12px;margin-bottom:8px}
.pie{font-size:10px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ok);
  color:#fff;font-weight:700;padding:12px 22px;border-radius:24px;z-index:99;
  box-shadow:0 6px 20px rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.reloj{display:inline-block;animation:gira 1.4s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
/* v23.4 — listes déroulantes lisibles (P-H : « texte blanc/blanc ») :
   color-scheme aligne les widgets natifs (options, calendriers, pickers)
   sur le thème actif, et les options héritent des couleurs de la maison. */
html[data-theme=dark]{color-scheme:dark}
html[data-theme=light]{color-scheme:light}
select option{background:var(--surface);color:var(--text)}
.ropt input{position:absolute;opacity:0;pointer-events:none}
.ropt span{display:inline-block;padding:6px 12px;border:1px solid var(--border);border-radius:14px;font-size:13px;cursor:pointer;color:var(--muted)}
.ropt input:checked+span{background:rgba(232,161,60,.22);border-color:#e8a13c;color:var(--text);font-weight:700}
.popt{background:none;padding:6px 12px;border:1px solid var(--border);border-radius:14px;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit}
.popt.flash{background:rgba(232,161,60,.22);border-color:#e8a13c;color:var(--text);font-weight:700}
/* Bouton allumé : quelque chose a été bu. Gris, personne n'a bu. */
.popt.on{background:rgba(232,161,60,.22);border-color:#e8a13c;color:var(--text);font-weight:700}
.dlg{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:420px}
/* Fenêtre à liste : elle ne dépasse jamais l'écran. La question reste en
   haut, le bouton reste en bas, et c'est la liste qui défile. */
.dlg.lista{padding:14px 14px 12px;display:flex;flex-direction:column}
.dlg.lista .lista-cuerpo{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.dlg.lista .lista-cuerpo .btn{margin-top:0;padding:11px 12px;font-size:17px}
.dlg.lista > .btn{margin-top:10px;padding:13px;font-size:18px}
.dlg.lista .lista-tit{font-size:16px;font-weight:700;margin-bottom:8px;text-align:center}
.dlg.lista .lista-pie{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
.trio-tot{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;text-align:right}
.matrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0}
.matrow>b{min-width:0}
.matrow.mat-on{border-color:#3dbf7f;background:rgba(61,191,127,.10)}
.matctrl{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px;row-gap:8px}
.matnum{font-size:22px;min-width:34px;text-align:center}
.matud{font-size:12px;color:var(--muted)}
.matinput{width:74px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:20px;font-weight:700;padding:8px;text-align:center}
.stepper{width:44px;height:44px;font-size:20px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer}
.btn-sw{background:none;border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:14px;font-weight:700;padding:9px 16px;cursor:pointer;white-space:nowrap}
.btn-sw.on{border-color:#3dbf7f;background:rgba(61,191,127,.18)}
/* ═══ BASCULEUR (P-H 28/07) — la réplique de l'interrupteur de l'appareil.
   Deux faces qui pivotent autour de l'arête centrale : celle qu'on enfonce
   part en arrière, l'autre ressort. Aucun mot : O et I se lisent dans les
   quatre langues. La face enfoncée s'allume quand la machine tourne. ═══ */
#u112 .matctrl{margin-left:0;flex:1 1 100%;justify-content:center}
.matrow.u112-on{border-color:#d5241a;background:rgba(213,36,26,.09)}
/* état 1 — la personne est sortie : ce n'est plus l'urgence, c'est
   l'attente du retour. La couleur le dit sans un mot. */
.matrow.u112-fuera{border-color:var(--warn);background:rgba(217,153,34,.12)}
.pac-fila{display:flex;gap:4px;align-items:stretch;justify-content:center;flex-wrap:wrap;margin-top:1px}
.pac-sel{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;
  font-size:15px;font-weight:800;padding:0 6px;height:32px;box-sizing:border-box;max-width:60vw;font-family:inherit}
.pac-btn{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;
  font-size:16px;padding:0 8px;height:32px;box-sizing:border-box;cursor:pointer;line-height:1}
/* Le ＋ est le geste le plus fréquent de l'installation : il se voit. */
#pac-mas{font-size:21px;font-weight:700;padding:0 11px}
.pac-vacio{font-size:15px;color:var(--muted);font-style:italic}
/* Le témoin des mesures du jour. Une case vide et une valeur perdue se
   ressemblent trop : celui-ci montre que la journée a déjà ses mesures,
   pendant que le formulaire reste neuf pour la suivante. */
/* ㉔ la persona cuidada : « pourquoi ça ne reste pas affiché derrière la barre ? »
   Le titre et les mesures du jour restent visibles ; le formulaire défile
   dessous. On lit ce qui a déjà été pris pendant qu'on en prend une autre. */
.panel h2{position:sticky;top:0;z-index:6;background:var(--bg);margin:0;padding:10px 0 6px}
.const-hoy{margin-top:8px;position:sticky;top:var(--h2h,42px);z-index:5;background:var(--bg);
  padding-bottom:6px;box-shadow:0 6px 6px -6px rgba(0,0,0,.18)}
.const-hoy .ch-tit{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.const-hoy .ch-lin{font-size:14px;padding:5px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:5px}
.const-hoy .ch-lin b{font-variant-numeric:tabular-nums;margin-right:4px}
/* 26/08 — les unités s'effacent, les chiffres restent : la ligne doit tenir
   d'un seul tenant sur un écran de 360 px. */
.const-hoy .ch-lin i{font-style:normal;font-size:10px;color:var(--muted);margin-left:1px}
/* 26/08 (P-H) : « une listbox extensible jusqu'à 4 lignes visibles ».
   Le navigateur s'en charge — au-delà, une barre paraît et l'on fait
   glisser. L'ordre reste CELUI DU TEMPS : c'est un fil de journée, pas
   une pile ; c'est la vue qui descend d'elle-même sur la dernière. */
.const-hoy{max-height:132px;overflow-y:auto}
.const-hoy .ch-lin{white-space:nowrap;overflow-x:auto;cursor:pointer}
.const-hoy .ch-lin:active{border-color:var(--accent);background:rgba(74,143,232,.12)}
.v-ambar{color:#e0a03a;font-weight:700}
.v-rojo{color:#e05a4a;font-weight:700}
.rocker{position:relative;width:50px;height:52px;flex:none;padding:4px;border:0;
  border-radius:9px;background:linear-gradient(#4a5057,#23272d);cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),0 2px 5px rgba(0,0,0,.35);
  -webkit-tap-highlight-color:transparent;perspective:120px}
.rocker .fa{position:absolute;left:4px;right:4px;height:21px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font:700 12px/1 system-ui,sans-serif;letter-spacing:.5px;color:#c8cdd4;
  background:linear-gradient(#e9edf2,#b9c0c9);text-shadow:none;
  transition:transform .14s ease,filter .14s ease,background .14s ease,box-shadow .14s ease}
.rocker .fa-o{top:4px;transform-origin:bottom center}
.rocker .fa-i{bottom:4px;transform-origin:top center}
/* repos : O ressorti, I enfoncé */
.rocker .fa-o{transform:rotateX(14deg);color:#33383f;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.rocker .fa-i{transform:rotateX(-30deg);filter:brightness(.62);color:#4a4f56}
/* en marche : I ressorti et allumé, O enfoncé */
.rocker.on .fa-o{transform:rotateX(-30deg);filter:brightness(.62);color:#4a4f56;box-shadow:none}
.rocker.on .fa-i{transform:rotateX(14deg);filter:none;
  background:linear-gradient(#ff6a5a,#d5241a);color:#fff3f1;
  box-shadow:0 1px 2px rgba(0,0,0,.35),0 0 12px rgba(255,60,40,.75)}
.rocker:active{box-shadow:inset 0 0 0 1px rgba(0,0,0,.7),0 1px 2px rgba(0,0,0,.35)}
.hbtn2{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:16px;padding:6px 9px;cursor:pointer}
/* v.80 — l'abeille du retour au panal : discrète devant le sous-titre,
   elle grossit quand on la survole ou qu'on la touche. */
#bee-panal{cursor:pointer;font-size:15px;display:inline-block;margin-right:5px;
  vertical-align:-2px;transition:transform .15s}
#bee-panal:hover,#bee-panal:active{transform:scale(1.6)}
.acc{border:1px solid var(--border);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--surface)}
.acc summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:700;font-size:16px;display:flex;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:'▸';margin-left:auto;color:var(--muted);transition:transform .2s}
.acc[open] summary::after{transform:rotate(90deg)}
.accb{padding:2px 14px 14px}
.nota-campo{font-size:12px;color:var(--muted);margin:2px 0 4px;line-height:1.4}
input:focus,textarea:focus,select:focus{background:rgba(232,161,60,.14)!important;outline:1px solid rgba(232,161,60,.5)}
/* ═══ LA MAISON VIDE ═══ Les quatre écrans restent visibles et
   effleurables ; seul leur mobilier se tait, et l'invitation paraît. */
.invit { display: none; }
body.sin-paciente .invit { display: block; }
body.sin-paciente #p-hoy > *:not(.invit),
body.sin-paciente #p-const > *:not(.invit),
body.sin-paciente #p-notas > *:not(.invit),
body.sin-paciente #p-datos > *:not(.invit) { display: none !important; }
/* ② la date et ses flèches n'ont pas de journée à visiter */
body.sin-paciente #hdr-fecha { visibility: hidden; }
body.sin-paciente #nav-res { opacity: .35; }
.reg-lin{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--border);border-radius:10px}
.reg-lin.reg-puesta{background:var(--surface2,rgba(127,127,127,.10));border-color:#3dbf7f}
/* La règle générale des champs impose 20 px de police et 12 px de marge :
   l'heure débordait sous l'étiquette. On remonte donc la spécificité. */
.reg-lin input.reg-h{font-size:14px;font-variant-numeric:tabular-nums;color:var(--text);
  width:58px;flex:0 0 58px;box-sizing:border-box;text-align:center;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:5px 1px;margin:0;letter-spacing:0;height:29px}
.reg-lin input.reg-h:disabled{background:none;border-color:transparent;color:var(--muted)}
.reg-et{flex:1 1 auto;min-width:0;font-size:13.5px;padding-left:2px;text-align:left;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reg-n{font-size:11px;font-weight:700;min-width:20px;flex:0 0 20px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.imp-lin{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--border);border-radius:9px}
.imp-lin.imp-off{opacity:.42}
.imp-sep{font-size:11px;color:var(--muted);text-align:left;margin:8px 0 2px;
  border-top:1px dashed var(--border);padding-top:7px}
.imp-chk{background:none;border:none;font-size:19px;line-height:1;cursor:pointer;color:var(--text);flex:0 0 26px;padding:0}
.imp-med{flex:1;min-width:0;text-align:left;font-size:13.5px;overflow:hidden}
.imp-frec{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg .imp-lin select.imp-mom{flex:0 0 96px;width:96px;box-sizing:border-box;font-size:11.5px;padding:5px 2px;margin:0}
.reg-fila{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:10px;cursor:pointer}
.reg-fila:active{background:var(--surface)}
.reg-fila.reg-con{background:var(--surface)}
.reg-fila .reg-ico{font-size:17px;flex:0 0 auto}
.reg-fila b{flex:0 0 auto;font-size:15px;min-width:7.5em}
/* ㉜ (P-H 03/08) — « je croyais que c'était cassé » : les valeurs, cadrées
   à droite, fuyaient l'œil qui lit l'étiquette à gauche — un fleuve de vide
   les séparait sur écran large. Le tableau à deux colonnes : étiquettes de
   largeur commune, valeurs CADRÉES À GAUCHE — toutes à la même verticale,
   l'œil les cueille d'un seul mouvement. */
.reg-res{flex:1;min-width:0;font-size:12.5px;color:var(--muted);text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.reg-abre{color:var(--muted);font-size:18px;flex:0 0 auto}
.reg-lin{gap:2px;padding:5px 4px}
.reg-lin button{background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);
  font-size:15px;font-weight:700;line-height:1;width:23px;height:29px;cursor:pointer;flex:0 0 23px;padding:0;box-sizing:border-box}
.reg-lin button:disabled{opacity:.25;cursor:default}
.reg-lin .reg-ant,.reg-lin .reg-sig{font-size:19px}
.reg-lin .reg-x{border-color:#c0392b;color:#c0392b;font-size:15px}
.reg-lin .reg-mas{border-color:#3dbf7f;color:#1e9c5a}
.reg-lin .reg-menos{border-color:#d9855f;color:#c0392b}
@media print {
  /* on n'imprime que la feuille : ni écrans, ni boutons, ni en-tête */
  body > *:not(#res-ov) { display: none !important; }
  #res-ov { position: static !important; overflow: visible !important; }
  #res-mandos { display: none !important; }
  body { zoom: 1 !important; background: #fff !important; }
}

<body>

<header>
  <span id="hdr-logo" onclick="sondearPc(true)" style="position:absolute;left:12px;top:10px;cursor:pointer;display:block"></span>
  <!-- P-H, 31/07 : « le logo affiché différemment en fonction de la connexion,
       et rien à côté ». La pastille est supprimée : c'est l'emblème lui-même
       qui dit si la maison est joignable. -->
  <div class="ctrls">
    <button class="hbtn" id="btn-theme" onclick="toggleTheme()">🌙</button>
    <button class="hbtn" id="btn-lang" onclick="cycleLang()">ES</button>
    <button class="hbtn" onclick="zoomMas(-1)">A−</button>
    <button class="hbtn" onclick="zoomMas(1)">A＋</button>
    <button class="hbtn" onclick="verAyuda()">❓</button>
  </div>
  <div class="fecha" id="hdr-fecha" style="font-size:15px"></div>
  <div id="hdr-patient" style="font-size:17px;font-weight:800;color:var(--text);margin-top:1px"></div>
  <!-- v.80 (P-H, 27/08) : « l'abeille toute seule, à gauche du texte — on
       clique, on y va ; on passe dessus, elle grossit ». Comme au panal,
       l'abeille fait voyager. Elle vit dans SON span : render() réécrit
       hdr-sub, l'abeille à côté n'est jamais effacée. -->
  <div class="sub" style="font-size:10px"><span id="bee-panal" onclick="window.open('https://caracole.github.io/Salufolio/index.html','_blank')" title="Panal Salufolio">🐝</span><span id="hdr-sub" style="opacity:.75">Salufolio Protocolo</span></div>
</header>

<main>
  <!-- ═══ HOY : les prises ═══ -->
  <section id="p-hoy" class="panel act">
    <div id="avisos"></div>
    <div id="dia-aviso" style="display:none;background:var(--warn);color:#1a1200;border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:13.5px;font-weight:700;text-align:center">
      ✎ <span id="dia-aviso-txt"></span> — <span style="text-decoration:underline;cursor:pointer" onclick="volverHoy()">volver a hoy</span>
    </div>
    <h2 id="i-thoy"></h2>
    <div id="tomas-lista"></div>
    <div id="puntuales"></div>
    <h2 id="i-tmat"></h2>
    <div id="material"></div>
    <div id="u112"></div>
    <button class="btn sec" onclick="tomaPuntual()" id="i-bpunt"></button>
    <button class="btn sec" onclick="irPauta()" style="margin-top:8px">✏️ <span id="i-bpauta"></span></button>
  </section>

  <!-- ═══ CONSTANTES ═══ -->
  <section id="p-const" class="panel">
    <h2 id="i-tconst"></h2>
    <!-- la persona cuidada, 01/08 : « pourquoi ça ne reste pas affiché en haut sous le
         trait ? comme ça on voit toujours ». Juste : les mesures du jour se
         lisent avant d'en prendre une nouvelle, non après avoir fait défiler

/* ═══ LA LANGUE (P-H, 18/08) ═══
   Elle vient du bouton drapeau, et le choix de l'aidant l'emporte toujours.
   Mais TANT QUE PERSONNE N'A CHOISI, on ouvrait en espagnol pour tout le
   monde : un aidant français recevait un mur qu'il ne comprenait pas, avec
   pour seule issue un petit drapeau caché derrière la fenêtre d'accueil.
   Au PREMIER démarrage seulement, on suit donc la langue de l'appareil.
   Dès qu'on touche le drapeau, l'appareil ne redécide plus jamais. */
function idiomaDelAparato() {
  try {
    const l = (navigator.language || 'es').toLowerCase();
    if (l.indexOf('fr') === 0) return 'fr';
    if (l.indexOf('ca') === 0 || l.indexOf('va') === 0) return 'va';
    if (l.indexOf('en') === 0) return 'en';
  } catch (e) {}
  return 'es';
}
function getLang() { return lsGet('mfp_lang', null) || idiomaDelAparato(); }
function t(k) { return (IDIOMAS[getLang()] || IDIOMAS.es)[k] || IDIOMAS.es[k] || k; }
function cycleLang() {
  const i = LANGS.indexOf(getLang());
  lsSet('mfp_lang', LANGS[(i + 1) % LANGS.length]);
  render(); renderDatos();
}

  const ov = document.createElement('div'); ov.className = 'dlg-ov';
  ov.innerHTML = '<div class="dlg"><h3>' + titulo + '</h3>' +
    campos.map((c, i) => '<label>' + c.label + '</label><input id="dlg-c' + i + '" type="' + (c.tipo || 'text') + '" value="' + (c.valor || '') + '">').join('') +
    '<div class="dbtns"><button class="dcan">' + t('d_can') + '</button><button class="dok">' + t('d_ok') + '</button></div></div>';
  ov.querySelector('.dcan').onclick = () => ov.remove();
  ov.querySelector('.dok').onclick = () => {
    const vals = campos.map((c, i) => ov.querySelector('#dlg-c' + i).value);
    ov.remove(); onOk(vals);
  };
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
  const prem = ov.querySelector('input'); if (prem && !prem.value) prem.focus();
}

const MOM_ICONO = { desayuno:'🌅', almuerzo:'🥐', comida:'☀️', merienda:'🍵',
                    cena:'🌇', noche:'🌙', demanda:'✚' };
/* ═══ 24/08 (P-H) — L'HEURE PLAUSIBLE DU MOMENT ═══
   « on sait bien que le desayuno ce n'est pas à minuit ». Cocher une prise
   à 23 h ne veut pas dire qu'elle a eu lieu à 23 h : elle a eu lieu AU
   MOMENT, et le moment a son heure d'usage. L'heure du clic mentait ;
   celle-ci est approchée mais jamais absurde.
   ⚠ Elle est une TABLE : la changer, c'est changer une ligne. Le jour où
   deux patients ne mangeront pas à la même heure, elle passera dans leur
   fiche sans qu'on touche au code qui la lit.
   « demanda » n'y figure pas : là, l'heure est celle du geste, et elle dit
   quelque chose — c'est tout l'intérêt d'une prise à la demande. */
const HORA_MOMENTO = { desayuno:'08:00', almuerzo:'11:00', comida:'13:30',
                       merienda:'17:00', cena:'20:00',    noche:'22:00' };
const MOMENTOS  = MOM_ICONO;
function momNombre(id) { return (MOM_ICONO[id] || '') + ' ' + t('mj_' + id); }
/* ═══ LES MOMENTS D'UNE FICHE (P-H, 17/08) ═══
   « je ne vais pas m'encombrer avec 2, 3 ou 4 fois le même médicament » :
   une fiche peut déclarer PLUSIEURS moments. Un seul endroit le dit, et il
   tolère les deux formes — les anciennes fiches n'ont qu'un `momento`, on
   ne les convertit pas à l'aveugle, on les lit telles qu'elles sont.
   `momento` reste tenu à jour (le premier de la liste) pour que tout ce qui
   ne connaît pas encore les listes continue de fonctionner. */
function momsDe(m) {
  if (!m) return [];
  if (Array.isArray(m.momentos) && m.momentos.length) return m.momentos;
  return m.momento ? [m.momento] : [];
}
var _momsForm = { nm: ['desayuno'], em: [] };
/* « À la demande » n'est pas un moment : c'est son contraire. Il est donc
   EXCLUSIF — le choisir efface les autres, en choisir un autre l'efface. */
function momBascula(pref, id) {
  var l = _momsForm[pref] || [];
  var i = l.indexOf(id);
  if (i >= 0) l.splice(i, 1);
  else if (id === 'demanda') l = ['demanda'];
  else { l = l.filter(function (x) { return x !== 'demanda'; }); l.push(id); }
  var ordre = Object.keys(MOM_ICONO);
  l.sort(function (a, b) { return ordre.indexOf(a) - ordre.indexOf(b); });
  _momsForm[pref] = l;
  pintaMomChips(pref);
  var cache = document.getElementById(pref + '-momento');
  if (cache) cache.value = l[0] || '';       /* ce que lisent les anciens */
  pintaFrec(pref);
}
function pintaMomChips(pref) {
  var c = document.getElementById(pref + '-moms'); if (!c) return;
  var l = _momsForm[pref] || [];
  c.innerHTML = Object.keys(MOM_ICONO).map(function (id) {
    var on = l.indexOf(id) >= 0;
    return '<button type="button" class="mchip' + (on ? ' on' : '') + '" onclick="momBascula(\'' + pref + '\',\'' + id + '\')">' +
           momNombre(id) + '</button>';
  }).join('');
}

/* ═══ PLUSIEURS PATIENTS SOUS UN SEUL TOIT (P-H 28/07) ═══
   Ce qui suit appartient au PATIENT : chacun a son casier, préfixé par son
   identifiant. Le reste — langue, zoom, thème, adresse du PC, commentaires —
   demeure au cuidador et reste commun. Une table, pas des conditions
   éparpillées : lsGet et lsSet sont les deux seules portes du stockage, et
   c'est là, en un seul endroit, que le préfixe se pose. */
const CLAVES_PACIENTE = ['mfp_patient','mfp_sip','mfp_meds','mfp_tomas','mfp_puntuales',
  'mfp_obs','mfp_constantes','mfp_material','mfp_material_cfg','mfp_asist',
  'mfp_avisos','mfp_horas','mfp_inicio'];
/* ═══ LE GUICHET DU STOCKAGE (17/08) ═══
   Défaut trouvé par P-H en ouvrant l'app depuis un fichier dans le banc :
   « SecurityError : Access is denied for this document ». Selon l'origine —
   un blob, une navigation privée, des cookies bloqués — le navigateur REFUSE
   l'accès au localStorage, et il ne rend pas null : IL LÈVE. Le programme
   mourait donc à la première ligne qui y touchait.

   Un carnet local-first n'a pas le droit de mourir parce que l'armoire est
   fermée. On passe donc TOUS les accès par un guichet unique : s'il n'y a pas
   d'armoire, il en ouvre une DANS LA MÉMOIRE VIVE — l'app fonctionne, on peut
   tout regarder, et rien ne survit à la fermeture de l'onglet. Ce qui ne peut
   pas être conservé n'est pas promis. */
var _ARMOIRE = null, _SANS_ARMOIRE = false;
function _arm() {
  if (_ARMOIRE) return _ARMOIRE;
  try {
    window.localStorage.setItem('mfp_essai', '1');
    window.localStorage.removeItem('mfp_essai');
    _ARMOIRE = window.localStorage;
  } catch (e) {
    _SANS_ARMOIRE = true;
    var d = {};
    _ARMOIRE = {
      getItem: function (k) { return k in d ? d[k] : null; },
      setItem: function (k, v) { d[k] = String(v); },
      removeItem: function (k) { delete d[k]; },
      get length() { return Object.keys(d).length; },
      key: function (i) { return Object.keys(d)[i]; }
    };
  }
  return _ARMOIRE;
}
function sinArmoire() { _arm(); return _SANS_ARMOIRE; }
function getPacientes() { try { return JSON.parse(_arm().getItem('mfp_pacientes')) || []; } catch (e) { return []; } }
function setPacientes(l) { _arm().setItem('mfp_pacientes', JSON.stringify(l)); }
/* Le patient actif appartient à L'ONGLET, pas au navigateur. Sans cela,
   deux onglets ouverts se marchent dessus : celui qui croit soigner Mamá
   écrit chez Papá dès que l'autre a changé de patient — vérifié, et c'est
   une faute clinique. sessionStorage est justement cloisonné par onglet et
   survit au rechargement ; localStorage ne garde que le DERNIER choix, pour
   qu'un onglet neuf s'ouvre là où l'on s'est arrêté. */
let _activoSesion = null;
function getActivo() {
  if (_activoSesion) return _activoSesion;
  let v = null;
  try { v = JSON.parse(sessionStorage.getItem('mfp_activo')); } catch (e) {}
  if (!v) { try { v = JSON.parse(_arm().getItem('mfp_activo')); } catch (e) {} }
  _activoSesion = v || null;
  return _activoSesion;
}
function setActivo(id) {
  _activoSesion = id;
  try { sessionStorage.setItem('mfp_activo', JSON.stringify(id)); } catch (e) {}
  _arm().setItem('mfp_activo', JSON.stringify(id));
}
function olvidarActivo() {
  _activoSesion = null;
  try { sessionStorage.removeItem('mfp_activo'); } catch (e) {}
  _arm().removeItem('mfp_activo');
}
function _k(k) {
  const a = getActivo();
  return (a && CLAVES_PACIENTE.indexOf(k) >= 0) ? ('mfp_' + a + '_' + k.slice(4)) : k;
}
function lsGet(k, def) { try { const v = JSON.parse(_arm().getItem(_k(k))); return v === null || v === undefined ? def : v; } catch { return def; } }
/* ⑤ Garde-fou : sans patient actif, une donnée de patient partirait dans le
   casier SANS NOM, où elle dormirait à jamais — invisible, jamais exportée,
   jamais envoyée. Le pire des trois destins possibles. L'écran l'empêche
   déjà ; ceci l'empêche pour de bon. */
function lsSet(k, v) {
  if (CLAVES_PACIENTE.indexOf(k) >= 0 && !getActivo()) return;
  _arm().setItem(_k(k), JSON.stringify(v));
}

/* Un identifiant lisible, tiré du nom, et unique dans la maison. */
function _idPaciente(nom) {
  const base = (nom || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '').slice(0, 10) || 'pac';
  const usados = getPacientes().map(p => p.id);
  let id = base, i = 2;
  while (usados.indexOf(id) >= 0) { id = base + i; i++; }
  return id;
}
/* Migration douce : un dossier d'avant la liste devient le patient n° 1,
   et ses affaires passent dans son casier. Rien n'est perdu, rien à
   ressaisir. Ne s'exécute qu'une fois. */
function migrarPacientes() {
  if (_arm().getItem('mfp_pacientes')) return;
  let nom = null, sip = '';
  try { nom = JSON.parse(_arm().getItem('mfp_patient')); } catch {}
  try { sip = JSON.parse(_arm().getItem('mfp_sip')) || ''; } catch {}
  if (!nom) { setPacientes([]); return; }
  const id = _idPaciente(nom);
  CLAVES_PACIENTE.forEach(k => {
    const v = _arm().getItem(k);
    if (v !== null) { _arm().setItem('mfp_' + id + '_' + k.slice(4), v); _arm().removeItem(k); }
  });
  setPacientes([{ id: id, nombre: nom, sip: sip }]); setActivo(id);
}
migrarPacientes();
function hoyKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

/* ── CORRIGER UN JOUR PASSÉ (P-H 16/07 : « je n'ai pas pu corriger en cas
   d'erreur ») — le jour ACTIF est aujourd'hui par défaut ; on peut reculer
   jusqu'à 7 jours pour réparer un oubli ou une erreur de doigt. Les avisos,
   eux, restent toujours sur aujourd'hui. ── */
let _diaActivo = null;
function diaKey() { return _diaActivo || hoyKey(); }
function esHoy() { return diaKey() === hoyKey(); }
function diaMas(n) {
  if (casaVacia()) return;              /* ② aucune journée à visiter */
  const d = new Date(diaKey() + 'T12:00:00');
  d.setDate(d.getDate() + n);
  const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const hoy = hoyKey();
  if (k > hoy) return;                                   /* pas de futur */
  const limite = new Date(); limite.setDate(limite.getDate() - 60);
  if (new Date(k + 'T12:00:00') < limite) return;        /* 7 jours en arrière */
  _diaActivo = (k === hoy) ? null : k;
  repintarDia();
}

   « je n'aime pas ce système de faire tourner les aiguilles » : on tape

  if (n.length === 4)      { d = +n.slice(0,2); m = +n.slice(2,4); a = new Date().getFullYear(); }

  else if (n.length === 8) { d = +n.slice(0,2); m = +n.slice(2,4); a = +n.slice(4,8); }
  else return null;
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  const dt = new Date(a, m - 1, d, 12, 0, 0);
  if (dt.getDate() !== d || dt.getMonth() !== m - 1) return null;   /* 31/02 n'existe pas */
  /* Quatre chiffres seuls : l'année est celle qui tombe dans le passé. */
  if (n.length === 4 && dt > new Date()) dt.setFullYear(a - 1);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');

      if (m) { const cs = getConstantes(), ix = _cDraftB[m[1]];
               el.value = (ix !== null && cs[ix]) ? cs[ix].hora : ''; }
    }
    replicarHora(el);
    const f = CAMPOS_GUARDA[el.id];
    if (f) { try { f(el); } catch (e) {} }
  }

/* ── oublis de la veille ── */
function ayerKey() { const d = new Date(); d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
/* 24/08 (P-H) : « seulement le 27, pas de pollution inutile » — un traitement
   qui commence plus tard ne figure pas dans la liste du jour avant son début. */
function medActivo(m, fecha) { return (!m.desde || fecha >= m.desde) && (!m.hasta || fecha <= m.hasta); }

/* ═══════════════════════════════════════════════════════════════════
   LA FRÉQUENCE (P-H 29/07 — « Hydroferol ampolla cada mes »)
   Une table déclare les fréquences ; tocaHoy() dit si le médicament est
   dû ce jour-là. L'écran du jour ne connaît que cette question.
   ═══════════════════════════════════════════════════════════════════ */
const FRECUENCIAS = {
  diaria:  { k:'fr_diaria',  pide:null   },
  alterna: { k:'fr_alterna', pide:null   },
  semanal: { k:'fr_semanal', pide:'sem'  },
  mensual: { k:'fr_mensual', pide:'mes'  }
};
/* Les noms des jours viennent du système : il connaît le calendrier des
   quatre langues mieux qu'une table écrite à la main. Ce n'est pas de la
   grammaire fabriquée, c'est une donnée de locale. Index 0 = dimanche,
   comme Date.getDay(). */
function nombresDiaSemana() {
  const loc = LOCALES[getLang()] || 'es-ES', out = [];
  for (let i = 0; i < 7; i++) {          /* le 5 juillet 2026 est un dimanche */
    out.push(new Date(2026, 6, 5 + i).toLocaleDateString(loc, { weekday: 'long' }));
  }
  return out;
}
function tocaHoy(m, fecha) {
  const fr = m.frec || 'diaria';
  if (fr === 'diaria' || !FRECUENCIAS[fr]) return true;
  const d = new Date(fecha + 'T12:00:00');
  if (fr === 'semanal') return d.getDay() === Number(m.fdia);
  if (fr === 'mensual') {
    /* un médicament du 31 ne doit pas disparaître en février : on le prend
       au dernier jour du mois. Rien ne se perd. */
    const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return d.getDate() === Math.min(Number(m.fdia) || 1, ultimo);
  }
  if (fr === 'alterna') {
    const a = new Date((m.ancla || fecha) + 'T12:00:00');
    return Math.abs(Math.round((d - a) / 86400000)) % 2 === 0;
  }
  return true;
}
/* Ce qu'on écrit dans la pauta, en clair. */
function frecTexto(m) {
  const fr = m.frec || 'diaria';
  if (fr === 'diaria') return '';
  const cfg = FRECUENCIAS[fr]; if (!cfg) return '';
  let x = t(cfg.k);
  if (fr === 'semanal') x += ' (' + (nombresDiaSemana()[Number(m.fdia)] || '?') + ')';
  if (fr === 'mensual') x += ' (' + t('fr_dmes').toLowerCase() + ' ' + (m.fdia || '?') + ')';
  return x;
}
/* Le formulaire ne montre que ce qui peut servir : le jour de la semaine
   pour une fréquence hebdomadaire, le jour du mois pour une mensuelle, et
   rien du tout pour un médicament « à la demande ». */
function pintaFrec(pref) {
  const mom = document.getElementById(pref + '-momento');
  const caja = document.getElementById(pref + '-frec-caja');
  const sel  = document.getElementById(pref + '-frec');
  const dsem = document.getElementById(pref + '-dsem');
  const dmes = document.getElementById(pref + '-dmes');
  if (!sel || !caja) return;
  const demanda = mom && mom.value === 'demanda';
  caja.style.display = demanda ? 'none' : '';
  const fr = sel.value;
  if (dsem) {
    if (!dsem.options.length) {
      dsem.innerHTML = nombresDiaSemana().map((nom, i) => '<option value="' + i + '">' + nom + '</option>').join('');
    }
    dsem.style.display = (!demanda && fr === 'semanal') ? '' : 'none';
  }
  if (dmes) dmes.style.display = (!demanda && fr === 'mensual') ? '' : 'none';
}
function opcionesFrec(actual) {
  return Object.keys(FRECUENCIAS).map(k =>
    '<option value="' + k + '"' + (actual === k ? ' selected' : '') + '>' + t(FRECUENCIAS[k].k) + '</option>').join('');
}
/* Ce que le formulaire a dit, prêt à ranger dans la fiche. */
function leerFrec(pref, fecha) {
  const sel = document.getElementById(pref + '-frec');
  const fr = (sel && sel.value) || 'diaria';
  const out = { frec: fr };
  if (fr === 'semanal') out.fdia = Number((document.getElementById(pref + '-dsem') || {}).value || 0);
  if (fr === 'mensual') out.fdia = Math.min(31, Math.max(1, Number((document.getElementById(pref + '-dmes') || {}).value || 1)));
  if (fr === 'alterna') out.ancla = fecha;

}

/* ── MATERIAL / DISPOSITIVOS (P-H 15/07) : l'oxygène et les Incopack ne sont
   pas des prises — compteur quotidien (pañales) et valeur (débit O₂ L/min). ── */
const MATERIAL_DEF = [
  { id: 'oxigeno',  nombre: 'Oxígeno',            tipo: 'interruptor', icono: '💨' }
];
/* Le nom d'un matériel de la maison (Oxígeno) vit dans la table des
   langues sous mat_<id> ; un matériel ajouté par l'aidant garde le sien. */
function matNombre(d) {
  const k = 'mat_' + d.id;
  const trad = (IDIOMAS[getLang()] || {})[k] || IDIOMAS.es[k];
  return trad || d.nombre;
}
function getMaterialCfg() {
  const cfg = lsGet('mfp_material_cfg', MATERIAL_DEF);
  /* v24.13 — migration douce : un oxígeno mémorisé en ancien type (valor L/min)
     devient interruptor, pour que le switch apparaisse sans vider les données. */
  let cambiado = false;
  cfg.forEach(d => { if (d.id === 'oxigeno' && d.tipo !== 'interruptor') { d.tipo = 'interruptor'; d.icono = '💨'; delete d.unidad; cambiado = true; } });
  /* 28/07 (P-H : « on supprime Incopack dans Hoy, ça simplifie ») : la ligne
     s'en va des appareils déclarés. Les comptes déjà écrits dans mfp_material
     restent où ils sont — on retire l'affichage, pas l'histoire. */
  for (let i = cfg.length - 1; i >= 0; i--) if (cfg[i].id === 'incopack') { cfg.splice(i, 1); cambiado = true; }
  if (cambiado) lsSet('mfp_material_cfg', cfg);
  return cfg;
}
function getMaterial() { return lsGet('mfp_material', {}); }
function matHoy() { const m = getMaterial(); return m[diaKey()] || {}; }
function matSet(id, val) {
  const m = getMaterial(); const k = diaKey();
  if (!m[k]) m[k] = {};
  if (val === null || val === '' || val === 0) delete m[k][id]; else m[k][id] = val;
  lsSet('mfp_material', m); renderMaterial();
}
function matMas(id, sens) {
  const n = Math.max(0, (parseInt(matHoy()[id]) || 0) + sens);
  matSet(id, n || null);
  if (sens > 0) toast('✓ ' + n);
}
function matValor(id, v) {
  const x = parseFloat(String(v).replace(',', '.'));
  matSet(id, isNaN(x) ? null : x);
}
function renderMaterial() {
  const el = document.getElementById('material'); if (!el) return;
  const hoy = matHoy();
  el.innerHTML = getMaterialCfg().map(function(d) {
    if (d.tipo === 'interruptor') return _matInterruptor(d);
    if (d.tipo === 'contador') {
      const n = parseInt(hoy[d.id]) || 0;
      return '<div class="matrow">🩹 <b>' + matNombre(d) + '</b>' +
        '<span class="matctrl">' +
        '<button class="stepper" onclick="matMas(\'' + d.id + '\',-1)">−</button>' +
        '<b class="matnum">' + n + '</b>' +
        '<button class="stepper" onclick="matMas(\'' + d.id + '\',1)">+</button>' +
        '<span class="matud">' + d.unidad + '</span></span></div>';
    }
    const v = hoy[d.id] !== undefined ? hoy[d.id] : '';
    return '<div class="matrow">🩹 <b>' + matNombre(d) + '</b>' +
      '<span class="matctrl">' +
      '<input type="number" inputmode="decimal" step="0.5" value="' + v + '" placeholder="—" ' +
      'onchange="matValor(\'' + d.id + '\', this.value)" class="matinput">' +
      '<span class="matud">' + d.unidad + '</span></span></div>';
  }).join('');
}
/* ═══ v2026.7.24.11 — INTERRUPTEUR (P-H : « la réplique de la réalité ») :
   un toque = inicio, un toque = fin ; session en cours = inicio sans fin
   (formato 2). Total du jour affiché comme témoin, comme l'hydratation. ═══ */
function _matSesiones(id) { const m = getMaterial(); m._uso = m._uso || {}; m._uso[id] = m._uso[id] || {}; return m; }
function matUsoHoy(id) { const m = getMaterial(); return ((m._uso || {})[id] || {})[diaKey()] || []; }
function _matInterruptor(d) {
  const ses = matUsoHoy(d.id);
  /* l'interrupteur suit la séance réellement ouverte, même commencée la
     veille : une nuit d'oxygène ne se coupe pas à minuit */
  const ab = matSesionAbierta(d.id);
  const abierta = !!ab;
  const ayer = (ab && ab.dia !== diaKey()) ? ab.dia : null;
  let mins = 0, cerradas = 0;
  ses.forEach(s => { const dd = durSesion(s, diaKey()); if (dd != null) { mins += dd; cerradas++; } });
  const resumen = cerradas ? (cerradas + '× · ' + _fmtDur(mins) + (abierta ? ' + en curso' : '')) : (abierta ? 'en curso desde ' + ((((getMaterial()._uso||{})[d.id]||{})[ab.dia]||[])[ab.i]||{}).inicio + (ayer ? ' (' + fmtDiaCorto(ayer) + ')' : '') : '');
  const lpm = matLitros(d.id);
  return '<div class="matrow ' + (abierta ? 'mat-on' : '') + '">' + (d.icono || '💨') + ' <b>' + matNombre(d) + '</b>' +
    '<span class="matctrl">' +
    '<span class="trio-tot">' + resumen + '</span>' +
    '<input type="number" inputmode="decimal" step="0.5" min="0" value="' + lpm + '" oninput="matSetLitros(\'' + d.id + '\', this.value)" onchange="matSetLitros(\'' + d.id + '\', this.value)" class="matinput" style="width:58px" title="L/min">' +
    '<span class="matud">L/min</span>' +
    '<button type="button" class="rocker ' + (abierta ? 'on' : '') + '" onclick="matToggle(\'' + d.id + '\')"' +
      ' aria-pressed="' + (abierta ? 'true' : 'false') + '"' +
      ' title="' + (abierta ? t('sw_fin') : t('sw_ini')) + '"' +
      ' aria-label="' + matNombre(d) + ' — ' + (abierta ? t('sw_fin') : t('sw_ini')) + '">' +
      '<span class="fa fa-o">O</span><span class="fa fa-i">I</span></button>' +
    '</span></div>';
}
/* v24.14 (P-H) : réglage litres — défaut 2, modifiable pendant ou après la marche,
   SANS question. Si on change EN MARCHE, on horodate le changement dans la session. */
function matLitros(id) {
  const m = getMaterial(); const g = (m._litros || {})[id];
  return (g === undefined || g === null || g === '') ? 2 : g;
}
function matSetLitros(id, v) {
  const val = parseFloat(String(v).replace(',', '.'));
  const lpm = isNaN(val) ? 2 : val;
  const m = getMaterial(); m._litros = m._litros || {}; m._litros[id] = lpm;
  /* si une session est en cours, on grave le changement horodaté */
  const dia = diaKey(); const arr = ((m._uso || {})[id] || {})[dia] || [];
  if (arr.length && !arr[arr.length - 1].fin) {
    const s = arr[arr.length - 1];
    s.litros = s.litros || [{ hora: s.inicio, lpm: lpm }];
    if (s.litros[s.litros.length - 1].lpm !== lpm) s.litros.push({ hora: ahora(), lpm: lpm });

  }

}
function _minEntre(hi, hf) { const a = hi.split(':'), b = hf.split(':'); return (b[0]*60 + (+b[1])) - (a[0]*60 + (+a[1])); }
function _fmtDur(m) { if (m < 0) m += 1440; const h = Math.floor(m/60), mm = m%60; return (h ? h + ' h ' : '') + (mm ? mm + ' min' : (h ? '' : '0 min')); }
/* ═══ LA DURÉE D'UNE SÉANCE (P-H, 01/08) ═══
   Une fin qui précède le début était lue comme une nuit franchie — juste
   pour 22:00→07:00, faux pour une faute de frappe. Son raisonnement tranche :
   C'EST LE JOUR SÉLECTIONNÉ QUI RÉPOND. On garde donc le jour de la fin dans
   la séance ; la durée ne se devine plus, elle se calcule.
   Et fermer une séance à une heure antérieure au début LE MÊME JOUR est une
   faute : le programme le dit au lieu de compter vingt-trois heures. */
function _diasEntre(d1, d2) {
  return Math.round((new Date(d2 + 'T12:00:00') - new Date(d1 + 'T12:00:00')) / 86400000);
}
function durSesion(ses, diaInicio) {
  if (!ses || !ses.inicio || !ses.fin) return null;
  let m = _minEntre(ses.inicio, ses.fin);
  const dd = (ses.finDia && diaInicio) ? _diasEntre(diaInicio, ses.finDia) : (m < 0 ? 1 : 0);
  m += dd * 1440;
  return m >= 0 ? m : null;
}
/* Une séance ouverte hier soir se ferme ce matin : c'est UNE séance, et la
   couper à minuit serait un mensonge sur la donnée. On la retrouve donc là
   où elle a commencé. */
function matSesionAbierta(id) {
  const m = getMaterial(), u = (m._uso || {})[id] || {};

/* L'adresse telle qu'on la montre à un humain : sans le protocole, et

async function enviarSalufolio() {

  const base = baseSalufolio();
  if (base === null) { toast(t('env_err') + ' — dirección?'); return; }
  const be = document.getElementById('i-benv');
  const avant = be ? be.textContent : '';
  if (be) { be.disabled = true; be.innerHTML = '<span class="reloj">⏳</span>'; }
  const st = document.getElementById('pc-estado');
  try {
    await fetch(base + '/api/protocolo', {
      method: 'POST',
      mode: 'no-cors',                       /* le satellite part sans réponse à lire */
      headers: { 'Content-Type': 'text/plain' },  /* text/plain = pas de preflight */
      body: JSON.stringify(payloadExport())
    });
    /* no-cors : on ne peut PAS lire r.ok ni r.json — on suppose parti */
    toast('🛰️ ' + t('env_ok'));
    if (st) st.innerHTML = '🛰️ ' + t('env_ok') + ' — ' + t('env_donde');
  } catch (e) {
    toast(t('env_err'));
    if (st) st.innerHTML = '❌ No salió.<br>Compruebe que Salufolio esté abierto en el ordenador y que el teléfono use el mismo WiFi.';
  }
  finally { if (be) { be.disabled = false; be.textContent = avant || t('b_env'); } }
}

async function compartir() {
  const json = JSON.stringify(payloadExport(), null, 2);
  try {
    const file = new File([json], 'Salufolio_Protocolo_export.json', { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Salufolio Protocolo' }); return;
    }
    if (navigator.share) { await navigator.share({ title: 'Salufolio Protocolo', text: json }); return; }
    throw 0;
  } catch (e) { if (e && e.name === 'AbortError') return; toast('Compartir no disponible — use ⬇️ Descargar'); }
}

/* v23.2 — bienvenida de primera apertura (P-H : « une page d'accueil la
   première fois ? ») : trois pasos y a trabajar. */
/* ═══ LA HAUTEUR UTILE (suggestion de P-H, 30/07) ═══
   « Pourquoi ne prends-tu pas la hauteur de la partie utile de l'écran ? »
   Il avait raison : les navigateurs l'exposent. visualViewport donne ce qui
   reste une fois les barres déduites — et sur mobile ces barres se rétractent
   au défilement, ce qu'aucune constante ne peut suivre.
   Tout est ramené en points de CONTENU, c'est-à-dire divisé par le facteur
   d'agrandissement : à l'intérieur du corps agrandi, un point d'écran ne vaut
   pas un point de contenu. */
function pantallaUtil() {
  const z = parseFloat(lsGet('mfp_zoom', 1.33)) || 1;
  const vv = window.visualViewport;
  return { an: Math.round((vv ? vv.width  : window.innerWidth)  / z),
           al: Math.round((vv ? vv.height : window.innerHeight) / z) };
}
/* La carte d'accueil s'ajuste à l'écran : large sur une tablette, resserrée
   sur un téléphone, et jamais plus haute que la place disponible — c'est le
   corps qui défile, jamais les boutons qui s'échappent. */
function ajustarBienvenida(ov) {
  const c = ov.querySelector('.bv-carta'); if (!c) return;
  const u = pantallaUtil();
  const ancho = Math.min(560, u.an - 24);
  const logo  = Math.max(84, Math.min(170, Math.round(Math.min(u.an, u.al) / 4.5)));
  const letra = Math.max(14, Math.min(18, Math.round(u.an / 27)));
  c.style.width     = ancho + 'px';
  c.style.maxHeight = (u.al - 20) + 'px';
  c.style.fontSize  = letra + 'px';
  const svg = c.querySelector('svg');
  if (svg) { svg.setAttribute('width', logo); svg.setAttribute('height', logo); }
}
/* ═══ INSTALLER SUR L'APPAREIL (P-H, 30/07) ═══
   L'ancien bouton demandait le fichier au serveur, par /protocolo/instalar.
   Deux ennuis : il ne vivait que sur le pont local, et le navigateur refusait
   « de télécharger le fichier de façon sécurisée » — un fichier HTML servi en
   clair est tenu pour suspect.
   On prend donc le programme à sa propre source et on le remet à l'appareil
   sous forme d'objet local. Cela marche partout : depuis le pont, depuis une
   copie, et même depuis le dépôt public. */
async function instalarLocal(btn) {
  const dicho = btn ? btn.textContent : '';
  /* ㉙ (P-H 03/08) : servie PAR LE PONT, l'app demande le fichier à la route
     /protocolo/instalar — octet-stream (Chrome ne le bloque plus) ET l'adresse
     du PC déjà injectée : la copie locale naît configurée. Les autres
     origines (file://, dépôt public https) gardent le chemin fetch-self. */
  if (baseSalufolio() === '') {
    if (btn) { btn.textContent = '✓'; setTimeout(function () { btn.textContent = dicho; }, 2500); }
    location.href = '/protocolo/instalar';
    return;
  }
  try {
    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    const r = await fetch(location.href, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    if (txt.indexOf('MFP_VERSION') < 0) throw new Error('fuente no reconocida');
    const url = URL.createObjectURL(new Blob([txt], { type: 'text/html' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'Salufolio_Protocolo_movil.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    if (btn) btn.textContent = '✓';
  } catch (e) {
    if (btn) btn.textContent = '⚠';
    toast('⚠ ' + (e && e.message ? e.message : 'error'));
  } finally {
    setTimeout(() => { if (btn) { btn.disabled = false; btn.textContent = dicho; } }, 2500);
  }
}

function bienvenida() {
  if (_arm().getItem('mfp_bienv2')) return;
  const ov = document.createElement('div');
  /* Sur un écran étroit, cette fenêtre mesurait 933 points pour un écran de
     800 : le ✕ passait au-dessus du bord et le bouton de validation en
     dessous. Aucun des deux n'était atteignable — l'accueil retenait
     prisonnier. Elle défile désormais au lieu de déborder, et son contenu

  ov.style.cssText = 'position:fixed;inset:0;z-index:98;background:rgba(0,0,0,.75);' +
    'display:flex;align-items:center;justify-content:center;padding:10px';

    '<div id="bv-conexion" style="font-size:12.5px;margin:2px 0 8px;flex-shrink:0;min-height:18px"></div>' +
    /* Le drapeau de l'en-tête est CACHÉ DERRIÈRE cette fenêtre : qui ne

    '<div class="bv-langs">' + LANGS.map(function (lg) {

             BANDERAS[lg] + '</button>'; }).join('') + '</div>' +
    /* 17/08 — P-H : « le texte est en español au premier plan et le drapeau

       cette fenêtre, écrite en dur — et c'est LE PREMIER ÉCRAN, celui qui

    '<p style="margin:8px 0;text-align:left">' + t('bv_cuerpo') + '</p>' +

    '<button class="btn" style="width:100%;margin-top:8px;flex-shrink:0" id="bv-ok">' + t('bv_ok') + '</button></div>';
  ov.querySelectorAll('.bv-lang').forEach(function (b) {

      bienvenida();                      /* …et se relit dans la bonne langue */
    };
  });
  document.body.appendChild(ov);
  ajustarBienvenida(ov);
  pintarConexionBienvenida();
  /* l'écran tourne, les barres se rétractent : on remesure */
  const remedir = () => { ajustarBienvenida(ov); ajustarPie(); };

  const cerrar = () => { _arm().setItem('mfp_bienv2', JSON.stringify('1')); ov.remove(); arranqueInicial(); };
  /* P-H, 30/07 : « lorsqu'on quitte l'écran d'accueil, un autre écran demande
     — vous pouvez installer en local, oui ou non ». Une question franche vaut
     mieux qu'un bouton qu'on remarque à peine, et la carte d'accueil reste

  ov.querySelector('#bv-ok').onclick = () => { cerrar(); preguntaInstalar(); };

/* ═══════════════════════════════════════════════════════════════════
   IMPORTER UN PATIENT DEPUIS SALUFOLIO (P-H, 01/08)
   Le dossier détient la vérité de ce qui est PRESCRIT ; le téléphone en
   emprunte une copie de travail. Il repart vierge de journal : ni
   constantes, ni observations, ni prises — celles-là vont dans l'autre
   sens.
   Le dossier ignore les moments de la journée. On ne les devine pas :
   on montre le texte de l'ordonnance et l'aidant pose le moment.
   ═══════════════════════════════════════════════════════════════════ */
let _impFicha = null;

async function importarDeSalufolio() {
  const base = baseSalufolio();
  if (base === null || _pcVivo !== true) { toast('⚪ ' + t('conn_no')); return; }
  toast('…');
  let lista;
  try {
    const r = await fetch(base + '/api/protocolo/pacientes', { cache: 'no-store' });
    lista = (await r.json()).pacientes || [];
  } catch (e) { toast('⚠ ' + t('imp_error')); return; }
  if (!lista.length) { toast(t('imp_ninguno')); return; }
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:97;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML = '<div class="dlg lista">' +
    '<div class="lista-tit">📥 ' + t('imp_tit') + '</div>' +
    '<div class="lista-cuerpo">' +
      lista.map(function (p, k) {
        /* un dossier anonymisé n'a pas de nom : on le dit, on n'invente pas */
        const anon = (p.nombre === p.clave);
        return '<button class="btn sec" data-p="' + k + '" style="text-align:left">' +
          '<b>' + p.nombre + '</b>' + (anon ? ' <span style="color:var(--muted);font-size:12px">' + t('imp_anon') + '</span>' : '') +
          '<div style="font-size:12px;color:var(--muted);margin-top:2px">' +
            p.medicamentos + ' ' + t('imp_meds') + ' · ' + t('imp_copia') + ' ' + p.fecha + ' ' + (p.hora || '').slice(0, 5) +
          '</div></button>';
      }).join('') +
    '</div>' +
    '<div class="lista-pie">' + t('imp_pie') + '</div>' +
    '<button class="btn sec" data-can="1">' + t('d_can') + '</button></div>';
  document.body.appendChild(ov);
  ajustaLista(ov);
  ov.querySelector('button[data-can]').onclick = function () { ov.remove(); };
  ov.querySelectorAll('button[data-p]').forEach(function (b) {
    b.onclick = function () { ov.remove(); _impPedirFicha(lista[+b.dataset.p]); };
  });
}

async function _impPedirFicha(p) {
  const base = baseSalufolio();
  toast('…');
  try {
    const r = await fetch(base + '/api/protocolo/paciente?k=' + encodeURIComponent(p.clave), { cache: 'no-store' });
    _impFicha = await r.json();
  } catch (e) { toast('⚠ ' + t('imp_error')); return; }
  if (!_impFicha || !_impFicha.paciente) { toast('⚠ ' + t('imp_error')); return; }
  /* P-H, 01/08 : « au-delà de 3 mois, pas d'intérêt ». Juste — mais un
     chronique prescrit il y a deux ans se prend peut-être encore tous les
     jours. On ne les retire donc PAS : on les montre, décochés. Si l'on ne
     fait rien ils n'entrent pas ; un toucher les récupère. Le programme
     range et suggère, il ne décide pas ce qui est prescrit. */
  const _limite = new Date(); _limite.setMonth(_limite.getMonth() - 3);
  const _lim = _limite.toISOString().slice(0, 10);
  _impFicha.eleccion = (_impFicha.medicamentos || []).map(function (m) {
    const reciente = !m.desde || m.desde >= _lim;
    return { puesto: reciente, viejo: !reciente,
             momento: m.statut === 'a_demanda' ? 'demanda' : '' };
  });
  _impPantalla();
}

function _impPantalla() {
  const F = _impFicha, meds = F.medicamentos || [];
  const viejo = document.getElementById('imp-ov'); if (viejo) viejo.remove();
  const ov = document.createElement('div');
  ov.id = 'imp-ov';
  ov.style.cssText = 'position:fixed;inset:0;z-index:97;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:14px';
  const listos = F.eleccion.filter(function (e) { return e.puesto && e.momento; }).length;
  ov.innerHTML = '<div class="dlg lista">' +
    '<div class="lista-tit">📥 ' + (F.paciente.nombre || '') + '</div>' +
    '<div style="font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:6px">' +
      t('imp_copia') + ' ' + (F.copia || {}).fecha + ' ' + ((F.copia || {}).hora || '').slice(0, 5) +
    '</div>' +
    '<div class="lista-cuerpo" style="gap:5px">' +
      (meds.length ? meds.map(function (m, k) {
        const e = F.eleccion[k];
        const primeroViejo = e.viejo && (k === 0 || !F.eleccion[k - 1].viejo);
        return (primeroViejo ? '<div class="imp-sep">' + t('imp_viejos') + '</div>' : '') +
          '<div class="imp-lin' + (e.puesto ? '' : ' imp-off') + '">' +
          '<button class="imp-chk" onclick="impMarcar(' + k + ')">' + (e.puesto ? '☑' : '☐') + '</button>' +
