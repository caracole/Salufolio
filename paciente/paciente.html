<header data-cabecera>

<main>
  <p class="sordo" data-idioma="sordo"></p>
  <!-- 🖨 à droite de « Completar la ficha » (P-H, 17/11/2026) -->
  <div class="fila-bot"><button class="btn pri" id="b-empezar" data-idioma="empezar"></button><button class="btn" id="b-imprimir" style="display:none" onclick="imprimeFicha()"></button></div>

<script>
const VERSION_PROGRAMA = SF_CONFIG.version;
const TABLA = 'paciente';

function t(clave, vars){
  var out;
  try{
    var T=(typeof SF_TEXTOS!=='undefined'&&SF_TEXTOS.textos)||{};
    var lg=(typeof MF!=='undefined'&&MF.idioma)?MF.idioma():'es';
    if(typeof MF!=='undefined'&&MF.clavePlural) clave = MF.clavePlural(T, lg, clave, vars);   /* « 1 página », « 2 páginas » (P-H, 16/11/2026) */
    out = (T[lg]&&T[lg][clave])||(T.es&&T.es[clave])||clave;
  }catch(e){ out = clave; }
  var v = vars||{};
  return String(out).replace(/\{(\w+)\}/g, function(m,k){ return (v[k]!==undefined) ? v[k] : m; });
}
function txt(x){ return SF_FORM.texto(x); }   /* un texto, o { es, fr, ca, en } */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

/* ══ LA CONVERSACIÓN Y LA TARJETA ══
   El programa no sabe qué se pregunta ni qué se muestra : lee la tabla
   (comun/formularios/paciente.js) — el flujo para la conversación, la
   « vista » para la tarjeta, los campos « bloqueado » para lo que no se
   corrige. Todo se escribe en el expediente abierto ; la tarjeta lo LEE
   de ahí, no de una copia. Doctrina de 1966. */
var FLUJO = SF_FORM_PACIENTE.flujo;
var VISTA = SF_FORM_PACIENTE.vista;
var CAMPOS = SF_FORM_PACIENTE.rubricas.identidad.campos;
var _DATOS = null;                 /* el expediente abierto */
var _LOCAL = { paciente:{} };      /* sin expediente (programa solo) : nada se guarda */
var _AUTO = false;                 /* la conversación arranca sola UNA vez, en un expediente recién creado */
var _EMP = false;                  /* ¿ya se ha hecho la conversación ? */
var _ABIERTAS = {};                /* listas desplegadas, para que sigan así al repintar */
var _ECO = ['sip','nhc','cip_sns','nacimiento','sexo'];

function D(){ return _DATOS || _LOCAL; }
function _sello(){
  var d = new Date(), z = function(x){ return String(x).padStart(2,'0'); };
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'_'+z(d.getHours())+'h'+z(d.getMinutes());
}
function _marca(){ return { src:'paciente', escrito:_sello() }; }
function _norm(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }

/* el registro de médicos : un DICCIONARIO {PR1:'nombre'} (la plantilla crea un array, que perdería sus claves
   al escribirse). Lee el array de antes sin pérdida. */
function _regPrescriptores(){
  var o = {}, d = D();
  [d.mt_prescripteurs, d.prescriptores].forEach(function(src){
    if(!src) return;
    if(Array.isArray(src)){ src.forEach(function(n, i){ if(typeof n === 'string' && n) o['PR' + (i + 1)] = n; }); }
    else if(typeof src === 'object'){ Object.keys(src).forEach(function(k){ o[k] = src[k]; }); }
  });
  return o;
}

/* ── escribir en el expediente ── */
function escribeReal(tipo, clave, valores){
  var d = D();
  if(tipo === 'raiz'){
    var P = d[clave] = (d[clave] && typeof d[clave] === 'object') ? d[clave] : {};
    Object.keys(valores).forEach(function(k){
      if(valores[k] === '' || valores[k] === undefined || valores[k] === null) delete P[k]; else P[k] = valores[k];
    });
    /* el eco : los programas leen estos campos en la raíz (mf.js los quita al escribir el .sf) */
    _ECO.forEach(function(k){ if(P[k]) d[k] = P[k]; else if(k in valores) delete d[k]; });
    if(P.nombre || P.apellidos) d.patient_name = [P.nombre, P.apellidos].filter(Boolean).join(' ');
  } else if(tipo === 'lista'){
    var l = d[clave] = Array.isArray(d[clave]) ? d[clave] : [];
    var x = Object.assign({}, valores, _marca());
    if(clave === 'centros'){
      var ya = l.filter(function(c){ return _norm(c.nombre) === _norm(valores.nombre); })[0];
      if(ya) return;                                   /* ya está : no se duplica */
      var max = 0; l.forEach(function(c){ var m = /^CT(\d+)$/.exec(c.id||''); if(m) max = Math.max(max, +m[1]); });
      x.id = 'CT' + (max + 1);
    }
    l.push(x);
  } else if(tipo === 'dicc'){
    var reg = _regPrescriptores(), n = _norm(valores.nombre);
    var hay = Object.keys(reg).filter(function(k){ return _norm(reg[k]) === n; })[0];
    if(!hay){
      var mx = 0; Object.keys(reg).forEach(function(k){ var m = /^PR(\d+)$/.exec(k); if(m) mx = Math.max(mx, +m[1]); });
      reg['PR' + (mx + 1)] = valores.nombre;
    }
    d[clave] = reg;
  }
  if(_DATOS) MF.tocado();                              /* el 💾 se enciende */
}

function guarda(destino, rubrica, valores){
  var d = String(destino || '').split(':');
  escribeReal(d[0], d[1], valores);
}

/* una pregunta de sí o no, en una ventana — leída en alto si la voz está activada */
function sino(texto, alResponder, textoYa){
  var q = textoYa ? texto : txt(texto);
  var pie = '<span style="flex:1"></span>'
          + '<button class="sf-ventana-btn sf-suave" id="_s-no">' + esc(t('no')) + '</button>'
          + '<button class="sf-ventana-btn" id="_s-si">' + esc(t('si')) + '</button>';
  var respondido = false;
  var v = MF.ventana('', '<div class="pregunta-cuerpo">' + esc(q) + '</div>', {
    ancho: '460px', alPie: pie,
    alCerrar: function(){ SF_FORM.habla(null); if(!respondido){ respondido = true; alResponder(null); } }
  });
  if(SF_FORM.voz()) SF_FORM.habla(q);
  function responde(x){ if(respondido) return; respondido = true; SF_FORM.habla(null); v.cierra(); alResponder(x); }
  v.caja.querySelector('#_s-si').onclick = function(){ responde(true); };
  v.caja.querySelector('#_s-no').onclick = function(){ responde(false); };
  v.caja.querySelector('#_s-si').focus();
}

function paso(i){
  if(i >= FLUJO.length) return fin(true);
  var P = FLUJO[i];
  var T = SF_FORM_PACIENTE.rubricas[P.rubrica];
  var escribe = P.escribe || (T && T.escribe);

  function abre(luego){
    var ini = {};
    if(escribe === 'raiz:paciente'){                /* lo que ya se sabe, propuesto */
      var d = D(), Pa = d.paciente || {};
      Object.keys(Pa).forEach(function(k){ if(Pa[k]) ini[k] = Pa[k]; });
      _ECO.forEach(function(k){ if(!ini[k] && d[k]) ini[k] = d[k]; });
    }
    SF_FORM.pide(P.tabla, P.rubrica, function(v){
      if(v === null) return luego(null);          /* cerrada sin guardar */
      guarda(escribe, P.rubrica, v);
      pintaResumen();
      luego(v);
    }, ini);
  }
  function repite(){
    abre(function(v){
      if(v === null || !P.otra) return paso(i + 1);
      sino(P.otra, function(x){ if(x) repite(); else paso(i + 1); });
    });
  }

  if(!P.si){                                      /* la identidad : sin preguntar si */
    if(P.intro) estado(txt(P.intro));
    return abre(function(v){ if(v === null) return fin(false); paso(i + 1); });
  }
  sino(P.si, function(x){
    if(x === null) return fin(false);             /* ✕ : se interrumpe todo */
    if(x) repite(); else paso(i + 1);
  });
}

function estado(m){ document.getElementById('estado').textContent = m || ''; }

function empezar(){
  _EMP = true;
  SF_FORM.modo('uno_a_uno');                      /* este programa es conversacional */
  estado('');
  paso(0);
}

function fin(ok){
  estado((ok ? t('fin_conv') : t('cancelado')) + (_DATOS ? ' ' + t('ya_guardado') : ''));
  pintaResumen();
  ponModo();
}

/* ¿un expediente recién creado ? sin sexo, sin nacimiento, sin listas, sin historia de cambios */
function esReciente(d){
  var P = d.paciente || {};
  if(P.sexo || P.nacimiento || d.sexo || d.nacimiento) return false;
  var vacio = ['antecedentes','diagnosticos','citas','vacunaciones','prescripciones','mesures','events','medicaments']
    .every(function(k){ return !(d[k] && d[k].length); });
  var h = (d.historial && d.historial.modificacion) || [];
  return vacio && !h.length;
}

/* ══ LA TARJETA ══ — lee el expediente, nunca una copia */

function _valorId(c){ var d = D(), P = d.paciente || {}; return P[c.id] || (_ECO.indexOf(c.id) >= 0 ? d[c.id] : '') || ''; }

function _items(v){                       /* las líneas de una lista de la vista : [{ref, obj}] */
  var e = String(v.escribe).split(':'), d = D();
  if(e[0] === 'dicc'){
    var reg = _regPrescriptores();
    return Object.keys(reg).map(function(k){ return { ref:k, obj:{ nombre:reg[k] } }; });
  }
  return (Array.isArray(d[e[1]]) ? d[e[1]] : []).map(function(o, i){ return { ref:i, obj:o }; });
}
function _linea(v, o){
  var partes = [];
  v.resumen.forEach(function(grupo){
    for(var i = 0; i < grupo.length; i++){
      var x = o[grupo[i]]; if(x !== undefined && x !== null && String(x) !== ''){ partes.push(String(x)); break; }
    }
  });
  return partes.join(' · ') || '—';
}

function _campoHTML(c){
  var val = _valorId(c), lbl = txt(c.etiqueta);
  if(c.bloqueado){
    return '<div class="fila"><span class="k">' + esc(lbl) + '</span><span class="v cerrado" data-ptip="' + esc(t('bloqueado')) + '">🔒 '
         + (val ? esc(val) : '—') + '</span></div>';
  }
  var ctl;
  if(c.tipo === 'lista'){
    ctl = '<select data-c="' + esc(c.id) + '"><option value=""></option>'
        + (c.valores || []).map(function(o){
            var vv = typeof o === 'object' ? o.valor : o, ee = typeof o === 'object' ? o.etiqueta : o;
            return '<option value="' + esc(vv) + '"' + (vv === val ? ' selected' : '') + '>' + esc(ee) + '</option>';
          }).join('') + '</select>';
  } else {
    ctl = '<input data-c="' + esc(c.id) + '" value="' + esc(val) + '" autocomplete="off"'
        + (c.ejemplo ? ' placeholder="' + esc(c.ejemplo) + '"' : '') + '>';
  }
  return '<div class="fila"><span class="k">' + esc(lbl) + '</span><span class="v">' + ctl + '</span></div>';
}

/* ══ LAS LISTAS EN TABLA (P-H, 16/11/2026) ══
   Dos columnas — la fecha y lo anotado — que se ordenan con un clic ; delante, de dónde viene la
   línea : 📄 un PDF (se abre, para comprobar), 📱 el Protocolo, ✍️ a mano. Centros y médicos no
   tienen fecha : la del ÚLTIMO documento donde aparecen, y cuántos documentos. Lo que enseña cada
   lista lo dice su « columnas », en la tabla (comun/formularios/paciente.js). */
var _ORDEN = {};                      /* { lista : { c:0|1, d:1|-1 } } */
var _IDX = null;                      /* los documentos del expediente, para centros y médicos */
var ICONO_PROV = { pdf:'📄', prot:'📱', mano:'✍️' };
function _sinAcento(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
/* los MOTS d'un nom, sans ordre, accents, virgules ni titres (P-H, 17/11/2026 : « HECTOR L. SALES SAFONT »
   et « SALES SAFONT, HECTOR L. » sont le même médecin) ; les titres viennent de paciente.js */
function _palabras(s){
  var T = (typeof SF_CONFIG !== 'undefined' && SF_CONFIG.titulos_medico) || [];
  return _sinAcento(s).replace(/[^a-z0-9]+/g, ' ').split(' ').filter(function(w){ return w.length > 1 && T.indexOf(w) < 0; });
}
function _primero(o, campos){
  for(var i = 0; i < (campos || []).length; i++){ var x = o[campos[i]]; if(x !== undefined && x !== null && String(x) !== '') return String(x); }
  return '';
}
/* una fecha : un texto, el primer elemento de una lista, o la fecha de un objeto (P-H, 16/11/2026) */
function _unaFecha(x){
  if(x && typeof x === 'object' && !Array.isArray(x)) x = x.fecha || x.date || x.inicio || x.desde || '';
  return (x === undefined || x === null) ? '' : String(x);
}
function _fechaDe(o, campos){
  for(var i = 0; i < (campos || []).length; i++){
    var x = o[campos[i]];
    if(Array.isArray(x)){ var L = x.map(_unaFecha).filter(Boolean); if(L.length) return { f: L[0], todas: L }; continue; }
    x = _unaFecha(x); if(x) return { f: x, todas: [x] };
  }
  return { f: '', todas: [] };
}
function _prov(o){
  if(o.pdf_id || o.pdf) return 'pdf';
  var s = String(o.src || o.fuente || o.origen || '');
  return (s === 'P' || /protocolo/i.test(s)) ? 'prot' : 'mano';
}
function _indiceDocs(){
  if(_IDX) return _IDX;
  var d = D(), L = [];
  ['mesures','events','medicaments','antecedentes','diagnosticos','citas','vacunaciones','prescripciones','escalas','bacteriologie'].forEach(function(k){
    (Array.isArray(d[k]) ? d[k] : []).forEach(function(x){
      if(!x || !(x.pdf_id || x.pdf)) return;
      var proc = '', crudo = '';
      try{ proc = MF.procedencia ? MF.procedencia(x) : ''; }catch(e){}
      try{ crudo = JSON.stringify(x); }catch(e){}
      var tx = _sinAcento(proc + ' ' + crudo);
      /* le médecin du document, par la table des professionnels : « Dr ARNAU » (P-H, 17/11/2026) */
      var R = d.referencias || {}, pr = ((R.procedencias || {})[x.prc_id] || {}).profesional || x.prescriptor_id, P = (R.profesionales || {})[pr];
      var proW = P ? [typeof P === 'string' ? P : (P.nombre || '')].concat((P && P.alias) || []).map(_palabras).filter(function(W){ return W.length; }) : [];
      L.push({ doc: x.pdf_id || x.pdf, fecha: String(x.date || x.fecha || x.desde || x.date_debut || '').slice(0, 10),
               texto: tx, pal: ' ' + tx.replace(/[^a-z0-9]+/g, ' ') + ' ', crudo: crudo, proW: proW });
    });
  });
  return (_IDX = L);
}
function _soloUno(v, w){   /* ce mot n'appartient qu'à un seul médecin de la liste */
  return _items(v).filter(function(it){ return _palabras(it.obj.nombre || '').indexOf(w) >= 0; }).length === 1;
}
function _docsDe(v, it){
  var nom = _sinAcento(it.obj.nombre || ''), clave = String(v.escribe).indexOf('dicc:') === 0 ? '"' + it.ref + '"' : null;
  /* le nom et ses autres écritures (alias laissés par « Fusionner des médecins ») : chacun par ses MOTS */
  var al = (clave && D().prescriptores_alias && D().prescriptores_alias[it.ref]) || [];
  var formas = [it.obj.nombre || ''].concat(al).map(_palabras);
  var docs = {}, ultimo = '', doc = null;
  _indiceDocs().forEach(function(x){
    var porMotos = formas.some(function(W){ return W.length >= 2 && W.every(function(w){ return x.pal.indexOf(' ' + w + ' ') >= 0; }); });
    /* le document ne donne qu'une partie du nom (« Dr ARNAU ») : tous SES mots sont dans le nom de la liste ;
       un seul mot ne suffit que s'il n'appartient à aucun autre médecin de la liste */
    var porDoc = x.proW.some(function(W){ return formas.some(function(F){ return W.every(function(w){ return F.indexOf(w) >= 0; })
      && (W.length >= 2 || _soloUno(v, W[0])); }); });
    if(!(porMotos || porDoc || (nom.length > 2 && x.texto.indexOf(nom) >= 0) || (clave && x.crudo.indexOf(clave) >= 0))) return;
    docs[x.doc] = 1; if(x.fecha >= ultimo){ ultimo = x.fecha; doc = x.doc; }
  });
  return { n: Object.keys(docs).length, ultimo: ultimo, doc: doc };
}
function _filas(v){
  var C = v.columnas || {};
  return _items(v).map(function(it){
    var f, n = null, p = _prov(it.obj), extra = [], ina = '', anot = false, fe;
    if(C.documentos){ var r = _docsDe(v, it); f = r.ultimo; n = r.n; if(r.doc) p = 'ult'; }   /* el último documento donde aparece */
    else {
      fe = _fechaDe(it.obj, C.fecha || ['fecha']); f = fe.f;
      if(fe.todas.length > 1) extra.push(t('fechas_todas', { f: fe.todas.join(' · ') }));
      if(!f && C.escrito && it.obj[C.escrito]){                     /* sin fecha clínica : la del día en que se anotó */
        f = String(it.obj[C.escrito]).slice(0, 10).replace(/_/g, ' '); anot = true; extra.push(t('anotado_el', { f: f }));
      }
    }
    if(C.inactivo && it.obj[C.inactivo]){ ina = _unaFecha(it.obj[C.inactivo]); extra.push(t('inact_desde', { f: ina })); }
    var x = _primero(it.obj, C.texto || ['nombre','texto']);
    if(!x && C.dicc){                                              /* el nombre, en un diccionario del expediente */
      var cod = it.obj[C.dicc.campo], dd = D()[C.dicc.tabla] || {};
      x = (cod !== undefined && cod !== null && dd[cod]) ? String(dd[cod]) : (cod !== undefined && cod !== null ? String(cod) : '');
    }
    var tip = (C.tip || []).map(function(c){ return _primero(it.obj, [c]); }).filter(Boolean).concat(extra).join(' · ');
    return { it: it, f: f, x: x || _linea(v, it.obj), n: n, tip: tip, p: p, ina: !!ina, anot: anot };
  });
}
function _tablaLista(v){
  var C = v.columnas || {}, O = _ORDEN[v.id] || { c:0, d:-1 }, F = _filas(v), L = esc(v.id);
  F.sort(function(a, b){
    var x = O.c === 0 ? a.f : _sinAcento(a.x), y = O.c === 0 ? b.f : _sinAcento(b.x);
    if(!x && y) return 1; if(x && !y) return -1;               /* lo que no tiene fecha, al final */
    return (x < y ? -1 : x > y ? 1 : 0) * O.d;
  });
  var fl = function(c){ return O.c === c ? (O.d > 0 ? ' ▲' : ' ▼') : ''; }, ot = esc(t('orden_tip'));
  var h = '<table class="tl"><thead><tr><th class="pv"></th>'
    + '<th data-o="0" data-l="' + L + '" data-ptip="' + ot + '">' + esc(t(C.documentos ? 'col_ultimo' : 'col_fecha')) + fl(0) + '</th>'
    + '<th data-o="1" data-l="' + L + '" data-ptip="' + ot + '">' + esc(txt(C.titulo || v.titulo)) + fl(1) + '</th><th class="ac"></th></tr></thead><tbody>';
  F.forEach(function(r){
    var R = esc(r.it.ref);
    var pv = (r.p === 'pdf' || r.p === 'ult')
      ? '<button class="ib" data-a="pdf" data-l="' + L + '" data-r="' + R + '" data-ptip="' + esc(t(r.p === 'ult' ? 'src_ult' : 'src_pdf')) + '">' + ICONO_PROV.pdf + '</button>'
      : '<span data-ptip="' + esc(t(r.p === 'prot' ? 'src_prot' : 'src_mano')) + '">' + ICONO_PROV[r.p] + '</span>';
    h += '<tr' + (r.ina ? ' class="inact"' : '') + (r.tip ? ' data-ptip="' + esc(r.tip) + '"' : '') + '><td class="pv">' + pv + '</td>'
       + '<td class="f' + (r.anot ? ' esc' : '') + '">' + esc(r.f || '—') + '</td>'
       + '<td>' + esc(r.x) + (r.n !== null ? ' <span class="nd">· ' + esc(t('docs', { n: r.n })) + '</span>' : '') + '</td>'
       + '<td class="ac"><button class="ib" data-a="ed" data-l="' + L + '" data-r="' + R + '" data-ptip="' + esc(t('editar')) + '">✏️</button>'
       + '<button class="ib" data-a="del" data-l="' + L + '" data-r="' + R + '" data-ptip="' + esc(t('suprimir')) + '">🗑</button></td></tr>';
  });
  return h + '</tbody></table>';
}
/* el PDF de una línea, en la página : la Casa lo da (MF.pdfRespuesta), nada sale de la carpeta del paciente */
function abrePdf(o){
  var id = o.pdf_id || o.pdf; if(!id) return;
  var nom = (MF.nombrePdf ? MF.nombrePdf(id) : String(id)).replace(/\.pdf$/i, '') + '.pdf';
  estado('📄 ' + nom + ' …');
  MF.pdfRespuesta(id).then(function(r){
    if(!r.ok){ estado('📄 ' + nom + ' — ' + (MF.motivoPdf ? MF.motivoPdf(r.headers.get('X-Sf-Motivo')) : '')); return; }
    return r.blob().then(function(b){
      estado('');
      var u = URL.createObjectURL(new Blob([b], { type:'application/pdf' }));
      var w = document.getElementById('pdf-capa'); if(w) w.remove();
      w = document.createElement('div'); w.id = 'pdf-capa';
      w.innerHTML = '<div class="pdf-cab"><span>📄 ' + esc(nom) + '</span><button class="ib" id="pdf-cierra">✕ '
        + esc(MF.palabra ? MF.palabra('cerrar') : '') + '</button></div><embed src="' + u + '" type="application/pdf">';
      document.body.appendChild(w);
      document.getElementById('pdf-cierra').onclick = function(){ w.remove(); URL.revokeObjectURL(u); };
    });
  }).catch(function(e){ estado('📄 ' + nom + ' — ' + e.message); });
}

function imprimeFicha(){
  var pa = {}; try{ pa = MF.paciente() || {}; }catch(e){}
  MF.imprimeHoja(document.getElementById('resumen'), { titulo:'🧑 ' + t('ficha_tit') + (pa.etiqueta ? ' — ' + pa.etiqueta : '') });
}
function pintaResumen(){
  var z = document.getElementById('resumen');
  var h = _DATOS ? '<p class="nota no-imprimir" style="color:var(--accent);border-color:var(--accent)">' + esc(t('pulsa_guardar')) + '</p>'
                 : '<p class="nota no-imprimir">' + esc(t('sin_expediente')) + '</p>';
  /* imprimir la ficha (P-H, 17/11/2026) */
  ponImprimir();
  h += '<div class="vignette"><h2>🧑 ' + esc(t('identidad_tit')) + '</h2>' + CAMPOS.map(_campoHTML).join('') + '</div>';
  h += '<div class="vignette"><h2>📋 ' + esc(t('listas_tit')) + '</h2>';
  _IDX = null;
  VISTA.forEach(function(v){
    var its = _items(v);
    h += '<details class="lista" data-l="' + esc(v.id) + '"' + (_ABIERTAS[v.id] ? ' open' : '') + '><summary>'
       + '<span>' + v.icono + ' ' + esc(txt(v.titulo)) + '</span>'
       + '<span class="cuenta">' + (its.length ? esc(t('cuenta', { n:its.length })) : esc(t('lista_vacia'))) + '</span>'
       + '<button class="ib" data-a="add" data-l="' + esc(v.id) + '" data-ptip="' + esc(t('anyadir')) + '">➕</button></summary>';
    if(its.length) h += _tablaLista(v);
    h += '</details>';
  });
  h += '</div>';
  z.innerHTML = h;
}

/* ── corregir un campo de identidad ── */
function cambiaCampo(el){
  var c = CAMPOS.filter(function(x){ return x.id === el.getAttribute('data-c'); })[0];
  if(!c || c.bloqueado) return;                                   /* defensa : los bloqueados no se tocan */
  var val = String(el.value || '').trim();
  var r = SF_FORM.comprueba(c, val);
  if(r && (r.grave || c.tipo === 'fecha' || c.patron)){            /* un formato roto no se guarda */
    el.classList.add('malo'); el.setAttribute('data-ptip', r.texto || t('ficha_mala')); return;
  }
  el.classList.remove('malo'); el.removeAttribute('data-ptip');
  if(val === _valorId(c)) return;
  var o = {}; o[c.id] = val;
  escribeReal('raiz', 'paciente', o);
  estado('');
}

/* ── ¿algo apunta a esta entrada ? (un médico en una receta, un centro en una cita…) ── */
function _enUso(v, ref, obj){
  var e = String(v.escribe).split(':'), d = D(), clave = e[0] === 'dicc' ? ref : obj.id;
  if(!clave) return false;
  var aguja = '"' + clave + '"';
  return Object.keys(d).some(function(k){
    if(k === e[1] || k === 'mt_prescripteurs') return false;
    try{ return JSON.stringify(d[k]).indexOf(aguja) >= 0; }catch(x){ return false; }
  });
}

function accion(a, lid, ref){
  var v = VISTA.filter(function(x){ return x.id === lid; })[0]; if(!v) return;
  var e = String(v.escribe).split(':'), d = D();
  _ABIERTAS[lid] = true;
  if(a === 'add'){
    SF_FORM.modo('uno_a_uno');
    SF_FORM.pide(v.tabla, v.rubrica, function(x){ if(x === null) return; guarda(v.escribe, v.rubrica, x); pintaResumen(); });
    return;
  }
  var its = _items(v), it = its.filter(function(x){ return String(x.ref) === String(ref); })[0]; if(!it) return;
  if(a === 'pdf'){ abrePdf((v.columnas || {}).documentos ? { pdf_id: _docsDe(v, it).doc } : it.obj); return; }
  if(a === 'ed'){
    SF_FORM.modo('uno_a_uno');
    SF_FORM.pide(v.tabla, v.rubrica, function(x){
      if(x === null) return;
      if(e[0] === 'dicc'){
        var reg = _regPrescriptores(); reg[it.ref] = x.nombre; d[e[1]] = reg;
      } else {
        Object.keys(x).forEach(function(k){ if(x[k] === '' || x[k] === undefined) delete it.obj[k]; else it.obj[k] = x[k]; });
        it.obj.corregido = _sello();
      }
      if(_DATOS) MF.tocado();
      pintaResumen();
    }, Object.assign({}, it.obj));
    return;
  }
  if(a === 'del'){
    var que = _linea(v, it.obj);
    if(_enUso(v, it.ref, it.obj)){ estado(t('en_uso', { que:que })); return; }
    sino(t('confirma_sup', { que:que }), function(ok){
      if(!ok) return;
      if(e[0] === 'dicc'){
        var reg = _regPrescriptores(); delete reg[it.ref]; d[e[1]] = reg;
        if(Array.isArray(d.mt_prescripteurs)){ var m = /^PR(\d+)$/.exec(it.ref); if(m) d.mt_prescripteurs[+m[1] - 1] = ''; }
      } else {
        d[e[1]].splice(+it.ref, 1);
      }
      if(_DATOS) MF.tocado();
      estado('');
      pintaResumen();
    }, true);
  }
}

var _zona = document.getElementById('resumen');
_zona.addEventListener('change', function(ev){ if(ev.target.getAttribute && ev.target.getAttribute('data-c')) cambiaCampo(ev.target); });
_zona.addEventListener('click', function(ev){
  var o = ev.target.closest && ev.target.closest('th[data-o]');
  if(o){                                    /* ordenar : la misma columna invierte ; otra columna empieza en su sentido */
    var l = o.getAttribute('data-l'), c = +o.getAttribute('data-o'), A = _ORDEN[l] || { c:0, d:-1 };
    _ORDEN[l] = A.c === c ? { c:c, d:-A.d } : { c:c, d:(c === 0 ? -1 : 1) };
    _ABIERTAS[l] = true; pintaResumen(); return;
  }
  var b = ev.target.closest && ev.target.closest('[data-a]');
  if(b){ ev.preventDefault(); ev.stopPropagation(); accion(b.getAttribute('data-a'), b.getAttribute('data-l'), b.getAttribute('data-r')); }
});
_zona.addEventListener('toggle', function(ev){
  var l = ev.target.getAttribute && ev.target.getAttribute('data-l'); if(l) _ABIERTAS[l] = ev.target.open;
}, true);

document.getElementById('b-empezar').onclick = empezar;

function ponImprimir(){
  var b = document.getElementById('b-imprimir'); if(!b) return;
  b.textContent = '🖨 ' + t('ficha_imp'); b.setAttribute('data-ptip', t('ficha_imp_tip'));
  b.style.display = _DATOS ? '' : 'none';
}
function ponModo(){
  ponImprimir();
  document.getElementById('b-empezar').textContent = t(_EMP ? 'reiniciar' : (_DATOS ? 'completar' : 'empezar'));
}

MF.arranca({
  alCargar: function(d){
    _DATOS = d;
    MF.ponVersion(); if(MF.ptips) MF.ptips(); if(MF.aplicaIdioma) MF.aplicaIdioma();
    ponModo(); pintaResumen();
    /* un expediente recién creado : la conversación arranca sola, una vez */
    if(!_AUTO && esReciente(d)){ _AUTO = true; setTimeout(empezar, 250); }
  },
  alFallar: function(){ MF.ponVersion(); if(MF.ptips) MF.ptips(); if(MF.aplicaIdioma) MF.aplicaIdioma(); ponModo(); pintaResumen(); },
  alIdioma: function(){ if(MF.aplicaIdioma) MF.aplicaIdioma(); ponModo(); pintaResumen(); }
});
