<title>Salufolio Protocolo</title>
<style>
:root{
  --bg:#0f1420; --surface:#1a2130; --surface2:#232c40; --border:#2a3348;
  --text:#e8ecf4; --muted:#8b94a8; --ok:#3fb950; --accent:#4f8ff7;
  --warn:#d99922; --bad:#f85149; --radius:14px;
}
html[data-theme="light"]{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#e6eaf2; --border:#c8d1e0;
  --text:#1b2330; --muted:#5b6577;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px}
body{padding-top:128px;padding-bottom:84px;min-height:100vh}
.mono{font-family:'IBM Plex Mono',Menlo,monospace}

/* ── en-tête ── */
header{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--bg);
  border-bottom:1px solid var(--border);padding:8px 14px 8px}
.ctrls{display:flex;gap:7px;justify-content:flex-end;margin-bottom:4px}
.hbtn{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  min-width:40px;height:40px;font-size:17px;cursor:pointer;color:var(--text);padding:0 8px;font-weight:700}
/* ── dialogues maison (adieu prompt/confirm agressifs) ── */
.dlg-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.dlg{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:20px;width:100%;max-width:400px;box-shadow:0 14px 44px rgba(0,0,0,.5)}
.dlg h3{margin:0 0 14px;font-size:18px}
.dlg label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.dlg input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-size:20px;padding:12px}
.dlg .dbtns{display:flex;gap:10px;margin-top:18px}
.dlg .dbtns button{flex:1;border-radius:12px;font-size:17px;font-weight:700;padding:14px;cursor:pointer}
.dlg .dok{background:var(--accent);border:none;color:#fff}
.dlg .dcan{background:none;border:2px solid var(--border);color:var(--muted)}
.aviso{background:rgba(217,153,34,.13);border:1.5px solid var(--warn);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:14px;font-size:15px}
.aviso .abtns{display:flex;gap:8px;margin-top:8px}
.aviso button{flex:1;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:14px;padding:10px;cursor:pointer}
.aviso button.si{border-color:var(--ok);color:var(--ok);font-weight:700}
.aviso button.no{border-color:var(--bad);color:var(--bad);font-weight:700}
.fin{opacity:.55}
.punt{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--border);
  border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;font-size:15px}
header .fecha{font-size:26px;font-weight:700;text-transform:capitalize}
header .sub{font-size:13px;color:var(--muted);margin-top:2px}
header .lema{font-size:11px;color:var(--muted);font-style:italic;margin-top:6px;opacity:.8}

/* ── navigation basse (pouce) ── */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);
  border-top:1px solid var(--border);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;
  padding:10px 0 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ico{font-size:27px}
nav button.act{color:var(--accent)}
nav button.act .ico{transform:scale(1.12)}

main{padding:14px 14px 20px}
.panel{display:none}.panel.act{display:block}
h2{font-size:16px;letter-spacing:.5px;color:var(--muted);font-weight:700;
  text-transform:uppercase;margin:18px 0 10px}

/* ── LA SIGNATURE : pastilles de prises ── */
.toma{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;cursor:pointer;color:var(--text);font-size:18px;
  transition:border-color .15s,background .15s}
.toma .pastilla{width:46px;height:46px;border-radius:50%;border:3px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  transition:all .15s}
.toma .info{flex:1;min-width:0}
.toma .nombre{font-weight:700}
.toma .detalle{font-size:13px;color:var(--muted);margin-top:2px}
.toma .hora{font-size:15px;color:var(--muted);white-space:nowrap}
.toma.hecha{border-color:var(--ok);background:rgba(63,185,80,.08)}
.toma.hecha .pastilla{border-color:var(--ok);background:var(--ok);color:#fff}
.toma.hecha .hora{color:var(--ok);font-weight:700}

/* ── constantes : gros pavés numériques ── */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.cbox label{display:block;font-size:16px;color:var(--text);font-weight:600;margin-bottom:6px}
.cbox input{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:26px;padding:10px;text-align:center;font-weight:700}
.cbox input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.cbox .unit{font-size:14px;color:var(--muted);text-align:center;margin-top:4px}

/* ── observations : jetons tactiles ── */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--surface);border:2px solid var(--border);border-radius:24px;
  color:var(--text);font-size:16px;padding:12px 18px;cursor:pointer}
.chip.sel{border-color:var(--warn);background:rgba(217,153,34,.14);font-weight:700}
/* Choix en cours dans la fenêtre : même feu que la chip. On le retouche
   pour l'éteindre — c'est l'annulation, sans bouton supplémentaire. */
.btn.sec.op-on{border-color:var(--warn);background:rgba(217,153,34,.18);font-weight:700}
textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:17px;padding:12px;min-height:80px;margin-top:12px}

/* ── boutons génériques ── */
.btn{display:block;width:100%;background:var(--accent);border:none;border-radius:var(--radius);
  color:#fff;font-size:19px;font-weight:700;padding:16px;margin-top:14px;cursor:pointer}
.btn.sec{background:var(--surface);border:2px solid var(--border);color:var(--text);font-weight:600}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}

/* ── historial ── */
.dia{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px}
.dia .df{font-weight:700;margin-bottom:6px;text-transform:capitalize}
.dia .linea{font-size:14px;color:var(--muted);padding:3px 0;border-top:1px dashed var(--border)}
.dia .linea b{color:var(--text)}
.vacio{color:var(--muted);text-align:center;padding:40px 10px;font-size:15px}

/* ── liste médicaments (Datos) ── */
.medrow{display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.medrow .mi{flex:1}.medrow .mn{font-weight:700}.medrow .md{font-size:13px;color:var(--muted)}
.medrow button{background:none;border:none;color:var(--bad);font-size:20px;cursor:pointer;padding:6px}
input.txt,select.txt{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:17px;padding:12px;margin-bottom:8px}
.pie{font-size:10px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ok);
  color:#fff;font-weight:700;padding:12px 22px;border-radius:24px;z-index:99;
  box-shadow:0 6px 20px rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.reloj{display:inline-block;animation:gira 1.4s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
/* v23.4 — listes déroulantes lisibles (P-H : « texte blanc/blanc ») :
   color-scheme aligne les widgets natifs (options, calendriers, pickers)
   sur le thème actif, et les options héritent des couleurs de la maison. */
html[data-theme=dark]{color-scheme:dark}
html[data-theme=light]{color-scheme:light}
select option{background:var(--surface);color:var(--text)}
.ropt input{position:absolute;opacity:0;pointer-events:none}
.ropt span{display:inline-block;padding:6px 12px;border:1px solid var(--border);border-radius:14px;font-size:13px;cursor:pointer;color:var(--muted)}
.ropt input:checked+span{background:rgba(232,161,60,.22);border-color:#e8a13c;color:var(--text);font-weight:700}
.popt{background:none;padding:6px 12px;border:1px solid var(--border);border-radius:14px;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit}
.popt.flash{background:rgba(232,161,60,.22);border-color:#e8a13c;color:var(--text);font-weight:700}
/* Bouton allumé : quelque chose a été bu. Gris, personne n'a bu. */
.popt.on{background:rgba(232,161,60,.22);border-color:#e8a13c;color:var(--text);font-weight:700}
.dlg{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:420px}
/* Fenêtre à liste : elle ne dépasse jamais l'écran. La question reste en
   haut, le bouton reste en bas, et c'est la liste qui défile. */
.dlg.lista{padding:14px 14px 12px;display:flex;flex-direction:column}
.dlg.lista .lista-cuerpo{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.dlg.lista .lista-cuerpo .btn{margin-top:0;padding:11px 12px;font-size:17px}
.dlg.lista > .btn{margin-top:10px;padding:13px;font-size:18px}
.dlg.lista .lista-tit{font-size:16px;font-weight:700;margin-bottom:8px;text-align:center}
.dlg.lista .lista-pie{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
.trio-tot{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;text-align:right}
.matrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0}
.matrow>b{min-width:0}
.matrow.mat-on{border-color:#3dbf7f;background:rgba(61,191,127,.10)}
.matctrl{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px;row-gap:8px}
.matnum{font-size:22px;min-width:34px;text-align:center}
.matud{font-size:12px;color:var(--muted)}
.matinput{width:74px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:20px;font-weight:700;padding:8px;text-align:center}
.stepper{width:44px;height:44px;font-size:20px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer}
.btn-sw{background:none;border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:14px;font-weight:700;padding:9px 16px;cursor:pointer;white-space:nowrap}
.btn-sw.on{border-color:#3dbf7f;background:rgba(61,191,127,.18)}
/* ═══ BASCULEUR (P-H 28/07) — la réplique de l'interrupteur de l'appareil.
   Deux faces qui pivotent autour de l'arête centrale : celle qu'on enfonce
   part en arrière, l'autre ressort. Aucun mot : O et I se lisent dans les
   quatre langues. La face enfoncée s'allume quand la machine tourne. ═══ */
.matrow.u112-on{border-color:#d5241a;background:rgba(213,36,26,.09)}
/* état 1 — la personne est sortie : ce n'est plus l'urgence, c'est
   l'attente du retour. La couleur le dit sans un mot. */
.matrow.u112-fuera{border-color:var(--warn);background:rgba(217,153,34,.12)}
.pac-fila{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:2px}
.pac-sel{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;
  font-size:17px;font-weight:800;padding:6px 10px;max-width:62vw;font-family:inherit}
.pac-btn{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;
  font-size:16px;padding:6px 10px;cursor:pointer;line-height:1}
.pac-vacio{font-size:15px;color:var(--muted);font-style:italic}
/* Le témoin des mesures du jour. Une case vide et une valeur perdue se
   ressemblent trop : celui-ci montre que la journée a déjà ses mesures,
   pendant que le formulaire reste neuf pour la suivante. */
.const-hoy{margin-top:8px}
.const-hoy .ch-tit{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.const-hoy .ch-lin{font-size:14px;padding:5px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:5px}
.const-hoy .ch-lin b{font-variant-numeric:tabular-nums}
.rocker{position:relative;width:50px;height:52px;flex:none;padding:4px;border:0;
  border-radius:9px;background:linear-gradient(#4a5057,#23272d);cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),0 2px 5px rgba(0,0,0,.35);
  -webkit-tap-highlight-color:transparent;perspective:120px}
.rocker .fa{position:absolute;left:4px;right:4px;height:21px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font:700 12px/1 system-ui,sans-serif;letter-spacing:.5px;color:#c8cdd4;
  background:linear-gradient(#e9edf2,#b9c0c9);text-shadow:none;
  transition:transform .14s ease,filter .14s ease,background .14s ease,box-shadow .14s ease}

/* ═══ PLUSIEURS PATIENTS SOUS UN SEUL TOIT (P-H 28/07) ═══
   Ce qui suit appartient au PATIENT : chacun a son casier, préfixé par son
   identifiant. Le reste — langue, zoom, thème, adresse du PC, commentaires —
   demeure au cuidador et reste commun. Une table, pas des conditions
   éparpillées : lsGet et lsSet sont les deux seules portes du stockage, et
   c'est là, en un seul endroit, que le préfixe se pose. */
const CLAVES_PACIENTE = ['mfp_patient','mfp_sip','mfp_meds','mfp_tomas','mfp_puntuales',
  'mfp_obs','mfp_constantes','mfp_material','mfp_material_cfg','mfp_asist',

/* Le patient actif appartient à L'ONGLET, pas au navigateur. Sans cela,
   deux onglets ouverts se marchent dessus : celui qui croit soigner Mamá
   écrit chez Papá dès que l'autre a changé de patient — vérifié, et c'est
   une faute clinique. sessionStorage est justement cloisonné par onglet et
   survit au rechargement ; localStorage ne garde que le DERNIER choix, pour
   qu'un onglet neuf s'ouvre là où l'on s'est arrêté. */
let _activoSesion = null;
function getActivo() {
  if (_activoSesion) return _activoSesion;
  let v = null;
  try { v = JSON.parse(sessionStorage.getItem('mfp_activo')); } catch (e) {}
  if (!v) { try { v = JSON.parse(localStorage.getItem('mfp_activo')); } catch (e) {} }
  _activoSesion = v || null;
  return _activoSesion;
}
function setActivo(id) {
  _activoSesion = id;
  try { sessionStorage.setItem('mfp_activo', JSON.stringify(id)); } catch (e) {}
  localStorage.setItem('mfp_activo', JSON.stringify(id));
}
function olvidarActivo() {
  _activoSesion = null;
  try { sessionStorage.removeItem('mfp_activo'); } catch (e) {}
  localStorage.removeItem('mfp_activo');
}
function _k(k) {
  const a = getActivo();
  return (a && CLAVES_PACIENTE.indexOf(k) >= 0) ? ('mfp_' + a + '_' + k.slice(4)) : k;
}
function lsGet(k, def) { try { const v = JSON.parse(localStorage.getItem(_k(k))); return v === null || v === undefined ? def : v; } catch { return def; } }
function lsSet(k, v) { localStorage.setItem(_k(k), JSON.stringify(v)); }

/* Un identifiant lisible, tiré du nom, et unique dans la maison. */
function _idPaciente(nom) {
  const base = (nom || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '').slice(0, 10) || 'pac';
  const usados = getPacientes().map(p => p.id);
  let id = base, i = 2;
  while (usados.indexOf(id) >= 0) { id = base + i; i++; }
  return id;
}
/* Migration douce : un dossier d'avant la liste devient le patient n° 1,
   et ses affaires passent dans son casier. Rien n'est perdu, rien à
   ressaisir. Ne s'exécute qu'une fois. */
function migrarPacientes() {
  if (localStorage.getItem('mfp_pacientes')) return;
  let nom = null, sip = '';
  try { nom = JSON.parse(localStorage.getItem('mfp_patient')); } catch {}
  try { sip = JSON.parse(localStorage.getItem('mfp_sip')) || ''; } catch {}
  if (!nom) { setPacientes([]); return; }
  const id = _idPaciente(nom);
  CLAVES_PACIENTE.forEach(k => {
    const v = localStorage.getItem(k);
    if (v !== null) { localStorage.setItem('mfp_' + id + '_' + k.slice(4), v); localStorage.removeItem(k); }
  });
  setPacientes([{ id: id, nombre: nom, sip: sip }]); setActivo(id);
}
migrarPacientes();
function hoyKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

/* ── CORRIGER UN JOUR PASSÉ (P-H 16/07 : « je n'ai pas pu corriger en cas
   d'erreur ») — le jour ACTIF est aujourd'hui par défaut ; on peut reculer
   jusqu'à 7 jours pour réparer un oubli ou une erreur de doigt. Les avisos,
   eux, restent toujours sur aujourd'hui. ── */
let _diaActivo = null;
function diaKey() { return _diaActivo || hoyKey(); }
function esHoy() { return diaKey() === hoyKey(); }
function diaMas(n) {
  const d = new Date(diaKey() + 'T12:00:00');
  d.setDate(d.getDate() + n);
  const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const hoy = hoyKey();
  if (k > hoy) return;                                   /* pas de futur */
  const limite = new Date(); limite.setDate(limite.getDate() - 60);
  if (new Date(k + 'T12:00:00') < limite) return;        /* 7 jours en arrière */
  _diaActivo = (k === hoy) ? null : k;
  renderTomas(); renderPuntuales(); renderMaterial && renderMaterial();
}

/* ── MATERIAL / DISPOSITIVOS (P-H 15/07) : l'oxygène et les Incopack ne sont

const MATERIAL_DEF = [

];
function getMaterialCfg() {
  const cfg = lsGet('mfp_material_cfg', MATERIAL_DEF);

     devient interruptor, pour que le switch apparaisse sans vider les données. */

  lsSet('mfp_material', m); renderMaterial();

}

}

/* ═══ v2026.7.24.11 — INTERRUPTEUR (P-H : « la réplique de la réalité ») :

    '</span></div>';

/* v24.14 (P-H) : réglage litres — défaut 2, modifiable pendant ou après la marche,

function matLitros(id) {

  const m = getMaterial(); m._litros = m._litros || {}; m._litros[id] = lpm;
  /* si une session est en cours, on grave le changement horodaté */
  const dia = diaKey(); const arr = ((m._uso || {})[id] || {})[dia] || [];
  if (arr.length && !arr[arr.length - 1].fin) {

function _fmtDur(m) { if (m < 0) m += 1440; const h = Math.floor(m/60), mm = m%60; return (h ? h + ' h ' : '') + (mm ? mm + ' min' : (h ? '' : '0 min')); }

  else { const l = matLitros(id); arr.push({ inicio: ahora(), litros: [{ hora: ahora(), lpm: l }] }); toast('▶ ' + ahora() + ' · ' + l + ' L/min'); }
  lsSet('mfp_material', m); renderMaterial();

/* ── AVISOS SONOROS (P-H 15/07) : carillon + vibration à l'heure du momento,
   SEULEMENT si des prises y restent en attente ; répété toutes les 10 min,
   3 fois max par momento et par jour. Limite assumée : l'app doit être
   ouverte — le réveil du téléphone reste le filet de sécurité. ── */
const HORAS_DEF = { desayuno: '08:30', comida: '14:00', cena: '21:00', noche: '23:00' };
function getAvisosOn() { return lsGet('mfp_avisos', false); }
function toggleAvisos() {
  lsSet('mfp_avisos', !getAvisosOn());
  if (getAvisosOn()) { desbloquearAudio(); beep(); }
  render(); renderDatos();
}
function getHoras() { return Object.assign({}, HORAS_DEF, lsGet('mfp_horas', {})); }
function setHora(mom, v) {
  const hs = getHoras(); if (horaValide(v)) { hs[mom] = horaValide(v); lsSet('mfp_horas', hs); }
}
let _audioCtx = null;
function desbloquearAudio() {

}

      o.connect(g); g.connect(_audioCtx.destination);
      o.frequency.value = nota[0]; o.type = 'sine';
      const t0 = _audioCtx.currentTime + nota[1];
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.20);
      o.start(t0); o.stop(t0 + 0.22);

  } catch (e) {}

}
function pendientesMomento(mom) {
  const tomas = getTomas()[hoyKey()] || {};
  return getMeds().filter(function(m) {
    return m.momento === mom && medActivo(m, hoyKey()) && !tomas[m.id];
  });
}
function checkAvisos(ahoraHM) {
  if (!getAvisosOn()) return null;
  const hs = getHoras(); const hoy = hoyKey();
  const beeps = lsGet('mfp_beeps', {}); const bj = beeps[hoy] = beeps[hoy] || {};
  const min = s => parseInt(s.slice(0,2)) * 60 + parseInt(s.slice(3));
  for (const mom of Object.keys(hs)) {
    if (ahoraHM < hs[mom]) continue;
    /* fenêtre de 2 h : passé ce délai, silence — l'oubli devient l'affaire
       du bandeau ⚠ du lendemain, pas d'une sonnerie à contretemps */
    if (min(ahoraHM) - min(hs[mom]) > 120) continue;
    const pend = pendientesMomento(mom);
    if (!pend.length) continue;
    const reg = bj[mom] || { n: 0, ult: '00:00' };
    if (reg.n >= 3) continue;
    const dif = min(ahoraHM) - min(reg.ult);
    if (reg.n > 0 && dif < 10) continue;
    bj[mom] = { n: reg.n + 1, ult: ahoraHM };
    lsSet('mfp_beeps', beeps);
    return { mom: mom, meds: pend.map(function(m) { return m.nombre; }) };
  }
  return null;
}

async function enviarSalufolio() {
  /* ═══ ESSAI SATÉLITE (P-H) — « on envoie et point final » : fetch no-cors,
     on N'ATTEND PAS de réponse (comme un formulaire) → autorisé même en local
     file://. La confirmation se fait côté serveur (protocolo-entrada). ═══ */
  const base = baseSalufolio();
  if (!base) { toast(t('env_err') + ' — dirección?'); return; }

  try {
    await fetch(base + '/api/protocolo', {
      method: 'POST',
      mode: 'no-cors',                       /* le satellite part sans réponse à lire */
      headers: { 'Content-Type': 'text/plain' },  /* text/plain = pas de preflight */
      body: JSON.stringify(payloadExport())
    });
    /* no-cors : on ne peut PAS lire r.ok ni r.json — on suppose parti */
    toast('🛰️ ' + t('env_ok'));
    if (st) st.innerHTML = '🛰️ Enviado al ordenador. Compruébelo en Salufolio (carpeta protocolo-entrada).';

  }

}

/* ═══ v23.12 — DOCTRINE P-H : « l'utilisateur ne doit pas se préoccuper,
   c'est le programme qui s'en charge » — MORT AUX GUARDAR.
   Modèle : une FICHE-BROUILLON par visite de l'onglet ; chaque champ
   modifié est gravé aussitôt (upsert) ; quitter l'onglet clôt la fiche
   (champs nettoyés) ; revenir = nouvelle fiche. Témoin « ✓ guardado ». ═══ */
let _cDraft = null;
function upsertConst() {
  const v = id => { const x = document.getElementById(id).value; return x === '' ? null : parseFloat(x); };
  const hEl = document.getElementById('c-hora');
  const vals = { ta_sis: v('c-tas'), ta_dia: v('c-tad'), fc: v('c-fc'), spo2: v('c-spo2'), peso: v('c-peso'), temp: v('c-temp') };
  const cs = getConstantes();
  if (Object.values(vals).every(x => x === null)) {
    if (_cDraft !== null && cs[_cDraft]) { cs.splice(_cDraft, 1); lsSet('mfp_constantes', cs); }
    _cDraft = null; estadoConst(''); return;
  }
  const horaPrev = (_cDraft !== null && cs[_cDraft]) ? cs[_cDraft].hora : null;
  const rec = Object.assign({ fecha: diaKey(), hora: (hEl && horaValide(hEl.value)) || horaPrev || ahora() }, vals);
  if (_cDraft === null || !cs[_cDraft]) { cs.push(rec); _cDraft = cs.length - 1; }
  else cs[_cDraft] = rec;
  lsSet('mfp_constantes', cs); estadoConst('✓ guardado · ' + rec.hora);
}

function _resumenConst(c) {

function pintaConstHoy() {

/* ═══ UNE SEULE ÉCOUTE POUR TOUTE LA MAISON (forme proposée par P-H,
   29/07) ═══ Plutôt que de brancher un écouteur sur chaque champ — qu'on
   oubliera le jour où l'on en ajoutera un —, une seule écoute déléguée sur
   le document, et une TABLE qui dit ce que chaque champ doit faire.
   Ajouter un champ demain, c'est ajouter une ligne.

   « input » et non « change » : « change » n'arrive qu'à la sortie du
   champ, donc rien n'est écrit tant que le doigt y est. Les deux sont
   écoutés — « change » rattrape les listes déroulantes et les sélecteurs
   de date sur les navigateurs qui n'émettent pas « input ». Les fonctions
   appelées sont des upsert : écrire cent fois ne crée pas cent fiches. */
const CAMPOS_GUARDA = {
  'c-tas': () => upsertConst(), 'c-tad': () => upsertConst(), 'c-fc': () => upsertConst(),
  'c-spo2': () => upsertConst(), 'c-peso': () => upsertConst(), 'c-temp': () => upsertConst(),
  'c-hora': () => upsertConst(),
  'nota-libre': () => upsertObs(),
  'cfg-patient2': e => renombrarActivo(e.value, null),
  'cfg-sip': e => renombrarActivo(null, e.value),
  'cfg-pc': e => setPc(e.value)
};
function ponerEscuchaUnica() {
  const guarda = ev => {
    const t = ev.target;
    if (!t || !t.id) return;
    const f = CAMPOS_GUARDA[t.id];
    if (!f) return;
    /* Ne jamais avaler une erreur : un enregistrement qui échoue en silence
       est pire qu'un enregistrement qui manque, car on le croit fait. */
    try { f(t); }
    catch (err) {
      if (window.console) console.error('Protocolo — échec d\'enregistrement sur ' + t.id, err);
      const e2 = document.getElementById('const-estado');
      if (e2 && t.id.indexOf('c-') === 0) e2.textContent = '⚠ ' + (err && err.message ? err.message : 'error');
    }
  };
  document.addEventListener('input', guarda, true);
  document.addEventListener('change', guarda, true);
}

  try { upsertConst(); } catch (e) {}

}

function restaurarCampos() {
  /* — les constantes : la fiche du jour, si elle existe — */
  const cs = getConstantes();
  let idx = -1;
  for (let i = cs.length - 1; i >= 0; i--) if (cs[i] && cs[i].fecha === diaKey()) { idx = i; break; }
  const c = idx >= 0 ? cs[idx] : null;
  const pon = (id, v) => { const e = document.getElementById(id); if (e) e.value = (v === null || v === undefined) ? '' : v; };
  pon('c-tas', c && c.ta_sis); pon('c-tad', c && c.ta_dia); pon('c-fc', c && c.fc);
  pon('c-spo2', c && c.spo2); pon('c-peso', c && c.peso); pon('c-temp', c && c.temp);
  pon('c-hora', c && c.hora);
  _cDraft = idx >= 0 ? idx : null;
  estadoConst(c ? '✓ guardado · ' + c.hora : '');

  /* — la note libre : le brouillon du jour, reconnu à sa marque — */
  const obs = getObs();
  let oi = -1;
  for (let i = obs.length - 1; i >= 0; i--) {
    const o = obs[i];
    if (o && o.fecha === diaKey() && o.libre) { oi = i; break; }
  }
  const nl = document.getElementById('nota-libre');
  if (nl) nl.value = oi >= 0 ? (obs[oi].nota || '') : '';
  _oDraft = oi >= 0 ? oi : null;
  estadoObs(oi >= 0 ? '✓ guardado · ' + obs[oi].hora : '');

}

/* ═══ URGENCIAS 112 (P-H 28/07) — trois moments dans l'ordre : l'appel, le

   trois observations horodatées comme les autres, donc l'heure se corrige

const U112 = [
  { et: 'Llamada a Urgencias 112',  k: 'u112_llam', ico: '📞' },
  { et: 'Llegada de la asistencia', k: 'u112_lleg', ico: '🚑' },
  { et: 'Salida del domicilio',     k: 'u112_sal',  ico: '🚪', alt: 'Salida en ambulancia' },

/* L'épisode ne tient pas dans une journée : on peut rentrer le soir même ou

   la date, et l'épisode reste ouvert jusqu'au retour. */
function _u112Episodio() {
  const orden = getObs()
    .filter(o => o && o.fecha && o.tipos && o.tipos.length)
    .slice().sort((a, b) => (a.fecha + ' ' + (a.hora || '')).localeCompare(b.fecha + ' ' + (b.hora || '')));
  let ep = null;
  orden.forEach(o => {
    const et = String(o.tipos[0]).replace(/^[^ ]+ /, '');
    let k = -1;
    U112.forEach((p, i) => { if (et === p.et || et === p.alt) k = i; });
    if (k === 0) ep = [null, null, null, null];

  const abierto = !!ep && hechos < 4;
  const hoy = diaKey();
  /* La date ne s'écrit que lorsqu'elle change : rien pour un épisode
     d'aujourd'hui, une seule fois en tête pour un épisode passé, et de
     nouveau si un temps tombe un autre jour. Elle parle quand elle a
     quelque chose à dire. */
  let ultimaF = null;
  const testigo = !ep ? '' : U112.map((p, i) => {

    ultimaF = ep[i].fecha;
    const f = cambia ? (ep[i].fecha.slice(8, 10) + '/' + ep[i].fecha.slice(5, 7) + ' ') : '';
    return '<span style="font-size:17px">' + p.ico + '</span> ' + f + ep[i].hora;
  }).filter(Boolean).join(' · ');
  const sig = abierto ? hechos : 0;     /* épisode clos → un nouvel appel */
  /* Deux états, comme P-H les décrit : tant que la personne est à la maison
     c'est l'urgence (rouge) ; dès qu'elle est sortie, il ne reste que le
     retour, qui peut venir le soir même ou quinze jours plus tard (miel). */
  const fuera = abierto && hechos >= 3;

/* v2026.7.28.8 (P-H) — le compte du jour s'écrit DEVANT le choix : « 1 Normal »,

/* v23.18 — OPTION A choisie par P-H (« ne pas asservir ») : GRAVÉ D'ABORD

/* Affichage seul : la nota reste en espagnol dans mfp_obs (identifiant
   stable). detLabel ne sert qu'à montrer, jamais à stocker. */
const DET_IDIOMAS = { 'dura':'dep_dura', 'líquida':'dep_liq',
                   'escasa':'mic_escasa', 'frecuente':'mic_frec' };
const TIPO_IDIOMAS = { 'Deposición':'l_dep', 'Micción':'l_mic', 'Hidratación':'l_hid',
  'Cambio de pañal':'l_panal', 'Llamada a Urgencias 112':'u112_llam',
  'Llegada de la asistencia':'u112_lleg', 'Salida del domicilio':'u112_sal',
  'Salida en ambulancia':'u112_sal', 'Regreso a casa':'u112_reg' };
function tipoLabel(tipo) {
  const sin = String(tipo || '').replace(/^[^ ]+ /, '');   /* on ôte l'émoji */
  const k = TIPO_IDIOMAS[sin]; return k ? t(k) : sin;
}
function detLabel(v, esDep) {
  const x = String(v || '').trim();
  if (x === 'normal') return t(esDep ? 'dep_normal' : 'mic_normal');
  const k = DET_IDIOMAS[x]; return k ? t(k) : v;
}

     bas disparaît pour le trio ; le nombre du jour s'écrit sur le bouton. */
  if (!callado) toastEv('✓ ' + tipoLabel(tipo) + (detalle ? ' (' + detLabel(detalle.replace('aspecto ', ''), detalle.indexOf('aspecto ') === 0) + ')' : '') + ' · ' + h + '  — ' + t('ev_otra'), obs.length - 1);

/* Le nom lisible d'une observation : préfixe émoji + nom traduit pour les
   registres du corps, forme complète déclarée pour les chips. */
function obsLabel(t0) {
  const s = String(t0 || ''), i = s.indexOf(' ');
  if (i > 0 && s.charCodeAt(0) > 0x2000) {
    const resto = s.slice(i + 1), k = TIPO_IDIOMAS[resto];
    return s.slice(0, i) + ' ' + (k ? t(k) : resto);
  }
  return chipLabel(s);
}

/* ── DATOS : historial, export, config ── */
function renderDatos() {
  /* historial 7 jours */
  const dias = {};
  const tomas = getTomas(); const meds = getMeds();
  const nomMed = id => { const m = meds.find(x => x.id === id); return m ? m.nombre : id; };
  Object.keys(tomas).forEach(d => {
    Object.entries(tomas[d]).forEach(([id, h]) => {
      (dias[d] = dias[d] || []).push(h === 'omitida'
        ? '💊 <b>' + nomMed(id) + '</b> — <b style="color:var(--bad)">' + t('omitida') + '</b>'
        : '💊 <b>' + nomMed(id) + '</b> · ' + h);
    });
  });
  getPuntuales().forEach(p => {
    (dias[p.fecha] = dias[p.fecha] || []).push('💊 <b>' + p.nombre + '</b> (' + t('puntual') + ') · ' + p.hora);
  });
  const matCfg = getMaterialCfg();
  Object.entries(getMaterial()).forEach(function([d, vals]) {
    Object.entries(vals).forEach(function([id, v]) {
      const cfg = matCfg.find(x => x.id === id) || { nombre: id, unidad: '' };
      (dias[d] = dias[d] || []).push('🩹 <b>' + cfg.nombre + '</b> : ' + v + ' ' + cfg.unidad);
    });
  });
  getConstantes().forEach(c => {
    const partes = [];
    if (c.ta_sis !== null && c.ta_sis !== undefined) partes.push('TA ' + c.ta_sis + '/' + c.ta_dia);
    if (c.fc) partes.push(c.fc + ' lpm'); if (c.spo2) partes.push('SpO₂ ' + c.spo2 + '%');
    if (c.peso) partes.push(c.peso + ' kg'); if (c.temp) partes.push(c.temp + ' °C');
    if (partes.length) (dias[c.fecha] = dias[c.fecha] || []).push('🩺 <b>' + partes.join(' · ') + '</b> (' + c.hora + ')');
  });
  getObs().forEach(o => {
    (dias[o.fecha] = dias[o.fecha] || []).push('📝 ' + [...(o.tipos || []), o.nota].filter(Boolean).map(x => '<b>' + x + '</b>').join(' · ') + ' (' + o.hora + ')');
  });
  const fechas = Object.keys(dias).sort().reverse().slice(0, 7);
  document.getElementById('historial').innerHTML = fechas.length
    ? fechas.map(d => '<div class="dia"><div class="df">' + fmtFecha(d) + '</div>' +
        dias[d].map(l => '<div class="linea">' + l + '</div>').join('') + '</div>').join('')
    : '<div class="vacio">Todavía sin registros — empiece por la pestaña Hoy.</div>';
  /* meds config */
  document.getElementById('meds-lista').innerHTML = getMeds().map((m, i) =>
    '<div class="medrow"><span class="mi"><div class="mn">' + m.nombre + '</div>' +
    '<div class="md">' + m.dosis + ' · ' + (MOMENTOS[m.momento] || m.momento) + (m.hasta ? ' · hasta ' + m.hasta : '') + '</div></span>' +
    '<button onclick="editarMed(' + i + ')" title="Editar" style="margin-right:6px">✏️</button>' +
    '<button onclick="quitarMed(' + i + ')" title="Quitar">🗑</button></div>').join('') ||
    '<div class="vacio">Sin medicamentos configurados.</div>';
  const cp2 = document.getElementById('cfg-patient2'); if (cp2) cp2.value = getPatient();
  const iw = document.getElementById('instalar-wrap');
  /* P-H 19/07 (404 sur le site public) : le bouton ⬇ instalar est un service
     du PONT local — il ne vit que sur les origines locales. Sur le web,
     « instalar » = Añadir a pantalla de inicio, rien à télécharger. */
  const esLocal = /^(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|localhost$)/.test(location.hostname);
  if (iw) iw.style.display = (location.protocol.indexOf('http') === 0 && esLocal) ? '' : 'none';
  const ba = document.getElementById('btn-avisos');
  if (ba) ba.textContent = getAvisosOn() ? '🔔 ' + t('av_on') : '🔕 ' + t('av_off');
  const ah = document.getElementById('avisos-horas');
  if (ah) {
    const hs = getHoras();
    ah.innerHTML = Object.keys(HORAS_DEF).map(function(mom) {
      return '<div class="cbox" style="padding:8px"><label style="font-size:12px">' + (MOMENTOS[mom] || mom) + '</label>' +
        '<input type="time" value="' + hs[mom] + '" onchange="setHora(\'' + mom + '\', this.value)" style="font-size:15px;padding:6px"></div>';
    }).join('');
    ah.style.display = getAvisosOn() ? '' : 'none';
  }
  const cs = document.getElementById('cfg-sip'); if (cs) cs.value = getSip();
}

/* ── export : le pont vers Salufolio ── */
/* ═══ v2026.7.24.1 — FORMATO 2 (scellé par P-H) : le jour en clé partout,
   l'absence est le silence (jamais de null ni de clé vide), tomas unifiée
   (momento = régulière, med = puntual), material avec sessions inicio/fin. ═══ */
function _f2limpio(e) {
  const o = {};
  Object.keys(e).forEach(k => {
    if (k === 'fecha') return;
    const v = e[k];
    if (v === null || v === undefined || v === '') return;
    if (Array.isArray(v) && !v.length) return;
    o[k] = v;
  });
  return o;
}
function _f2agrupa(arr) {
  const g = {};
  (arr || []).forEach(e => { if (!e || !e.fecha) return; (g[e.fecha] = g[e.fecha] || []).push(_f2limpio(e)); });
  return g;
}
function payloadExport() {
  const tomasF2 = {};
  const tm = getTomas();
  Object.keys(tm).forEach(dia => Object.keys(tm[dia] || {}).forEach(mom => {
    const h = tm[dia][mom]; if (!h) return;
    (tomasF2[dia] = tomasF2[dia] || []).push({ momento: mom, hora: h });
  }));
  getPuntuales().forEach(pu => {
    if (!pu || !pu.fecha) return;
    (tomasF2[pu.fecha] = tomasF2[pu.fecha] || []).push({ med: pu.nombre, hora: pu.hora });
  });
  const pac = { nombre: getPatient() }; if (getSip()) pac.sip = getSip();
  return {
    formato: 2,
    version: 'Salufolio-Protocolo-' + MFP_VERSION,
    exportado: new Date().toLocaleString('es-ES', { timeZone: 'Europe/Madrid' }),
    paciente: pac,
    medicamentos: getMeds().map(m => {
      const o = { nombre: m.nombre, dosis: m.dosis };
      if (m.momento === 'demanda') o.puntual = true; else o.momento = m.momento;
      if (m.hasta) o.hasta = m.hasta;
      return o;
    }),
    tomas: tomasF2,
    material: (function(){
      const m = getMaterial(), out = {};
      Object.keys(m).forEach(k => { if (k !== '_uso' && m[k] !== null && m[k] !== undefined && m[k] !== '') out[k] = m[k]; });
      if (m._uso) { const u = {}; Object.keys(m._uso).forEach(id => { const dias = {}; Object.keys(m._uso[id]).forEach(f => { if ((m._uso[id][f]||[]).length) dias[f] = m._uso[id][f]; }); if (Object.keys(dias).length) u[id] = dias; }); if (Object.keys(u).length) out.uso = u; }
      return out;
    })(),
    material_config: getMaterialCfg(),
    constantes: _f2agrupa(getConstantes()),
    observaciones: _f2agrupa(getObs())
  };
}
/* ═══ RESTAURAR — lit le formato 2 et tolère le 1 (Lavoisier : rien ne se perd) ═══ */
function _nn(v) { return v === undefined ? null : v; }
function restaurarDesdeObj(d) {
  const F2 = d && d.formato === 2;
  const nom = F2 ? (d.paciente && d.paciente.nombre) : d.patient_label;
  const sip = F2 ? (d.paciente && d.paciente.sip) : d.patient_sip;
  renombrarActivo(nom || null, sip || '');
  const medsIn = (F2 ? d.medicamentos : d.medicamentos_config) || [];
  lsSet('mfp_meds', medsIn.map((m, i) => ({
    id: m.id || ('med' + Date.now() + '_' + i),
    nombre: m.nombre, dosis: m.dosis || '',
    momento: m.puntual ? 'demanda' : (m.momento || 'desayuno'),
    hasta: m.hasta || null
  })));
  if (d.material) {
    const mat = Object.assign({}, d.material);
    if (mat.uso) { mat._uso = mat.uso; delete mat.uso; }
    lsSet('mfp_material', mat);
  }
  if (d.material_config) lsSet('mfp_material_cfg', d.material_config);
  if (F2) {
    const tm = {}, pun = [];
    Object.keys(d.tomas || {}).forEach(f => (d.tomas[f] || []).forEach(e => {
      if (e.momento) { (tm[f] = tm[f] || {})[e.momento] = e.hora || null; }
      else if (e.med) pun.push({ fecha: f, hora: e.hora, nombre: e.med });
    }));
    lsSet('mfp_tomas', tm); lsSet('mfp_puntuales', pun);
    const cs = [];
    Object.keys(d.constantes || {}).forEach(f => (d.constantes[f] || []).forEach(c => cs.push({
      fecha: f, hora: c.hora || null, ta_sis: _nn(c.ta_sis), ta_dia: _nn(c.ta_dia),
      fc: _nn(c.fc), spo2: _nn(c.spo2), peso: _nn(c.peso), temp: _nn(c.temp)
    })));
    lsSet('mfp_constantes', cs);
    const ob = [];
    Object.keys(d.observaciones || {}).forEach(f => (d.observaciones[f] || []).forEach(o => {
      const e = { fecha: f, hora: o.hora || null, tipos: o.tipos || [], nota: o.nota || null };
      if (o.cant !== undefined) e.cant = o.cant;
      ob.push(e);
    }));
    lsSet('mfp_obs', ob);
  } else {
    if (d.tomas) lsSet('mfp_tomas', d.tomas);
    if (d.tomas_puntuales) lsSet('mfp_puntuales', d.tomas_puntuales);
    if (d.constantes) lsSet('mfp_constantes', d.constantes);
    if (d.observaciones) lsSet('mfp_obs', d.observaciones);
  }
}
function confirmar(titulo, msg, si) {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:96;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:18px';
  ov.innerHTML = '<div class="dlg"><div style="font-size:17px;font-weight:700;margin-bottom:10px">' + titulo + '</div>' +
    '<p style="font-size:14px;line-height:1.5;white-space:pre-line;margin:0">' + msg + '</p>' +
    '<div style="display:flex;gap:10px;margin-top:14px"><button class="btn sec" id="cf-no" style="flex:1">' + t('d_can') + '</button>' +
    '<button class="btn" id="cf-si" style="flex:1">' + t('d_ok') + '</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector('#cf-no').onclick = () => ov.remove();
  ov.querySelector('#cf-si').onclick = () => { ov.remove(); si(); };
}
function restaurarArchivo(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const nom = (d.formato === 2 ? (d.paciente && d.paciente.nombre) : d.patient_label) || '(sin nombre)';
      confirmar('📂 Restaurar', 'Se cargarán los datos de « ' + nom + ' »' + (d.exportado ? '\n(guardados el ' + d.exportado + ')' : '') + '.\nSustituirán lo que haya en este dispositivo.', () => {
        restaurarDesdeObj(d);
        localStorage.setItem('mfp_bienv2', JSON.stringify('1')); lsSet('mfp_asist', '1');
        toast('✓ restaurado — recargando…');
        setTimeout(() => location.reload(), 700);
      });
    } catch (e) { toast('⚠ archivo no válido'); }
  };
  r.readAsText(file);
}
/* ═══ ASISTENTE DE PRIMER ARRANQUE (dessiné par P-H) ═══ */
function asistente() {
  if (lsGet('mfp_asist', null)) return;
  if (getMeds().length) { lsSet('mfp_asist', '1'); return; }
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:94;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:18px';
  ov.innerHTML = '<div class="dlg" style="text-align:center">' +
    '<div style="font-size:19px;font-weight:800;margin-bottom:4px">Primer paso</div>' +
    '<p class="nota-campo" style="font-size:13px;margin-bottom:6px">¿Cómo empezamos?</p>' +
    '<button class="btn" style="width:100%;margin-top:6px" id="as-rest">📂 Restaurar una copia guardada</button>' +
    '<button class="btn sec" style="width:100%;margin-top:8px" id="as-nuevo">✚ Paciente nuevo</button>' +
    '<button class="hbtn2" style="width:100%;margin-top:10px;font-size:12px" id="as-luego">Más tarde</button></div>';
  document.body.appendChild(ov);
  const fin = () => { lsSet('mfp_asist', '1'); ov.remove(); };
  ov.querySelector('#as-luego').onclick = fin;
  ov.querySelector('#as-rest').onclick = () => { fin(); const f = document.getElementById('rest-file'); if (f) f.click(); };
  ov.querySelector('#as-nuevo').onclick = () => { fin(); pacienteNuevo(false); };
}
function asistenteNuevo() {
  dlg('✚ Paciente nuevo', [
    { label: 'Nombre', tipo: 'text', valor: '' },
    { label: 'SIP (opcional)', tipo: 'text', valor: '' }
  ], vals => {
    const n = (vals[0] || '').trim();
    if (n && !getPacientes().length) {   /* pas de liste encore : on l'ouvre */
      const id = _idPaciente(n);
      setPacientes([{ id: id, nombre: n, sip: (vals[1] || '').trim() }]); setActivo(id);
    }
    renombrarActivo(n || null, (vals[1] || '').trim());
    if (typeof renderPacientes === 'function') renderPacientes();
    const c2 = document.getElementById('cfg-patient2'); if (c2) c2.value = getPatient();
    const cS = document.getElementById('cfg-sip'); if (cS) cS.value = getSip();
    toast('✓ ' + getPatient() + ' — ahora, su pauta');
    irPauta();
  });
}
function exportarJSON() {
  const d = new Date();
  const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') +
    '_' + String(d.getHours()).padStart(2,'0') + 'h' + String(d.getMinutes()).padStart(2,'0');
  const blob = new Blob([JSON.stringify(payloadExport(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'MFProtocolo_' + getPatient().split(' ')[0].replace(/[^A-Za-z0-9]/g, '') + '_v' + stamp + '.json';
  a.click();
  toast('✓ JSON descargado');
}
function copiarJSON() {
  navigator.clipboard.writeText(JSON.stringify(payloadExport(), null, 2))
    .then(() => toast('✓ Copiado al portapapeles'))
    .catch(() => toast('⚠ Copia no disponible'));
}

/* ── rendu général ── */
function fmtFecha(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
}
function aplicarIdiomas() {
  const M = { 'i-thoy':'t_hoy','i-tconst':'t_const','i-tnotas':'t_notas','i-thist':'t_hist',
    'i-tcomp':'t_comp','i-tmeds':'t_meds','i-tpac':'t_pac','i-bgconst':'b_gconst','i-bgobs':'b_gobs',
    'i-bpunt':'b_punt','i-bdesc':'b_desc','i-bcopi':'b_copi','i-bcomp':'b_comp','i-baddmed':'b_addmed',
    'i-lhmed':'hora_med','i-bcorr':'b_corr','i-lfin':'fin_trat',
    'i-nhoy':'hoy','i-nconst':'consts','i-nnotas':'notas','i-ndatos':'datos','i-expnota':'exp_nota','i-binst':'inst_btn','i-feedback':'feedback','i-binst-nota':'inst_nota','i-tmat':'t_mat','i-tpac2':'t_pac','i-lsip':'sip_label','i-avisos':'av_title','i-avisos-nota':'av_nota','i-lhid':'l_hid','i-ldep':'l_dep','i-lmic':'l_mic','i-tfb':'t_fb','i-bpauta':'b_pauta','i-fbenv':'b_fbenv','i-fbanul':'b_fbanul','i-brest':'b_restaurar','i-dispsolo':'disp_solo','i-ctas':'c_tas','i-ctad':'c_tad','i-cfc':'c_fc','i-cspo2':'c_spo2','i-cpeso':'c_peso','i-ctemp':'c_temp',
    'i-dnorm':'dep_normal','i-ddura':'dep_dura','i-dliq':'dep_liq',

  Object.entries(M).forEach(([id, k]) => { const e = document.getElementById(id); if (e) e.textContent = t(k); });
  const nl = document.getElementById('nota-libre'); if (nl) nl.placeholder = t('nota_ph');
  hidTotal(); pintaConteos();
  if (typeof renderU112 === 'function') renderU112();
  const bl = document.getElementById('btn-lang'); if (bl) { bl.innerHTML = BANDERAS[getLang()] || getLang().toUpperCase(); bl.title = getLang().toUpperCase(); }
}
async function sincronizarPaciente() {
  /* Le patient vient de Salufolio (P-H 15/07) : le PC publie label+SIP via
     /api/paciente, l'app les adopte. Modifiable ensuite dans Datos. */
  const base = baseSalufolio();
  if (base === null || (base === '' && location.protocol.indexOf('http') !== 0)) return;
  try {
    const r = await fetch(base + '/api/paciente');
    const p = await r.json();
    /* Le PC ne renomme plus personne : c'est le Protocolo qui tient la
       liste des patients de la maison. On n'adopte l'étiquette du dossier
       que si la maison est encore vide — au tout premier branchement. */
    if (!getPacientes().length) {
      if (p && p.label) lsSet('mfp_patient', p.label);
      if (p && p.sip) lsSet('mfp_sip', String(p.sip));
      if (p && (p.label || p.sip)) render();
    }
  } catch (e) { /* serveur muet : on garde le patient local */ }
}
function render() {
  if (!lsGet('mfp_inicio', null)) lsSet('mfp_inicio', hoyKey());
  const hs = document.getElementById('hdr-sub'); if (hs) hs.textContent = 'Salufolio Protocolo · v' + MFP_VERSION;
  restaurarCampos();
  trioTotales(); pintaConstHoy(); bienvenida();
  /* ═══ DOCTRINE (P-H, 29/07) : « changement d'état d'un paramètre, on doit
     OBLIGATOIREMENT enregistrer — pas de confirmation ». « change » n'arrive
     qu'à la sortie du champ : tant que le doigt y est encore, rien n'est
     écrit, et si l'écran bascule avant, la valeur s'évapore. On écoute donc
     « input », qui arrive à chaque frappe. Les deux fonctions sont des
     upsert : écrire cent fois ne crée pas cent fiches. ═══ */
  if (!window._escuchasPuestas) {
    window._escuchasPuestas = true;
    ponerEscuchaUnica();
  }
  const _oh = document.getElementById('o-hora'); if (_oh) _oh.addEventListener('change', upsertObs);
  setTimeout(sondearPc, 400);
  document.querySelectorAll('details.acc').forEach(d => d.addEventListener('toggle', () => {
    if (d.open) document.querySelectorAll('details.acc[open]').forEach(o => { if (o !== d) o.open = false; });
  }));
  if (localStorage.getItem('mfp_bienv2')) setTimeout(arranqueInicial, 350);
  /* devise P-H : la table se remplit toute seule — servie par le PC, l'app
     mémorise son adresse pour les ouvertures locales futures */
  if (location.protocol.indexOf('http') === 0 && location.origin) lsSet('mfp_pc', location.origin);
  document.getElementById('hdr-fecha').textContent =
    new Date().toLocaleDateString(LOCALES[getLang()] || 'es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const sipTxt = getSip() ? '  ·  SIP ' + getSip() : '';
  renderPacientes();
  document.getElementById('ver').textContent = 'v' + MFP_VERSION;
  aplicarTheme(); aplicarZoom(); aplicarIdiomas();
  const ch = document.getElementById('c-hora'); if (ch) ch.value = ahora();
  const oh = document.getElementById('o-hora'); if (oh) oh.value = ahora();
  const bc = document.getElementById('i-bcomp');
  if (bc) bc.style.display = (navigator.share ? '' : 'none');
  const be = document.getElementById('i-benv');
  if (be) { be.textContent = t('b_env'); be.style.display = (location.protocol.indexOf('http') === 0 || getPc()) ? '' : 'none'; }
  const lp = document.getElementById('i-lpc'); if (lp) lp.textContent = t('pc_label');
  const cp = document.getElementById('cfg-pc'); if (cp && !cp.value) cp.value = getPc();
  renderTomas(); renderChips(); renderMaterial();
}
render();
sincronizarPaciente();
