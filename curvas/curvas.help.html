var A = {
es:`<h1>📈 Curvas</h1>
<div class="sub">Todos los parámetros, año tras año</div>

<h2>Las rúbricas</h2>
<p>La barra de arriba agrupa los parámetros por familia: hematología, bioquímica, coagulación, hepático… Toque una rúbrica para desplegar sus parámetros, y marque los que quiera ver. La barra queda fija: se cambia de rúbrica sin perder de vista las curvas.</p>

<h2>Superponer dos curvas</h2>
<p>Clic derecho sobre una curva para proponer otra en el mismo gráfico. Útil para ver si dos valores se mueven juntos — la hemoglobina y el hierro, la creatinina y el filtrado.</p>
<div class="nota">Que dos valores se muevan juntos no significa que uno cause el otro. Es una pista, no una prueba.</div>

<h2>Los umbrales</h2>
<p>La banda clara detrás de la curva marca el rango normal. Lo que sale de ella se aparta — sin que eso signifique forzosamente algo.</p>

<h2>El documento de origen</h2>
<p>Clic sobre un punto: se le dice de qué informe viene ese valor. Los PDF están en <code>pacientes/MATRÍCULA/sources/</code>.</p>`,
fr:`<h1>📈 Courbes</h1>
<div class="sub">Tous les paramètres, année après année</div>

<h2>Les rubriques</h2>
<p>La barre du haut regroupe les paramètres par famille : hématologie, biochimie, coagulation, hépatique… Touchez une rubrique pour déployer ses paramètres, et cochez ceux que vous voulez voir. La barre reste fixe : on change de rubrique sans perdre les courbes de vue.</p>

<h2>Superposer deux courbes</h2>
<p>Clic droit sur une courbe pour en proposer une autre dans le même graphique. Utile pour voir si deux valeurs évoluent ensemble — l'hémoglobine et le fer, la créatinine et la filtration.</p>
<div class="nota">Que deux valeurs évoluent ensemble ne veut pas dire que l'une cause l'autre. C'est une piste, pas une preuve.</div>

<h2>Les seuils</h2>
<p>La bande claire derrière la courbe marque la plage normale. Ce qui en sort s'écarte — sans que cela signifie forcément quelque chose.</p>

<h2>Le document d'origine</h2>
<p>Clic sur un point : on vous dit de quel rapport vient cette valeur. Les PDF sont dans <code>pacientes/MATRICULE/sources/</code>.</p>`,
ca:`<h1>📈 Corbes</h1>
<div class="sub">Tots els paràmetres, any rere any</div>

<h2>Les rúbriques</h2>
<p>La barra de dalt agrupa els paràmetres per família: hematologia, bioquímica, coagulació, hepàtic… Toque una rúbrica per a desplegar els seus paràmetres, i marque els que vulga veure. La barra queda fixa: es canvia de rúbrica sense perdre de vista les corbes.</p>

<h2>Superposar dues corbes</h2>
<p>Clic dret sobre una corba per a proposar-ne una altra en el mateix gràfic. Útil per a veure si dos valors es mouen junts — l'hemoglobina i el ferro, la creatinina i el filtrat.</p>
<div class="nota">Que dos valors es moguen junts no vol dir que un cause l'altre. És una pista, no una prova.</div>

<h2>Els llindars</h2>
<p>La banda clara darrere de la corba marca el rang normal. El que n'ix s'aparta — sense que això signifique forçosament res.</p>

<h2>El document d'origen</h2>
<p>Clic sobre un punt: se li diu de quin informe ve aquest valor. Els PDF estan en <code>pacientes/MATRÍCULA/sources/</code>.</p>`,
en:`<h1>📈 Curves</h1>
<div class="sub">Every parameter, year after year</div>

<h2>The groups</h2>
<p>The bar at the top groups the parameters by family: haematology, biochemistry, coagulation, liver… Tap a group to unfold its parameters, and tick the ones you want to see. The bar stays fixed: you can switch group without losing sight of the curves.</p>

<h2>Overlaying two curves</h2>
<p>Right-click a curve to add another one to the same chart. Useful to see whether two values move together — haemoglobin and iron, creatinine and filtration.</p>
<div class="nota">Two values moving together does not mean one causes the other. It is a lead, not proof.</div>

<h2>Thresholds</h2>
<p>The light band behind the curve marks the normal range. What falls outside it stands apart — without necessarily meaning anything.</p>

<h2>The source document</h2>
<p>Click a point: it tells you which report that value comes from. The PDFs are in <code>pacientes/ID/sources/</code>.</p>`
};
