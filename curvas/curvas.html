/* ================================================================

================================================================ */
/* Petit toast de statut (bas de l'écran, auto-disparition) — utilisé par
   les actions rapides (vaccins, changement de statut médicament, etc.)
   pour confirmer une action sans bloquer avec une alert(). Historiquement
   appelé mais jamais défini nulle part -> "status is not a function". */
function status(msg) {
  var el = document.getElementById('mf-status-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'mf-status-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);' +
      'background:var(--surface2);color:var(--text);border:1px solid var(--accent);' +
      'border-radius:8px;padding:10px 18px;font-size:13px;z-index:20000;' +
      'box-shadow:0 4px 16px rgba(0,0,0,0.35);opacity:0;transition:opacity .2s;pointer-events:none';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(function() { el.style.opacity = '0'; }, 2600);
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function getStatus(key, val) {
  const p = PARAMS[key];
  if (!p || !p.ref) return 'ok';
  const [lo, hi] = p.ref;
  if (lo !== null && val < lo) return 'bad';
  if (hi !== null && val > hi) return 'bad';
  return 'ok';
}
function getSeriesForParam(data, key) {
  /* v2026.7.21.10 — chaque point porte sa ROCHE-MÈRE : pdf_id + pdf voyagent
     avec la valeur (Lavoisier appliqué aux graphiques). */
  return data.filter(m => m.vals && (m.vals||{})[key] !== undefined)
             .map(m => ({ x: m.date, y: (m.vals||{})[key], src: m.src, pdf_id: m.pdf_id, pdf: m.pdf }))
             .sort((a,b) => a.x.localeCompare(b.x));
}

/* v2026.7.21.10 — « el médico no se lo creerá: ¿dónde está el informe? » (P-H) :
   un clic sur un point OUVRE le document source (résolu via le registre pdfs).
   Sans carpeta configurée, on affiche au moins le nom du document. */
/* P-H 09/08 : le PDF s'affiche dans un POPUP MAISON — déplaçable par sa
   poignée, redimensionnable par le coin bas-droit (poignée native du
   navigateur), fermable par ✕. Le document est rendu par la visionneuse
   PDF intégrée de Brave, DANS le popup. Pur HTML, zéro serveur. */
/* P-H 09/08-10/08 : « mets en relief HEMOGLOBINA dans le pdf » — la
   visionneuse de Brave ne surligne pas sur commande, alors l'app dessine
   ELLE-MÊME la page avec pdf.js (déjà embarqué pour l'OCR) et pose des
   surlignages dorés sur chaque occurrence du paramètre ET de sa valeur.
   Navigation ◀ ▶ entre les pages, redessin au redimensionnement du popup.
   Sans pdf.js ou PDF illisible (scan) : repli sur la visionneuse embed. */
function _pdfPopupShell(titulo, info) {
  document.querySelectorAll('.pdf-popup-maison').forEach(function(o) { o.remove(); });
  var pop = document.createElement('div');
  pop.className = 'pdf-popup-maison';
  pop.style.cssText = 'position:fixed;z-index:10002;width:min(900px,94vw);height:82vh;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:4px;display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:280px;min-height:160px';
  pop.style.left = 'calc(50% - min(450px,47vw))';
  pop.style.top = '40px';
  var banda = info ? '<div class="pdf-popup-banda" style="flex:0 0 auto;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--border)">🔍 Verificar en el documento: <b style="color:' + info.color + '">' + info.label + '</b> = <b>' + info.valor + '</b> ' + info.unidad + ' (' + (typeof fmtDate === 'function' ? fmtDate(info.fecha) : info.fecha) + ')<span class="pdf-popup-extra"></span></div>' : '';
  pop.innerHTML =
    '<div class="pdf-popup-drag" style="cursor:move;user-select:none;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 6px;border-bottom:1px solid var(--border)">' +
    '<b style="font-size:13px">📄 ' + titulo + '</b>' +
    '<span style="cursor:pointer;color:var(--muted);font-size:16px" onclick="this.closest(\'.pdf-popup-maison\').remove()">✕</span></div>' + banda +
    '<div class="pdf-popup-cuerpo" style="flex:1;min-height:0;overflow:auto;position:relative"></div>';
  document.body.appendChild(pop);
  (function() {
    var poignee = pop.querySelector('.pdf-popup-drag');
    var dragging = false, sx = 0, sy = 0, ol = 0, ot = 0;
    function pt(e) { return e.touches && e.touches[0] ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }
    function down(e) { if (e.target.tagName === 'SPAN' && e.target.getAttribute('onclick')) return; dragging = true; var p = pt(e); sx = p.x; sy = p.y; var r = pop.getBoundingClientRect(); ol = r.left; ot = r.top; e.preventDefault(); }
    function move(e) { if (!dragging) return; var p = pt(e); pop.style.left = Math.max(0, Math.min(window.innerWidth - 80, ol + p.x - sx)) + 'px'; pop.style.top = Math.max(0, Math.min(window.innerHeight - 40, ot + p.y - sy)) + 'px'; }
    function up() { dragging = false; }
    poignee.addEventListener('mousedown', down);
    poignee.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  })();
  return { pop: pop, cuerpo: pop.querySelector('.pdf-popup-cuerpo'), extra: pop.querySelector('.pdf-popup-extra') };
}

function _pdfPopupAbrir(url, titulo, info) {
  var sh = _pdfPopupShell(titulo, info);
  sh.cuerpo.innerHTML = '<embed src="' + url + '" type="application/pdf" style="width:100%;height:100%;border:0">';
}

async function _pdfPopupAbrirEnPagina(url, titulo, info, nom) {
  if (typeof pdfjsLib === 'undefined') { _pdfPopupAbrir(url, titulo, info); return; }
  var doc;
  /* P-H 10/08 : un file:// ne peut PAS être lu par fetch NI par le worker
     pdf.js depuis une page file:// (CORS « origin null », mur définitif).
     La seule voie propre pour récupérer les OCTETS (nécessaires au rendu
     maison + surlignage) est le serveur, qui sert le PDF en http:// —
     guichet /api/pdf déjà là. Repli sur l'embed file:// si pas de serveur
     (l'embed, lui, le navigateur l'autorise). */
  try {
    var buf = null;
    if (nom) {
      var srv = (typeof baseSalufolio === 'function' && baseSalufolio()) ? baseSalufolio() : 'http://localhost:7777';
      var stem = /\.pdf$/i.test(nom) ? nom.slice(0, -4) : nom;
      var r = await fetch(srv + '/api/pdf?n=' + encodeURIComponent(stem));
      if (r.ok) buf = await r.arrayBuffer();
    }
    if (!buf) buf = await (await fetch(url)).arrayBuffer(); /* dernier recours file:// */
    doc = await pdfjsLib.getDocument({ data: buf }).promise;
  }
  catch (e) { _pdfPopupAbrir(url, titulo, info); return; }
  try {
    var labelMin = (info && info.label) ? info.label.toLowerCase() : null;
    /* Les formes sous lesquelles le laboratoire peut écrire CETTE valeur.
       P-H 11/08 : le feutre ratait les valeurs > 1000 — le .sf porte 2583
       mais le PDF imprime « 2.583,00 » (point de milliers à l'espagnole).
       Faute de la trouver, le feutre continuait et surlignait le LABEL sur
       une autre page (« elevación de Dímero D... » p4 au lieu du 2.583 p2).
       On fabrique donc toutes les écritures plausibles de la même valeur. */
    var valores = [];
    if (info) {
      var n = Number(info.valor);
      var brut = String(info.valor);
      valores.push(brut);                         /* 2583   ·  13.8   */
      valores.push(brut.replace('.', ','));       /* 2583   ·  13,8   */
      if (isFinite(n) && Math.abs(n) >= 1000) {
        /* séparateur de milliers espagnol : le point */
        var ent = Math.trunc(Math.abs(n));
        var dec = brut.indexOf('.') >= 0 ? brut.split('.')[1] : '';
        var mil = String(ent).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        valores.push(mil);                        /* 2.583            */
        valores.push(mil + ',' + (dec || '00'));  /* 2.583,00         */
        valores.push(mil + ',' + (dec || '0'));   /* 2.583,0          */
      } else if (isFinite(n) && Number.isInteger(n)) {
        /* un entier peut être imprimé avec décimales : 235 → 235,00 */
        valores.push(brut + ',00');
        valores.push(brut + ',0');
      }
      valores = valores.filter(function (v, i, a) { return v && a.indexOf(v) === i; });
    }
    /* P-H 10/08 : « affiche la page qui tient le 1er feutre ». On ouvre
       donc la première page où quelque chose SERA surligné — c.-à-d. la
       valeur (le repère le plus sûr) ou, à défaut, le label. On cherche
       la valeur en priorité (page du vrai feutre), le label ne servant
       que de repli s'il n'y a aucune valeur nulle part. */
    var pagina = 1, pageValeur = 0, pageLabel = 0, textoVacio = true;
    if (labelMin || valores.length) {
      for (var pnum = 1; pnum <= doc.numPages; pnum++) {
        var pg = await doc.getPage(pnum);
        var tc0 = await pg.getTextContent();
        var texto = tc0.items.map(function(it) { return it.str; }).join(' ');
        if (texto.trim()) textoVacio = false;
        var tl = texto.toLowerCase();
        if (!pageValeur && valores.some(function(v) { return v && texto.indexOf(v) !== -1; })) pageValeur = pnum;
        if (!pageLabel && labelMin && tl.indexOf(labelMin) !== -1) pageLabel = pnum;
        if (pageValeur) break; /* la page du feutre-valeur trouvée, on s'arrête */
      }
      pagina = pageValeur || pageLabel || 1;
    }
    if (textoVacio) { try { doc.destroy(); } catch (e) {} _pdfPopupAbrir(url, titulo, info); return; } /* scan sans OCR */
    var sh = _pdfPopupShell(titulo, info);
    var barra = document.createElement('div');
    barra.style.cssText = 'flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:3px 6px;border-bottom:1px solid var(--border);font-size:12px';
    barra.innerHTML = '<button class="pdf-pg-prev" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 8px">◀</button>' +
      '<span class="pdf-pg-info"></span>' +
      '<button class="pdf-pg-next" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 8px">▶</button>' +
      '<span class="pdf-pg-nb" style="color:var(--muted)"></span>';
    sh.pop.insertBefore(barra, sh.cuerpo);
    sh.cuerpo.style.background = '#8a8a8a';
    sh.cuerpo.style.textAlign = 'center';
    var actual = pagina;
    async function dibujar(pnum) {
      actual = pnum;
      sh.cuerpo.innerHTML = '';
      var page = await doc.getPage(pnum);
      var vp1 = page.getViewport({ scale: 1 });
      var ancho = Math.max(300, sh.cuerpo.clientWidth - 20);
      var scale = ancho / vp1.width;
      var vp = page.getViewport({ scale: scale });
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:relative;display:inline-block;margin:8px 0;box-shadow:0 2px 10px rgba(0,0,0,.4)';
      var canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height;
      wrapper.appendChild(canvas);
      sh.cuerpo.appendChild(wrapper);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      var tc = await page.getTextContent();
      var nb = 0, premierTop = null;
      tc.items.forEach(function(it) {
        var s = (it.str || '');
        var hit = (labelMin && s.toLowerCase().indexOf(labelMin) !== -1) ||
                  valores.some(function(v) { return v && s.indexOf(v) !== -1; });
        if (!hit) return;
        nb++;
        var tx = pdfjsLib.Util.transform(vp.transform, it.transform);
        var h = Math.hypot(tx[2], tx[3]) || 12;
        var d = document.createElement('div');
        d.style.cssText = 'position:absolute;background:rgba(255,200,0,.45);outline:1.5px solid rgba(230,150,0,.9);border-radius:2px;pointer-events:none;left:' + (tx[4] - 2) + 'px;top:' + (tx[5] - h) + 'px;width:' + (it.width * scale + 4) + 'px;height:' + (h * 1.2) + 'px';
        wrapper.appendChild(d);
        if (premierTop === null) premierTop = tx[5] - h;
      });
      barra.querySelector('.pdf-pg-info').textContent = 'página ' + pnum + ' / ' + doc.numPages;
      barra.querySelector('.pdf-pg-nb').textContent = nb ? ('🟡 ' + nb + ' resaltado' + (nb > 1 ? 's' : '')) : '';
      if (premierTop !== null) sh.cuerpo.scrollTop = Math.max(0, premierTop - 60);
    }
    barra.querySelector('.pdf-pg-prev').onclick = function() { if (actual > 1) dibujar(actual - 1); };
    barra.querySelector('.pdf-pg-next').onclick = function() { if (actual < doc.numPages) dibujar(actual + 1); };
    /* redessin quand P-H redimensionne le popup (poignée du coin) */
    var roT = null;
    new ResizeObserver(function() { clearTimeout(roT); roT = setTimeout(function() { dibujar(actual); }, 200); }).observe(sh.cuerpo);
    await dibujar(pagina);
  } catch (e) {
    try { doc.destroy(); } catch (e2) {}
    _pdfPopupAbrir(url, titulo, info);
  }
}

function _chartVerInforme(s, key) {
  var id = s && (s.pdf_id || s.pdf); if (!id) return;
  /* P-H 09/08 : le popup annonce CE QU'ON EST VENU VÉRIFIER — paramètre,
     valeur, date — et l'URL porte #search= (honoré par certains visores). */
  var info = null;
  if (key && typeof PARAMS === 'object' && PARAMS[key]) {
    info = { label: PARAMS[key].label || key, valor: s.y, unidad: PARAMS[key].unit || '', fecha: s.x, color: PARAMS[key].color || 'var(--accent)' };
  }
  /* P-H 09/08 (« je n'ai pas besoin d'un serveur pour lire un pdf ») :
     ouverture DIRECTE en file:// — les fichiers de sources/ portent
     désormais leur nom exact PDFxxx.pdf, il suffisait d'ajouter
     l'extension que l'ancien code n'ajoutait pas. Zéro dépendance. */
  var nom = /\.pdf$/i.test(String(id)) ? String(id) : String(id) + '.pdf';
  var dir = (typeof pdfCarpeta === 'function') ? pdfCarpeta(id) : '';
  if (dir) {
    var base = dir.replace(/\/+$/, '');
    var url = (base.indexOf('://') !== -1 ? base : 'file://' + (base.charAt(0) === '/' ? '' : '/') + base) + '/' + encodeURIComponent(nom);
    try { _pdfPopupAbrirEnPagina(url, nom, info, nom); return; } catch (e) {}
  }
  /* v2026.7.21.20 — plus d'aboiement du navigateur (demande P-H) : le repli
     passe par la BANDE DU PAVÉ quand elle existe, et nomme le bon guichet
     (« Auditoría », pas « Trazabilidad »). L'alerte native ne sert que si
     aucune bande n'est à l'écran. */
  var msg = '📄 ' + nom + (dir
    ? ' — carpeta: ' + dir + ' (no se pudo abrir)'
    : ' — para abrirlo con un clic, defina la «carpeta de PDF» en la vista AUDITORÍA.');
  var det = document.getElementById('xz-cmt-detalle');
  if (det) { det.innerHTML = '🧪 ' + msg; return; }
  alert(msg);
}

Chart.defaults.font.family = "'IBM Plex Mono', monospace";
Chart.defaults.font.size = 10;
Chart.defaults.color = '#7a8499';
Chart.defaults.borderColor = '#2a3348';
const chartInstances = {};

/* v2026.7.21.4 — échelle par courbe : Lin (par défaut) ⇄ Log (natif Chart.js).
   Le BNP à 11924 (TEP 2022, valeur RÉELLE et grave) écrasait les valeurs
   récentes en linéaire ; en log, le pic ET les variations fines cohabitent.
   L'état vit dans _chartScale[key] ; le bouton dans le titre bascule et redessine. */
window._chartScale = window._chartScale || {};

/* v2026.7.21.17 — P-H avait RAISON sur l'échelle : l'app applique un zoom CSS
   (document.body.style.zoom, module languages) que Chart.js ignore dans ses
   calculs de souris → mauvais point détecté, doigt posé à côté. On calcule
   donc NOUS-MÊMES la position du curseur, auto-calibrée par le rapport
   rect/offsetWidth — juste quel que soit le zoom/l'échelle en vigueur. */
function _chartPosEvento(chart, ev) {
  var rect = chart.canvas.getBoundingClientRect();
  var f = (rect.width / (chart.canvas.offsetWidth || rect.width)) || 1;
  return { x: (ev.clientX - rect.left) / f, y: (ev.clientY - rect.top) / f };
}
function _chartPuntoCercano(chart, ev) {
  var pos = _chartPosEvento(chart, ev);
  var meta = chart.getDatasetMeta(0);
  var best = -1, bd = Infinity, dist = Infinity;
  (meta && meta.data || []).forEach(function(el, i) {
    var d = Math.abs(el.x - pos.x);
    if (d < bd) { bd = d; best = i; dist = Math.hypot(el.x - pos.x, el.y - pos.y); }
  });
  return { index: best, precis: dist <= 16 };
}
function makeChart(canvasId, key, data, opts) {
  opts = opts || {};
  /* v2026.7.21.8 — les opts sont mémorisées par canvas : les redraws
     (bascule d'échelle, resize) conservent l'habillage d'origine. */
  window._chartOpts = window._chartOpts || {};
  _chartOpts[canvasId] = opts;
  var rejilla = opts.claro ? '#e6e6de' : '#2a3348';
  const p = PARAMS[key];
  const series = getSeriesForParam(data, key);
  if (!series.length) return;
  const esLog = (_chartScale[key] === 'log');
  const labels = series.map(s => fmtDate(s.x));
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (chartInstances[canvasId]) { chartInstances[canvasId].destroy(); }
  window._chartSeries = window._chartSeries || {};
  _chartSeries[canvasId] = series;
  chartInstances[canvasId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: p.label,
        data: series.map(s => s.y),
        borderColor: p.color,
        backgroundColor: p.color + '18',
        pointBackgroundColor: series.map(s => getStatus(key, s.y) === 'bad' ? '#c0392b' : p.color),
        pointRadius: 5, pointHoverRadius: (opts.sinTooltip ? 5 : 7), pointHitRadius: 14, tension: 0.3, fill: false,
      }]
    },
    options: {
      responsive: true,
      /* v2026.7.21.10 — clic sur un point → ver informe (le survol l'annonce) */
      /* v2026.7.21.16 (P-H : « manque de sensibilité » + « un doigt à la
         place du curseur ») : le SURVOL est généreux — n'importe où sur la

         le curseur devient un DOIGT 👆 quand un rond est saisi. */
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      onClick: (e, els, chart) => {
        try {
          const pc = _chartPuntoCercano(chart, e.native || e);
          if (pc.precis) { const s = series[pc.index]; if (s && (s.pdf_id || s.pdf)) _chartVerInforme(s, key); }
        } catch (er) {}
      },
      /* v2026.7.21.15 (conception P-H : « affiche le texte dans la popup et
         point final ») : le survol d'un point nourrit le pavé DIRECTEMENT,
         sans dépendre de l'infobulle — que celle-ci soit activée ou non. */
      onHover: (e, els, chart) => {
        const ev = e.native || e;
        let pc = { index: -1, precis: false };
        try { pc = _chartPuntoCercano(chart, ev); } catch (er) {}
        try { const cible = ev.target || chart.canvas; if (cible) cible.style.cursor = pc.precis ? 'pointer' : 'default'; } catch (er) {}

        const s = series[pc.index] || {};
        const v = s.y;
        const doc = (typeof pdfNombre === 'function' && (s.pdf_id || s.pdf)) ? pdfNombre(s.pdf_id || s.pdf) : (s.src || '');
        try { _chartPuntoHover({ param: (p.label || key), fecha: s.x, valor: v, unidad: p.unit || '', fuera: getStatus(key, v) === 'bad', doc: doc, tienePdf: !!(s.pdf_id || s.pdf) }); } catch (er) {}
      },

          const l = [fuera ? '⚠ Fuera de rango' : '✓ Normal'];
          const doc = (typeof pdfNombre === 'function' && (s.pdf_id || s.pdf)) ? pdfNombre(s.pdf_id || s.pdf) : (s.src || '');
          if (doc) l.push('📄 ' + doc);
          if (s.pdf_id || s.pdf) l.push('(clic: ver informe)');
          return l;
        }
      }}},
      scales: {
        x: { grid: { color: rejilla } },
        y: { type: esLog ? 'logarithmic' : 'linear',
             grid: { color: rejilla }, ticks: { maxTicksLimit: 6 },
             title: { display: true, text: p.unit + ' — vista ' + (esLog ? 'LOG' : 'LIN') } }
      }
    },
    plugins: [{
      id: 'ref', beforeDraw(chart) {
        if (!p.ref) return;
        const [lo, hi] = p.ref;
        if (lo === null && hi === null) return;
        const { ctx, chartArea: { left, right, top, bottom }, scales: { y } } = chart;
        ctx.save(); ctx.fillStyle = 'rgba(30,180,100,0.06)';
        const yTop = hi !== null ? y.getPixelForValue(Math.min(hi, y.max)) : top;
        const yBot = lo !== null ? y.getPixelForValue(Math.max(lo, y.min)) : bottom;
        ctx.fillRect(left, yTop, right - left, yBot - yTop);
        ctx.restore();
      }
    }]
  });

/* Helper: tooltip interactif pour les noms de paramètres */
function paramTip(key) {
  const p = PARAMS[key];
  if (!p) return '';
  const ref = p.ref ? p.ref.filter(v=>v!==null).join('–') + ' ' + p.unit : 'sin rango definido';
  return p.desc + '\nRef: ' + ref;
}
/* Tooltip global : un seul élément fixé au body, mesuré puis positionné —
   jamais rogné, jamais étroit (délégation : fonctionne pour tout .param-tip). */
(function initParamTip() {
  if (typeof document === 'undefined') return;
  let box = null;
  function ensureBox() {
    if (!box) { box = document.createElement('div'); box.id = 'param-tipbox'; document.body.appendChild(box); }
    return box;
  }
  document.addEventListener('mouseover', function (e) {
    const t = e.target && e.target.closest ? e.target.closest('[data-ptip]') : null;
    if (!t || !t.getAttribute('data-ptip')) return;
    const b = ensureBox();
    /* livrée : or-sur-bleu pour les corrélations (P-H), défaut sinon */
    if (t.classList && t.classList.contains('corr-tip')) {
      b.style.background = 'linear-gradient(135deg, var(--corr-tip-bg1), var(--corr-tip-bg2))';
      b.style.color = 'var(--corr-tip-color)';
      b.style.border = '1.5px solid var(--corr-tip-border)';
    } else {
      b.style.background = ''; b.style.color = ''; b.style.border = '';
    }
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    b.innerHTML = (t.getAttribute('data-ptip') || '').split('\n')
      .map(l => l.indexOf('Ref:') === 0
        ? '<span style="color:#3fb950;font-weight:600">' + esc(l) + '</span>'
        : esc(l)).join('<br>');
    b.classList.remove('on');
    b.style.left = '0px'; b.style.top = '-9999px';   /* mesurer hors écran */
    const r = t.getBoundingClientRect();
    const bw = b.offsetWidth, bh = b.offsetHeight;
    let x = Math.min(Math.max(6, r.left), window.innerWidth - bw - 6);
    let y = r.top - bh - 8;
    if (y < 6) y = r.bottom + 8;                      /* pas de place en haut → dessous */
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.classList.add('on');
  });
  document.addEventListener('mouseout', function (e) {
    const t = e.target && e.target.closest ? e.target.closest('[data-ptip]') : null;
    if (t && box) box.classList.remove('on');
  });
  document.addEventListener('scroll', function () { if (box) box.classList.remove('on'); }, true);
})();

function paramSpan(key, shortLabel, extraStyle) {
  const p = PARAMS[key];
  if (!p) return key;
  const ref = p.ref ? p.ref.filter(v=>v!==null).join(' – ') + ' ' + p.unit : '';
  /* P-H 07/08 : fondu avec l'indication clic droit dans LA MÊME bulle
     rapide (data-ptip) — l'ancien title="" natif du <td> parent avait un
     délai imposé par le navigateur, impossible à raccourcir en JS. */
  const tip = (p.desc || p.label) + (ref ? '\nRef: ' + ref : '') + '\n🖱️ Clic izq.: glosario · Clic der.: curva';
  const label = shortLabel || p.label;
  return '<span class="param-tip" data-ptip="' + tip.replace(/"/g, '&quot;') + '" onclick="glosarioMostrarToast(\'' + key.replace(/'/g,"") + '\', event)" style="cursor:pointer' + (extraStyle ? ';'+extraStyle : '') + '">' + label + '</span>';
}

/* Alias court pour templates */
function paramTip(key, short) {
  return paramSpan(key, short);
}

function fillParamSelect() {
  const sel = document.getElementById('m-param');
  if (!sel) return;
  sel.innerHTML = '<option value="">— ' + (t('lbl_param')||'Parámetro') + ' —</option>';

  /* Paramètres prédéfinis — triés alphabétiquement */
  const optGroup1 = document.createElement('optgroup');
  optGroup1.label = 'Parámetros estándar';
  Object.entries(PARAMS)
    .sort((a, b) => a[1].label.localeCompare(b[1].label))
    .forEach(([k,p]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = p.label + ' (' + p.unit + ')';
      optGroup1.appendChild(opt);
    });
  sel.appendChild(optGroup1);

  /* Paramètres personnalisés */
  const customs = loadCustomParams();
  if (Object.keys(customs).length) {
    const optGroup2 = document.createElement('optgroup');
    optGroup2.label = 'Mis parámetros';
    Object.entries(customs).forEach(([k,p]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = p.label + ' (' + p.unit + ')';
      optGroup2.appendChild(opt);
    });
    sel.appendChild(optGroup2);
  }

  /* Option pour ajouter un nouveau */
  const sep = document.createElement('option');
  sep.disabled = true; sep.textContent = '────────────────';
  sel.appendChild(sep);
  const addOpt = document.createElement('option');
  addOpt.value = '__NEW__'; addOpt.textContent = '➕ Nuevo parámetro...';
  addOpt.style.color = 'var(--accent)';
  sel.appendChild(addOpt);

  /* Remplir la datalist des sources */
  fillSourceList();
}

function fillSourceList() {
  const sel = document.getElementById('m-source-select');
  if (!sel) return;

  /* Collecter toutes les sources connues */
  const sources = new Set();
  loadData().forEach(d => { if (d.src) sources.add(d.src); });
  loadEvents().forEach(e => { if (e.src) sources.add(e.src); });
  loadCustomSources().forEach(s => sources.add(s));

  /* Garder la sélection actuelle */
  const prev = sel.value;

  sel.innerHTML = '<option value="">— Seleccionar fuente —</option>';

  /* Sources existantes */
  [...sources].sort().forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });

  /* Séparateur + option nouvelle */
  if (sources.size > 0) {
    const sep = document.createElement('option');
    sep.disabled = true; sep.textContent = '────────────────';
    sel.appendChild(sep);
  }
  const addOpt = document.createElement('option');
  addOpt.value = '__NEW_SOURCE__'; addOpt.textContent = '➕ Nueva fuente...';
  sel.appendChild(addOpt);

  /* Restaurer sélection si possible */
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function onSourceChange() {
  const sel = document.getElementById('m-source-select');
  const inp = document.getElementById('m-source-new');
  if (sel.value === '__NEW_SOURCE__') {
    inp.style.display = 'block';
    inp.focus();
  } else {

    inp.value = '';
  }
}

function getSelectedSource() {
  const sel = document.getElementById('m-source-select');
  if (sel.value === '__NEW_SOURCE__') {
    return document.getElementById('m-source-new').value.trim() || '';
  }
  return sel.value || '';
}

/* Gestion des paramètres personnalisés */
const CUSTOM_PARAMS_KEY = 'mt_custom_params';
const CUSTOM_SOURCES_KEY = 'mt_custom_sources';

function loadCustomParams() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_PARAMS_KEY) || '{}'); } catch { return {}; }
}
function saveCustomParams(p) { localStorage.setItem(CUSTOM_PARAMS_KEY, JSON.stringify(p)); }
function loadCustomSources() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_SOURCES_KEY) || '[]'); } catch { return []; }
}
function saveCustomSources(s) { localStorage.setItem(CUSTOM_SOURCES_KEY, JSON.stringify(s)); }

function addCustomSource(src) {
  if (!src || src === 'Manuel') return;
  const sources = loadCustomSources();
  if (!sources.includes(src)) {
    sources.push(src);
    sources.sort();
    saveCustomSources(sources);
  }
}

function onParamChange() {
  const sel = document.getElementById('m-param');
  const box = document.getElementById('custom-param-box');
  if (sel.value === '__NEW__') {
    box.style.display = 'block';
    document.getElementById('cp-label').focus();
  } else {
    box.style.display = 'none';
  }
}

function registerCustomParam() {
  const label = document.getElementById('cp-label').value.trim();
  const unit  = document.getElementById('cp-unit').value.trim() || '';
  const refStr = document.getElementById('cp-ref').value.trim();

  if (!label) return null;

  /* Générer une clé machine depuis le label */
  const key = 'custom_' + label.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

  /* Parser ref "min-max" */
  let ref = null;
  if (refStr) {
    const parts = refStr.split(/[-–—]/);
    if (parts.length === 2) {
      ref = [parseFloat(parts[0]) || null, parseFloat(parts[1]) || null];
    }
  }

  /* Sauvegarder dans PARAMS (runtime) et localStorage */
  const customs = loadCustomParams();
  const paramDef = { label, unit, ref, color: '#7f8c8d', desc: 'Parámetro personalizado: ' + label };
  customs[key] = paramDef;
  PARAMS[key] = paramDef;
  saveCustomParams(customs);

  /* Reset les champs */
  document.getElementById('cp-label').value = '';
  document.getElementById('cp-unit').value = '';
  document.getElementById('cp-ref').value = '';
  document.getElementById('custom-param-box').style.display = 'none';

  /* Recharger le select et sélectionner le nouveau */
  fillParamSelect();
  document.getElementById('m-param').value = key;

  return key;
}

  else if (cambioDatos) boutonAction = '<button id="tblcurve-btn" class="btn primary" style="font-size:11px;padding:5px 12px" onclick="tblCurveComentario(' + clesJs + ',\'' + huella.replace(/'/g,"") + '\')">🔄 Actualizar comentario</button>';
  const zona = apiKey ? (

    (memo && memo.texto ? formatearComentarioClaude(memo.texto) +
      '<div style="flex:0 0 auto;margin-top:4px;font-size:10px;color:var(--muted);font-style:italic">Comentario de Claude (' + (memo.modelo||'') + ') del ' + (memo.fecha||'') + ' — no sustituye el juicio clínico.</div>' +
      (cambioDatos ? '<div style="flex:0 0 auto;margin-top:6px;font-size:11px;color:var(--warn,#e8a33d)">⚠ Los datos han cambiado desde este comentario.</div>' : '') : '') +
    (boutonAction ? '<div style="flex:0 0 auto;margin-top:8px;display:flex;align-items:center;gap:8px">' + boutonAction + '<span style="font-size:10px;color:var(--muted)">se guarda en el expediente</span></div>' : '') + '</div>'
  ) : (
    '<div id="tblcurve-topbar" style="font-size:11px;color:var(--muted)">💡 Puede pedir una segunda opinión a Claude — configure su clave API en <a href="#" onclick="showPanel(\'importar\',document.getElementById(\'tour-tab-importar\'));this.closest(\'.tblcurve-comentario-popup\').remove();return false;" style="color:var(--accent)">📥 Datos</a>.</div>'
  );
  const pop = document.createElement('div');
  pop.className = 'tblcurve-comentario-popup';
  /* P-H 09/08 : popup redimensionnable — poignée native du navigateur au
     coin bas-droit, surtout pour pouvoir le RÉDUIRE. */
  pop.style.cssText = 'position:fixed;z-index:10002;width:min(860px,96vw);max-height:88vh;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:4px;display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:260px;min-height:110px';
  pop.style.left = 'calc(50% - min(430px,48vw))';
  pop.style.top = '60px';
  pop.innerHTML =
    '<div class="tblcurve-toast-drag" style="cursor:move;user-select:none;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 6px;border-bottom:1px solid var(--border)">' +
    '<b style="font-size:14px">' + titre + '</b>' +
    '<span style="display:inline-flex;align-items:center;gap:8px">' +
    (esCombo ? (patronExiste(keys) ? '<span style="font-size:11px;color:var(--ok,#3fb950)">✓ Patrón conservado</span>'
      : '<button id="tblcombo-conservar" class="btn" style="font-size:11px;padding:3px 8px" onclick="patronConservar(' + JSON.stringify(keys).replace(/"/g,"\'") + ')">💾 Conservar este patrón</button>') : '') +
    '<span style="cursor:pointer;color:var(--muted);font-size:16px" onclick="this.closest(\'.tblcurve-comentario-popup\').remove()">✕</span></span></div>' +
    '<div style="flex:0 0 auto;font-size:11px;color:var(--muted);padding:4px 6px">' + stats + '</div>' +
    '<div style="flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;padding:4px 6px">' + zona + '</div>';
  document.body.appendChild(pop);
  (function() {
    var poignee = pop.querySelector('.tblcurve-toast-drag');
    var dragging = false, sx = 0, sy = 0, ol = 0, ot = 0;
    function pt(e) { return e.touches && e.touches[0] ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }
    function down(e) { if (e.target.closest('button') || (e.target.tagName === 'SPAN' && e.target.getAttribute('onclick'))) return; dragging = true; var p = pt(e); sx = p.x; sy = p.y; var r = pop.getBoundingClientRect(); ol = r.left; ot = r.top; e.preventDefault(); }
    function move(e) { if (!dragging) return; var p = pt(e); pop.style.left = Math.max(0, Math.min(window.innerWidth - pop.offsetWidth, ol + p.x - sx)) + 'px'; pop.style.top = Math.max(0, Math.min(window.innerHeight - 40, ot + p.y - sy)) + 'px'; }
    function up() { dragging = false; }
    poignee.addEventListener('mousedown', down);
    poignee.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  })();
  if (autoComentar && apiKey && !(memo && memo.texto)) setTimeout(function() { tblCurveComentario(esCombo ? keys : keys[0], huella); }, 200);
}



/* ================================================================
   ALL CHARTS — rubriques + superpositions N courbes (v2026.7.12.10)
   - Sélecteur par rubriques (GRUPOS), défauts GRUPOS_DEFECTO.
   - Superposition par glisser-déposer OU clic droit (menu contextuel :
     ➕ Superponer/Añadir, ➖ Quitar, ✕ Separar, 📍/⛶).
   - RÈGLE : max 2 UNITÉS par graphe (2 axes Y) ; même unité = même axe.
     La liste "Superponer con…" couvre TOUTES les rubriques (données requises).
================================================================ */
const CHARTS_SEL_KEY = 'mt_charts_sel';
const CHARTS_COMBOS_KEY = 'mt_charts_combos';
let _dragKey = null;




/* combos : [{keys:[k1,k2,...], taille:'aqui'|'grande'}] — migre l'ancien format [k1,k2,taille] */



function grupoDe(key) {
  for (const [g, cles] of Object.entries(GRUPOS)) if (cles.includes(key)) return g;
  return 'OTROS';
}
function unitOf(key) { return ((PARAMS[key] && PARAMS[key].unit) || '').trim(); }
function comboUnits(keys) { return [...new Set(keys.map(unitOf))]; }
let _grupoOuvert = null;

function _avecDonnees(data) {
  return Object.keys(PARAMS).filter(k => getSeriesForParam(data, k).length >= 1);
}

function buildAllCharts(data) {
  if (!data) data = loadData();
  const el = document.getElementById('all-charts');
  el.innerHTML = '';
  _menuFermer();

  const avecDonnees = _avecDonnees(data);
  let sel = loadChartsSel();
  if (sel === null) {
    const defs = (typeof GRUPOS_DEFECTO !== 'undefined') ? GRUPOS_DEFECTO : null;
    sel = defs ? avecDonnees.filter(k => defs.includes(grupoDe(k))) : avecDonnees.slice();
    if (!sel.length) sel = avecDonnees.slice();
  }
  sel = sel.filter(k => avecDonnees.includes(k));

  /* ── barre des rubriques ── */
  const rubriques = [...new Set(avecDonnees.map(grupoDe))];
  const ordre = Object.keys(GRUPOS).concat('OTROS');
  rubriques.sort((a, b) => ordre.indexOf(a) - ordre.indexOf(b));
  let bar = document.getElementById('charts-selector');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'charts-selector';
    bar.style.cssText = 'margin:0 0 14px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px';
    el.parentNode.insertBefore(bar, el);
  }
  const puce = (g) => {
    const cles = avecDonnees.filter(k => grupoDe(k) === g);
    const nSel = cles.filter(k => sel.includes(k)).length;
    const actif = nSel > 0, partiel = actif && nSel < cles.length;
    return '<span style="display:inline-flex;align-items:center;gap:2px;margin:2px 4px 2px 0">' +
      '<button onclick="_grupoToggle(\'' + g + '\')" style="cursor:pointer;font-size:11px;padding:4px 10px;border-radius:14px 0 0 14px;border:1px solid ' +
        (actif ? 'var(--accent)' : 'var(--border)') + ';background:' + (actif ? 'var(--accent)' : 'var(--surface)') +
        ';color:' + (actif ? '#fff' : 'var(--muted)') + '">' + g + (partiel ? ' ' + nSel + '/' + cles.length : '') + '</button>' +
      '<button onclick="_grupoDeplier(\'' + g + '\')" title="Elegir parámetros" style="cursor:pointer;font-size:11px;padding:4px 7px;border-radius:0 14px 14px 0;border:1px solid ' +
        (actif ? 'var(--accent)' : 'var(--border)') + ';border-left:none;background:var(--surface);color:var(--muted)">' +
      (_grupoOuvert === g ? '▴' : '▾') + '</button></span>';
  };
  let html = '<div style="display:flex;flex-wrap:wrap;align-items:center">' + rubriques.map(puce).join('') +
    '<span style="margin-left:auto;font-size:11px;color:var(--muted)">' + sel.length + '/' + avecDonnees.length + ' parámetros · clic derecho en una curva: superponer</span></div>';
  if (_grupoOuvert && rubriques.includes(_grupoOuvert)) {
    const cles = avecDonnees.filter(k => grupoDe(k) === _grupoOuvert);
    html += '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);display:flex;flex-wrap:wrap;gap:4px 12px">' +
      cles.map(k => '<label style="display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;color:var(--fg)">' +
        '<input type="checkbox" data-pkey="' + k + '" ' + (sel.includes(k) ? 'checked' : '') + ' onchange="_chartsSelToggle(this)"/>' +
        '<span>' + (PARAMS[k].label || k) + ' <span style="color:var(--muted)">(' + getSeriesForParam(data, k).length + ')</span></span></label>').join('') +
      '</div>';
  }
  bar.innerHTML = html;

  /* ── combos valides (toutes rubriques : indépendants de sel) ── */
  const combos = loadChartsCombos().filter(c => c.keys.every(k => avecDonnees.includes(k)));
  const membre = new Map();               /* clé → index combo */
  combos.forEach((c, i) => c.keys.forEach(k => membre.set(k, i)));
  const rendus = new Set();

  const carteCombo = (i) => {
    const combo = combos[i], grande = combo.taille === 'grande';
    const div = document.createElement('div');
    div.className = 'chart-card';
    if (grande) div.style.gridColumn = '1 / -1';
    const titres = combo.keys.map(k => '<span style="color:' + PARAMS[k].color + '">' + (PARAMS[k].label || k) + '</span>').join(' ⇆ ');
    div.innerHTML = '<div class="chart-title">' + titres +
      '<span style="float:right;display:inline-flex;gap:4px">' +
      '<button onclick="_comboTaille(' + i + ')" title="' + (grande ? 'Reducir' : 'Ampliar') + '" style="cursor:pointer;font-size:10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);padding:0 6px">' + (grande ? '📍' : '⛶') + '</button>' +
      '<button onclick="_comboSupprimer(' + i + ')" title="Separar todo" style="cursor:pointer;font-size:10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);padding:0 6px">✕</button>' +
      '</span></div>' +
      '<canvas id="ac-combo-' + i + '" height="' + (grande ? 90 : 150) + '"></canvas>';
    div.addEventListener('contextmenu', e => { e.preventDefault(); _menuOuvrir(e, { combo: i }); });
    el.appendChild(div);
    setTimeout(() => makeComboChart('ac-combo-' + i, combo.keys, data), 50);
  };

  /* ── cartes, ordre du catalogue ── */
  Object.keys(PARAMS).forEach(key => {
    if (membre.has(key)) {
      const i = membre.get(key);
      if (!rendus.has(i) && (sel.includes(key) || combos[i].keys.every(k => !sel.includes(k)))) {
        rendus.add(i); carteCombo(i);
      }
      return;                                   /* membre : pas de carte individuelle */
    }
    if (!sel.includes(key)) return;
    const series = getSeriesForParam(data, key);
    if (series.length < 1) return;
    const p = PARAMS[key];
    const div = document.createElement('div');
    div.className = 'chart-card';
    div.setAttribute('draggable', 'true');
    /* P-H 10/08 : title natif retiré — il surgissait au survol de toute la
       carte et se superposait à l'infobulle du point, gênant l'inspection.
       Le rappel « clic derecho para superponer » reste dans le bandeau fixe
       sous la sélection (ligne du compteur de paramètres). */
    div.addEventListener('dragstart', () => { _dragKey = key; div.style.opacity = '0.5'; });
    div.addEventListener('dragend',   () => { div.style.opacity = ''; });
    div.addEventListener('dragover',  e => { e.preventDefault(); div.style.outline = '2px dashed var(--accent)'; });
    div.addEventListener('dragleave', () => { div.style.outline = ''; });
    div.addEventListener('drop',      e => { e.preventDefault(); div.style.outline = ''; if (_dragKey && _dragKey !== key) _comboProposer(div, _dragKey, key); });
    div.addEventListener('contextmenu', e => { e.preventDefault(); _menuOuvrir(e, { key }); });
    /* v2026.7.21.4 — bouton Lin/Log, seulement utile quand une valeur écrase
       la série (amplitude > 20×, toutes > 0). Le BNP en est l'exemple type. */
    const _sv = getSeriesForParam(data, key).map(s => s.y).filter(v => v > 0);
    const _ampli = _sv.length > 1 ? Math.max(..._sv) / Math.min(..._sv) : 1;
    const _btnEsc = _ampli > 20
      ? `<button class="scale-btn" onclick="_chartToggleScale('${key}','ac-${key}')" title="Cambiar escala lineal/logarítmica">⇄ escala</button>`
      : '';
    div.innerHTML = `<div class="chart-title">${paramSpan(key)}${_btnEsc}</div><div class="chart-sub">${p.unit}${p.ref?'·Ref:'+p.ref.filter(v=>v!==null).join('–'):''}</div><canvas id="ac-${key}" height="150"></canvas>`;
    el.appendChild(div);
    setTimeout(() => makeChart('ac-'+key, key, data), 50);
  });
  combos.forEach((c, i) => { if (!rendus.has(i)) { rendus.add(i); carteCombo(i); } });
  if (!el.children.length) el.innerHTML = '<p style="padding:20px;color:var(--muted);text-align:center">Ninguna rúbrica seleccionada — pulse una arriba.</p>';
}

/* v2026.7.21.4 — bascule l'échelle d'une courbe et la redessine sur place. */
function _chartToggleScale(key, canvasId) {
  _chartScale[key] = (_chartScale[key] === 'log') ? 'lin' : 'log';
  makeChart(canvasId, key, loadData(), (window._chartOpts || {})[canvasId]);
  const btn = event && event.target;
  /* l'état est déclaré par l'axe (« vista LIN/LOG ») ; le bouton reste neutre */
}

/* ── candidats à l'ajout : règle des unités, toutes rubriques ── */
function _candidats(keysExistantes) {
  const data = loadData();
  const avecDonnees = _avecDonnees(data);
  const combos = loadChartsCombos();
  const pris = new Set(combos.flatMap(c => c.keys));
  const units = comboUnits(keysExistantes);
  let cands = avecDonnees.filter(k => !keysExistantes.includes(k) && !pris.has(k));
  if (units.length >= 2) cands = cands.filter(k => units.includes(unitOf(k)));
  cands.sort((a, b) => {
    const ua = units.includes(unitOf(a)) ? 0 : 1, ub = units.includes(unitOf(b)) ? 0 : 1;
    if (ua !== ub) return ua - ub;
    return (PARAMS[a].label || a).localeCompare(PARAMS[b].label || b);
  });
  return cands;
}

/* ── menu contextuel ── */
function _menuFermer() { const m = document.getElementById('charts-ctxmenu'); if (m) m.remove(); }
function _menuOuvrir(e, cible) {
  _menuFermer();
  const m = document.createElement('div');
  m.id = 'charts-ctxmenu';
  m.style.cssText = 'position:fixed;z-index:9999;left:' + e.clientX + 'px;top:' + e.clientY + 'px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.45);padding:6px;min-width:230px;max-height:70vh;overflow:auto;font-size:12px';
  const item = (label, onclick, muted) => '<div style="padding:6px 10px;border-radius:6px;cursor:pointer;color:' + (muted ? 'var(--muted)' : 'var(--fg)') + '" onmouseover="this.style.background=\'var(--border)\'" onmouseout="this.style.background=\'\'" onclick="' + onclick + '">' + label + '</div>';
  let html = '';
  const keys = cible.combo !== undefined ? loadChartsCombos()[cible.combo].keys : [cible.key];
  const cands = _candidats(keys);
  const units = comboUnits(keys);
  _menuCible = cible; _menuSel = new Set();
  html += '<div style="padding:4px 10px;color:var(--muted);font-size:11px">' + keys.map(k => PARAMS[k].label || k).join(' ⇆ ') + ' — ejes: ' + units.join(' | ') + '</div>';
  {
    /* P-H 09/08 : le commentaire clinique vit dans son popup déplaçable,
       sans courbe — accessible ici pour les courbes seules ET combinées. */
    const clesJs = "['" + keys.map(k => k.replace(/'/g, '')).join("','") + "']";
    html += '<div style="padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--accent);font-weight:600" onmouseover="this.style.background=\'var(--border)\'" onmouseout="this.style.background=\'\'" onclick="_menuFermer();tblShowComentario(' + clesJs + ',true)">🧠 Comentario clínico</div>' +
      '<div style="border-top:1px solid var(--border);margin:4px 0"></div>';
  }
  html += '<div style="position:sticky;top:0;background:var(--surface);z-index:2;padding:6px 8px 8px;border-bottom:1px solid var(--border)">' +
    '<div style="padding:0 2px 5px;color:var(--muted);font-size:11px">➕ Superponer con… (selección múltiple)</div>' +
    '<button id="menu-btn-add" class="btn" style="width:100%;padding:6px;font-size:12px;opacity:.5" onclick="_menuAjouterSel()">➕ Añadir seleccionados (0)</button></div>';
  if (cands.length) {
    /* groupés par rubrique, dans l'ordre du catalogue GRUPOS */
    const ordre = Object.keys(GRUPOS).concat('OTROS');
    const parGrupo = {};
    cands.forEach(k => { const g = grupoDe(k); (parGrupo[g] = parGrupo[g] || []).push(k); });
    ordre.filter(g => parGrupo[g]).forEach(g => {
      html += '<div style="padding:5px 10px 2px;font-size:10px;letter-spacing:.5px;color:var(--accent);border-top:1px dashed var(--border)">' + g + '</div>';
      parGrupo[g].forEach(k => {
        const meme = units.includes(unitOf(k));
        html += '<label data-cand="' + k + '" data-unit="' + unitOf(k) + '" style="display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;cursor:pointer" ' +
          'onmouseover="this.style.background=\'var(--border)\'" onmouseout="this.style.background=\'\'">' +
          '<input type="checkbox" onclick="event.stopPropagation();_menuToggleCand(this,\'' + k + '\')"/>' +
          '<span>' + (PARAMS[k].label || k) + ' <span style="color:var(--muted)">(' + (unitOf(k) || '—') + (meme ? '' : ' → 2º eje') + ')</span></span></label>';
      });
    });

  } else html += item('(sin candidatos compatibles)', '_menuFermer()', true);
  if (cible.combo !== undefined) {
    html += '<div style="border-top:1px dashed var(--border);margin:4px 0"></div>';
    keys.forEach(k => { html += item('➖ Quitar ' + (PARAMS[k].label || k), '_comboQuitter(' + cible.combo + ',\'' + k + '\')'); });
    html += item('✕ Separar todo', '_comboSupprimer(' + cible.combo + ')');
  }
  m.innerHTML = html;
  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  if (r.bottom > window.innerHeight) m.style.top = Math.max(6, window.innerHeight - r.height - 10) + 'px';
  if (r.right > window.innerWidth) m.style.left = Math.max(6, window.innerWidth - r.width - 10) + 'px';
  setTimeout(() => document.addEventListener('click', function h(ev) {
    const menu = document.getElementById('charts-ctxmenu');
    if (menu && menu.contains(ev.target)) { document.addEventListener('click', h, { once: true }); return; }
    _menuFermer();
  }, { once: true }), 0);
}

/* ── sélection multiple dans le menu ── */
let _menuCible = null, _menuSel = new Set();
function _menuToggleCand(cb, k) {
  if (cb.checked) _menuSel.add(k); else _menuSel.delete(k);
  /* règle des unités sur l'ENSEMBLE (existant + cochés) : désactiver les incompatibles */
  const keys = _menuCible.combo !== undefined ? loadChartsCombos()[_menuCible.combo].keys : [_menuCible.key];
  const units = comboUnits([...keys, ..._menuSel]);
  const menu = document.getElementById('charts-ctxmenu');
  if (menu) {
    menu.querySelectorAll('label[data-cand]').forEach(l => {
      const u = l.getAttribute('data-unit');
      const bloque = units.length >= 2 && !units.includes(u);
      l.style.opacity = bloque ? '.35' : '';
      l.querySelector('input').disabled = bloque && !_menuSel.has(l.getAttribute('data-cand'));
    });
    const btn = menu.querySelector('#menu-btn-add');
    if (btn) { btn.textContent = '➕ Añadir seleccionados (' + _menuSel.size + ')'; btn.style.opacity = _menuSel.size ? '1' : '.5'; }
  }
}
function _menuAjouterSel() {
  if (!_menuSel.size) return;
  const combos = loadChartsCombos();
  if (_menuCible.combo !== undefined) {
    _menuSel.forEach(k => { if (!combos[_menuCible.combo].keys.includes(k)) combos[_menuCible.combo].keys.push(k); });
  } else {
    combos.push({ keys: [_menuCible.key, ..._menuSel], taille: 'aqui' });
  }
  saveChartsCombos(combos);
  _menuSel = new Set(); _menuFermer();
  buildAllCharts();
}

/* ── opérations combos ── */
function _comboProposer(div, k1, k2) {   /* au drop : choix de taille (inchangé) */
  const t1 = PARAMS[k1] ? (PARAMS[k1].label || k1) : k1;
  const t2 = PARAMS[k2] ? (PARAMS[k2].label || k2) : k2;
  div.innerHTML =
    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:170px;text-align:center">' +
      '<div style="font-size:12px;color:var(--fg)">Superponer <b>' + t1 + '</b> ⇆ <b>' + t2 + '</b></div>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="btn" style="padding:6px 14px;font-size:12px" onclick="_comboCreer(\'' + k1 + '\',\'' + k2 + '\',\'aqui\')">📍 Aquí</button>' +
        '<button class="btn" style="padding:6px 14px;font-size:12px" onclick="_comboCreer(\'' + k1 + '\',\'' + k2 + '\',\'grande\')">⛶ En grande</button>' +
      '</div>' +
      '<button onclick="buildAllCharts()" style="cursor:pointer;font-size:11px;border:none;background:none;color:var(--muted);text-decoration:underline">cancelar</button>' +
    '</div>';
}
function _comboCreer(k1, k2, taille) {
  const combos = loadChartsCombos();
  if (!combos.some(c => c.keys.includes(k1) && c.keys.includes(k2)))
    combos.push({ keys: [k1, k2], taille: taille || 'aqui' });
  saveChartsCombos(combos); _dragKey = null;
  buildAllCharts();
}
function _comboCreerMenu(k1, k2) { _comboCreer(k2, k1, 'aqui'); }   /* cible du clic droit = k1 (position) */
function _comboAjouter(i, k) {
  const combos = loadChartsCombos();
  if (combos[i] && !combos[i].keys.includes(k)) {
    const units = comboUnits(combos[i].keys);
    if (units.length >= 2 && !units.includes(unitOf(k))) return _menuFermer();   /* garde-fou */
    combos[i].keys.push(k);
  }
  saveChartsCombos(combos); buildAllCharts();
}
function _comboQuitter(i, k) {
  const combos = loadChartsCombos();
  if (combos[i]) {
    combos[i].keys = combos[i].keys.filter(x => x !== k);
    if (combos[i].keys.length < 2) combos.splice(i, 1);
  }
  saveChartsCombos(combos); buildAllCharts();
}
function _comboSupprimer(i) {
  const combos = loadChartsCombos(); combos.splice(i, 1);
  saveChartsCombos(combos); buildAllCharts();
}
function _comboTaille(i) {
  const combos = loadChartsCombos();
  if (combos[i]) combos[i].taille = combos[i].taille === 'grande' ? 'aqui' : 'grande';
  saveChartsCombos(combos); buildAllCharts();
}
function _grupoToggle(g) {
  const data = loadData();
  const avecDonnees = _avecDonnees(data);
  const cles = avecDonnees.filter(k => grupoDe(k) === g);
  let sel = loadChartsSel(); 
  if (sel === null) {
    const defs = (typeof GRUPOS_DEFECTO !== 'undefined') ? GRUPOS_DEFECTO : null;
    sel = defs ? avecDonnees.filter(k => defs.includes(grupoDe(k))) : avecDonnees.slice();
  }
  const actif = cles.some(k => sel.includes(k));
  sel = actif ? sel.filter(k => !cles.includes(k)) : [...new Set([...sel, ...cles])];
  saveChartsSel(sel); buildAllCharts(data);
}
function _grupoDeplier(g) { _grupoOuvert = (_grupoOuvert === g) ? null : g; buildAllCharts(); }
function _chartsSelToggle(cb) {
  const data = loadData();
  const avecDonnees = _avecDonnees(data);
  let sel = loadChartsSel();
  if (sel === null) {
    const defs = (typeof GRUPOS_DEFECTO !== 'undefined') ? GRUPOS_DEFECTO : null;
    sel = defs ? avecDonnees.filter(k => defs.includes(grupoDe(k))) : avecDonnees.slice();
  }
  const k = cb.getAttribute('data-pkey');
  sel = cb.checked ? [...new Set([...sel, k])] : sel.filter(x => x !== k);
  saveChartsSel(sel); buildAllCharts(data);
}

/* ── graphe combiné : AXE PAR UNITÉ (max 2), pointillés variés par axe ── */
function makeComboChart(canvasId, keys, data) {
  const ctxEl = document.getElementById(canvasId);
  if (!ctxEl) return;
  if (chartInstances[canvasId]) chartInstances[canvasId].destroy();
  const units = comboUnits(keys).slice(0, 2);
  const series = keys.map(k => ({ k, s: getSeriesForParam(data, k) }));
  const dates = [...new Set(series.flatMap(x => x.s.map(p => p.x)))].sort();
  const val = (s, d) => { const m = s.find(p => p.x === d); return m ? m.y : null; };
  const DASH = [[], [6, 3], [2, 2], [8, 3, 2, 3]];
  const STYLES = ['circle', 'rect', 'triangle', 'rectRot'];
  /* P-H 09/08 (Leucocitos + Plaquetas) : même unité mais ordres de
     grandeur trop éloignés → la petite série s'écrasait en ligne quasi
     horizontale. Si le rapport des maxima dépasse 10, les séries
     "petites" passent sur l'axe DROIT même à unité identique — chacune
     occupe alors toute la hauteur. Les couleurs disent qui est où. */
  const surAxe2 = new Set();
  if (units.length === 1 && series.length > 1) {
    const maxDe = {};
    series.forEach(({ k, s }) => { maxDe[k] = Math.max.apply(null, s.map(p => Math.abs(p.y)).concat([0])); });
    const maxGlobal = Math.max.apply(null, Object.values(maxDe));
    series.forEach(({ k }) => { if (maxDe[k] > 0 && maxGlobal / maxDe[k] > 10) surAxe2.add(k); });
    if (surAxe2.size === series.length) surAxe2.clear(); /* toutes petites = rien à séparer */
  }
  const compteurAxe = {};
  const datasets = series.map(({ k, s }) => {
    const u = unitOf(k);
    const axe = (units.indexOf(u) === 1 || surAxe2.has(k)) ? 'y2' : 'y';
    const n = compteurAxe[axe] = (compteurAxe[axe] || 0) + 1;
    return {
      label: PARAMS[k].label || k, data: dates.map(d => val(s, d)), yAxisID: axe,
      borderColor: PARAMS[k].color, backgroundColor: PARAMS[k].color + '18',
      borderDash: DASH[(n - 1) % DASH.length], pointStyle: STYLES[(n - 1) % STYLES.length],
      pointRadius: 5, pointHoverRadius: 7, tension: 0.3, spanGaps: true, fill: false
    };
  });
  const scales = {
    x: { grid: { color: '#2a3348' } },
    y: { position: 'left', grid: { color: '#2a3348' }, ticks: { maxTicksLimit: 5 },
         title: { display: true, text: units[0] || '' } }
  };
  if (units.length > 1) scales.y2 = { position: 'right', grid: { drawOnChartArea: false }, ticks: { maxTicksLimit: 5 }, title: { display: true, text: units[1] } };
  else if (surAxe2.size) scales.y2 = { position: 'right', grid: { drawOnChartArea: false }, ticks: { maxTicksLimit: 5 }, title: { display: true, text: units[0] || '' } };
  chartInstances[canvasId] = new Chart(ctxEl, {
    type: 'line',
    data: { labels: dates.map(fmtDate), datasets },
    options: { responsive: true,
      plugins: { legend: { display: true, labels: { usePointStyle: true, font: { size: 10 } } } },
      scales }
  });
}
