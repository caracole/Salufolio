/* étape 2 (P-H, 05/11/2026) : el comentario de la IA, las preguntas para el médico */
.es-ia{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}

/* los pliegues, la casilla de impresión, las sugeridas (P-H, 05/11/2026, 19:03) */

<script>
/* ═════════════════════════════════════════════════════════════════════
   ESPECIALIDAD — programa autónomo de Salufolio V2
   Versión 2026.11.05-20:12:21
   (05/11/2026, 19:03 : P-H — tratamientos plegables ; una sola carta « Preparar la consulta » ; la hoja : en curso, abandonados del año con su razón, el año en curso, próximas citas, valores marcados ☑ ; sin página en blanco.)
   (05/11/2026 : étape 2 — el comentario de la IA « desde la última consulta », las preguntas para el médico ; Neurología.)
   (05/11/2026 : creado — P-H : « avoir des cartes par spécialités, à cause des RV Neumólogo et Cardiólogo ».)

   Una tarjeta por especialidad en la casa, UN SOLO programa : la tarjeta
   dice cuál (?esp=neumologia) ; la tabla común comun/especialidades.js dice
   lo que se muestra (« ficha » : parámetros con su normal, medicamentos).
   Cuatro cartas : desde la última consulta · las consultas · los valores ·
   los tratamientos ; y una hoja para imprimir. La página solo LEE.

       especialidad.html?esp=neumologia&mf=DSF2026&carpeta=../pacientes/DSF2026/
   ═════════════════════════════════════════════════════════════════════ */
const VERSION_PROGRAMA = SF_CONFIG.version;
var _DATOS = null;
const _ESP_ID = new URLSearchParams(location.search).get('esp') || '';

/* ── los textos, la lengua, lo pequeño ── */
function _esLg(){ try { return MF.idioma() || 'es'; } catch (e) { return 'es'; } }
function txe(k, v){
  const T = (window.SF_TEXTOS && SF_TEXTOS.textos) || {}, L = T[_esLg()] || {};
  if (v && v.n === 1 && (L[k + '_1'] || (T.es && T.es[k + '_1']))) k = k + '_1';
  let s = L[k] || (T.es && T.es[k]) || k;
  Object.keys(v || {}).forEach(x => { s = s.split('{' + x + '}').join(v[x]); });
  return s;
}
function _esEsc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function _esF(d){ return d && d.length >= 10 ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : (d || ''); }
function _esHoy(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function _esMenosMeses(iso, m){ const d = new Date(iso + 'T12:00:00'); d.setMonth(d.getMonth() - m); return d.toISOString().slice(0, 10); }
function _esCfg(){ return Object.assign({ meses_sin_visita: 12, meses_tratamiento: 12, estados_fin: [], max_anteriores: 8, umbral_flecha: 0.05, impresion: {} }, SF_CONFIG.ficha || {}); }

/* ── las especialidades : la tabla común, preparada una vez ── */
function _esTabla(){
  return ((window.SF_ESPECIALIDADES && SF_ESPECIALIDADES.especialidades) || []).map(e => Object.assign({}, e, {
    _srv: e.servicios ? new RegExp(e.servicios, 'i') : null, _pal: e.palabras ? new RegExp(e.palabras, 'i') : null }));
}
function _esNom(e){ const t = (e && e.etiqueta) || {}; return t[_esLg()] || t.es || (e && e.id) || ''; }
/* la especialidad de un acontecimiento — la misma regla que la Cronología y el Resumen */
function _esDe(ev, T){
  if (ev && ev._esp) { const f = T.find(e => e.id === ev._esp); if (f) return f; }
  const pr = MF.procedencia ? MF.procedencia(ev, true) : { servicio: '' };
  const ts = (ev.type || '') + ' ' + (pr.servicio || '');
  for (const e of T.slice().sort((a, b) => (a.orden || 99) - (b.orden || 99))) if (e._srv && e._srv.test(ts)) return e;
  const bl = (ev.titre || ev.title || '') + ' ' + (ev.description || ev.text || '');
  for (const e of T) if (e._pal && e._pal.test(e.solo_titulo ? String(ev.titre || ev.title || '') : bl)) return e;
  return T.find(e => e.por_defecto) || T[T.length - 1] || {};
}
/* los acontecimientos, una vez cada uno, del más reciente al más antiguo */
function _esEventos(d, T){
  const visto = {}, vistoEsp = {}, out = [];
  (d.events || []).concat((MF.eventosRegistros ? MF.eventosRegistros(d) : [])).forEach(e => {
    if (!e || !e.date || isNaN(new Date(e.date).getTime())) return;
    if (e.date > _esHoy()) return;   /* lo que aún no ha pasado es una cita : va a « Próximas citas », no a las consultas */
    const k = e.date + '|' + String(e.titre || e.title || e.type || '').trim().toUpperCase();
    if (visto[k]) return; visto[k] = 1;
    const esp = _esDe(e, T), kd = e.date + '|' + esp.id;
    if (e._registro ? vistoEsp[kd] : (esp.uno_por_dia && vistoEsp[kd])) return;
    if (!e._registro) vistoEsp[kd] = 1;
    out.push({ ev: e, esp: esp });
  });
  return out.sort((a, b) => a.ev.date < b.ev.date ? 1 : -1);
}

/* ── los valores : todas las series, bajo su clave única ── */
function _esSeries(d){
  const S = {};
  (MF.mesuresCanon ? MF.mesuresCanon(d) : []).forEach(t => Object.keys(t.vals || {}).forEach(k => {
    const v = parseFloat(t.vals[k]); if (isNaN(v)) return; (S[k] = S[k] || []).push([t.date, v, t.pdf_id || '']); }));
  Object.keys(S).forEach(k => S[k].sort((a, b) => a[0] < b[0] ? -1 : 1));
  return S;
}
function _esEtiq(k){ const P = ((window.SF_SINONIMOS_PARAMETROS || {}).parametros || {})[k] || {}; const e = P.etiqueta || {}; return [e[_esLg()] || e.es || k, P.unidad || '']; }
function _esFuera(v, n){ return !!n && ((n[0] != null && v < n[0]) || (n[1] != null && v > n[1])); }
function _esRango(n){ if (!n) return ''; return n[0] != null && n[1] != null ? n[0] + '–' + n[1] : n[0] != null ? '≥ ' + n[0] : '≤ ' + n[1]; }
function _esCurvita(s, color){
  const w = 84, h = 20, ys = s.map(x => x[1]), mn = Math.min.apply(null, ys), r = (Math.max.apply(null, ys) - mn) || 1;
  const pts = s.map((x, i) => ((s.length > 1 ? i * (w - 4) / (s.length - 1) + 2 : w / 2).toFixed(1) + ',' + (h - 3 - (x[1] - mn) / r * (h - 6)).toFixed(1))).join(' ');
  return '<svg class="es-svg" width="' + w + '" height="' + h + '"><polyline points="' + pts + '"' + (color ? ' style="stroke:' + color + '"' : '') + '/></svg>';
}

/* ── los tratamientos — la regla del Resumen (P-H, 04/11/2026) ── */
function _esMedFecha(m, a, b, c){ return m[a] || m[b] || m[c] || ''; }
function _esTratamientos(d, rx){
  const C = _esCfg(), hoy = _esHoy(), lim = _esMenosMeses(hoy, C.meses_tratamiento), fin = (C.estados_fin || []).map(x => String(x).toLowerCase());
  const raw = (d.medicaments || []).filter(m => m && rx.test(String(m.nombre || m.nom || '') + ' ' + String((MF.principioDe && MF.principioDe(m.nombre || m.nom || '')) || '')));
  const cron = {};
  raw.forEach(m => { if (MF.esCronico && MF.esCronico(m)) { const u = MF.medicamentosUnicos([m])[0]; if (u) cron[u._clave] = 1; } });
  const curso = [], ant = [];
  (MF.medicamentosUnicos ? MF.medicamentosUnicos(raw) : raw).forEach(m => {
    const est = String(m.estado || m.statut || '').toLowerCase(), desde = _esMedFecha(m, 'desde', 'date_debut', 'date'), hasta = _esMedFecha(m, 'hasta', 'date_fin', 'fin');
    const esCron = (MF.esCronico && MF.esCronico(m)) || !!cron[m._clave], x = { m: m, desde: desde, hasta: hasta, cron: esCron };
    const parado = est && fin.indexOf(est) >= 0;
    if (!parado && desde && desde >= lim && hasta && hasta > hoy) curso.push(x);
    else if (!parado && esCron && !hasta) curso.push(x);
    else if (!parado && esCron && hasta) { x.caducado = hasta; curso.push(x); }
    else ant.push(x);
  });
  ant.sort((a, b) => (b.hasta || b.desde) < (a.hasta || a.desde) ? -1 : 1);
  return { curso: curso, ant: ant };
}

/* ── LA VISTA ── */
let _ES = null;   /* lo calculado, para la hoja impresa */
function buildEspecialidad(){
  const d = _DATOS; if (!d) return;
  const T = _esTabla(), esp = T.find(e => e.id === _ESP_ID), C = _esCfg(), hoy = _esHoy();
  if (!esp) { const a = document.getElementById('aviso'); a.style.display = 'block'; a.textContent = txe('es_sin_esp'); document.getElementById('panel-especialidad').style.display = 'none'; return; }
  const F = esp.ficha || {}, nombre = (F.icono || '') + ' ' + _esNom(esp);
  document.title = _esNom(esp) + ' · Salufolio';
  const ti = document.getElementById('titulo'); if (ti) ti.textContent = nombre;
  const E = _esEventos(d, T), mias = E.filter(x => x.esp.id === esp.id), S = _esSeries(d);
  const ult = mias[0] ? mias[0].ev.date : '', desde = ult || _esMenosMeses(hoy, C.meses_sin_visita);
  const nada = '<div class="es-nada">' + _esEsc(txe('es_nada')) + '</div>';
  const R = { esp: esp, nombre: nombre, ult: ult, desde: desde };

  /* la banda : sexo, edad, consultas, período, la última — nunca el nombre */
  const b = ['<span class="es-nombre">' + _esEsc(nombre) + '</span>'], nac = parseInt(d.nacimiento || '', 10), sx = String(d.sexo || '').toLowerCase();
  const sxk = /^(muj|fem|f$|wom|dona)/.test(sx) ? 'es_mujer' : /^(hom|masc|m$|male|man|h$)/.test(sx) ? 'es_hombre' : '';
  if (sxk) b.push('<b>' + _esEsc(txe(sxk)) + '</b>');
  if (nac > 1900) b.push('<b>' + _esEsc(txe('es_anos', { n: new Date().getFullYear() - nac })) + '</b>');
  if (mias.length) {
    const pr = MF.procedencia ? MF.procedencia(mias[0].ev) : '';
    b.push('<span>' + _esEsc(txe('es_consultas', { n: mias.length })) + ' · ' + _esEsc(txe('es_periodo', { a: mias[mias.length - 1].ev.date.slice(0, 4), b: ult.slice(0, 4) })) + '</span>');
    b.push('<span' + (pr ? ' data-ptip="' + _esEsc(pr) + '"' : '') + '>' + _esEsc(txe('es_ultima', { f: _esF(ult) })) + '</span>');
  } else b.push('<span>' + _esEsc(txe('es_ninguna')) + '</span>');
  b.push('<button class="es-imp" data-ptip="' + _esEsc(txe('es_tip_imprimir')) + '" onclick="esImprime()">' + _esEsc(txe('es_imprimir')) + '</button>');
  document.getElementById('es-banda').innerHTML = b.join('');
  R.banda = b.slice(1, -1).map(x => x.replace(/<[^>]+>/g, '')).filter(Boolean).join(' · ');

  /* 1 · DESDE LA ÚLTIMA CONSULTA — lo que el médico quiere saber */
  document.getElementById('es-h-desde').innerHTML = _esEsc(txe('es_desde_tit')) + '<small>' + _esEsc(ult ? txe('es_desde_sub', { f: _esF(ult) }) : txe('es_desde_sub_sin', { m: C.meses_sin_visita })) + '</small>';
  const desp = E.filter(x => x.ev.date > desde && x.esp.id !== esp.id);
  const urg = desp.filter(x => x.esp.orden), otras = {};

/* ── la altura : en pantalla ancha, cada carta con su propio ascensor, la página no se desplaza ── */
function _esAltura(){
  const g = document.getElementById('es-grid'); if (!g) return;
  const tres = getComputedStyle(g).gridTemplateColumns.split(' ').filter(Boolean).length >= 3;
  g.querySelectorAll('.es-cuerpo').forEach(c => { c.style.maxHeight = ''; });
  if (!tres) return;
  const alto = Math.max(260, window.innerHeight - g.getBoundingClientRect().top - 30);
  g.querySelectorAll(':scope > .es-carta > .es-cuerpo').forEach(c => { c.style.maxHeight = (alto - 40) + 'px'; });
  /* una columna de varias cartas : lo que queda, repartido entre sus cuerpos que se desplazan */
  g.querySelectorAll(':scope > .es-col').forEach(col => {
    const cs = Array.from(col.querySelectorAll('.es-cuerpo')); if (!cs.length) return;
    const fijo = col.offsetHeight - cs.reduce((s, c) => s + c.offsetHeight, 0);
    const cada = Math.max(80, Math.round((alto - fijo) / cs.length));
    cs.forEach(c => { if (c.scrollHeight > cada) c.style.maxHeight = cada + 'px'; });
  });
}
window.addEventListener('resize', function(){ clearTimeout(window._esAT); window._esAT = setTimeout(_esAltura, 120); });

/* ══ ÉTAPE 2 (P-H, 05/11/2026) — EL COMENTARIO DE LA IA « DESDE LA ÚLTIMA CONSULTA » ══
   Lo que sale hacia la IA, y nada más : sexo, edad, los diagnósticos si se marca la casilla
   (SF_COMENTARIO_IA.lineaContexto), los TÍTULOS y fechas de los acontecimientos desde la última
   consulta, los nombres de los medicamentos, las series de la ficha. Nunca un nombre, un SIP,

   comun/prompt-comentario-especialidad.js. El comentario se guarda en este navegador. */
function _esMat(){ try { return (MF.matricula && MF.matricula()) || (MF.paciente() || {}).matricula || ''; } catch (e) { return ''; } }

function _esEntrada(R){
  const P = window.SF_PROMPT_COMENTARIO_ESPECIALIDAD || {}, E = P.etiquetas || {};
  const ev = R.desde_urg.map(x => x.ev.date + ' · ' + _esNomEs(x.esp) + ' · ' + String(x.ev.title || x.ev.titre || '').slice(0, 140))
    .concat(Object.values(R.desde_otras).map(o => (E.otras || 'otras consultas') + ' · ' + _esNomEs(o.e) + ' : ' + o.n));
  const med = R.TR.curso.map(x => (E.en_curso || 'en curso') + ' : ' + (x.m._principio || x.m.nombre || '') + (x.cron ? ' (' + (E.cronico || 'crónico') + ')' : ''))
    .concat(R.nuevos.map(m => (E.nuevo || 'nuevo') + ' ' + _esMedFecha(m, 'desde', 'date_debut', 'date') + ' : ' + (m._principio || m.nombre || '')))
    .concat(R.parados.map(m => (E.parado || 'terminado') + ' ' + _esMedFecha(m, 'hasta', 'date_fin', 'fin') + ' : ' + (m._principio || m.nombre || '')));
  const F = R.esp.ficha || {}, max = P.puntos_max || 10;
  const series = (F.parametros || []).filter(p => R.S[p.k]).map(p => { const L = _esEtiqEs(p.k);
    return { etiqueta: L[0], unidad: L[1], ref: p.normal || null, desc: '', puntos: R.S[p.k].slice(-max).map(x => ({ x: x[0], y: x[1] })) }; });
  return { acontecimientos: ev.join('\n') || (E.nada || '—'), medicacion: med.join('\n') || (E.nada || '—'), series: series };
}

/* ── PREPARAR LA CONSULTA (P-H, 05/11/2026, 18:36 : « pourquoi un cadre preguntas alors qu'il y a les questions suggérées par l'IA ? repenser ») ──
