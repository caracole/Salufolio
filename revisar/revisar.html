}






/* ══════════════════════════════════════════════════════════════════════
   LES SOURCES ABRÉGÉES (P-H, 09/09)

   « les libellés des fuentes occupent beaucoup dans la liste — ce serait
     bien d'avoir un abrégé associé, et au passage de la souris on affiche
     en clair dans une tooltip maison »

   L'abrégé vit dans la table « centros » de l'EXPEDIENTE : les sources
   sont propres au parcours de chaque patient. Les catégories du filtre,
   elles, sont standard et vivent dans revisar.js.

   Deux façons de les remplir : l'API les propose à l'extraction, et le
   clic sur la source permet de corriger l'abrégé ou le nom en clair.
   ══════════════════════════════════════════════════════════════════════ */

/* le filtre se peuple depuis la configuration — rien en dur */
function pintaFiltro(){
  var sel = document.getElementById('event-filter');
  if(!sel) return;
  var C = (SF_CONFIG.categorias)||[];
  var lg = (typeof MF!=='undefined' && MF.idioma)? MF.idioma() : 'es';
  sel.innerHTML = C.map(function(c){
    var n = (c.nombre && (c.nombre[lg] || c.nombre.es)) || c.id;
    return '<option value="' + c.id + '">' + n + '</option>';
  }).join('');
}
function colorDe(tipo){
  var c = ((SF_CONFIG.categorias)||[]).filter(function(x){ return x.id===tipo; })[0];
  return (c && c.color) || 'var(--muted)';
}

/* ── la table des sources, dans l'expediente ── */
function _fuentes(){
  var c = _asegura().centros;
  if(!Array.isArray(c)) { c = []; _asegura().centros = c; }
  return c;
}
function _normFuente(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
         .replace(/[^a-z0-9]+/g,' ').trim();
}
/* l'abrégé d'une source — celui qu'on a, ou un que l'on devine */
function abrevDe(nombre){
  /* v3 (P-H, 09/09) : PAS D'INVENTION. Elle rend l'abrégé qui existe,
     rien d'autre. Vide c'est vide — pas un tiret, pas des initiales
     devinées. C'est à celui qui appelle de décider ce qu'il affiche. */
  if(!nombre) return '';
  var n = _normFuente(nombre);
  var f = _fuentes().filter(function(x){
    return _normFuente(x.nombre || x.name || x) === n; })[0];
  return (f && f.abrev) ? f.abrev : '';
}

/* le clic sur la source : corriger l'abrégé ou le nom en clair */

/* les abrégés déjà employés, avec ce qu'ils désignent (P-H, 09/09) :
   « bcp de noms différents qui ont le même abrégé » */
function abrevsConocidas(){
  var cuenta = {};
  _fuentes().forEach(function(x){
    var a = x.abrev; if(!a) return;
    if(!cuenta[a]) cuenta[a] = { abrev:a, cuantas:0, ejemplo:x.nombre||x.name||'' };
    cuenta[a].cuantas++;
  });
  return Object.keys(cuenta).sort().map(function(k){ return cuenta[k]; });
}

function editaFuente(nombre, alGuardar){
  var n = _normFuente(nombre);
  var L = _fuentes();
  var i = L.findIndex(function(x){ return _normFuente(x.nombre || x.name || x) === n; });
  var f = (i>=0)? L[i] : { nombre:nombre, abrev:abrevDe(nombre) };
  if(typeof f === 'string') f = { nombre:f, abrev:abrevDe(f) };

  var fondo = document.createElement('div');
  fondo.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9500;'
    +'display:flex;align-items:center;justify-content:center;padding:20px';
  fondo.innerHTML = '<div style="background:var(--surface);border:1px solid var(--accent);'
    + 'border-radius:12px;padding:20px 24px;max-width:520px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.5)">'
    + '<div style="font-family:var(--serif);font-size:16px;margin-bottom:4px">🏥 La fuente</div>'
    + '<div style="font-size:11.5px;color:var(--muted);margin-bottom:14px">'
    + 'Corregir el nombre en claro, o su abreviatura. Una misma fuente escrita de tres '
    + 'maneras es una fuente de más.</div>'
    + '<label style="font-size:11px;color:var(--muted)">Nombre en claro</label>'
    + '<input id="_f-nombre" value="' + String(f.nombre||nombre).replace(/"/g,'&quot;') + '"'
    + ' style="width:100%;margin:4px 0 12px;padding:7px 10px;background:var(--bg);color:var(--text);'
    + 'border:1px solid var(--border);border-radius:6px;font-size:13px">'
    + '<label style="font-size:11px;color:var(--muted)">Abreviatura</label>'
    + '<div style="font-size:10.5px;color:var(--muted);margin:2px 0 4px">'
    + 'Elija una existente o escriba otra — varias fuentes pueden compartir la misma.</div>'
    + '<input id="_f-abrev" list="_f-abrevs" value="' + String(f.abrev||'').replace(/"/g,'&quot;') + '"'
    + ' style="width:100%;margin:4px 0 16px;padding:7px 10px;background:var(--bg);color:var(--text);'
    + 'border:1px solid var(--border);border-radius:6px;font-family:var(--mono);font-size:13px"'
    + ' placeholder="escriba o elija una">'
    + '<datalist id="_f-abrevs">' + abrevsConocidas().map(function(a){
        return '<option value="' + a.abrev + '">' + a.cuantas + ' fuente'
             + (a.cuantas>1?'s':'') + ' · ' + a.ejemplo + '</option>'; }).join('')
      + '</datalist>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end">'
    + '<button id="_f-cancel" style="padding:6px 14px;border-radius:7px;border:1px solid var(--border);'
    + 'background:transparent;color:var(--muted);cursor:pointer;font-size:12.5px">Cancelar</button>'
    + '<button id="_f-ok" style="padding:6px 16px;border-radius:7px;border:1px solid var(--accent);'
    + 'background:rgba(74,143,232,.15);color:var(--text);cursor:pointer;font-size:12.5px">Guardar</button>'
    + '</div></div>';
  document.body.appendChild(fondo);
  var inp = fondo.querySelector('#_f-nombre'); inp.focus(); inp.select();

  /* v2 (P-H, 09/09) : choisir un abrégé propose le nom en clair de la
     source qui le porte — corrigeable avant de garder (voie B). */
  var iAbr = fondo.querySelector('#_f-abrev');
  iAbr.onchange = function(){
    var a = iAbr.value.trim();
    if(!a) return;
    var q = _fuentes().filter(function(x){ return x.abrev === a; });
    if(!q.length) return;
    var actual = inp.value.trim();
    if(!actual){ inp.value = q[0].nombre || ''; inp.focus(); inp.select(); return; }
    if(_normFuente(actual) === _normFuente(q[0].nombre||'')) return;
    if(q.length===1){
      if(confirm('« ' + a + ' » designa:\n\n' + q[0].nombre + '\n\n¿Poner ese nombre en claro?'))
        { inp.value = q[0].nombre; inp.focus(); }
    } else {
      var lista = q.map(function(x,i){ return (i+1)+') '+x.nombre; }).join('\n');
      var n = prompt('« ' + a + ' » designa ' + q.length + ' fuentes:\n\n' + lista
                     + '\n\n¿Cuál? (número, o vacío para dejar el nombre actual)');
      var k = parseInt(n,10);
      if(k>=1 && k<=q.length){ inp.value = q[k-1].nombre; inp.focus(); }
    }
  };

  function cierra(){ document.body.removeChild(fondo); }
  fondo.querySelector('#_f-cancel').onclick = cierra;
  fondo.onclick = function(e){ if(e.target===fondo) cierra(); };
  fondo.querySelector('#_f-ok').onclick = function(){
    var nom = fondo.querySelector('#_f-nombre').value.trim() || nombre;
    var abr = fondo.querySelector('#_f-abrev').value.trim() || abrevDe(nom);
    if(i>=0) L[i] = { nombre:nom, abrev:abr };
    else L.push({ nombre:nom, abrev:abr });
    _asegura().centros = L;
    MF.tocado();
    cierra();
    if(alGuardar) alGuardar(nom, abr);
    refresca();
  };
}

/* la cellule d'une source : l'abrégé, le nom entier dans l'infobulle */
function celdaFuente(nombre, alClic){
  /* l'abrégé s'il existe ; sinon le nom entier, raccourci — c'est ici
     qu'on décide de l'affichage, pas dans abrevDe (P-H, 09/09) */
  var abr = abrevDe(nombre);
  if(!abr) abr = nombre ? (String(nombre).length>14 ? String(nombre).substring(0,14)+'…' : String(nombre)) : '—';
  return '<td style="padding:4px 8px;cursor:pointer;font-size:11px;color:var(--muted);width:96px"'
    + ' data-ptip="' + String(nombre||'—').replace(/"/g,'&quot;') + '"'
    + ' onclick="' + alClic + '">' + abr + '</td>';
}

/* ══════════════════════════════════════════════════════════════════════
   LES MÉDICAMENTS DANS LA MÊME TABLE (P-H, 09/09)

   « Rien n'empêche de l'ajouter aux filtres ici, l'épuration est plus
     simple sans passer par le complexe Medicamentos. »

   Le filtre « medicamentos » montre les traitements dans les mêmes cinq
   colonnes : Fecha · Tipo · Título · Fuente · ✕ — tout corrigeable.
   ══════════════════════════════════════════════════════════════════════ */
function _medFecha(m){ return m.desde || m.fecha || m.date || ''; }
function _medNombre(m){ return m.nombre || m.nom || ''; }
function _medFin(m){ return m.hasta || m.date_fin || m.fin || ''; }

function buildMedsList(){
  var el = document.getElementById('import-list');
  if(!el) return;
  var L = loadMeds();
  if(!L.length){
    el.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:8px">No hay medicamentos.</div>';
    return;
  }
  var hoy = new Date().toISOString().substring(0,10);

  var html = '<div style="font-size:11px;color:var(--muted);margin-bottom:6px">'
    + 'Haga clic en cualquier celda para editarla.</div>'
    + '<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr>'
    + '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px;width:90px">Fecha</th>'
    + '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px;width:90px">Tipo</th>'
    + '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px">Título</th>'
    + '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px;width:120px">Fuente</th>'
    + '<th style="text-align:center;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px;width:40px">✕</th>'
    + '</tr></thead><tbody>';

  /* du plus récent au plus ancien, comme les événements */
  var orden = L.map(function(m,i){ return {m:m, i:i}; })
               .sort(function(a,b){ return _medFecha(a.m) < _medFecha(b.m) ? 1 : -1; });

  orden.forEach(function(x){
    var m = x.m, idx = x.i;
    var ff = _medFin(m), vivo = (!ff || ff >= hoy);
    var col = vivo ? 'var(--ok)' : 'var(--muted)';
    var prin = (typeof MF!=='undefined' && MF.principioDe)? MF.principioDe(_medNombre(m)) : null;
    var titulo = _medNombre(m)
      + ((m.dosis||m.dose)? ' ' + (m.dosis||m.dose) : '')
      + ((m.frecuencia||m.frequence)? ' — ' + (m.frecuencia||m.frequence) : '');
    var corto = titulo.length>50 ? titulo.substring(0,50)+'…' : titulo;
    html += '<tr style="border-bottom:1px solid var(--border)">'
      + '<td style="padding:4px 8px;cursor:pointer" onclick="editMedCell(' + idx + ',\'fecha\',this)">'
        + '<span style="font-family:var(--mono);font-size:11px">'
        + (_medFecha(m)? fmtDate(_medFecha(m)) : '⚠ sin fecha') + '</span></td>'
      + '<td style="padding:4px 8px;cursor:pointer" onclick="editMedCell(' + idx + ',\'estado\',this)">'
        + '<span style="background:' + col + '20;color:' + col + ';padding:2px 8px;border-radius:4px;'
        + 'font-size:10px;font-weight:600;text-transform:uppercase">'
        + (vivo? 'en curso' : 'terminado') + '</span></td>'
      + '<td style="padding:4px 8px;cursor:pointer;font-size:12px" onclick="editaTituloMed(' + idx + ')"'
        + ' data-ptip="' + titulo.replace(/"/g,'&quot;') + (prin? '  ·  ' + prin : '') + '">' + corto + '</td>'
      + celdaFuente(m.source || m.fuente || '', 'editaFuenteMed(' + idx + ')')
      + '<td style="padding:4px 8px;text-align:center"><button onclick="deleteMed(' + idx + ')"'
        + ' style="background:transparent;border:1px solid var(--danger);color:var(--danger);'
        + 'border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer;font-family:var(--mono)">✕</button></td>'
      + '</tr>';
  });
  html += '</tbody></table>';
  var vivos = L.filter(function(m){ var f=_medFin(m); return !f || f>=hoy; }).length;
  html += '<div style="font-size:11px;color:var(--muted);margin-top:8px">'
    + L.length + ' medicamento(s) · <b>' + vivos + '</b> en curso</div>';
  el.innerHTML = html;
}

/* la même édition sur place que pour les événements */
function editMedCell(idx, campo, td){
  var L = loadMeds();
  if(idx<0 || idx>=L.length) return;
  var m = L[idx];

  if(campo==='estado'){
    /* on met ou on ôte la date de fin : c'est elle qui dit « terminé » */
    var inp = document.createElement('input');
    inp.type='date'; inp.value = _medFin(m) || '';
    inp.style.cssText='font-family:var(--mono);font-size:11px;padding:2px;background:var(--bg);'
      + 'color:var(--text);border:1px solid var(--accent);border-radius:4px';
    inp.title='fecha de fin — vacía quiere decir « en curso »';
    td.innerHTML=''; td.appendChild(inp); inp.focus();
    inp.onblur=function(){
      if(inp.value) m.hasta=inp.value; else { delete m.hasta; delete m.date_fin; delete m.fin; }
      saveMeds(L); buildMedsList(); refresca();
    };
    return;
  }

  var valor = (campo==='fecha')? _medFecha(m)
            : (campo==='nombre')? _medNombre(m)
            : (m.source || m.fuente || '');
  var inp = document.createElement('input');
  inp.type = (campo==='fecha')? 'date' : 'text';
  inp.value = valor;
  inp.style.cssText='font-family:var(--mono);font-size:11px;padding:2px;width:100%;background:var(--bg);'
    + 'color:var(--text);border:1px solid var(--accent);border-radius:4px';
  td.innerHTML=''; td.appendChild(inp); inp.focus(); inp.select();
  function guarda(){
    var v = inp.value.trim();
    if(campo==='fecha')       { m.desde = v; if(m.date) m.date = v; }
    else if(campo==='nombre') { if(m.nombre!==undefined) m.nombre=v; else m.nom=v; }
    else                      { m.source = v; }
    saveMeds(L); buildMedsList(); refresca();
  }
  inp.onblur = guarda;
  inp.onkeydown = function(e){
    if(e.key==='Enter') inp.blur();
    if(e.key==='Escape'){ inp.onblur=null; buildMedsList(); }
  };
}

/* le titre par le MÊME popup que les événements — voie A (P-H, 09/09) */
function editaTituloMed(idx){
  var L = loadMeds();
  if(idx<0 || idx>=L.length) return;
  var m = L[idx];
  var actual = _medNombre(m)
    + ((m.dosis||m.dose)? ' ' + (m.dosis||m.dose) : '')
    + ((m.frecuencia||m.frequence)? ' — ' + (m.frecuencia||m.frequence) : '');
  /* le popup maison, désormais dans les communs (P-H, 09/09) */
  if(typeof MF!=='undefined' && MF.popupTexto){
    MF.popupTexto('el tratamiento', actual, function(nuevo){
      /* on remet le nom, la dose et la fréquence à leur place */
      var p = nuevo.split('—');
      var izq = p[0].trim();
      if(p.length>1){ if(m.frecuencia!==undefined) m.frecuencia=p[1].trim(); else m.frequence=p[1].trim(); }
      if(m.nombre!==undefined) m.nombre = izq; else m.nom = izq;
      saveMeds(L); buildMedsList(); refresca();
    });
  } else {
    var nuevo = prompt('Editar el tratamiento:', actual);
    if(nuevo===null) return;
    if(m.nombre!==undefined) m.nombre = nuevo.trim(); else m.nom = nuevo.trim();
    saveMeds(L); buildMedsList(); refresca();
  }
}

function editaFuenteMed(idx){
  var L = loadMeds();
  if(idx<0 || idx>=L.length) return;
  editaFuente(L[idx].source || L[idx].fuente || '', function(nom){
    L[idx].source = nom; saveMeds(L); buildMedsList();
  });
}

function deleteMed(idx){
  var L = loadMeds();
  if(idx<0 || idx>=L.length) return;
  if(!confirm('¿Quitar «' + _medNombre(L[idx]) + '» del expediente?')) return;
  L.splice(idx,1); saveMeds(L); buildMedsList(); refresca();
}

/* le filtre choisit ce qu'on montre : les événements ou les médicaments */
function pintaLoImportado(){
  var f = (document.getElementById('event-filter')||{}).value || 'todos';
  if(f === 'medicamentos') buildMedsList();
  else buildImportList();
}


function refresca(){
  try{
    var n=loadData().length, e=loadEvents().length, m=loadMeds().length;
    document.getElementById('x-est').textContent =
      n + ' extracciones · ' + e + ' eventos · ' + m + ' medicamentos';
    document.getElementById('c-importado').textContent = e + ' eventos · ' + m + ' medicamentos';
    document.getElementById('c-mediciones').textContent = n;
    pintaLoImportado();
    if(typeof buildMesuresList === 'function') buildMesuresList();
  }catch(err){ console.warn(err); }
}

MF.arranca({
  alCargar: function(d){
    _DATOS = d;
    var p = MF.paciente();
    document.getElementById('x-pac').textContent = p.etiqueta || p.matricula || '';
    document.getElementById('aviso').style.display = 'none';
    pintaFiltro(); refresca(); MF.ponVersion();
  },
  alFallar: function(msg){
    var a=document.getElementById('aviso');
    a.style.display='block';
    a.innerHTML='<b>'+msg+'</b><br><br>Use <b>📂</b> para abrir un expediente.';
    pintaFiltro(); MF.ponVersion();
  }
});
</script>
