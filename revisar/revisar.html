/* ═══════════════════════════════════════════════════════════════════════
   REVISAR — programa autónomo de Salufolio V2
   Versión 2026.09.09-11:17:03

   « Il faut séparer la consultation / corrections de l'acquisition. »
                                                        — P-H, 09/09/2026

   El antiguo Datos hacía tres oficios en una pantalla, y por eso estaba
   enredado. Aquí solo uno: MIRAR Y CORREGIR lo que ya está. La entrada
   manual y la lectura de PDF son otros programas.

   La tabla es la de la V1, con sus cinco columnas — Fecha · Tipo ·
   Título · Fuente · ✕, todo corregible. Solo se le ha añadido
   « medicamentos » al filtro, como pidió P-H.

   MÓDULO AUTO-INSTALABLE: al abrirse se declara al lanzador.
   ═══════════════════════════════════════════════════════════════════════ */
const VERSION_PROGRAMA = SF_CONFIG.version;
const APP_VERSION = SF_CONFIG.version;
const APP_VERSION_DATE = SF_CONFIG.version;

/* ══ LES PONTS vers mf.js ══
   Ce qui parlait au localStorage lit maintenant le dossier. Les noms
   sont ceux du dossier : « prescriptores », « servicios », « centros ». */
var _DATOS = null;
function _asegura(){
  if(!_DATOS) _DATOS={ formato:'salufolio', version:'1.0', mesures:[], events:[], medicaments:[] };
  return _DATOS;
}
function loadData(){       return _asegura().mesures || []; }
function saveDataArr(v){   _asegura().mesures=v; MF.tocado(); }
function loadEvents(){     return _asegura().events || []; }
function saveEvents(v){    _asegura().events=v; MF.tocado(); }

function saveMeds(v){      _asegura().medicaments=v; MF.tocado(); }
function saveData(){       if(_DATOS) MF.tocado(); }
function getPatientLabel(){ var p=MF.paciente(); return p.etiqueta||p.matricula||''; }
function showPanel(){} function switchTab(){}
function loadServicios(){      return _asegura().servicios || []; }
function saveServicios(v){     _asegura().servicios=v; MF.tocado(); }
function loadServiciosTabla(){ return loadServicios(); }
function saveServiciosTabla(v){ saveServicios(v); }
function loadCentros(){        return _asegura().centros || []; }
function saveCentros(v){       _asegura().centros=v; MF.tocado(); }
function loadCentrosTabla(){   return loadCentros(); }
function saveCentrosTabla(v){  saveCentros(v); }
function loadPrescriptores(){  return _asegura().prescriptores || _asegura().mt_prescripteurs || []; }
function savePrescriptores(v){ _asegura().prescriptores=v; MF.tocado(); }
function loadPrescriptoresTabla(){ return loadPrescriptores(); }
function savePrescriptoresTabla(v){ savePrescriptores(v); }
function loadAntecedentes(){   return _asegura().antecedentes || []; }
function saveAntecedentes(v){  _asegura().antecedentes=v; MF.tocado(); }
function loadArchivos(){       return _asegura().archivos || {}; }
function saveArchivos(v){      _asegura().archivos=v; MF.tocado(); }
function baseSalufolio(){ var p=MF.paciente(); return '../pacientes/'+(p.matricula||'')+'/sources/'; }
function escJsAttr(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function t(clave){
  try{
    var T=(typeof SF_TEXTOS!=='undefined'&&SF_TEXTOS.textos)||{};
    var lg=(typeof MF!=='undefined'&&MF.idioma)?MF.idioma():'es';
    return (T[lg]&&T[lg][clave])||(T.es&&T.es[clave])||clave;
  }catch(e){ return clave; }
}




/* ══ core-utils-js.js ══ */


/* ================================================================
   UTILITAIRES
================================================================ */
/* Petit toast de statut (bas de l'écran, auto-disparition) — utilisé par
   les actions rapides (vaccins, changement de statut médicament, etc.)
   pour confirmer une action sans bloquer avec une alert(). Historiquement
   appelé mais jamais défini nulle part -> "status is not a function". */
function status(msg) {
  var el = document.getElementById('mf-status-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'mf-status-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);' +
      'background:var(--surface2);color:var(--text);border:1px solid var(--accent);' +
      'border-radius:8px;padding:10px 18px;font-size:13px;z-index:20000;' +
      'box-shadow:0 4px 16px rgba(0,0,0,0.35);opacity:0;transition:opacity .2s;pointer-events:none';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(function() { el.style.opacity = '0'; }, 2600);
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function getStatus(key, val) {
  const p = PARAMS[key];
  if (!p || !p.ref) return 'ok';
  const [lo, hi] = p.ref;
  if (lo !== null && val < lo) return 'bad';
  if (hi !== null && val > hi) return 'bad';
  return 'ok';
}
function getSeriesForParam(data, key) {
  /* v2026.7.21.10 — chaque point porte sa ROCHE-MÈRE : pdf_id + pdf voyagent
     avec la valeur (Lavoisier appliqué aux graphiques). */
  return data.filter(m => m.vals && (m.vals||{})[key] !== undefined)
             .map(m => ({ x: m.date, y: (m.vals||{})[key], src: m.src, pdf_id: m.pdf_id, pdf: m.pdf }))
             .sort((a,b) => a.x.localeCompare(b.x));
}

/* v2026.7.21.10 — « el médico no se lo creerá: ¿dónde está el informe? » (P-H) :
   un clic sur un point OUVRE le document source (résolu via le registre pdfs).
   Sans carpeta configurée, on affiche au moins le nom du document. */
/* P-H 09/08 : le PDF s'affiche dans un POPUP MAISON — déplaçable par sa
   poignée, redimensionnable par le coin bas-droit (poignée native du
   navigateur), fermable par ✕. Le document est rendu par la visionneuse
   PDF intégrée de Brave, DANS le popup. Pur HTML, zéro serveur. */
/* P-H 09/08-10/08 : « mets en relief HEMOGLOBINA dans le pdf » — la
   visionneuse de Brave ne surligne pas sur commande, alors l'app dessine
   ELLE-MÊME la page avec pdf.js (déjà embarqué pour l'OCR) et pose des
   surlignages dorés sur chaque occurrence du paramètre ET de sa valeur.
   Navigation ◀ ▶ entre les pages, redessin au redimensionnement du popup.
   Sans pdf.js ou PDF illisible (scan) : repli sur la visionneuse embed. */
function _pdfPopupShell(titulo, info) {
  document.querySelectorAll('.pdf-popup-maison').forEach(function(o) { o.remove(); });
  var pop = document.createElement('div');
  pop.className = 'pdf-popup-maison';
  pop.style.cssText = 'position:fixed;z-index:10002;width:min(900px,94vw);height:82vh;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:4px;display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:280px;min-height:160px';
  pop.style.left = 'calc(50% - min(450px,47vw))';
  pop.style.top = '40px';
  var banda = info ? '<div class="pdf-popup-banda" style="flex:0 0 auto;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--border)">🔍 Verificar en el documento: <b style="color:' + info.color + '">' + info.label + '</b> = <b>' + info.valor + '</b> ' + info.unidad + ' (' + (typeof fmtDate === 'function' ? fmtDate(info.fecha) : info.fecha) + ')<span class="pdf-popup-extra"></span></div>' : '';
  pop.innerHTML =
    '<div class="pdf-popup-drag" style="cursor:move;user-select:none;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 6px;border-bottom:1px solid var(--border)">' +
    '<b style="font-size:13px">📄 ' + titulo + '</b>' +
    '<span style="cursor:pointer;color:var(--muted);font-size:16px" onclick="this.closest(\'.pdf-popup-maison\').remove()">✕</span></div>' + banda +
    '<div class="pdf-popup-cuerpo" style="flex:1;min-height:0;overflow:auto;position:relative"></div>';
  document.body.appendChild(pop);
  (function() {
    var poignee = pop.querySelector('.pdf-popup-drag');
    var dragging = false, sx = 0, sy = 0, ol = 0, ot = 0;
    function pt(e) { return e.touches && e.touches[0] ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }
    function down(e) { if (e.target.tagName === 'SPAN' && e.target.getAttribute('onclick')) return; dragging = true; var p = pt(e); sx = p.x; sy = p.y; var r = pop.getBoundingClientRect(); ol = r.left; ot = r.top; e.preventDefault(); }
    function move(e) { if (!dragging) return; var p = pt(e); pop.style.left = Math.max(0, Math.min(window.innerWidth - 80, ol + p.x - sx)) + 'px'; pop.style.top = Math.max(0, Math.min(window.innerHeight - 40, ot + p.y - sy)) + 'px'; }
    function up() { dragging = false; }
    poignee.addEventListener('mousedown', down);
    poignee.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  })();
  return { pop: pop, cuerpo: pop.querySelector('.pdf-popup-cuerpo'), extra: pop.querySelector('.pdf-popup-extra') };
}

function _pdfPopupAbrir(url, titulo, info) {
  var sh = _pdfPopupShell(titulo, info);
  sh.cuerpo.innerHTML = '<embed src="' + url + '" type="application/pdf" style="width:100%;height:100%;border:0">';
}

async function _pdfPopupAbrirEnPagina(url, titulo, info, nom) {
  if (typeof pdfjsLib === 'undefined') { _pdfPopupAbrir(url, titulo, info); return; }
  var doc;
  /* P-H 10/08 : un file:// ne peut PAS être lu par fetch NI par le worker
     pdf.js depuis une page file:// (CORS « origin null », mur définitif).
     La seule voie propre pour récupérer les OCTETS (nécessaires au rendu
     maison + surlignage) est le serveur, qui sert le PDF en http:// —
     guichet /api/pdf déjà là. Repli sur l'embed file:// si pas de serveur
     (l'embed, lui, le navigateur l'autorise). */
  try {
    var buf = null;
    if (nom) {
      var srv = (typeof baseSalufolio === 'function' && baseSalufolio()) ? baseSalufolio() : 'http://localhost:7777';
      var stem = /\.pdf$/i.test(nom) ? nom.slice(0, -4) : nom;
      var r = await fetch(srv + '/api/pdf?n=' + encodeURIComponent(stem));
      if (r.ok) buf = await r.arrayBuffer();
    }
    if (!buf) buf = await (await fetch(url)).arrayBuffer(); /* dernier recours file:// */
    doc = await pdfjsLib.getDocument({ data: buf }).promise;
  }
  catch (e) { _pdfPopupAbrir(url, titulo, info); return; }
  try {
    var labelMin = (info && info.label) ? info.label.toLowerCase() : null;
    /* Les formes sous lesquelles le laboratoire peut écrire CETTE valeur.
       P-H 11/08 : le feutre ratait les valeurs > 1000 — le .sf porte 2583
       mais le PDF imprime « 2.583,00 » (point de milliers à l'espagnole).
       Faute de la trouver, le feutre continuait et surlignait le LABEL sur
       une autre page (« elevación de Dímero D... » p4 au lieu du 2.583 p2).
       On fabrique donc toutes les écritures plausibles de la même valeur. */
    var valores = [];
    if (info) {
      var n = Number(info.valor);
      var brut = String(info.valor);
      valores.push(brut);                         /* 2583   ·  13.8   */
      valores.push(brut.replace('.', ','));       /* 2583   ·  13,8   */
      if (isFinite(n) && Math.abs(n) >= 1000) {
        /* séparateur de milliers espagnol : le point */
        var ent = Math.trunc(Math.abs(n));
        var dec = brut.indexOf('.') >= 0 ? brut.split('.')[1] : '';
        var mil = String(ent).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        valores.push(mil);                        /* 2.583            */
        valores.push(mil + ',' + (dec || '00'));  /* 2.583,00         */
        valores.push(mil + ',' + (dec || '0'));   /* 2.583,0          */
      } else if (isFinite(n) && Number.isInteger(n)) {
        /* un entier peut être imprimé avec décimales : 235 → 235,00 */
        valores.push(brut + ',00');
        valores.push(brut + ',0');
      }
      valores = valores.filter(function (v, i, a) { return v && a.indexOf(v) === i; });
    }
    /* P-H 10/08 : « affiche la page qui tient le 1er feutre ». On ouvre
       donc la première page où quelque chose SERA surligné — c.-à-d. la
       valeur (le repère le plus sûr) ou, à défaut, le label. On cherche
       la valeur en priorité (page du vrai feutre), le label ne servant
       que de repli s'il n'y a aucune valeur nulle part. */
    var pagina = 1, pageValeur = 0, pageLabel = 0, textoVacio = true;
    if (labelMin || valores.length) {
      for (var pnum = 1; pnum <= doc.numPages; pnum++) {
        var pg = await doc.getPage(pnum);
        var tc0 = await pg.getTextContent();
        var texto = tc0.items.map(function(it) { return it.str; }).join(' ');
        if (texto.trim()) textoVacio = false;
        var tl = texto.toLowerCase();
        if (!pageValeur && valores.some(function(v) { return v && texto.indexOf(v) !== -1; })) pageValeur = pnum;
        if (!pageLabel && labelMin && tl.indexOf(labelMin) !== -1) pageLabel = pnum;
        if (pageValeur) break; /* la page du feutre-valeur trouvée, on s'arrête */
      }
      pagina = pageValeur || pageLabel || 1;
    }
    if (textoVacio) { try { doc.destroy(); } catch (e) {} _pdfPopupAbrir(url, titulo, info); return; } /* scan sans OCR */
    var sh = _pdfPopupShell(titulo, info);
    var barra = document.createElement('div');
    barra.style.cssText = 'flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:3px 6px;border-bottom:1px solid var(--border);font-size:12px';
    barra.innerHTML = '<button class="pdf-pg-prev" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 8px">◀</button>' +
      '<span class="pdf-pg-info"></span>' +
      '<button class="pdf-pg-next" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 8px">▶</button>' +
      '<span class="pdf-pg-nb" style="color:var(--muted)"></span>';
    sh.pop.insertBefore(barra, sh.cuerpo);
    sh.cuerpo.style.background = '#8a8a8a';
    sh.cuerpo.style.textAlign = 'center';
    var actual = pagina;
    async function dibujar(pnum) {
      actual = pnum;
      sh.cuerpo.innerHTML = '';
      var page = await doc.getPage(pnum);
      var vp1 = page.getViewport({ scale: 1 });
      var ancho = Math.max(300, sh.cuerpo.clientWidth - 20);
      var scale = ancho / vp1.width;
      var vp = page.getViewport({ scale: scale });
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:relative;display:inline-block;margin:8px 0;box-shadow:0 2px 10px rgba(0,0,0,.4)';
      var canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height;
      wrapper.appendChild(canvas);
      sh.cuerpo.appendChild(wrapper);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      var tc = await page.getTextContent();
      var nb = 0, premierTop = null;
      tc.items.forEach(function(it) {
        var s = (it.str || '');
        var hit = (labelMin && s.toLowerCase().indexOf(labelMin) !== -1) ||
                  valores.some(function(v) { return v && s.indexOf(v) !== -1; });
        if (!hit) return;
        nb++;
        var tx = pdfjsLib.Util.transform(vp.transform, it.transform);
        var h = Math.hypot(tx[2], tx[3]) || 12;
        var d = document.createElement('div');
        d.style.cssText = 'position:absolute;background:rgba(255,200,0,.45);outline:1.5px solid rgba(230,150,0,.9);border-radius:2px;pointer-events:none;left:' + (tx[4] - 2) + 'px;top:' + (tx[5] - h) + 'px;width:' + (it.width * scale + 4) + 'px;height:' + (h * 1.2) + 'px';
        wrapper.appendChild(d);
        if (premierTop === null) premierTop = tx[5] - h;
      });
      barra.querySelector('.pdf-pg-info').textContent = 'página ' + pnum + ' / ' + doc.numPages;
      barra.querySelector('.pdf-pg-nb').textContent = nb ? ('🟡 ' + nb + ' resaltado' + (nb > 1 ? 's' : '')) : '';
      if (premierTop !== null) sh.cuerpo.scrollTop = Math.max(0, premierTop - 60);
    }
    barra.querySelector('.pdf-pg-prev').onclick = function() { if (actual > 1) dibujar(actual - 1); };
    barra.querySelector('.pdf-pg-next').onclick = function() { if (actual < doc.numPages) dibujar(actual + 1); };
    /* redessin quand P-H redimensionne le popup (poignée du coin) */
    var roT = null;
    new ResizeObserver(function() { clearTimeout(roT); roT = setTimeout(function() { dibujar(actual); }, 200); }).observe(sh.cuerpo);
    await dibujar(pagina);
  } catch (e) {
    try { doc.destroy(); } catch (e2) {}
    _pdfPopupAbrir(url, titulo, info);
  }
}

function _chartVerInforme(s, key) {
  var id = s && (s.pdf_id || s.pdf); if (!id) return;
  /* P-H 09/08 : le popup annonce CE QU'ON EST VENU VÉRIFIER — paramètre,
     valeur, date — et l'URL porte #search= (honoré par certains visores). */
  var info = null;
  if (key && typeof PARAMS === 'object' && PARAMS[key]) {
    info = { label: PARAMS[key].label || key, valor: s.y, unidad: PARAMS[key].unit || '', fecha: s.x, color: PARAMS[key].color || 'var(--accent)' };
  }
  /* P-H 09/08 (« je n'ai pas besoin d'un serveur pour lire un pdf ») :
     ouverture DIRECTE en file:// — les fichiers de sources/ portent
     désormais leur nom exact PDFxxx.pdf, il suffisait d'ajouter
     l'extension que l'ancien code n'ajoutait pas. Zéro dépendance. */
  var nom = /\.pdf$/i.test(String(id)) ? String(id) : String(id) + '.pdf';
  var dir = (typeof pdfCarpeta === 'function') ? pdfCarpeta(id) : '';
  if (dir) {
    var base = dir.replace(/\/+$/, '');
    var url = (base.indexOf('://') !== -1 ? base : 'file://' + (base.charAt(0) === '/' ? '' : '/') + base) + '/' + encodeURIComponent(nom);
    try { _pdfPopupAbrirEnPagina(url, nom, info, nom); return; } catch (e) {}
  }
  /* v2026.7.21.20 — plus d'aboiement du navigateur (demande P-H) : le repli
     passe par la BANDE DU PAVÉ quand elle existe, et nomme le bon guichet
     (« Auditoría », pas « Trazabilidad »). L'alerte native ne sert que si
     aucune bande n'est à l'écran. */
  var msg = '📄 ' + nom + (dir
    ? ' — carpeta: ' + dir + ' (no se pudo abrir)'
    : ' — para abrirlo con un clic, defina la «carpeta de PDF» en la vista AUDITORÍA.');
  var det = document.getElementById('xz-cmt-detalle');

const chartInstances = {};

/* v2026.7.21.4 — échelle par courbe : Lin (par défaut) ⇄ Log (natif Chart.js).
   Le BNP à 11924 (TEP 2022, valeur RÉELLE et grave) écrasait les valeurs
   récentes en linéaire ; en log, le pic ET les variations fines cohabitent.
   L'état vit dans _chartScale[key] ; le bouton dans le titre bascule et redessine. */
window._chartScale = window._chartScale || {};

/* v2026.7.21.17 — P-H avait RAISON sur l'échelle : l'app applique un zoom CSS
   (document.body.style.zoom, module languages) que Chart.js ignore dans ses
   calculs de souris → mauvais point détecté, doigt posé à côté. On calcule
   donc NOUS-MÊMES la position du curseur, auto-calibrée par le rapport
   rect/offsetWidth — juste quel que soit le zoom/l'échelle en vigueur. */
function _chartPosEvento(chart, ev) {
  var rect = chart.canvas.getBoundingClientRect();
  var f = (rect.width / (chart.canvas.offsetWidth || rect.width)) || 1;
  return { x: (ev.clientX - rect.left) / f, y: (ev.clientY - rect.top) / f };
}
function _chartPuntoCercano(chart, ev) {
  var pos = _chartPosEvento(chart, ev);
  var meta = chart.getDatasetMeta(0);
  var best = -1, bd = Infinity, dist = Infinity;
  (meta && meta.data || []).forEach(function(el, i) {
    var d = Math.abs(el.x - pos.x);
    if (d < bd) { bd = d; best = i; dist = Math.hypot(el.x - pos.x, el.y - pos.y); }
  });
  return { index: best, precis: dist <= 16 };
}
function makeChart(canvasId, key, data, opts) {
  opts = opts || {};
  /* v2026.7.21.8 — les opts sont mémorisées par canvas : les redraws
     (bascule d'échelle, resize) conservent l'habillage d'origine. */
  window._chartOpts = window._chartOpts || {};
  _chartOpts[canvasId] = opts;
  var rejilla = opts.claro ? '#e6e6de' : '#2a3348';
  const p = PARAMS[key];
  const series = getSeriesForParam(data, key);
  if (!series.length) return;
  const esLog = (_chartScale[key] === 'log');
  const labels = series.map(s => fmtDate(s.x));
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (chartInstances[canvasId]) { chartInstances[canvasId].destroy(); }
  window._chartSeries = window._chartSeries || {};
  _chartSeries[canvasId] = series;
  chartInstances[canvasId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: p.label,
        data: series.map(s => s.y),
        borderColor: p.color,
        backgroundColor: p.color + '18',
        pointBackgroundColor: series.map(s => getStatus(key, s.y) === 'bad' ? '#c0392b' : p.color),
        pointRadius: 5, pointHoverRadius: (opts.sinTooltip ? 5 : 7), pointHitRadius: 14, tension: 0.3, fill: false,
      }]
    },
    options: {
      responsive: true,
      /* v2026.7.21.10 — clic sur un point → ver informe (le survol l'annonce) */
      /* v2026.7.21.16 (P-H : « manque de sensibilité » + « un doigt à la
         place du curseur ») : le SURVOL est généreux — n'importe où sur la
         courbe, c'est le point le plus proche en X qui parle au pavé ; le
         CLIC reste précis — il n'ouvre l'informe que pile sur le rond ; et
         le curseur devient un DOIGT 👆 quand un rond est saisi. */
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      onClick: (e, els, chart) => {
        try {
          const pc = _chartPuntoCercano(chart, e.native || e);
          if (pc.precis) { const s = series[pc.index]; if (s && (s.pdf_id || s.pdf)) _chartVerInforme(s, key); }
        } catch (er) {}
      },
      /* v2026.7.21.15 (conception P-H : « affiche le texte dans la popup et
         point final ») : le survol d'un point nourrit le pavé DIRECTEMENT,
         sans dépendre de l'infobulle — que celle-ci soit activée ou non. */
      onHover: (e, els, chart) => {
        const ev = e.native || e;
        let pc = { index: -1, precis: false };
        try { pc = _chartPuntoCercano(chart, ev); } catch (er) {}
        try { const cible = ev.target || chart.canvas; if (cible) cible.style.cursor = pc.precis ? 'pointer' : 'default'; } catch (er) {}
        if (pc.index < 0 || typeof window._chartPuntoHover !== 'function') return;
        const s = series[pc.index] || {};
        const v = s.y;
        const doc = (typeof pdfNombre === 'function' && (s.pdf_id || s.pdf)) ? pdfNombre(s.pdf_id || s.pdf) : (s.src || '');
        try { _chartPuntoHover({ param: (p.label || key), fecha: s.x, valor: v, unidad: p.unit || '', fuera: getStatus(key, v) === 'bad', doc: doc, tienePdf: !!(s.pdf_id || s.pdf) }); } catch (er) {}
      },
      plugins: { legend: { display: false }, tooltip: { enabled: !opts.sinTooltip, callbacks: {
        afterLabel: c => {
          const s = series[c.dataIndex] || {};
          const fuera = getStatus(key, c.raw) === 'bad';
          const l = [fuera ? '⚠ Fuera de rango' : '✓ Normal'];
          const doc = (typeof pdfNombre === 'function' && (s.pdf_id || s.pdf)) ? pdfNombre(s.pdf_id || s.pdf) : (s.src || '');
          if (doc) l.push('📄 ' + doc);
          if (s.pdf_id || s.pdf) l.push('(clic: ver informe)');
          return l;
        }
      }}},
      scales: {
        x: { grid: { color: rejilla } },
        y: { type: esLog ? 'logarithmic' : 'linear',
             grid: { color: rejilla }, ticks: { maxTicksLimit: 6 },
             title: { display: true, text: p.unit + ' — vista ' + (esLog ? 'LOG' : 'LIN') } }
      }
    },
    plugins: [{
      id: 'ref', beforeDraw(chart) {
        if (!p.ref) return;
        const [lo, hi] = p.ref;
        if (lo === null && hi === null) return;
        const { ctx, chartArea: { left, right, top, bottom }, scales: { y } } = chart;
        ctx.save(); ctx.fillStyle = 'rgba(30,180,100,0.06)';
        const yTop = hi !== null ? y.getPixelForValue(Math.min(hi, y.max)) : top;
        const yBot = lo !== null ? y.getPixelForValue(Math.max(lo, y.min)) : bottom;
        ctx.fillRect(left, yTop, right - left, yBot - yTop);
        ctx.restore();
      }
    }]
  });
}

/* Helper: tooltip interactif pour les noms de paramètres */
function paramTip(key) {
  const p = PARAMS[key];
  if (!p) return '';
  const ref = p.ref ? p.ref.filter(v=>v!==null).join('–') + ' ' + p.unit : 'sin rango definido';
  return p.desc + '\nRef: ' + ref;
}
/* Tooltip global : un seul élément fixé au body, mesuré puis positionné —
   jamais rogné, jamais étroit (délégation : fonctionne pour tout .param-tip). */
(function initParamTip() {
  if (typeof document === 'undefined') return;
  let box = null;
  function ensureBox() {
    if (!box) { box = document.createElement('div'); box.id = 'param-tipbox'; document.body.appendChild(box); }
    return box;
  }
  document.addEventListener('mouseover', function (e) {
    const t = e.target && e.target.closest ? e.target.closest('[data-ptip]') : null;
    if (!t || !t.getAttribute('data-ptip')) return;
    const b = ensureBox();
    /* livrée : or-sur-bleu pour les corrélations (P-H), défaut sinon */
    if (t.classList && t.classList.contains('corr-tip')) {
      b.style.background = 'linear-gradient(135deg, var(--corr-tip-bg1), var(--corr-tip-bg2))';
      b.style.color = 'var(--corr-tip-color)';
      b.style.border = '1.5px solid var(--corr-tip-border)';
    } else {
      b.style.background = ''; b.style.color = ''; b.style.border = '';
    }
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    b.innerHTML = (t.getAttribute('data-ptip') || '').split('\n')
      .map(l => l.indexOf('Ref:') === 0
        ? '<span style="color:#3fb950;font-weight:600">' + esc(l) + '</span>'
        : esc(l)).join('<br>');
    b.classList.remove('on');
    b.style.left = '0px'; b.style.top = '-9999px';   /* mesurer hors écran */
    const r = t.getBoundingClientRect();
    const bw = b.offsetWidth, bh = b.offsetHeight;
    let x = Math.min(Math.max(6, r.left), window.innerWidth - bw - 6);
    let y = r.top - bh - 8;
    if (y < 6) y = r.bottom + 8;                      /* pas de place en haut → dessous */
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.classList.add('on');
  });
  document.addEventListener('mouseout', function (e) {
    const t = e.target && e.target.closest ? e.target.closest('[data-ptip]') : null;
    if (t && box) box.classList.remove('on');
  });
  document.addEventListener('scroll', function () { if (box) box.classList.remove('on'); }, true);
})();

function paramSpan(key, shortLabel, extraStyle) {
  const p = PARAMS[key];
  if (!p) return key;
  const ref = p.ref ? p.ref.filter(v=>v!==null).join(' – ') + ' ' + p.unit : '';
  /* P-H 07/08 : fondu avec l'indication clic droit dans LA MÊME bulle
     rapide (data-ptip) — l'ancien title="" natif du <td> parent avait un
     délai imposé par le navigateur, impossible à raccourcir en JS. */
  const tip = (p.desc || p.label) + (ref ? '\nRef: ' + ref : '') + '\n🖱️ Clic izq.: glosario · Clic der.: curva';
  const label = shortLabel || p.label;
  return '<span class="param-tip" data-ptip="' + tip.replace(/"/g, '&quot;') + '" onclick="glosarioMostrarToast(\'' + key.replace(/'/g,"") + '\', event)" style="cursor:pointer' + (extraStyle ? ';'+extraStyle : '') + '">' + label + '</span>';
}

/* Alias court pour templates */
function paramTip(key, short) {
  return paramSpan(key, short);
}

function fillParamSelect() {
  const sel = document.getElementById('m-param');
  if (!sel) return;
  sel.innerHTML = '<option value="">— ' + (t('lbl_param')||'Parámetro') + ' —</option>';

  /* Paramètres prédéfinis — triés alphabétiquement */
  const optGroup1 = document.createElement('optgroup');
  optGroup1.label = 'Parámetros estándar';
  Object.entries(PARAMS)
    .sort((a, b) => a[1].label.localeCompare(b[1].label))
    .forEach(([k,p]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = p.label + ' (' + p.unit + ')';
      optGroup1.appendChild(opt);
    });
  sel.appendChild(optGroup1);

  /* Paramètres personnalisés */
  const customs = loadCustomParams();
  if (Object.keys(customs).length) {
    const optGroup2 = document.createElement('optgroup');
    optGroup2.label = 'Mis parámetros';
    Object.entries(customs).forEach(([k,p]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = p.label + ' (' + p.unit + ')';
      optGroup2.appendChild(opt);
    });
    sel.appendChild(optGroup2);
  }

  /* Option pour ajouter un nouveau */
  const sep = document.createElement('option');
  sep.disabled = true; sep.textContent = '────────────────';
  sel.appendChild(sep);
  const addOpt = document.createElement('option');
  addOpt.value = '__NEW__'; addOpt.textContent = '➕ Nuevo parámetro...';
  addOpt.style.color = 'var(--accent)';
  sel.appendChild(addOpt);

  /* Remplir la datalist des sources */
  fillSourceList();
}

function fillSourceList() {
  const sel = document.getElementById('m-source-select');
  if (!sel) return;

  /* Collecter toutes les sources connues */
  const sources = new Set();
  loadData().forEach(d => { if (d.src) sources.add(d.src); });
  loadEvents().forEach(e => { if (e.src) sources.add(e.src); });
  loadCustomSources().forEach(s => sources.add(s));

  /* Garder la sélection actuelle */
  const prev = sel.value;

  sel.innerHTML = '<option value="">— Seleccionar fuente —</option>';

  /* Sources existantes */
  [...sources].sort().forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });

  /* Séparateur + option nouvelle */
  if (sources.size > 0) {
    const sep = document.createElement('option');
    sep.disabled = true; sep.textContent = '────────────────';
    sel.appendChild(sep);
  }
  const addOpt = document.createElement('option');
  addOpt.value = '__NEW_SOURCE__'; addOpt.textContent = '➕ Nueva fuente...';
  sel.appendChild(addOpt);

  /* Restaurer sélection si possible */
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function onSourceChange() {
  const sel = document.getElementById('m-source-select');
  const inp = document.getElementById('m-source-new');
  if (sel.value === '__NEW_SOURCE__') {
    inp.style.display = 'block';
    inp.focus();
  } else {
    inp.style.display = 'none';
    inp.value = '';
  }
}

function getSelectedSource() {
  const sel = document.getElementById('m-source-select');
  if (sel.value === '__NEW_SOURCE__') {
    return (document.getElementById('m-source-new')||{}).value.trim() || '';
  }
  return sel.value || '';
}

/* Gestion des paramètres personnalisés */
const CUSTOM_PARAMS_KEY = 'mt_custom_params';
const CUSTOM_SOURCES_KEY = 'mt_custom_sources';

function loadCustomParams() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_PARAMS_KEY) || '{}'); } catch { return {}; }
}
function saveCustomParams(p) { localStorage.setItem(CUSTOM_PARAMS_KEY, JSON.stringify(p)); }
function loadCustomSources() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_SOURCES_KEY) || '[]'); } catch { return []; }
}
function saveCustomSources(s) { localStorage.setItem(CUSTOM_SOURCES_KEY, JSON.stringify(s)); }

function addCustomSource(src) {
  if (!src || src === 'Manuel') return;
  const sources = loadCustomSources();
  if (!sources.includes(src)) {
    sources.push(src);
    sources.sort();
    saveCustomSources(sources);
  }
}

function onParamChange() {
  const sel = document.getElementById('m-param');
  const box = document.getElementById('custom-param-box');
  if (sel.value === '__NEW__') {
    box.style.display = 'block';
    document.getElementById('cp-label').focus();
  } else {
    box.style.display = 'none';
  }

function registerCustomParam() {
  const label = (document.getElementById('cp-label')||{}).value.trim();
  const unit  = (document.getElementById('cp-unit')||{}).value.trim() || '';
  const refStr = (document.getElementById('cp-ref')||{}).value.trim();

  if (!label) return null;

  /* Générer une clé machine depuis le label */
  const key = 'custom_' + label.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

  /* Parser ref "min-max" */
  let ref = null;
  if (refStr) {
    const parts = refStr.split(/[-–—]/);
    if (parts.length === 2) {
      ref = [parseFloat(parts[0]) || null, parseFloat(parts[1]) || null];
    }
  }

  /* Sauvegarder dans PARAMS (runtime) et localStorage */
  const customs = loadCustomParams();
  const paramDef = { label, unit, ref, color: '#7f8c8d', desc: 'Parámetro personalizado: ' + label };
  customs[key] = paramDef;
  PARAMS[key] = paramDef;
  saveCustomParams(customs);

  /* Reset les champs */
  (document.getElementById('cp-label')||{}).value = '';
  (document.getElementById('cp-unit')||{}).value = '';
  (document.getElementById('cp-ref')||{}).value = '';
  (document.getElementById('custom-param-box')||{}).style.display = 'none';

  /* Recharger le select et sélectionner le nouveau */
  fillParamSelect();
  (document.getElementById('m-param')||{}).value = key;

  return key;
}

   par le registre, la déshydratation et la réhydratation (P-H 16/07 : « attention
   si dans le code on utilise cette clé ou pdf_id ! »). Ajouter une table ici

const MF_TABLAS_PDF = ['loadData', 'loadEvents', 'loadMeds', 'loadAntecedentes',
  'loadVacunaciones', 'loadEnfermeriaDxRegistro', 'loadEnfermeriaIntRegistro', 'loadBacterio'];
const MF_TABLAS_PDF_MF = ['mesures', 'events', 'medicaments', 'antecedentes',
  'vacunaciones', 'enfermeria_dx_registro', 'enfermeria_int_registro', 'bacteriologie'];

const PDF_DIR_KEY = 'mt_pdf_dir';
/* Base des dossiers patients — injectée par le serveur QUAND Salufolio est
   servi via http://localhost:7777/salufolio (P-H 05/08, même geste que
   MFP_PC_DEF pour le móvil). Vide si ouvert en file://. */
const MFP_PACIENTES_BASE = '';

   Vacunas·Enfermería puisse résoudre son pdf_id longtemps après l'import. */
const PDFS_ARCHIVO_KEY = 'mt_pdfs_archivo';
function loadPdfsArchivo() { try { return JSON.parse(localStorage.getItem(PDFS_ARCHIVO_KEY) || '{}'); } catch { return {}; } }
function savePdfsArchivo(a) { localStorage.setItem(PDFS_ARCHIVO_KEY, JSON.stringify(a)); }
function resolverPdfId(id) {
  if (!id) return null;
  const reg = loadPdfsArchivo();
  const fichero = (reg.archivos || {})[id];
  if (!fichero) return null;

function getPdfDir() {

  return manual || getPdfDirAuto();
}
function setPdfDir(v) { localStorage.setItem(PDF_DIR_KEY, (v || '').trim()); }

function pdfRegistro() {
  /* union de toutes les tables ; la table pdfs explicite a priorité */
  const archivos = {};
  (loadSourcesPdf() || []).forEach(function(x) {
    if (x && x.id && x.fichero) archivos[x.id] = x.fichero;
  });
  const recolter = function(x) {
    if (x && x.pdf_id && x.pdf && !archivos[x.pdf_id]) archivos[x.pdf_id] = x.pdf;
  };
  MF_TABLAS_PDF.forEach(function(f) {
    try { (typeof window[f] === 'function' ? window[f]() : []).forEach(recolter); } catch (e) {}
  });
  return { directorio: getPdfDir(), archivos: archivos };
}
function pdfNombre(id) {
  if (!id) return '';
  if (String(id).indexOf('PDF') !== 0) return String(id).split('/').pop();   /* déjà un nom/chemin */
  const v = pdfRegistro().archivos[id] || id;
  return String(v).split('/').pop();   /* une valeur avec / est un chemin complet */
}
function pdfCarpeta(id) {

  if (String(v).indexOf('/') !== -1) return String(v).slice(0, String(v).lastIndexOf('/'));

/* ── Registre des FUENTES (proposition P-H 16/07, jumeau du registre pdfs) ──
   « Hospital General … » répété 100 fois → une table { S001: nombre }, les
   entrées ne portent que src_id. Ids STABLES : persistés (mt_fuentes), un
   libellé nouveau reçoit le numéro suivant, jamais de renumérotation. */
const FUENTES_KEY = 'mt_fuentes';
function loadFuentes() { try { return JSON.parse(localStorage.getItem(FUENTES_KEY) || '{}'); } catch { return {}; } }
function saveFuentes(f) { localStorage.setItem(FUENTES_KEY, JSON.stringify(f)); }

function fuentesRegistro() {
  const reg = loadFuentes();               /* {id: nombre} existant */
  const porNombre = {};
  Object.entries(reg).forEach(function([id, n]) { porNombre[n] = id; });
  let max = 0;
  Object.keys(reg).forEach(function(id) {
    const m = /^S(\d+)$/.exec(id); if (m) max = Math.max(max, parseInt(m[1]));
  });
  const adopter = function(x) {
    const n = x && x.src;
    if (!n || porNombre[n]) return;
    max += 1;
    const id = 'S' + String(max).padStart(3, '0');
    reg[id] = n; porNombre[n] = id;
  };
  (typeof loadData === 'function' ? loadData() : []).forEach(adopter);
  (typeof loadEvents === 'function' ? loadEvents() : []).forEach(adopter);
  (typeof loadMeds === 'function' ? loadMeds() : []).forEach(adopter);
  saveFuentes(reg);
  return reg;
}
function fuenteNombre(id) {
  if (!id) return '';
  return loadFuentes()[id] || id;
}
function srcDeshidratar(tabla, porNombre) {
  return (tabla || []).map(function(x) {
    if (x && x.src && porNombre[x.src]) {
      const c = Object.assign({}, x); c.src_id = porNombre[x.src]; delete c.src; return c;
    }
    return x;
  });
}
function srcRehidratar(tabla, reg) {
  (tabla || []).forEach(function(x) {
    if (x && x.src_id && !x.src && reg[x.src_id]) x.src = reg[x.src_id];
  });
  return tabla;
}

function pdfDeshidratar(tabla) {
  /* copie de la table SANS la clé 'pdf' quand pdf_id existe (export normalisé).
     GARDE-FOU Lavoisier : si le nom de l'entrée diffère du registre (collision
     d'ids, cf. R3), on GARDE la clé explicite — aucune information ne se perd
     tant que le défaut n'est pas corrigé côté Extractor. */
  const archivos = pdfRegistro().archivos;
  const porNombre = {}, dobles = {};
  Object.entries(archivos).forEach(function([id, n]) {
    if (porNombre[n]) dobles[n] = 1; else porNombre[n] = id;
  });
  return (tabla || []).map(function(x) {
    if (!x || !x.pdf) return x;
    if (x.pdf_id && archivos[x.pdf_id] === x.pdf) {           /* cas normal */
      const c = Object.assign({}, x); delete c.pdf; return c;
    }
    if (!x.pdf_id && porNombre[x.pdf] && !dobles[x.pdf]) {    /* entrée orpheline (bacteriologie) */
      const c = Object.assign({}, x); c.pdf_id = porNombre[x.pdf]; delete c.pdf; return c;
    }
    return x;   /* collision ou inconnu : on garde le nom explicite (garde-fou) */
  });
}
function pdfRehidratar(tabla, archivos) {
  (tabla || []).forEach(function(x) {
    if (x && x.pdf_id && !x.pdf && archivos[x.pdf_id]) x.pdf = archivos[x.pdf_id];
  });
  return tabla;
}

function loadSourcesPdf() {
  try { return JSON.parse(localStorage.getItem(SOURCES_PDF_KEY) || '[]'); } catch { return []; }
}
function saveSourcesPdf(s) { localStorage.setItem(SOURCES_PDF_KEY, JSON.stringify(s)); }

function resolveOrCreatePdf(fichero) {
  const reg = loadSourcesPdf();
  const trouve = reg.find(r => r.fichero === fichero);
  if (trouve) return trouve.id;
  /* Référentiel de la pyramide : le CODE ÉPISODE de l'Extractor est l'id
     (JME1938-ICU007_... → ICU007). Repli PDFnnn pour les fichiers hors convention
     (sources extérieures non renommées, scans divers). Décision P-H 12/07/2026. */
  const m = (fichero || '').match(/^[A-Z]{3}\d{4}-([A-Z]{2,4}\d{3})_/);
  let id = m ? m[1] : null;
  if (!id || reg.some(r => r.id === id)) {
    id = 'PDF' + String(reg.length + 1).padStart(3, '0');
  }
  reg.push({ id: id, fichero: fichero });
  saveSourcesPdf(reg);
  return id;
}

/* ================================================================
   DÉDUPLICATION — Supprime les doublons dans events et bacterio
================================================================ */
function deduplicateAll() {
  /* Events : dédoublonner par date seulement (un seul événement par date) */
  const evts = loadEvents();
  if (!Array.isArray(evts)) return;
  const seenEvts = new Set();
  const uniqueEvts = evts.filter(e => {
    const key = (e.date||'');
    if (seenEvts.has(key)) return false;
    seenEvts.add(key);
    return true;
  });
  if (uniqueEvts.length < evts.length) {
    saveEvents(uniqueEvts);
    console.log('[Salufolio] Dedup events: ' + evts.length + ' → ' + uniqueEvts.length);
  }

  /* Bacterio : dédoublonner par date seulement (un seul résultat par date) */
  const bacts = loadBacterio();
  if (Array.isArray(bacts)) {
    const seenBacts = new Set();
    const uniqueBacts = bacts.filter(b => {
      const key = (b.date||b.date_prelevement||'');
      if (seenBacts.has(key)) return false;
      seenBacts.add(key);
      return true;
    });
    if (uniqueBacts.length < bacts.length) {
      saveBacterio(uniqueBacts);
      console.log('[Salufolio] Dedup bacterio: ' + bacts.length + ' → ' + uniqueBacts.length);
    }
  }

  /* Meds : dédoublonner par nom+date+dose (garder la dernière entrée avec le plus d'infos) */
  const meds = loadMeds();
  const seenMeds = new Set();
  const uniqueMeds = [];
  function _normMed(s) { return (s||'').replace(/\s*\(.*?\)/g,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
  meds.forEach(function(m) {
    var key = _normMed(m.nom) + '|' + (m.date||'') + '|' + _normMed(m.dose);
    if (!seenMeds.has(key)) {
      seenMeds.add(key);
      uniqueMeds.push(m);
    } else {
      /* Si doublon, mettre à jour l'existant avec les champs supplémentaires */
      var existing = uniqueMeds.find(function(u) { return _normMed(u.nom) + '|' + (u.date||'') + '|' + _normMed(u.dose) === key; });
      if (existing) {
        if (m.motif && !existing.motif) existing.motif = m.motif;
        if (m.date_fin && !existing.date_fin) existing.date_fin = m.date_fin;
        if (m.date_debut && !existing.date_debut) existing.date_debut = m.date_debut;
        if (m.remplace_par && !existing.remplace_par) existing.remplace_par = m.remplace_par;
        if (m.source && !existing.source) existing.source = m.source;
      }
    }
  });
  if (uniqueMeds.length < meds.length) {
    saveMeds(uniqueMeds);
    console.log('[Salufolio] Dedup meds: ' + meds.length + ' → ' + uniqueMeds.length);
  }
}

    var dateDisplay = ev.date ? fmtDate(ev.date) : '\u26a0 sin fecha';

function editaFuenteEvento(idx){
  var E = loadEvents();
  if(idx<0 || idx>=E.length) return;
  editaFuente(E[idx].src || E[idx].source || '', function(nom){
    if(E[idx].src!==undefined) E[idx].src = nom; else E[idx].source = nom;
    saveEvents(E); buildImportList();
  });
}

function editCell(idx, field, td) {
  var evts = loadEvents();
  if (idx < 0 || idx >= evts.length) return;
  var ev = evts[idx];
  var currentVal = ev[field] || '';

  if (field === 'type') {
    var types = ['laboratorio','urgencias','hematologia','neurologia','cardiologia','neumologia','consulta','imagen','bacteriologia'];
    var sel = document.createElement('select');
    sel.style.cssText = 'font-family:var(--mono);font-size:11px;padding:2px;background:var(--surface2);color:var(--text);border:1px solid var(--accent);border-radius:4px;width:100%';
    types.forEach(function(t) {
      var opt = document.createElement('option');
      opt.value = t; opt.textContent = t;
      if (t === currentVal) opt.selected = true;
      sel.appendChild(opt);
    });
    td.innerHTML = '';
    td.appendChild(sel);
    sel.focus();
    sel.onchange = function() { evts[idx][field] = sel.value; saveEvents(evts); buildImportList(); };
    sel.onblur = function() { buildImportList(); };
    return;
  }

  if (field === 'date') {
    var inp = document.createElement('input');
    inp.type = 'date';
    inp.value = currentVal;
    inp.style.cssText = 'font-family:var(--mono);font-size:14px;padding:6px 8px;background:var(--surface2);color:var(--text);border:2px solid var(--accent);border-radius:6px;width:100%;cursor:pointer';
    inp.min = '2015-01-01'; inp.max = '2030-12-31';
    td.innerHTML = '';
    td.appendChild(inp);
    inp.focus();
    try { inp.showPicker(); } catch(e) {}
    inp.onchange = function() { if (inp.value) { evts[idx][field] = inp.value; saveEvents(evts); } buildImportList(); };
    inp.onblur = function() { buildImportList(); };
    return;
  }

  /* Si le texte est long (>40 car) ou champ titre/src, utiliser un popup textarea */
  if (currentVal.length > 40 || field === 'title' || field === 'text') {
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center';
    var box = document.createElement('div');
    box.style.cssText = 'background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:20px;width:90%;max-width:500px';
    box.innerHTML = '<div style="font-family:var(--mono);font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px">Editar: ' + field + '</div>';
    var ta = document.createElement('textarea');
    ta.value = currentVal;
    ta.style.cssText = 'width:100%;height:120px;font-family:var(--mono);font-size:13px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px;resize:vertical;line-height:1.6';
    box.appendChild(ta);
    var btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:8px;margin-top:10px;justify-content:flex-end';
    var btnSave = document.createElement('button');
    btnSave.textContent = (t('edit_save')||'\u2713 Guardar');
    btnSave.className = 'btn primary';
    btnSave.style.cssText = 'font-size:13px;padding:8px 18px';
    var btnCancel = document.createElement('button');
    btnCancel.textContent = (t('edit_cancel'));
    btnCancel.className = 'btn';
    btnCancel.style.cssText = 'font-size:13px;padding:8px 18px';
    btnRow.appendChild(btnCancel);
    btnRow.appendChild(btnSave);
    box.appendChild(btnRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    ta.focus();
    ta.select();
    btnSave.onclick = function() { var nv = ta.value.trim(); if (nv !== currentVal) { evts[idx][field] = nv; saveEvents(evts); } document.body.removeChild(overlay); buildImportList(); };
    btnCancel.onclick = function() { document.body.removeChild(overlay); };
    overlay.onclick = function(e) { if (e.target === overlay) document.body.removeChild(overlay); };
    return;
  }

  var inp2 = document.createElement('input');
  inp2.type = 'text';
  inp2.value = currentVal;
  inp2.style.cssText = 'font-family:var(--mono);font-size:11px;padding:2px;background:var(--surface2);color:var(--text);border:1px solid var(--accent);border-radius:4px;width:100%';
  td.innerHTML = '';
  td.appendChild(inp2);
  inp2.focus();
  inp2.select();
  function saveCell() {
    var newVal = inp2.value.trim();
    if (newVal !== currentVal) { evts[idx][field] = newVal; saveEvents(evts); }
    buildImportList();
  }
  inp2.onblur = saveCell;
  inp2.onkeydown = function(e) { if (e.key === 'Enter') saveCell(); if (e.key === 'Escape') buildImportList(); };
}

function deleteEvent(idx) {
  var evts = loadEvents();
  if (idx < 0 || idx >= evts.length) return;
  var ev = evts[idx];

  /* Popup personnalisé au lieu du confirm natif */
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center';
  var box = document.createElement('div');
  box.style.cssText = 'background:var(--surface);border:2px solid var(--danger);border-radius:12px;padding:24px;width:90%;max-width:420px;text-align:center';
  box.innerHTML = '<div style="font-size:32px;margin-bottom:12px">\u26a0\ufe0f</div>' +
    '<div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px">\u00bfEliminar este evento?</div>' +
    '<div style="font-size:14px;color:var(--muted);margin-bottom:6px">' + fmtDate(ev.date) + '</div>' +
    '<div style="font-size:13px;color:var(--text);margin-bottom:20px;padding:10px;background:var(--surface2);border-radius:6px;text-align:left">' + (ev.title||'Sin t\u00edtulo') + '</div>';
  var btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:10px;justify-content:center';
  var btnCancel = document.createElement('button');
  btnCancel.textContent = 'Cancelar';
  btnCancel.className = 'btn';
  btnCancel.style.cssText = 'font-size:14px;padding:10px 24px';
  var btnDelete = document.createElement('button');
  btnDelete.textContent = (t('del_confirm')||'\u2715 Eliminar');
  btnDelete.style.cssText = 'font-size:14px;padding:10px 24px;background:var(--danger);color:white;border:none;border-radius:6px;cursor:pointer;font-family:var(--sans);font-weight:600';
  btnRow.appendChild(btnCancel);
  btnRow.appendChild(btnDelete);
  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  btnDelete.onclick = function() {
    evts.splice(idx, 1);
    saveEvents(evts);
    document.body.removeChild(overlay);
    buildImportList();
    updateDataSummary(loadData());
  };
  btnCancel.onclick = function() { document.body.removeChild(overlay); };
  overlay.onclick = function(e) { if (e.target === overlay) document.body.removeChild(overlay); };
}

function buildMesuresList() {
  var el = document.getElementById('mesures-list');
  if (!el) return;
  var data = loadData();
  if (!data.length) { el.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:8px">No hay mediciones.</div>'; return; }

  var html = '<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px;width:100px">Fecha</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px">Fuente</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px">Par\u00e1metros</th>' +
    '<th style="text-align:center;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);font-size:11px;width:40px">\u2715</th>' +
    '</tr></thead><tbody>';

  data.slice().reverse().forEach(function(m, i) {
    var realIdx = data.length - 1 - i;
    var paramCount = Object.keys(m.vals||{}).length;
    var dateDisplay = m.date ? fmtDate(m.date) : '\u26a0 sin fecha';
    html += '<tr style="border-bottom:1px solid var(--border)">' +
      '<td style="padding:4px 8px;cursor:pointer;font-family:var(--mono);font-size:11px" onclick="editMesureDate(' + realIdx + ',this)">' + dateDisplay + '</td>' +
      '<td style="padding:4px 8px;cursor:pointer;font-size:12px" onclick="editMesureSrc(' + realIdx + ',this)">' + (m.src||'\u2014') + '</td>' +
      '<td style="padding:4px 8px;font-size:11px;color:var(--muted)">' + paramCount + ' valor(es)</td>' +
      '<td style="padding:4px 8px;text-align:center"><button onclick="deleteMesure(' + realIdx + ')" style="background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer">\u2715</button></td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  html += '<div style="font-size:11px;color:var(--muted);margin-top:6px">' + data.length + ' medici\u00f3n(es)</div>';

function editMesureDate(idx, td) {
  var data = loadData();
  if (idx < 0 || idx >= data.length) return;
  var inp = document.createElement('input');
  inp.type = 'date'; inp.value = data[idx].date || '';
  inp.style.cssText = 'font-family:var(--mono);font-size:14px;padding:6px 8px;background:var(--surface2);color:var(--text);border:2px solid var(--accent);border-radius:6px;width:100%;cursor:pointer';
  inp.min = '2015-01-01'; inp.max = '2030-12-31';
  td.innerHTML = ''; td.appendChild(inp); inp.focus(); try { inp.showPicker(); } catch(e) {}
  inp.onchange = function() { if (inp.value) { data[idx].date = inp.value; data.sort(function(a,b){return a.date.localeCompare(b.date)}); saveData(data); } buildMesuresList(); };
  inp.onblur = function() { buildMesuresList(); };
}

function editMesureSrc(idx, td) {
  var data = loadData();
  if (idx < 0 || idx >= data.length) return;
  ensureTablasFromExisting();
  var p = splitMesureSrc(data[idx].src);
  var servicios = loadServiciosTabla().slice().sort(function(a,b){return a.nombre.localeCompare(b.nombre);});
  var _regP = loadPrescriptores(), _cdpP = loadPrescriptorCentro();
  var prescriptores = Object.keys(_regP).map(function(id){ return {id:id, nombre:_regP[id], centro_id:_cdpP[id]||null}; })
    .sort(function(a,b){return a.nombre.localeCompare(b.nombre);});
  var centros = loadCentrosTabla();

  var wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:3px;min-width:260px';
  var instInp = document.createElement('input');
  instInp.type = 'text'; instInp.value = p.institucion; instInp.placeholder = 'Institución';
  instInp.style.cssText = 'font-size:11px;padding:3px 5px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px';

  function makeSelect(tabla, currentNombre, placeholder) {
    var sel = document.createElement('select');
    sel.style.cssText = 'font-size:11px;padding:3px 5px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px';
    sel.innerHTML = '<option value="">— ' + placeholder + ' —</option>' +
      tabla.map(function(e){ return '<option value="' + e.nombre.replace(/"/g,'&quot;') + '"' + (normNombre(e.nombre)===normNombre(currentNombre)?' selected':'') + '>' + e.nombre + '</option>'; }).join('') +
      '<option value="__nuevo__">+ Nuevo…</option>';
    return sel;
  }
  var servSel = makeSelect(servicios, p.servicio, 'Servicio');
  /* Le sélecteur Prescriptor ne propose, tant que possible, que les
     médecins déjà connus de l'institution saisie — évite de faire défiler
     tous les prescripteurs du dossier pour n'en retenir qu'un. */
  var prescSel = makeSelect(prescriptoresDeCentro(instInp.value, prescriptores, centros), p.prescriptor, 'Prescriptor');
  var nuevoInp = document.createElement('input');
  nuevoInp.type = 'text'; nuevoInp.placeholder = 'Nombre del nuevo…'; nuevoInp.style.cssText = 'display:none;font-size:11px;padding:3px 5px;background:var(--surface2);color:var(--text);border:1px solid var(--accent);border-radius:4px';
  var nuevoTarget = null;
  [servSel, prescSel].forEach(function(sel) {
    sel.onchange = function() {
      if (sel.value === '__nuevo__') { nuevoTarget = sel; nuevoInp.style.display = ''; nuevoInp.value=''; nuevoInp.focus(); }
    };
  });
  instInp.oninput = function() {
    var currentPresc = prescSel.value === '__nuevo__' ? '' : prescSel.value;
    var filtered = prescriptoresDeCentro(instInp.value, prescriptores, centros);
    var rebuilt = makeSelect(filtered, currentPresc, 'Prescriptor');
    rebuilt.onchange = prescSel.onchange;
    rebuilt.onblur = prescSel.onblur;
    rebuilt.onkeydown = prescSel.onkeydown;
    wrap.replaceChild(rebuilt, prescSel);
    prescSel = rebuilt;
  };
  wrap.appendChild(instInp); wrap.appendChild(servSel); wrap.appendChild(prescSel); wrap.appendChild(nuevoInp);
  td.innerHTML = ''; td.appendChild(wrap); instInp.focus();

  function save() {
    var servicioNombre = servSel.value === '__nuevo__' ? nuevoInp.value.trim() : servSel.value;
    var prescriptorNombre = prescSel.value === '__nuevo__' ? nuevoInp.value.trim() : prescSel.value;
    var institucionNombre = instInp.value.trim();
    if (servSel.value === '__nuevo__' && servicioNombre) { var st = loadServiciosTabla(); resolveOrCreateEntry(st, servicioNombre, 'SV'); saveServiciosTabla(st); }
    if (institucionNombre) { var ct = loadCentrosTabla(); resolveOrCreateEntry(ct, institucionNombre, 'CT'); saveCentrosTabla(ct); }
    if (prescriptorNombre) {
      var prId = prescriptorResolverId(prescriptorNombre);
      if (institucionNombre) {
        var ct2 = loadCentrosTabla();
        var centroId = resolveOrCreateEntry(ct2, institucionNombre, 'CT');
        saveCentrosTabla(ct2);
        var cdp2 = loadPrescriptorCentro();
        if (!cdp2[prId]) { cdp2[prId] = centroId; savePrescriptorCentro(cdp2); }
      }
    }
    var d = loadData();
    d[idx].src = [institucionNombre, servicioNombre, prescriptorNombre].filter(Boolean).join(' — ');
    saveData(d);
    buildMesuresList();
  }
  instInp.onblur = function() { setTimeout(function() { if (!wrap.contains(document.activeElement)) save(); }, 120); };
  servSel.onblur = instInp.onblur; prescSel.onblur = instInp.onblur; nuevoInp.onblur = instInp.onblur;
  instInp.onkeydown = nuevoInp.onkeydown = function(e) { if (e.key === 'Enter') { save(); } if (e.key === 'Escape') buildMesuresList(); };
}

  var btnD = document.createElement('button'); btnD.textContent = (t('del_confirm')||'\u2715 Eliminar'); btnD.style.cssText = 'font-size:14px;padding:10px 24px;background:var(--danger);color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600';
  btnRow.appendChild(btnC); btnRow.appendChild(btnD); box.appendChild(btnRow); overlay.appendChild(box); document.body.appendChild(overlay);
  btnD.onclick = function() { data.splice(idx, 1); saveData(data); document.body.removeChild(overlay); buildMesuresList(); updateDataSummary(data); };
  btnC.onclick = function() { document.body.removeChild(overlay); };
  overlay.onclick = function(e) { if (e.target === overlay) document.body.removeChild(overlay); };
}

/* id -> nom, pour l'affichage. Repli honnête sur l'id lui-même si inconnu
   (jamais une chaîne vide qui ferait croire à un champ non renseigné). */
function prescriptorNombre(id) {
  if (!id) return '';
  return loadPrescriptores()[id] || id;
}

/* nom -> id, en créant l'entrée si elle n'existe pas encore (comparaison
   normalisée, insensible à la casse/espaces — même règle que fuentes). */
function prescriptorResolverId(nombre) {
  nombre = (nombre || '').trim();
  if (!nombre) return null;
  var reg = loadPrescriptores();
  var norm = normNombre(nombre);
  var found = Object.keys(reg).find(function(id) { return normNombre(reg[id]) === norm; });
  if (found) return found;
  var max = 0;
  Object.keys(reg).forEach(function(id) {
    var m = /^PR(\d+)$/.exec(id);
    if (m) max = Math.max(max, parseInt(m[1]));
  });
  var nuevoId = 'PR' + (max + 1);
  reg[nuevoId] = nombre;
  savePrescriptores(reg);
  return nuevoId;
}

/* Passerelle de lecture (P-H 06/08) : accepte le NOUVEAU dictionnaire
   {id:nombre} ET l'ANCIENNE liste [{id,nombre}] — un vieux .mf renommé
   .sf ne doit jamais planter à l'import, Lavoisier oblige. */
function _prescriptoresComoObjeto(p) {
  if (!p) return {};
  if (Array.isArray(p)) {
    var o = {};
    p.forEach(function(e) { if (e && e.id && e.nombre) o[e.id] = e.nombre; });
    return o;
  }
  return p;
}

function prescriptorEliminar(id) {
  var reg = loadPrescriptores(); delete reg[id]; savePrescriptores(reg);
  var rc = loadPrescriptorCentro(); delete rc[id]; savePrescriptorCentro(rc);
}

/* MIGRATION OBLIGATOIRE (P-H 06/08) : convertit l'ancienne table-liste
   mt_prescriptores_tabla ([{id,nombre,centro_id}], si elle existe) vers
   le nouveau dictionnaire. Idempotente — rien à faire si déjà migrée ou
   si la liste est vide. Appelée une fois au démarrage. */
function prescriptoresDeCentro(centroNombre, prescriptores, centros) {
  var nombreNorm = normNombre(centroNombre);
  if (!nombreNorm) return prescriptores;
  var centro = centros.find(function(c) { return normNombre(c.nombre) === nombreNorm; });
  if (!centro) return prescriptores; // institución encore inconnue : pas de filtre possible
  var filtrados = prescriptores.filter(function(pr) { return pr.centro_id === centro.id; });
  return filtrados.length ? filtrados : prescriptores; // aucun lien connu -> ne pas bloquer la saisie
}
function normNombre(s) { return (s || '').trim().toLowerCase().replace(/\s+/g, ' '); }

function resolveOrCreateEntry(tabla, nombre, prefix) {
  nombre = (nombre || '').trim();
  if (!nombre) return null;
  var norm = normNombre(nombre);
  var found = tabla.find(function(e) { return normNombre(e.nombre) === norm; });
  if (found) return found.id;
  var n = 1;
  while (tabla.some(function(e) { return e.id === prefix + n; })) n++;
  var id = prefix + n;
  tabla.push({ id: id, nombre: nombre });
  return id;
}
function getEntryNombre(tabla, id) { var e = tabla.find(function(x) { return x.id === id; }); return e ? e.nombre : ''; }

/* Analyse un src "Institución — Servicio — Prescriptor" ; tolère un src
   à 1 ou 2 segments (anciennes saisies) sans planter. */
function splitMesureSrc(src) {
  var parts = (src || '').split(/\s+—\s+/);
  return { institucion: parts[0] || '', servicio: parts[1] || '', prescriptor: parts[2] || '' };
}

/* Peuple les tables Servicios/Prescriptores à partir des données déjà
   saisies (mesures + events) — idempotent, sûr à appeler souvent. */
function ensureTablasFromExisting() {
  var servicios = loadServiciosTabla(), centros = loadCentrosTabla();
  var centroDePresc = loadPrescriptorCentro();
  loadData().forEach(function(d) {
    var p = splitMesureSrc(d.src);
    var centroId = p.institucion ? resolveOrCreateEntry(centros, p.institucion, 'CT') : null;
    if (p.servicio) resolveOrCreateEntry(servicios, p.servicio, 'SV');
    var prId = p.prescriptor ? prescriptorResolverId(p.prescriptor) : null;
    if (prId && centroId && !centroDePresc[prId]) centroDePresc[prId] = centroId;
  });
  loadEvents().forEach(function(e) {
    if (e.src) resolveOrCreateEntry(servicios, e.src, 'SV');
    if (e.prescriptor) prescriptorResolverId(e.prescriptor);
  });
  saveServiciosTabla(servicios);
  savePrescriptorCentro(centroDePresc);
  saveCentrosTabla(centros);
}

function servicioUsageCount(nombre) {
  var c = 0;
  loadData().forEach(function(d) { if (normNombre(splitMesureSrc(d.src).servicio) === normNombre(nombre)) c++; });
  loadEvents().forEach(function(e) { if (normNombre(e.src) === normNombre(nombre)) c++; });
  return c;
}
function prescriptorUsageCount(nombre) {
  var c = 0;
  loadData().forEach(function(d) { if (normNombre(splitMesureSrc(d.src).prescriptor) === normNombre(nombre)) c++; });
  loadEvents().forEach(function(e) { if (normNombre(e.prescriptor) === normNombre(nombre)) c++; });
  var id = null;
  var reg = loadPrescriptores();
  Object.keys(reg).forEach(function(k) { if (normNombre(reg[k]) === normNombre(nombre)) id = k; });
  if (id) loadMeds().forEach(function(m) { if (m.prescriptor === id) c++; });
  return c;
}

/* Renommer = corriger UNE FOIS dans la table ; cascade automatique sur
   toutes les mesures/events qui référencent l'ancien nom. */
function renameServicio(id, newNombre) {
  newNombre = (newNombre || '').trim(); if (!newNombre) return;
  var tabla = loadServiciosTabla();
  var entry = tabla.find(function(e) { return e.id === id; });
  if (!entry) return;
  var oldNombre = entry.nombre;
  entry.nombre = newNombre;
  saveServiciosTabla(tabla);
  var data = loadData(), changed = false;
  data.forEach(function(d) {
    var p = splitMesureSrc(d.src);
    if (p.servicio && normNombre(p.servicio) === normNombre(oldNombre)) {
      d.src = [p.institucion, newNombre, p.prescriptor].filter(Boolean).join(' — ');
      changed = true;
    }
  });
  if (changed) saveData(data);
  var events = loadEvents(), changedEv = false;
  events.forEach(function(e) { if (e.src && normNombre(e.src) === normNombre(oldNombre)) { e.src = newNombre; changedEv = true; } });
  if (changedEv) saveEvents(events);
}
function renameCentro(id, newNombre) {
  newNombre = (newNombre || '').trim(); if (!newNombre) return;
  var tabla = loadCentrosTabla();
  var entry = tabla.find(function(e) { return e.id === id; });
  if (!entry) return;
  var oldNombre = entry.nombre;
  entry.nombre = newNombre;
  saveCentrosTabla(tabla);
  var data = loadData(), changed = false;
  data.forEach(function(d) {
    var p = splitMesureSrc(d.src);
    if (p.institucion && normNombre(p.institucion) === normNombre(oldNombre)) {
      d.src = [newNombre, p.servicio, p.prescriptor].filter(Boolean).join(' — ');
      changed = true;
    }
  });
  if (changed) saveData(data);
}
function centroUsageCount(nombre) {
  var c = 0;
  loadData().forEach(function(d) { if (normNombre(splitMesureSrc(d.src).institucion) === normNombre(nombre)) c++; });
  var centro = loadCentrosTabla().find(function(e) { return normNombre(e.nombre) === normNombre(nombre); });
  if (centro) {
    var cdp = loadPrescriptorCentro();
    Object.keys(cdp).forEach(function(prId) { if (cdp[prId] === centro.id) c++; });
  }
  return c;
}
function deleteCentroEntry(id) { var t = loadCentrosTabla(); var i = t.findIndex(function(e){return e.id===id;}); if (i>=0) { t.splice(i,1); saveCentrosTabla(t); } showTablasModal(); }
function renamePrescriptor(id, newNombre) {
  /* Renommer dans le dictionnaire (P-H 06/08) : les medicamentos portent
     l'ID, pas le nom — leur affichage se corrige donc TOUT SEUL, sans
     rien toucher chez eux. Seuls mesures/events/cache, qui portent encore
     le nom en texte libre, ont besoin d'une vraie cascade. */
  newNombre = (newNombre || '').trim(); if (!newNombre) return;
  var reg = loadPrescriptores();
  var oldNombre = reg[id];
  if (oldNombre === undefined) return;
  reg[id] = newNombre;
  savePrescriptores(reg);
  var data = loadData(), changed = false;
  data.forEach(function(d) {
    var p = splitMesureSrc(d.src);
    if (p.prescriptor && normNombre(p.prescriptor) === normNombre(oldNombre)) {
      d.src = [p.institucion, p.servicio, newNombre].filter(Boolean).join(' — ');
      changed = true;
    }
  });
  if (changed) saveData(data);
  var events = loadEvents(), changedEv = false;
  events.forEach(function(e) { if (e.prescriptor && normNombre(e.prescriptor) === normNombre(oldNombre)) { e.prescriptor = newNombre; changedEv = true; } });
  if (changedEv) saveEvents(events);
  try {
    var cache = JSON.parse(localStorage.getItem('mt_prescripteurs') || '[]');
    var idx = cache.findIndex(function(n) { return normNombre(n) === normNombre(oldNombre); });
    if (idx >= 0) { cache[idx] = newNombre; localStorage.setItem('mt_prescripteurs', JSON.stringify(cache)); }
  } catch(e) {}
}
function deleteServicioEntry(id) { var t = loadServiciosTabla(); var i = t.findIndex(function(e){return e.id===id;}); if (i>=0) { t.splice(i,1); saveServiciosTabla(t); } showTablasModal(); }
function deletePrescriptorEntry(id) { prescriptorEliminar(id); showTablasModal(); }

  box.innerHTML =
    '<div id="tablas-modal-hdr" style="background:rgba(74,143,232,0.15);padding:12px 22px;cursor:move;user-select:none;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)">' +

      '<button onclick="document.getElementById(\'tablas-modal-overlay\').remove()" style="background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1">✕</button>' +
    '</div>' +
    '<div style="padding:18px 22px;overflow-y:auto;flex:1">' +
      '<div style="font-size:11px;color:var(--muted);margin-bottom:14px">Corrige un nombre AQUÍ y se actualiza automáticamente en todas las mediciones y eventos que lo referencian. Asigna un centro a cada prescriptor para que el selector de mediciones solo proponga los médicos conocidos de ese centro. Solo se puede eliminar una entrada sin referencias.</div>' +

      '<div style="margin-bottom:20px">' + (centros.length ? centros.map(function(c){ return rowHtml(c, 'centro', centroUsageCount(c.nombre)); }).join('') : '<div style="color:var(--muted);font-size:12px;padding:8px">Ninguno todavía.</div>') + '</div>' +

  if (typeof makeModalDraggable === 'function') makeModalDraggable('tablas-modal-card', 'tablas-modal-hdr');

  box.querySelectorAll('.tablas-rename-inp').forEach(function(inp) {
    function commit() {
      var v = inp.value.trim();
      if (!v) { showTablasModal(); return; }
      if (inp.dataset.kind === 'servicio') renameServicio(inp.dataset.id, v);

      else renamePrescriptor(inp.dataset.id, v);

    }
    inp.onkeydown = function(e) { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); commit(); } if (e.key === 'Escape') showTablasModal(); };
    inp.onblur = function() { if (inp.value.trim() !== inp.defaultValue.trim()) commit(); };
  });
  box.querySelectorAll('.tablas-centro-sel').forEach(function(sel) {
    sel.onchange = function() {
      var cdp = loadPrescriptorCentro();
      if (sel.value) cdp[sel.dataset.prescId] = sel.value; else delete cdp[sel.dataset.prescId];
      savePrescriptorCentro(cdp);
    };
  });
}

/* ══ DOCTRINE P-H : O₂, Incopack & Cie NE SONT PAS DES MÉDICAMENTS ══
   Ils vivent dans la table medicaments (l'Extractor les y met, la Receta
   Electrónica les y mêle), mais ce sont du MATÉRIEL / des dispositifs :
   pas de principe actif, pas de code ATC, aucune interaction à chercher.
   Conséquence : la farmacovigilancia (CIMA/AEMPS) ne doit JAMAIS les
   interroger, et l'affichage doit les distinguer.
   Table-driven : une ligne de plus ici suffit. */
const MF_NO_FARMACO = [
  { patron: /oxígeno|oxigeno|\bO2\b|oxigenoterapia/i, clase: 'material', etiqueta: 'O₂ / oxigenoterapia' },
  { patron: /incopack|pañal|absorbente|inc\.?\s*orina|compresa/i, clase: 'material', etiqueta: 'absorbentes' },
  { patron: /gasa|apósito|aposito|vendaje|esparadrapo/i, clase: 'material', etiqueta: 'curas' },
  { patron: /sonda|catéter|cateter|jeringa|aguja/i, clase: 'material', etiqueta: 'dispositivo' },
  { patron: /bipap|cpap|concentrador|silla|andador|cama articulada|grúa|grua/i, clase: 'material', etiqueta: 'equipo' },
  { patron: /nutrición|nutricion|suplemento|espesante|fresubin|ensure/i, clase: 'nutricion', etiqueta: 'nutrición' }
];
function claseFarmaco(nombre) {
  const n = String(nombre || '');
  const r = MF_NO_FARMACO.find(function(x) { return x.patron.test(n); });
  return r ? r : null;      /* null = vrai médicament */
}
function esFarmaco(nombre) { return claseFarmaco(nombre) === null; }

const ANTECEDENTES_KEY = 'mt_antecedentes';

/* Fusionne une nouvelle liste d'antécédents (venant d'un import Collector ou
   d'une Historia Resumida collée à la main) avec ceux déjà en mémoire, sans
   dupliquer une entrée déjà connue pour le même idCodigo (fuente+codigo). */
function mergeAntecedentes(nuevos) {
  var actuales = loadAntecedentes();
  var byId = {};
  actuales.forEach(function(a) { byId[(a.codificacion||'?') + ':' + a.codigo] = a; });
  (nuevos || []).forEach(function(a) {
    var key = (a.codificacion||'?') + ':' + a.codigo;
    var existing = byId[key];
    if (!existing) { byId[key] = a; actuales.push(a); return; }
    // Fusionner fechas sans doublon, garder l'estado le plus récent (le nouveau).
    var fechas = Array.from(new Set((existing.fechas||[]).concat(a.fechas||[]))).sort();
    existing.fechas = fechas;
    existing.descripcion = a.descripcion || existing.descripcion;
    existing.estado = a.estado || existing.estado;
    if (a.fecha_inactivacion) existing.fecha_inactivacion = a.fecha_inactivacion;
  });
  saveAntecedentes(actuales);
}

/* ── IDENTITÉ DU PATIENT (P-H, 11/08 22h) ────────────────────────────
   « il manque, avant sip : Nombre-apellido, sexo, Fecha Nacimiento ».
   Ces champs appartiennent au DOSSIER, pas au navigateur : ils vivent à
   la racine du .sf, à côté de patient_label et de sip. On les recueille

   d'un seul champ, sexo s'écrit M/F/Mujer/Varón, la naissance en ISO ou
   en JJ/MM/AAAA. Ce qui manque reste vide — on n'invente pas.        */
const IDENT_KEY = 'mt_identidad';
function _sfIdentidad(p) {
  if (!p || typeof p !== 'object') return;
  var id = {};
  id.nombre   = p.nombre || p.name || '';
  id.apellido = p.apellido || p.apellidos || p.surname || '';
  id.sexo     = p.sexo || p.sex || p.genero || '';
  id.nacimiento = p.fecha_nacimiento || p.nacimiento || p.birth || p.fecha_nac || '';
  if (!id.nombre && !id.apellido && !id.sexo && !id.nacimiento) return;
  try { localStorage.setItem(IDENT_KEY, JSON.stringify(id)); } catch (e) {}
}
function getIdentidad() {
  try { return JSON.parse(localStorage.getItem(IDENT_KEY) || '{}'); } catch (e) { return {}; }
}
function _identSexoTexto(s) {
  s = (s || '').toString().trim().toUpperCase();
  if (!s) return '';
  if (s[0] === 'M' && s !== 'MASCULINO' || s.indexOf('MUJER') === 0 || s[0] === 'F') return 'Mujer';
  if (s[0] === 'V' || s[0] === 'H' || s.indexOf('MASCULINO') === 0) return 'Varón';
  return '';
}
function _identEdad(nac) {
  if (!nac) return '';
  var d = null;
  var m = String(nac).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) d = new Date(+m[1], +m[2] - 1, +m[3]);
  else {
    m = String(nac).match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if (m) d = new Date(+m[3], +m[2] - 1, +m[1]);
  }
  if (!d || isNaN(d)) return '';
  var h = new Date(), a = h.getFullYear() - d.getFullYear(), mm = h.getMonth() - d.getMonth();
  if (mm < 0 || (mm === 0 && h.getDate() < d.getDate())) a--;
  return (a > 0 && a < 130) ? a + ' años' : '';
}
function getSip() { return localStorage.getItem(SIP_KEY) || ''; }
function setSip(v) { if (v) localStorage.setItem(SIP_KEY, String(v).trim()); }

/* getPatientLabel → pont vers mf.js */

  else localStorage.removeItem(PATIENT_LABEL_KEY);
  updatePatientBadge();
}
function updatePatientBadge() {
