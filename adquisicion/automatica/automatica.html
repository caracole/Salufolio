async function leeUnDocumento(file, clave, modelo){
  var b64 = await new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ res(r.result.split(',')[1]); };
    r.onerror = function(){ rej(new Error('no se pudo leer el fichero')); };
    r.readAsDataURL(file);
  });

  var resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-api-key':clave,
              'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({
      model: modelo, max_tokens: tokensMax(),
      messages:[{ role:'user', content:[
        { type:'document', source:{ type:'base64', media_type:'application/pdf', data:b64 } },
        { type:'text', text: PROMPT_TEXTO }
      ]}]
    })
  });
  if(!resp.ok){
    var t = await resp.text();
    throw new Error('la API ha dicho ' + resp.status + ': ' + t.substring(0,120));
  }
  var data = await resp.json();
  /* v2 (P-H, 09/09) : un informe de alta donne un JSON bien plus long
     qu'une urgence. Quand la réponse bute sur la limite, le JSON est
     coupé net et on lisait « Unterminated string » sans comprendre. */
  if(data.stop_reason === 'max_tokens'){
    throw new Error('respuesta cortada en ' + tokensMax().toLocaleString()
      + ' tokens — suba el límite en la configuración');
  }
  var txt = (data.content||[]).map(function(x){ return x.text||''; }).join('').trim();
  txt = txt.replace(/^```(?:json)?\s*/,'').replace(/\s*```$/,'');
  var parsed = JSON.parse(txt);

  return guardaLoLeido(parsed, file);
}

/* ══ ranger ce que Claude a rendu ══ */
function guardaLoLeido(parsed, file){
  /* déjà lu ? le même document donné deux fois ne compte qu'une (P-H) */
  var _h = huellaDe(parsed);
  var _antes = yaLeido(_h);
  if(_antes){
    return { repetido:true, huella:_h, comoEn:_antes.fichero,
             mediciones:0, eventos:0, medicamentos:0,
             fuente:(parsed.documento&&parsed.documento.centro)||'', dudas:[] };
  }
  var doc = parsed.documento || {};
  var idf = parsed.identificacion || {};
  var fuente = doc.centro
    ? doc.centro + (doc.servicio ? ' — ' + doc.servicio : '')
    : (parsed.source || '');
  var fecha = doc.fecha_informe || doc.fecha_ingreso || parsed.date || '';

  /* le fichier va dans la table des PDF : c'est ce qui attache une
     donnée à son document (P-H, 09/09) */
  var A = loadPdfsArchivo();
  var pdfId = null;
  Object.keys(A).forEach(function(k){ if(A[k]===file.name) pdfId=k; });
  if(!pdfId){
    var n = 1;
    while(A['PDF'+String(n).padStart(3,'0')]) n++;
    pdfId = 'PDF'+String(n).padStart(3,'0');
    A[pdfId] = file.name;
    savePdfsArchivo(A);
  }

  var nMed=0, nEv=0, nTrat=0;
  /* ce qui entre ici est du NEUF : actualizacion, source A (l'API) */
  var _huboAlgo = false;

  /* les mesures */
  if((parsed.mediciones||[]).length){
    var D = loadData();
    var porFecha = {};
    parsed.mediciones.forEach(function(m){
      var f = m.fecha || fecha; if(!f) return;
      var clave = f + '|' + (m.hora||'') + '|' + (m.condicion||'');
      if(!porFecha[clave]) porFecha[clave] = { date:f, src:fuente, vals:{},
        pdf:file.name, pdf_id:pdfId };
      if(m.hora)      porFecha[clave].hora = m.hora;
      if(m.condicion) porFecha[clave].condicion = m.condicion;
      if(m.grupo)     porFecha[clave].grupo = m.grupo;
      if(idf.n_solicitud) porFecha[clave].n_solicitud = idf.n_solicitud;
      var v = m.valor;
      if(typeof v === 'string' && /^-?\d+([.,]\d+)?$/.test(v.trim()))
        v = parseFloat(v.trim().replace(',','.'));
      porFecha[clave].vals[(m.parametro||'').trim()] = v;
      if(m.unidad){
        porFecha[clave].unidades = porFecha[clave].unidades || {};
        porFecha[clave].unidades[(m.parametro||'').trim()] = m.unidad;
      }
      nMed++;
    });
    Object.keys(porFecha).forEach(function(k){ D.push(porFecha[k]); });
    D.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
    saveDataArr(D);
  }

  /* les événements — AVEC LEUR SOURCE, corrigé le 09/09 */
  if((parsed.eventos||[]).length){
    var E = loadEvents();
    parsed.eventos.forEach(function(e){
      var ev = {
        date: e.fecha || fecha,
        type: (doc.tipo||'').toLowerCase().indexOf('urgen')>=0 ? 'urgencias'
            : (doc.tipo||'').toLowerCase().indexOf('alta')>=0  ? 'ingreso'
            : (doc.servicio||'').toLowerCase() || 'consulta',
        title: e.titulo || '',
        text: e.detalle || '',
        src: fuente,
        pdf: file.name,
        pdf_id: pdfId
      };
      if(doc.centro)        ev.centro   = doc.centro;
      if(doc.servicio)      ev.servicio = doc.servicio;
      if(doc.fecha_informe) ev.fecha_informe = doc.fecha_informe;
      if(idf.n_episodio)    ev.n_episodio = idf.n_episodio;
      if(idf.n_informe)     ev.n_informe  = idf.n_informe;
      if(idf.nhc)           ev.nhc        = idf.nhc;
      E.push(ev); nEv++;
    });
    E.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
    saveEvents(E);
  }

  /* les traitements */
  if((parsed.medicamentos||[]).length){
    var M = loadMeds();
    parsed.medicamentos.forEach(function(m){
      if(!m.nombre) return;
      M.push({
        nombre: m.nombre, dosis: m.dosis||'', frecuencia: m.pauta||'', via: m.via||'',
        desde: m.desde || fecha, hasta: m.hasta || '',
        source: fuente, pdf: file.name, pdf_id: pdfId
      });
      nTrat++;
    });
    saveMeds(M);
  }

  /* le centre, dans la table des sources */
  if(doc.centro){
    var C = loadCentros();
    var ya = C.some(function(x){
      return (typeof x==='string'? x : (x.nombre||'')).toLowerCase() === fuente.toLowerCase(); });
    if(!ya){ C.push({ nombre: fuente, abrev: '' }); saveCentros(C); }
  }

  /* « le programme doit les poser à CHAQUE écriture, sans exception » */
  if((nMed + nEv + nTrat) > 0 && typeof SF_PLANTILLA!=='undefined'){
    SF_PLANTILLA.actualiza(_DATOS, 'A');
  }
  return { mediciones:nMed, eventos:nEv, medicamentos:nTrat, huella:_h,
           fuente: fuente, dudas: parsed.dudas || [] };
}


/* ══ garder ce qui est en mémoire, sans passer par la console (P-H) ══
   Le 💾 de mf.js reste muet sans expediente ouvert. Ici on garde
   toujours : mieux vaut un fichier orphelin qu'une heure de travail
   perdue au premier rechargement. */
function guardaAqui(){
  if(!_DATOS){ pintaProgreso('No hay nada que guardar.'); return; }
  var p = MF.paciente() || {};
  var n = new Date(), z = function(x){ return String(x).padStart(2,'0'); };
  var sello = n.getFullYear()+'-'+z(n.getMonth()+1)+'-'+z(n.getDate())
            + '_'+z(n.getHours())+'h'+z(n.getMinutes());
  var nombre = (p.matricula || 'SIN_PACIENTE') + '_' + sello + '.mf';
  if(typeof SF_PLANTILLA!=='undefined') SF_PLANTILLA.paraExportar(_DATOS);
  var b = new Blob([JSON.stringify(_DATOS, null, 1)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nombre; a.click();
  URL.revokeObjectURL(a.href);
  pintaProgreso('Guardado: ' + nombre);
  setTimeout(function(){ pintaProgreso(''); }, 4000);
}

/* le journal seul — sin nada médico, para reclamar a la GVA */
function guardaDiario(){
  var D = diario();
  if(!D.length){ pintaProgreso('El diario está vacío.'); return; }
  var n = new Date(), z = function(x){ return String(x).padStart(2,'0'); };
  var sello = n.getFullYear()+'-'+z(n.getMonth()+1)+'-'+z(n.getDate())
            + '_'+z(n.getHours())+'h'+z(n.getMinutes());
  var b = new Blob([JSON.stringify({
    _que_es: ('Diario de lectura de documentos. Dice, documento por documento, '
      + 'lo que el portal ha dado y lo que faltaba. No contiene ningún dato médico: '
      + 'sólo nombres de fichero, fechas, y las dudas del lector.'),
    matricula: (MF.paciente()||{}).matricula || '',
    generado: sello, lineas: D.length, diario: D
  }, null, 1)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = ((MF.paciente()||{}).matricula || 'SIN_PACIENTE') + '_diario_' + sello + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  pintaProgreso('Diario guardado (sin datos médicos)');
  setTimeout(function(){ pintaProgreso(''); }, 4000);
}

function refresca(){
  try{
    var n=loadData().length, e=loadEvents().length, m=loadMeds().length;
    var D = diario();
    var leidos = D.filter(function(l){ return !l.error && !l.repetido; }).length;
    var dobles = D.filter(function(l){ return l.repetido; }).length;
    document.getElementById('x-est').textContent =
      leidos + ' documento' + (leidos===1?'':'s')
      + (dobles? ' (+' + dobles + ' repetido' + (dobles===1?'':'s') + ')' : '')
      + ' · ' + n + ' extracciones · ' + e + ' eventos · ' + m + ' medicamentos';
    pintaDiario();
  }catch(err){ console.warn(err); }
}

/* la zone de dépôt */
(function(){
  var z = document.getElementById('zona'), inp = document.getElementById('ficheros');
  z.onclick = function(){ inp.click(); };
  inp.onchange = function(){ if(inp.files.length) leeDocumentos(Array.from(inp.files)); inp.value=''; };
  ['dragenter','dragover'].forEach(function(ev){
    z.addEventListener(ev, function(e){ e.preventDefault(); z.classList.add('encima'); }); });
  ['dragleave','drop'].forEach(function(ev){
    z.addEventListener(ev, function(e){ e.preventDefault(); z.classList.remove('encima'); }); });
  z.addEventListener('drop', function(e){
    var f = Array.from(e.dataTransfer.files||[]).filter(function(x){ return /\.pdf$/i.test(x.name); });
    if(f.length) leeDocumentos(f);
  });
})();

MF.arranca({
  alCargar: function(d){
    /* un dossier ancien peut manquer de champs : on les ajoute sans
       rien réécrire de ce qui s'y trouve (P-H, 11/09) */
    _DATOS = (typeof SF_PLANTILLA!=='undefined')
      ? SF_PLANTILLA.completa(d, MF.paciente()) : d;
    _ABIERTO = true;
    var p = MF.paciente();
    document.getElementById('x-pac').textContent = p.etiqueta || p.matricula || '';
    document.getElementById('aviso').style.display='none';
    pintaTextos(); miraClave(); pintaPrompts();
    cargaDiario(function(){ refresca(); });
    MF.ponVersion();
  },
  alFallar: function(msg){
    document.getElementById('x-pac').textContent = '⚠ ningún expediente abierto';
    document.getElementById('x-pac').style.color = 'var(--warn)';
    document.getElementById('x-pac').style.borderColor = 'var(--warn)';
    pintaTextos(); miraClave(); pintaPrompts(); pintaDiario(); MF.ponVersion();
  }
});
</script>
