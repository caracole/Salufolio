<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Adquisición automática · Salufolio</title>
<script src="../../comun/chart.umd.min.js"></script>
<script src="../../medicamentos/principios.js"></script>
<script src="../prompts/prompts.js"></script>
<script src="../../comun/plantilla-mf.js"></script>
<link rel="stylesheet" href="../../comun/salufolio.css">
<style>
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans,system-ui,sans-serif)}
header[data-cabecera]{display:flex;align-items:baseline;gap:var(--gap-m,12px);
       padding:var(--pad-s,10px) var(--pad-m,18px);border-bottom:1px solid var(--border)}
.mod-tit{font-family:var(--serif);font-size:var(--tam-tit,18px);font-weight:600;color:var(--text)}
header .chip{font-size:var(--tam-min,11px);border:1px solid var(--muted);border-radius:var(--radio-s,6px);
             padding:1px 8px;color:var(--muted)}
main{padding:16px 20px 40px;max-width:960px;margin:0 auto}
/* les dépliants : leur style vit dans comun/salufolio.css (P-H, 11/09) */
#zona{border:2px dashed var(--border);border-radius:12px;padding:34px 20px;text-align:center;
      cursor:pointer;transition:all .25s;margin:6px 0 4px}
#zona:hover,#zona.encima{border-color:var(--accent);background:rgba(74,143,232,.07)}
.btn{padding:6px 14px;border-radius:7px;border:1px solid var(--border);background:transparent;
     color:var(--text);cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--accent)}
.btn.pri{border-color:var(--accent);background:rgba(74,143,232,.15)}
input[type=text],input[type=password],select{background:var(--bg);color:var(--text);
     border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px}
#aviso{padding:var(--pad-g,40px) var(--pad-m,20px);color:var(--muted);text-align:center;line-height:1.8}
.module-version-corner{display:none}
</style>
</head>
<body>
<header data-cabecera>
  <span id="titulo" class="mod-tit">⚙️ Adquisición automática</span>
  <span class="chip" id="x-pac">—</span>
  <span class="chip" id="x-est"></span>
</header>

<main>

<details class="sf-plegable" id="d-config">
  <summary style="color:var(--warn)">
    <span data-idioma="tit_config">⚙️ Configuración de la extracción</span>
    <span class="cuenta" id="c-config"></span>
  </summary>
  <div id="cfg-intro" style="font-size:12px;color:var(--muted);line-height:1.7;margin:4px 0 14px"></div>

  <label style="font-size:11px;color:var(--muted)" data-idioma="cfg_clave">🔑 Clave API</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 12px">
    <input type="password" id="clave" placeholder="sk-ant-…" style="flex:1;min-width:230px">
    <button class="btn" onclick="verClave()" title="ver la clave">👁</button>
  </div>

  <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px">
    <div style="flex:1;min-width:190px">
      <label style="font-size:11px;color:var(--muted)" data-idioma="cfg_quien">🤖 Quién lee</label>
      <select id="modelo" style="width:100%;margin-top:4px">
        <option value="claude-sonnet-4-6" data-idioma="mod_rapido">Sonnet — rápido y barato</option>
        <option value="claude-opus-4-1" data-idioma="mod_fino">Opus — más fino, más caro</option>
      </select>
    </div>
    <div style="flex:1;min-width:190px">
      <label style="font-size:11px;color:var(--muted)" data-idioma="cfg_que">📄 Qué se le pide</label>
      <select id="prompt-elegido" style="width:100%;margin-top:4px"></select>
    </div>
    <div style="flex:1;min-width:180px">
      <label style="font-size:11px;color:var(--muted)" data-idioma="cfg_cuanto">🔢 Cuánto puede devolver</label>
      <select id="tokens" style="width:100%;margin-top:4px">
        <option value="8000" data-idioma="tok_cortos">Informes cortos</option>
        <option value="16000" data-idioma="tok_habitual">Lo habitual</option>
        <option value="32000" selected data-idioma="tok_alta">Informes de alta — recomendado</option>
        <option value="64000" data-idioma="tok_largos">Documentos muy largos</option>
      </select>
    </div>
  </div>
  <div id="cfg-cuanto-expl" style="font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:12px"></div>

  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn pri" onclick="guardaClave()" data-idioma="cfg_guardar">Guardar la configuración</button>
  </div>
  <div id="estado-clave" style="font-size:11.5px;margin-top:10px"></div>
</details>

<details class="sf-plegable" id="d-leer" open>
  <summary style="color:var(--accent)">
    <span data-idioma="tit_leer">📄 Leer documentos</span>
    <span class="cuenta" id="c-leer"></span>
  </summary>
  <div id="zona">
    <div style="font-size:30px;margin-bottom:6px">📄</div>
    <div style="font-size:13.5px;margin-bottom:3px" data-idioma="leer_suelte">Suelte aquí los PDF, o toque para elegirlos</div>
    <div style="font-size:11.5px;color:var(--muted)" data-idioma="leer_uno">
      Se leen uno tras otro. Cada uno deja su línea en el diario.</div>
  </div>
  <input type="file" id="ficheros" accept=".pdf" multiple style="display:none">
  <div id="progreso" style="margin-top:10px"></div>
  <div id="parar" style="display:none;margin-top:8px;text-align:right">
    <button class="btn" onclick="pideParar()"
            style="border-color:var(--danger);color:var(--danger)"
            title="termina el documento en curso y se detiene" data-idioma="leer_detener">⏹ Detener</button>
  </div>
</details>

<details class="sf-plegable" id="d-diario">
  <summary style="color:var(--ok,#4ae88f)">
    <span data-idioma="tit_diario">📓 El diario</span>
    <span class="cuenta" id="c-diario"></span>
  </summary>
  <div style="font-size:12px;color:var(--muted);line-height:1.65;margin:4px 0 8px"
       data-idioma="dia_intro"></div>
  <div id="botones-diario" style="display:none;gap:8px;justify-content:flex-end;margin-bottom:8px">
    <button class="btn" onclick="guardaDiario()"
            title="sólo el diario, sin ningún dato médico — para reclamar" data-idioma="dia_diario">📓 Guardar el diario</button>
    <button class="btn pri" onclick="guardaAqui()"
            title="todo lo leído, en un fichero .mf" data-idioma="dia_guardar">💾 Guardar lo leído</button>
  </div>
  <div id="diario-lista" style="max-height:420px;overflow-y:auto"></div>
</details>

</main>
<div id="aviso" style="display:none"></div>

<script src="automatica.js"></script>
<script src="automatica.idiomas.js"></script>
<script src="../../comun/mf.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   ADQUISICIÓN AUTOMÁTICA — Salufolio V2
   Versión 2026.09.09-17:23:58

   El tercero de los tres modos de adquisición (P-H, 09/09):
     manual     · a mano, sin documento
     asistida   · copiar y pegar con claude.ai, sin clave
     automática · con clave API — este programa

   « l'acquisition avancée avec clé API pour moi c'est un programme
     à part » — P-H. Cuesta dinero y pide configuración: no es para
     todo el mundo.

   CORREGIDO HOY: el evento se construía SIN FUENTE. Las mediciones la
   llevaban, los medicamentos también — los eventos no. Por eso las
   nueve urgencias de Ana estaban « SIN FUENTE ».

   EL PROMPT VIVE EN SU .txt (regla de P-H del 11/08), en ../prompts/.
   ═══════════════════════════════════════════════════════════════════════ */
const VERSION_PROGRAMA = SF_CONFIG.version;
const APP_VERSION = SF_CONFIG.version;
const APP_VERSION_DATE = SF_CONFIG.version;

function t(clave, vars){
  var out;
  try{
    var T=(typeof SF_TEXTOS!=='undefined'&&SF_TEXTOS.textos)||{};
    var lg=(typeof MF!=='undefined'&&MF.idioma)?MF.idioma():'es';
    out = (T[lg]&&T[lg][clave])||(T.es&&T.es[clave])||clave;
  }catch(e){ out = clave; }
  /* les morceaux qu'on glisse dedans : {asistida}, {consola}, {otro} */
  var COMUNES = {
    asistida:'<a href="../asistida/asistida.html" style="color:var(--accent)">asistida</a>',
    consola :'<a href="https://console.anthropic.com" target="_blank" style="color:var(--accent)">console.anthropic.com</a>',
    sk      :'<code>sk-ant-</code>'
  };
  var todas = Object.assign({}, COMUNES, vars||{});
  return String(out).replace(/\{(\w+)\}/g, function(m,k){
    return (todas[k]!==undefined) ? todas[k] : m; });
}

/* ══ LES PONTS vers mf.js ══ */
var _DATOS = null;
var _ABIERTO = false;   /* un expediente a-t-il vraiment été ouvert ? */

/* ══ v5 (P-H, 11/09) : LA MATRICE, pas un squelette bricolé ══
   « Tu devrais avoir quelque part una plantilla de .mf VIDE »

   Le dossier que je fabriquais n'avait ni historial, ni patient, ni le
   bon formato. Maintenant il sort de comun/plantilla-mf.js, complet dès
   le premier jour — et un dossier ouvert qui manquerait de quelque chose
   est remis d'aplomb sans qu'on touche à ce qui s'y trouve. */
function _asegura(){
  if(!_DATOS){
    _DATOS = (typeof SF_PLANTILLA!=='undefined')
      ? SF_PLANTILLA.nuevo(MF.paciente() || {})
      : { formato:'SF1', mesures:[], events:[], medicaments:[] };
  }
  return _DATOS;
}
function loadData(){       return _asegura().mesures || []; }
function saveDataArr(v){   _asegura().mesures=v; MF.tocado(); }
function loadEvents(){     return _asegura().events || []; }
function saveEvents(v){    _asegura().events=v; MF.tocado(); }
function loadMeds(){       return _asegura().medicaments || []; }
function saveMeds(v){      _asegura().medicaments=v; MF.tocado(); }
function saveData(){       if(_DATOS) MF.tocado(); }
function getPatientLabel(){ var p=MF.paciente(); return p.etiqueta||p.matricula||''; }
function showPanel(){} function switchTab(){}
function loadAntecedentes(){  return _asegura().antecedentes || []; }
function saveAntecedentes(v){ _asegura().antecedentes=v; MF.tocado(); }
function loadBacterio(){      return _asegura().bacteriologia || []; }
function saveBacterio(v){     _asegura().bacteriologia=v; MF.tocado(); }
function loadVacunas(){       return _asegura().vacunas || []; }
function saveVacunas(v){      _asegura().vacunas=v; MF.tocado(); }
function loadArchivos(){      return _asegura().archivos || {}; }
function saveArchivos(v){     _asegura().archivos=v; MF.tocado(); }
function loadPdfsArchivo(){   return (_asegura().pdfs && _asegura().pdfs.archivos) || {}; }
function savePdfsArchivo(v){
  var p=_asegura(); if(!p.pdfs) p.pdfs={directorio:'',archivos:{}};
  p.pdfs.archivos=v; MF.tocado();
}
function loadServicios(){     return _asegura().servicios || []; }
function saveServicios(v){    _asegura().servicios=v; MF.tocado(); }
function loadCentros(){       return _asegura().centros || []; }
function saveCentros(v){      _asegura().centros=v; MF.tocado(); }
function loadPrescriptores(){ return _asegura().prescriptores || []; }
function savePrescriptores(v){ _asegura().prescriptores=v; MF.tocado(); }
function baseSalufolio(){ var p=MF.paciente(); return '../../pacientes/'+(p.matricula||'')+'/sources/'; }
function escJsAttr(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

/* les textes qui ne tiennent pas dans un attribut */
function pintaTextos(){
  var i = document.getElementById('cfg-intro');
  if(i) i.innerHTML = t('cfg_intro') + '<br><br>' + t('cfg_gratis');
  var c = document.getElementById('cfg-cuanto-expl');
  if(c) c.innerHTML = t('cfg_cuanto_expl');
  var d = document.querySelector('[data-idioma="dia_intro"]');
  if(d) d.innerHTML = t('dia_intro');
  if(typeof MF!=='undefined' && MF.aplicaIdioma) MF.aplicaIdioma();
}



/* ══════════════════════════════════════════════════════════════════════
   EL DIARIO (P-H, 09-10/09/2026)

   « Dans tous les cas, il y a un journal qui coiffe tout le monde. »
   « Le journal doit vivre à part, pas dans le .mf — chaque patient a son
     journal dans son dossier. »

   UN SEUL JOURNAL PAR PATIENT, dans son dossier :

       pacientes/AGL5678/diario.js

   Chaque ligne porte son MODE — [A]utomática · [M]anual · [S]emiauto — et
   chaque programme ne montre que le sien. La racine de l'acquisition
   montre tout, par date.

   Et sa SÉANCE : les lignes d'une même fournée partagent l'heure de début,
   de sorte qu'on puisse les regrouper à l'affichage.

   Il se range tout seul quand le serveur tourne. Sans lui, il se télécharge
   et vous le placez — comme le reste.
   ══════════════════════════════════════════════════════════════════════ */
var MI_MODO   = 'A';        /* ce programme est l'automatique */
var DIARIO    = [];
var SESION    = null;
var _DIA_SUCIO = false;

function _sello(d){
  d = d || new Date();
  var z = function(x){ return String(x).padStart(2,'0'); };
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())
       + '_'+z(d.getHours())+'h'+z(d.getMinutes());
}
function _rutaDiario(){
  var p = MF.paciente() || {};
  return p.matricula ? ('pacientes/' + p.matricula + '/diario.js') : null;
}

function cargaDiario(alListo){
  var p = MF.paciente() || {};
  DIARIO = [];
  if(!p.matricula){ pintaDiario(); if(alListo) alListo(); return; }
  var viejo = document.getElementById('_sc_diario');
  if(viejo) viejo.remove();
  window.SF_DIARIO = null;
  var sc = document.createElement('script');
  sc.id  = '_sc_diario';
  sc.src = '../../pacientes/' + p.matricula + '/diario.js?' + Date.now();
  sc.onload  = function(){
    if(window.SF_DIARIO && Array.isArray(SF_DIARIO.lineas)) DIARIO = SF_DIARIO.lineas;
    pintaDiario(); if(alListo) alListo();
  };
  sc.onerror = function(){ pintaDiario(); if(alListo) alListo(); };
  document.head.appendChild(sc);
}

function salvaDiario(){
  var ruta = _rutaDiario();
  if(!ruta) return Promise.resolve({ok:false});
  var p = MF.paciente() || {};
  var js = '/* ═══════════════════════════════════════════════════════\n'
    + '   EL DIARIO de ' + (p.etiqueta || p.matricula) + '\n\n'
    + '   Una linea por documento leido, sea cual sea el modo:\n'
    + '     A · automatica   M · manual   S · asistida\n\n'
    + '   No es un dato medico: es el cuaderno del trabajo.\n'
    + '   ═══════════════════════════════════════════════════════ */\n'
    + 'var SF_DIARIO = window.SF_DIARIO = '
    + JSON.stringify({ matricula: p.matricula || '', actualizado: _sello(),
                       lineas: DIARIO }, null, 1) + ';\n';
  return MF.guarda(ruta, js).then(function(r){
    _DIA_SUCIO = !(r && r.como === 'servidor');
    pintaDiario();
    return r;
  });
}

function diario(){ return DIARIO; }

function anotaEnDiario(linea){
  if(!SESION) SESION = _sello();
  DIARIO.push(Object.assign({
    cuando: _sello(), sesion: SESION, modo: MI_MODO,
    programa: SF_CONFIG.id + ' ' + SF_CONFIG.version
  }, linea));
  _DIA_SUCIO = true;
  pintaDiario();
  return DIARIO[DIARIO.length-1];
}

/* ══ ce que chaque ligne montre (P-H, 10/09) ══
   [Modo] [Estado] [Fecha] [Duracion] [fichero] [resumen] */
var ICO_MODO   = { A:'\u2699\ufe0f', M:'\u270d\ufe0f', S:'\ud83d\udccb' };
var NOM_MODO   = { A:'automatica', M:'manual', S:'asistida' };
var ICO_ESTADO = { X:'\u2713', C:'\u23f9', E:'\u26a0\ufe0f' };
var COL_ESTADO = { X:'var(--ok)', C:'var(--muted)', E:'var(--warn)' };

function _estadoDe(l){
  if(l.error && l.parado) return 'C';
  if(l.error)    return 'E';
  if(l.repetido) return 'C';
  return 'X';
}
function _resumenDe(l){
  if(l.parado)   return String(l.error||'');
  if(l.error)    return String(l.error).substring(0,70);
  if(l.repetido) return t('dia_repe') + ' \u00b7 ' + (l.comoEn||'');
  var p = [];
  if(l.mediciones)   p.push(l.mediciones + ' med');
  if(l.eventos)      p.push(l.eventos + ' ev');
  if(l.medicamentos) p.push(l.medicamentos + ' trat');
  var r = p.join(' \u00b7 ') || 'nada';
  if(l.dudas && l.dudas.length) r += '  \u26a0 ' + l.dudas.length;
  return r;
}

function pintaDiario(){
  var z = document.getElementById('diario-lista');
  if(!z) return;
  var D = DIARIO.filter(function(l){ return (l.modo || 'A') === MI_MODO; });

  var c = document.getElementById('c-diario');
  if(c) c.textContent = D.length ? (D.length + (_DIA_SUCIO ? ' \u00b7 sin guardar' : '')) : '';
  var bot = document.getElementById('botones-diario');
  if(bot) bot.style.display = DIARIO.length ? 'flex' : 'none';

  if(!D.length){
    z.innerHTML = '<div style="font-size:12.5px;color:var(--muted);padding:10px 0">'
      + t('dia_vacio') + '</div>';
    return;
  }

  var tandas = {};
  D.forEach(function(l){
    var k = l.sesion || l.cuando;
    (tandas[k] = tandas[k] || []).push(l);
  });
  var claves = Object.keys(tandas).sort().reverse();

  var html = '';
  claves.forEach(function(k){
    var L = tandas[k];
    var bien = L.filter(function(l){ return _estadoDe(l)==='X'; }).length;
    html += '<div style="margin:12px 0 4px;padding-bottom:3px;'
      + 'border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10.5px;'
      + 'letter-spacing:1px;color:var(--accent)">'
      + k.replace('_',' \u00b7 ')
      + '  <span style="color:var(--muted);letter-spacing:0">'
      + L.length + ' doc, ' + bien + ' le\u00eddo' + (bien>1?'s':'') + '</span></div>';

    L.forEach(function(l){
      var i  = DIARIO.indexOf(l);
      var es = _estadoDe(l);
      html += '<div onclick="detalleDiario(' + i + ')" style="display:flex;gap:8px;'
        + 'align-items:baseline;font-size:12px;padding:5px 4px;cursor:pointer;'
        + 'border-bottom:1px solid var(--border)">'
        + '<span title="' + (NOM_MODO[l.modo]||'') + '" style="flex:0 0 16px">'
          + (ICO_MODO[l.modo]||'\u00b7') + '</span>'
        + '<span style="flex:0 0 16px;color:' + (COL_ESTADO[es]||'var(--muted)') + '">'
          + (ICO_ESTADO[es]||'\u00b7') + '</span>'
        + '<span style="flex:0 0 112px;color:var(--muted);font-family:var(--mono);font-size:10.5px">'
          + String(l.cuando||'').replace('_',' ') + '</span>'
        + '<span style="flex:0 0 42px;color:var(--muted);font-family:var(--mono);'
          + 'font-size:10.5px;text-align:right">' + (l.segundos ? l.segundos + 's' : '') + '</span>'
        + '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
          + (l.fichero || '\u2014') + '</span>'
        + '<span style="flex:0 0 auto;color:var(--muted);font-size:11px">'
          + _resumenDe(l) + '</span></div>';
    });
  });
  z.innerHTML = html;
}

function detalleDiario(i){
  var l = DIARIO[i];
  if(!l) return;

  var filas = [
    [t('det_fichero'),  l.fichero],
    [t('det_cuando'),   String(l.cuando||'').replace('_',' ')],
    [t('det_sesion'),   String(l.sesion||'').replace('_',' ')],
    [t('det_modo'),     (ICO_MODO[l.modo]||'') + ' ' + t('mod_' + (l.modo||'A'))],
    [t('det_duracion'), l.segundos ? (l.segundos + ' ' + t('det_segundos')) : ''],
    [t('det_quien'),    l.modelo],
    [t('det_que'),      l.prompt],
    [t('det_fuente'),   l.fuente],
    [t('det_sacado'),   (l.mediciones||0) + ' mediciones \u00b7 ' + (l.eventos||0)
                        + ' eventos \u00b7 ' + (l.medicamentos||0) + ' medicamentos'],
    [t('det_error'),    l.error]
  ].filter(function(x){ return x[1]; });

  /* les classes viennent du CSS commun — plus rien en dur ici (P-H) */
  var cuerpo = '<table>'
    + filas.map(function(x){
        return '<tr><td class="sf-etiq">' + x[0] + '</td>'
             + '<td class="sf-valor">' + x[1] + '</td></tr>'; }).join('')
    + '</table>'
    + (l.dudas && l.dudas.length
       ? '<details class="sf-dudas"><summary>\u26a0 ' + l.dudas.length
         + ' DUDA' + (l.dudas.length>1?'S':'')
         + ' <span class="sf-sordo">' + t('det_desplegar') + '</span></summary>'
         + l.dudas.map(function(d){
             return '<div class="sf-duda">' + d + '</div>'; }).join('')
         + '</details>'
       : '');

  MF.ventana((ICO_ESTADO[_estadoDe(l)]||'') + ' ' + (l.fichero||'\u2014'),
             cuerpo, { cerrar: t('det_cerrar') });
}

function borraDiario(){
  if(!DIARIO.length) return;
  var fechas = DIARIO.map(function(l){ return String(l.cuando||'').substring(0,10); })
                     .filter(Boolean).sort();

  var cuerpo = '<div class="sf-sordo">' + t('dia_limpiar_expl') + '<br>'
    + t('dia_limpiar_hay', { n:'<b>'+DIARIO.length+'</b>', desde:'<b>'+fechas[0]+'</b>' })

/* Petit toast de statut (bas de l'écran, auto-disparition) — utilisé par
   les actions rapides (vaccins, changement de statut médicament, etc.)
   pour confirmer une action sans bloquer avec une alert(). Historiquement
   appelé mais jamais défini nulle part -> "status is not a function". */
function status(msg) {
  var el = document.getElementById('mf-status-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'mf-status-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);' +
      'background:var(--surface2);color:var(--text);border:1px solid var(--accent);' +
      'border-radius:8px;padding:10px 18px;font-size:13px;z-index:20000;' +
      'box-shadow:0 4px 16px rgba(0,0,0,0.35);opacity:0;transition:opacity .2s;pointer-events:none';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(function() { el.style.opacity = '0'; }, 2600);
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function getStatus(key, val) {
  const p = PARAMS[key];
  if (!p || !p.ref) return 'ok';
  const [lo, hi] = p.ref;
  if (lo !== null && val < lo) return 'bad';
  if (hi !== null && val > hi) return 'bad';
  return 'ok';
}
function getSeriesForParam(data, key) {
  /* v2026.7.21.10 — chaque point porte sa ROCHE-MÈRE : pdf_id + pdf voyagent
     avec la valeur (Lavoisier appliqué aux graphiques). */
  return data.filter(m => m.vals && (m.vals||{})[key] !== undefined)
             .map(m => ({ x: m.date, y: (m.vals||{})[key], src: m.src, pdf_id: m.pdf_id, pdf: m.pdf }))
             .sort((a,b) => a.x.localeCompare(b.x));
}

/* v2026.7.21.10 — « el médico no se lo creerá: ¿dónde está el informe? » (P-H) :
   un clic sur un point OUVRE le document source (résolu via le registre pdfs).
   Sans carpeta configurée, on affiche au moins le nom du document. */
/* P-H 09/08 : le PDF s'affiche dans un POPUP MAISON — déplaçable par sa
   poignée, redimensionnable par le coin bas-droit (poignée native du
   navigateur), fermable par ✕. Le document est rendu par la visionneuse
   PDF intégrée de Brave, DANS le popup. Pur HTML, zéro serveur. */
/* P-H 09/08-10/08 : « mets en relief HEMOGLOBINA dans le pdf » — la
   visionneuse de Brave ne surligne pas sur commande, alors l'app dessine
   ELLE-MÊME la page avec pdf.js (déjà embarqué pour l'OCR) et pose des
   surlignages dorés sur chaque occurrence du paramètre ET de sa valeur.
   Navigation ◀ ▶ entre les pages, redessin au redimensionnement du popup.
   Sans pdf.js ou PDF illisible (scan) : repli sur la visionneuse embed. */
function _pdfPopupShell(titulo, info) {
  document.querySelectorAll('.pdf-popup-maison').forEach(function(o) { o.remove(); });
  var pop = document.createElement('div');
  pop.className = 'pdf-popup-maison';
  pop.style.cssText = 'position:fixed;z-index:10002;width:min(900px,94vw);height:82vh;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:4px;display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:280px;min-height:160px';
  pop.style.left = 'calc(50% - min(450px,47vw))';
  pop.style.top = '40px';
  var banda = info ? '<div class="pdf-popup-banda" style="flex:0 0 auto;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--border)">🔍 Verificar en el documento: <b style="color:' + info.color + '">' + info.label + '</b> = <b>' + info.valor + '</b> ' + info.unidad + ' (' + (typeof fmtDate === 'function' ? fmtDate(info.fecha) : info.fecha) + ')<span class="pdf-popup-extra"></span></div>' : '';
  pop.innerHTML =
    '<div class="pdf-popup-drag" style="cursor:move;user-select:none;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 6px;border-bottom:1px solid var(--border)">' +
    '<b style="font-size:13px">📄 ' + titulo + '</b>' +
    '<span style="cursor:pointer;color:var(--muted);font-size:16px" onclick="this.closest(\'.pdf-popup-maison\').remove()">✕</span></div>' + banda +
    '<div class="pdf-popup-cuerpo" style="flex:1;min-height:0;overflow:auto;position:relative"></div>';
  document.body.appendChild(pop);
  (function() {
    var poignee = pop.querySelector('.pdf-popup-drag');
    var dragging = false, sx = 0, sy = 0, ol = 0, ot = 0;
    function pt(e) { return e.touches && e.touches[0] ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }
    function down(e) { if (e.target.tagName === 'SPAN' && e.target.getAttribute('onclick')) return; dragging = true; var p = pt(e); sx = p.x; sy = p.y; var r = pop.getBoundingClientRect(); ol = r.left; ot = r.top; e.preventDefault(); }
    function move(e) { if (!dragging) return; var p = pt(e); pop.style.left = Math.max(0, Math.min(window.innerWidth - 80, ol + p.x - sx)) + 'px'; pop.style.top = Math.max(0, Math.min(window.innerHeight - 40, ot + p.y - sy)) + 'px'; }
    function up() { dragging = false; }
    poignee.addEventListener('mousedown', down);
    poignee.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  })();
  return { pop: pop, cuerpo: pop.querySelector('.pdf-popup-cuerpo'), extra: pop.querySelector('.pdf-popup-extra') };
}

function _pdfPopupAbrir(url, titulo, info) {
  var sh = _pdfPopupShell(titulo, info);
  sh.cuerpo.innerHTML = '<embed src="' + url + '" type="application/pdf" style="width:100%;height:100%;border:0">';
}

async function _pdfPopupAbrirEnPagina(url, titulo, info, nom) {
  if (typeof pdfjsLib === 'undefined') { _pdfPopupAbrir(url, titulo, info); return; }
  var doc;
  /* P-H 10/08 : un file:// ne peut PAS être lu par fetch NI par le worker
     pdf.js depuis une page file:// (CORS « origin null », mur définitif).
     La seule voie propre pour récupérer les OCTETS (nécessaires au rendu
     maison + surlignage) est le serveur, qui sert le PDF en http:// —
     guichet /api/pdf déjà là. Repli sur l'embed file:// si pas de serveur
     (l'embed, lui, le navigateur l'autorise). */
  try {
    var buf = null;
    if (nom) {
      var srv = (typeof baseSalufolio === 'function' && baseSalufolio()) ? baseSalufolio() : 'http://localhost:7777';
      var stem = /\.pdf$/i.test(nom) ? nom.slice(0, -4) : nom;
      var r = await fetch(srv + '/api/pdf?n=' + encodeURIComponent(stem));
      if (r.ok) buf = await r.arrayBuffer();
    }
    if (!buf) buf = await (await fetch(url)).arrayBuffer(); /* dernier recours file:// */
    doc = await pdfjsLib.getDocument({ data: buf }).promise;
  }
  catch (e) { _pdfPopupAbrir(url, titulo, info); return; }
  try {
    var labelMin = (info && info.label) ? info.label.toLowerCase() : null;
    /* Les formes sous lesquelles le laboratoire peut écrire CETTE valeur.
       P-H 11/08 : le feutre ratait les valeurs > 1000 — le .sf porte 2583
       mais le PDF imprime « 2.583,00 » (point de milliers à l'espagnole).
       Faute de la trouver, le feutre continuait et surlignait le LABEL sur
       une autre page (« elevación de Dímero D... » p4 au lieu du 2.583 p2).
       On fabrique donc toutes les écritures plausibles de la même valeur. */
    var valores = [];
    if (info) {
      var n = Number(info.valor);
      var brut = String(info.valor);
      valores.push(brut);                         /* 2583   ·  13.8   */
      valores.push(brut.replace('.', ','));       /* 2583   ·  13,8   */
      if (isFinite(n) && Math.abs(n) >= 1000) {
        /* séparateur de milliers espagnol : le point */
        var ent = Math.trunc(Math.abs(n));
        var dec = brut.indexOf('.') >= 0 ? brut.split('.')[1] : '';
        var mil = String(ent).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        valores.push(mil);                        /* 2.583            */
        valores.push(mil + ',' + (dec || '00'));  /* 2.583,00         */
        valores.push(mil + ',' + (dec || '0'));   /* 2.583,0          */
      } else if (isFinite(n) && Number.isInteger(n)) {
        /* un entier peut être imprimé avec décimales : 235 → 235,00 */
        valores.push(brut + ',00');
        valores.push(brut + ',0');
      }
      valores = valores.filter(function (v, i, a) { return v && a.indexOf(v) === i; });
    }
    /* P-H 10/08 : « affiche la page qui tient le 1er feutre ». On ouvre
       donc la première page où quelque chose SERA surligné — c.-à-d. la
       valeur (le repère le plus sûr) ou, à défaut, le label. On cherche
       la valeur en priorité (page du vrai feutre), le label ne servant
       que de repli s'il n'y a aucune valeur nulle part. */
    var pagina = 1, pageValeur = 0, pageLabel = 0, textoVacio = true;
    if (labelMin || valores.length) {
      for (var pnum = 1; pnum <= doc.numPages; pnum++) {
        var pg = await doc.getPage(pnum);
        var tc0 = await pg.getTextContent();
        var texto = tc0.items.map(function(it) { return it.str; }).join(' ');
        if (texto.trim()) textoVacio = false;
        var tl = texto.toLowerCase();
        if (!pageValeur && valores.some(function(v) { return v && texto.indexOf(v) !== -1; })) pageValeur = pnum;
        if (!pageLabel && labelMin && tl.indexOf(labelMin) !== -1) pageLabel = pnum;
        if (pageValeur) break; /* la page du feutre-valeur trouvée, on s'arrête */
      }
      pagina = pageValeur || pageLabel || 1;
    }
    if (textoVacio) { try { doc.destroy(); } catch (e) {} _pdfPopupAbrir(url, titulo, info); return; } /* scan sans OCR */
    var sh = _pdfPopupShell(titulo, info);
    var barra = document.createElement('div');
    barra.style.cssText = 'flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:3px 6px;border-bottom:1px solid var(--border);font-size:12px';
    barra.innerHTML = '<button class="pdf-pg-prev" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 8px">◀</button>' +
      '<span class="pdf-pg-info"></span>' +
      '<button class="pdf-pg-next" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 8px">▶</button>' +
      '<span class="pdf-pg-nb" style="color:var(--muted)"></span>';
    sh.pop.insertBefore(barra, sh.cuerpo);
    sh.cuerpo.style.background = '#8a8a8a';
    sh.cuerpo.style.textAlign = 'center';
    var actual = pagina;
    async function dibujar(pnum) {
      actual = pnum;
      sh.cuerpo.innerHTML = '';
      var page = await doc.getPage(pnum);
      var vp1 = page.getViewport({ scale: 1 });
      var ancho = Math.max(300, sh.cuerpo.clientWidth - 20);
      var scale = ancho / vp1.width;
      var vp = page.getViewport({ scale: scale });
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:relative;display:inline-block;margin:8px 0;box-shadow:0 2px 10px rgba(0,0,0,.4)';
      var canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height;
      wrapper.appendChild(canvas);
      sh.cuerpo.appendChild(wrapper);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      var tc = await page.getTextContent();
      var nb = 0, premierTop = null;
      tc.items.forEach(function(it) {
        var s = (it.str || '');
        var hit = (labelMin && s.toLowerCase().indexOf(labelMin) !== -1) ||
                  valores.some(function(v) { return v && s.indexOf(v) !== -1; });
        if (!hit) return;
        nb++;
        var tx = pdfjsLib.Util.transform(vp.transform, it.transform);
        var h = Math.hypot(tx[2], tx[3]) || 12;
        var d = document.createElement('div');
        d.style.cssText = 'position:absolute;background:rgba(255,200,0,.45);outline:1.5px solid rgba(230,150,0,.9);border-radius:2px;pointer-events:none;left:' + (tx[4] - 2) + 'px;top:' + (tx[5] - h) + 'px;width:' + (it.width * scale + 4) + 'px;height:' + (h * 1.2) + 'px';
        wrapper.appendChild(d);
        if (premierTop === null) premierTop = tx[5] - h;
      });
      barra.querySelector('.pdf-pg-info').textContent = 'página ' + pnum + ' / ' + doc.numPages;
      barra.querySelector('.pdf-pg-nb').textContent = nb ? ('🟡 ' + nb + ' resaltado' + (nb > 1 ? 's' : '')) : '';
      if (premierTop !== null) sh.cuerpo.scrollTop = Math.max(0, premierTop - 60);
    }
    barra.querySelector('.pdf-pg-prev').onclick = function() { if (actual > 1) dibujar(actual - 1); };
    barra.querySelector('.pdf-pg-next').onclick = function() { if (actual < doc.numPages) dibujar(actual + 1); };
    /* redessin quand P-H redimensionne le popup (poignée du coin) */
    var roT = null;
    new ResizeObserver(function() { clearTimeout(roT); roT = setTimeout(function() { dibujar(actual); }, 200); }).observe(sh.cuerpo);
    await dibujar(pagina);
  } catch (e) {
    try { doc.destroy(); } catch (e2) {}
    _pdfPopupAbrir(url, titulo, info);
  }
}

function _chartVerInforme(s, key) {
  var id = s && (s.pdf_id || s.pdf); if (!id) return;
  /* P-H 09/08 : le popup annonce CE QU'ON EST VENU VÉRIFIER — paramètre,
     valeur, date — et l'URL porte #search= (honoré par certains visores). */
  var info = null;
  if (key && typeof PARAMS === 'object' && PARAMS[key]) {
    info = { label: PARAMS[key].label || key, valor: s.y, unidad: PARAMS[key].unit || '', fecha: s.x, color: PARAMS[key].color || 'var(--accent)' };
  }
  /* P-H 09/08 (« je n'ai pas besoin d'un serveur pour lire un pdf ») :
     ouverture DIRECTE en file:// — les fichiers de sources/ portent
     désormais leur nom exact PDFxxx.pdf, il suffisait d'ajouter
     l'extension que l'ancien code n'ajoutait pas. Zéro dépendance. */
  var nom = /\.pdf$/i.test(String(id)) ? String(id) : String(id) + '.pdf';
  var dir = (typeof pdfCarpeta === 'function') ? pdfCarpeta(id) : '';
  if (dir) {
    var base = dir.replace(/\/+$/, '');
    var url = (base.indexOf('://') !== -1 ? base : 'file://' + (base.charAt(0) === '/' ? '' : '/') + base) + '/' + encodeURIComponent(nom);
    try { _pdfPopupAbrirEnPagina(url, nom, info, nom); return; } catch (e) {}
  }
  /* v2026.7.21.20 — plus d'aboiement du navigateur (demande P-H) : le repli
     passe par la BANDE DU PAVÉ quand elle existe, et nomme le bon guichet
     (« Auditoría », pas « Trazabilidad »). L'alerte native ne sert que si
     aucune bande n'est à l'écran. */
  var msg = '📄 ' + nom + (dir
    ? ' — carpeta: ' + dir + ' (no se pudo abrir)'
    : ' — para abrirlo con un clic, defina la «carpeta de PDF» en la vista AUDITORÍA.');
  var det = document.getElementById('xz-cmt-detalle');
  if (det) { det.innerHTML = '🧪 ' + msg; return; }
  alert(msg);
}

Chart.defaults.font.family = "'IBM Plex Mono', monospace";
Chart.defaults.font.size = 10;
Chart.defaults.color = '#7a8499';
Chart.defaults.borderColor = '#2a3348';
const chartInstances = {};

/* v2026.7.21.4 — échelle par courbe : Lin (par défaut) ⇄ Log (natif Chart.js).
   Le BNP à 11924 (TEP 2022, valeur RÉELLE et grave) écrasait les valeurs
   récentes en linéaire ; en log, le pic ET les variations fines cohabitent.
   L'état vit dans _chartScale[key] ; le bouton dans le titre bascule et redessine. */
window._chartScale = window._chartScale || {};

/* v2026.7.21.17 — P-H avait RAISON sur l'échelle : l'app applique un zoom CSS
   (document.body.style.zoom, module languages) que Chart.js ignore dans ses
   calculs de souris → mauvais point détecté, doigt posé à côté. On calcule
   donc NOUS-MÊMES la position du curseur, auto-calibrée par le rapport
   rect/offsetWidth — juste quel que soit le zoom/l'échelle en vigueur. */
function _chartPosEvento(chart, ev) {
  var rect = chart.canvas.getBoundingClientRect();
  var f = (rect.width / (chart.canvas.offsetWidth || rect.width)) || 1;
  return { x: (ev.clientX - rect.left) / f, y: (ev.clientY - rect.top) / f };
}
function _chartPuntoCercano(chart, ev) {
  var pos = _chartPosEvento(chart, ev);
  var meta = chart.getDatasetMeta(0);
  var best = -1, bd = Infinity, dist = Infinity;
  (meta && meta.data || []).forEach(function(el, i) {
    var d = Math.abs(el.x - pos.x);
    if (d < bd) { bd = d; best = i; dist = Math.hypot(el.x - pos.x, el.y - pos.y); }
  });
  return { index: best, precis: dist <= 16 };
}
function makeChart(canvasId, key, data, opts) {
  opts = opts || {};
  /* v2026.7.21.8 — les opts sont mémorisées par canvas : les redraws
     (bascule d'échelle, resize) conservent l'habillage d'origine. */
  window._chartOpts = window._chartOpts || {};
  _chartOpts[canvasId] = opts;
  var rejilla = opts.claro ? '#e6e6de' : '#2a3348';
  const p = PARAMS[key];
  const series = getSeriesForParam(data, key);
  if (!series.length) return;
  const esLog = (_chartScale[key] === 'log');
  const labels = series.map(s => fmtDate(s.x));
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (chartInstances[canvasId]) { chartInstances[canvasId].destroy(); }
  window._chartSeries = window._chartSeries || {};
  _chartSeries[canvasId] = series;
  chartInstances[canvasId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: p.label,
        data: series.map(s => s.y),
        borderColor: p.color,
        backgroundColor: p.color + '18',
        pointBackgroundColor: series.map(s => getStatus(key, s.y) === 'bad' ? '#c0392b' : p.color),
        pointRadius: 5, pointHoverRadius: (opts.sinTooltip ? 5 : 7), pointHitRadius: 14, tension: 0.3, fill: false,
      }]
    },
    options: {
      responsive: true,
      /* v2026.7.21.10 — clic sur un point → ver informe (le survol l'annonce) */
      /* v2026.7.21.16 (P-H : « manque de sensibilité » + « un doigt à la
         place du curseur ») : le SURVOL est généreux — n'importe où sur la
         courbe, c'est le point le plus proche en X qui parle au pavé ; le
         CLIC reste précis — il n'ouvre l'informe que pile sur le rond ; et
         le curseur devient un DOIGT 👆 quand un rond est saisi. */
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      onClick: (e, els, chart) => {
        try {
          const pc = _chartPuntoCercano(chart, e.native || e);
          if (pc.precis) { const s = series[pc.index]; if (s && (s.pdf_id || s.pdf)) _chartVerInforme(s, key); }
        } catch (er) {}
      },
      /* v2026.7.21.15 (conception P-H : « affiche le texte dans la popup et
         point final ») : le survol d'un point nourrit le pavé DIRECTEMENT,
         sans dépendre de l'infobulle — que celle-ci soit activée ou non. */
      onHover: (e, els, chart) => {
        const ev = e.native || e;
        let pc = { index: -1, precis: false };
        try { pc = _chartPuntoCercano(chart, ev); } catch (er) {}
        try { const cible = ev.target || chart.canvas; if (cible) cible.style.cursor = pc.precis ? 'pointer' : 'default'; } catch (er) {}
        if (pc.index < 0 || typeof window._chartPuntoHover !== 'function') return;
        const s = series[pc.index] || {};
        const v = s.y;
        const doc = (typeof pdfNombre === 'function' && (s.pdf_id || s.pdf)) ? pdfNombre(s.pdf_id || s.pdf) : (s.src || '');
        try { _chartPuntoHover({ param: (p.label || key), fecha: s.x, valor: v, unidad: p.unit || '', fuera: getStatus(key, v) === 'bad', doc: doc, tienePdf: !!(s.pdf_id || s.pdf) }); } catch (er) {}
      },
      plugins: { legend: { display: false }, tooltip: { enabled: !opts.sinTooltip, callbacks: {
        afterLabel: c => {
          const s = series[c.dataIndex] || {};
          const fuera = getStatus(key, c.raw) === 'bad';
          const l = [fuera ? '⚠ Fuera de rango' : '✓ Normal'];
          const doc = (typeof pdfNombre === 'function' && (s.pdf_id || s.pdf)) ? pdfNombre(s.pdf_id || s.pdf) : (s.src || '');
          if (doc) l.push('📄 ' + doc);
          if (s.pdf_id || s.pdf) l.push('(clic: ver informe)');
          return l;
        }
      }}},
      scales: {
        x: { grid: { color: rejilla } },
        y: { type: esLog ? 'logarithmic' : 'linear',
             grid: { color: rejilla }, ticks: { maxTicksLimit: 6 },
             title: { display: true, text: p.unit + ' — vista ' + (esLog ? 'LOG' : 'LIN') } }
      }
    },
    plugins: [{
      id: 'ref', beforeDraw(chart) {
        if (!p.ref) return;
        const [lo, hi] = p.ref;
        if (lo === null && hi === null) return;
        const { ctx, chartArea: { left, right, top, bottom }, scales: { y } } = chart;
        ctx.save(); ctx.fillStyle = 'rgba(30,180,100,0.06)';
        const yTop = hi !== null ? y.getPixelForValue(Math.min(hi, y.max)) : top;
        const yBot = lo !== null ? y.getPixelForValue(Math.max(lo, y.min)) : bottom;
        ctx.fillRect(left, yTop, right - left, yBot - yTop);
        ctx.restore();
      }
    }]
  });
}

/* Helper: tooltip interactif pour les noms de paramètres */
function paramTip(key) {
  const p = PARAMS[key];
  if (!p) return '';
  const ref = p.ref ? p.ref.filter(v=>v!==null).join('–') + ' ' + p.unit : 'sin rango definido';
  return p.desc + '\nRef: ' + ref;
}
/* Tooltip global : un seul élément fixé au body, mesuré puis positionné —
   jamais rogné, jamais étroit (délégation : fonctionne pour tout .param-tip). */
(function initParamTip() {
  if (typeof document === 'undefined') return;
  let box = null;
  function ensureBox() {
    if (!box) { box = document.createElement('div'); box.id = 'param-tipbox'; document.body.appendChild(box); }
    return box;
  }
  document.addEventListener('mouseover', function (e) {
    const t = e.target && e.target.closest ? e.target.closest('[data-ptip]') : null;
    if (!t || !t.getAttribute('data-ptip')) return;
    const b = ensureBox();
    /* livrée : or-sur-bleu pour les corrélations (P-H), défaut sinon */
    if (t.classList && t.classList.contains('corr-tip')) {
      b.style.background = 'linear-gradient(135deg, var(--corr-tip-bg1), var(--corr-tip-bg2))';
      b.style.color = 'var(--corr-tip-color)';
      b.style.border = '1.5px solid var(--corr-tip-border)';
    } else {
      b.style.background = ''; b.style.color = ''; b.style.border = '';
    }
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    b.innerHTML = (t.getAttribute('data-ptip') || '').split('\n')
      .map(l => l.indexOf('Ref:') === 0
        ? '<span style="color:#3fb950;font-weight:600">' + esc(l) + '</span>'
        : esc(l)).join('<br>');
    b.classList.remove('on');
    b.style.left = '0px'; b.style.top = '-9999px';   /* mesurer hors écran */
    const r = t.getBoundingClientRect();
    const bw = b.offsetWidth, bh = b.offsetHeight;
    let x = Math.min(Math.max(6, r.left), window.innerWidth - bw - 6);
    let y = r.top - bh - 8;
    if (y < 6) y = r.bottom + 8;                      /* pas de place en haut → dessous */
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.classList.add('on');
  });
  document.addEventListener('mouseout', function (e) {
    const t = e.target && e.target.closest ? e.target.closest('[data-ptip]') : null;
    if (t && box) box.classList.remove('on');
  });
  document.addEventListener('scroll', function () { if (box) box.classList.remove('on'); }, true);
})();

function paramSpan(key, shortLabel, extraStyle) {
  const p = PARAMS[key];
  if (!p) return key;
  const ref = p.ref ? p.ref.filter(v=>v!==null).join(' – ') + ' ' + p.unit : '';
  /* P-H 07/08 : fondu avec l'indication clic droit dans LA MÊME bulle
     rapide (data-ptip) — l'ancien title="" natif du <td> parent avait un
     délai imposé par le navigateur, impossible à raccourcir en JS. */
  const tip = (p.desc || p.label) + (ref ? '\nRef: ' + ref : '') + '\n🖱️ Clic izq.: glosario · Clic der.: curva';
  const label = shortLabel || p.label;
  return '<span class="param-tip" data-ptip="' + tip.replace(/"/g, '&quot;') + '" onclick="glosarioMostrarToast(\'' + key.replace(/'/g,"") + '\', event)" style="cursor:pointer' + (extraStyle ? ';'+extraStyle : '') + '">' + label + '</span>';
}

/* Alias court pour templates */
function paramTip(key, short) {
  return paramSpan(key, short);
}

function fillParamSelect() {
  const sel = document.getElementById('m-param');
  if (!sel) return;
  sel.innerHTML = '<option value="">— ' + (t('lbl_param')||'Parámetro') + ' —</option>';

  /* Paramètres prédéfinis — triés alphabétiquement */
  const optGroup1 = document.createElement('optgroup');
  optGroup1.label = 'Parámetros estándar';
  Object.entries(PARAMS)
    .sort((a, b) => a[1].label.localeCompare(b[1].label))
    .forEach(([k,p]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = p.label + ' (' + p.unit + ')';
      optGroup1.appendChild(opt);
    });
  sel.appendChild(optGroup1);

  /* Paramètres personnalisés */
  const customs = loadCustomParams();
  if (Object.keys(customs).length) {
    const optGroup2 = document.createElement('optgroup');
    optGroup2.label = 'Mis parámetros';
    Object.entries(customs).forEach(([k,p]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = p.label + ' (' + p.unit + ')';
      optGroup2.appendChild(opt);
    });
    sel.appendChild(optGroup2);
  }

  /* Option pour ajouter un nouveau */
  const sep = document.createElement('option');
  sep.disabled = true; sep.textContent = '────────────────';
  sel.appendChild(sep);
  const addOpt = document.createElement('option');
  addOpt.value = '__NEW__'; addOpt.textContent = '➕ Nuevo parámetro...';
  addOpt.style.color = 'var(--accent)';
  sel.appendChild(addOpt);

  /* Remplir la datalist des sources */
  fillSourceList();
}

function fillSourceList() {
  const sel = document.getElementById('m-source-select');
  if (!sel) return;

  /* Collecter toutes les sources connues */
  const sources = new Set();
  loadData().forEach(d => { if (d.src) sources.add(d.src); });
  loadEvents().forEach(e => { if (e.src) sources.add(e.src); });
  loadCustomSources().forEach(s => sources.add(s));

  /* Garder la sélection actuelle */
  const prev = sel.value;

  sel.innerHTML = '<option value="">— Seleccionar fuente —</option>';

  /* Sources existantes */
  [...sources].sort().forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });

  /* Séparateur + option nouvelle */
  if (sources.size > 0) {
    const sep = document.createElement('option');
    sep.disabled = true; sep.textContent = '────────────────';
    sel.appendChild(sep);
  }
  const addOpt = document.createElement('option');
  addOpt.value = '__NEW_SOURCE__'; addOpt.textContent = '➕ Nueva fuente...';
  sel.appendChild(addOpt);

  /* Restaurer sélection si possible */
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function onSourceChange() {
  const sel = document.getElementById('m-source-select');
  const inp = document.getElementById('m-source-new');
  if (sel.value === '__NEW_SOURCE__') {
    inp.style.display = 'block';
    inp.focus();
  } else {
    inp.style.display = 'none';
    inp.value = '';
  }
}

function getSelectedSource() {
  const sel = document.getElementById('m-source-select');
  if (sel.value === '__NEW_SOURCE__') {
    return document.getElementById('m-source-new').value.trim() || '';
  }
  return sel.value || '';
}

/* Gestion des paramètres personnalisés */
const CUSTOM_PARAMS_KEY = 'mt_custom_params';
const CUSTOM_SOURCES_KEY = 'mt_custom_sources';

function loadCustomParams() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_PARAMS_KEY) || '{}'); } catch { return {}; }
}
function saveCustomParams(p) { localStorage.setItem(CUSTOM_PARAMS_KEY, JSON.stringify(p)); }
function loadCustomSources() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_SOURCES_KEY) || '[]'); } catch { return []; }
}
function saveCustomSources(s) { localStorage.setItem(CUSTOM_SOURCES_KEY, JSON.stringify(s)); }

function addCustomSource(src) {
  if (!src || src === 'Manuel') return;
  const sources = loadCustomSources();
  if (!sources.includes(src)) {
    sources.push(src);
    sources.sort();
    saveCustomSources(sources);
  }
}

function onParamChange() {
  const sel = document.getElementById('m-param');
  const box = document.getElementById('custom-param-box');
  if (sel.value === '__NEW__') {
    box.style.display = 'block';
    document.getElementById('cp-label').focus();
  } else {
    box.style.display = 'none';
  }
}

function registerCustomParam() {
  const label = document.getElementById('cp-label').value.trim();
  const unit  = document.getElementById('cp-unit').value.trim() || '';
  const refStr = document.getElementById('cp-ref').value.trim();

  if (!label) return null;

  /* Générer une clé machine depuis le label */
  const key = 'custom_' + label.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

  /* Parser ref "min-max" */
  let ref = null;
  if (refStr) {
    const parts = refStr.split(/[-–—]/);
    if (parts.length === 2) {
      ref = [parseFloat(parts[0]) || null, parseFloat(parts[1]) || null];
    }
  }

  /* Sauvegarder dans PARAMS (runtime) et localStorage */
  const customs = loadCustomParams();
  const paramDef = { label, unit, ref, color: '#7f8c8d', desc: 'Parámetro personalizado: ' + label };
  customs[key] = paramDef;
  PARAMS[key] = paramDef;
  saveCustomParams(customs);

  /* Reset les champs */
  document.getElementById('cp-label').value = '';
  document.getElementById('cp-unit').value = '';
  document.getElementById('cp-ref').value = '';
  document.getElementById('custom-param-box').style.display = 'none';

  /* Recharger le select et sélectionner le nouveau */
  fillParamSelect();
  document.getElementById('m-param').value = key;

  return key;
}

/* Ajoute la provenance au JSON extrait — structure conforme au
   journal du 12/07 : generado_por, fecha_importacion (locale,
   aaaa-mm-jj hh:mn:ss), modelo, fichero_origen, plus le prompt
   (nouveau v2026.6b : version de la table de pilotage). */
function ajouterTrazabilidad(parsed, extra) {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  parsed.trazabilidad = Object.assign({
    generado_por: 'Salufolio ' + (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '?'),
    fecha_importacion: d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' +
                       pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds())
  }, extra || {});
  return parsed;
}

/* ── Registre des FUENTES (proposition P-H 16/07, jumeau du registre pdfs) ──
   « Hospital General … » répété 100 fois → une table { S001: nombre }, les
   entrées ne portent que src_id. Ids STABLES : persistés (mt_fuentes), un
   libellé nouveau reçoit le numéro suivant, jamais de renumérotation. */
const FUENTES_KEY = 'mt_fuentes';
function loadFuentes() { try { return JSON.parse(localStorage.getItem(FUENTES_KEY) || '{}'); } catch { return {}; } }
function saveFuentes(f) { localStorage.setItem(FUENTES_KEY, JSON.stringify(f)); }

function fuentesRegistro() {
  const reg = loadFuentes();               /* {id: nombre} existant */
  const porNombre = {};
  Object.entries(reg).forEach(function([id, n]) { porNombre[n] = id; });
  let max = 0;
  Object.keys(reg).forEach(function(id) {
    const m = /^S(\d+)$/.exec(id); if (m) max = Math.max(max, parseInt(m[1]));
  });
  const adopter = function(x) {
    const n = x && x.src;
    if (!n || porNombre[n]) return;
    max += 1;
    const id = 'S' + String(max).padStart(3, '0');
    reg[id] = n; porNombre[n] = id;
  };
  (typeof loadData === 'function' ? loadData() : []).forEach(adopter);
  (typeof loadEvents === 'function' ? loadEvents() : []).forEach(adopter);
  (typeof loadMeds === 'function' ? loadMeds() : []).forEach(adopter);

function srcDeshidratar(tabla, porNombre) {
  return (tabla || []).map(function(x) {
    if (x && x.src && porNombre[x.src]) {
      const c = Object.assign({}, x); c.src_id = porNombre[x.src]; delete c.src; return c;
    }
    return x;
  });
}
function srcRehidratar(tabla, reg) {
  (tabla || []).forEach(function(x) {
    if (x && x.src_id && !x.src && reg[x.src_id]) x.src = reg[x.src_id];
  });
  return tabla;
}

function pdfDeshidratar(tabla) {
  /* copie de la table SANS la clé 'pdf' quand pdf_id existe (export normalisé).
     GARDE-FOU Lavoisier : si le nom de l'entrée diffère du registre (collision
     d'ids, cf. R3), on GARDE la clé explicite — aucune information ne se perd
     tant que le défaut n'est pas corrigé côté Extractor. */
  const archivos = pdfRegistro().archivos;
  const porNombre = {}, dobles = {};
  Object.entries(archivos).forEach(function([id, n]) {
    if (porNombre[n]) dobles[n] = 1; else porNombre[n] = id;
  });
  return (tabla || []).map(function(x) {
    if (!x || !x.pdf) return x;
    if (x.pdf_id && archivos[x.pdf_id] === x.pdf) {           /* cas normal */
      const c = Object.assign({}, x); delete c.pdf; return c;
    }
    if (!x.pdf_id && porNombre[x.pdf] && !dobles[x.pdf]) {    /* entrée orpheline (bacteriologie) */
      const c = Object.assign({}, x); c.pdf_id = porNombre[x.pdf]; delete c.pdf; return c;
    }
    return x;   /* collision ou inconnu : on garde le nom explicite (garde-fou) */
  });
}
function pdfRehidratar(tabla, archivos) {
  (tabla || []).forEach(function(x) {
    if (x && x.pdf_id && !x.pdf && archivos[x.pdf_id]) x.pdf = archivos[x.pdf_id];
  });
  return tabla;
}

function loadSourcesPdf() {
  try { return JSON.parse(localStorage.getItem(SOURCES_PDF_KEY) || '[]'); } catch { return []; }
}
function saveSourcesPdf(s) { localStorage.setItem(SOURCES_PDF_KEY, JSON.stringify(s)); }

function resolveOrCreatePdf(fichero) {
  const reg = loadSourcesPdf();
  const trouve = reg.find(r => r.fichero === fichero);
  if (trouve) return trouve.id;
  /* Référentiel de la pyramide : le CODE ÉPISODE de l'Extractor est l'id
     (JME1938-ICU007_... → ICU007). Repli PDFnnn pour les fichiers hors convention
     (sources extérieures non renommées, scans divers). Décision P-H 12/07/2026. */
  const m = (fichero || '').match(/^[A-Z]{3}\d{4}-([A-Z]{2,4}\d{3})_/);
  let id = m ? m[1] : null;
  if (!id || reg.some(r => r.id === id)) {
    id = 'PDF' + String(reg.length + 1).padStart(3, '0');
  }
  reg.push({ id: id, fichero: fichero });
  saveSourcesPdf(reg);
  return id;
}

/* ================================================================
   DÉDUPLICATION — Supprime les doublons dans events et bacterio
================================================================ */
function deduplicateAll() {
  /* Events : dédoublonner par date seulement (un seul événement par date) */
  const evts = loadEvents();
  if (!Array.isArray(evts)) return;
  const seenEvts = new Set();
  const uniqueEvts = evts.filter(e => {
    const key = (e.date||'');
    if (seenEvts.has(key)) return false;
    seenEvts.add(key);
    return true;
  });
  if (uniqueEvts.length < evts.length) {
    saveEvents(uniqueEvts);
    console.log('[Salufolio] Dedup events: ' + evts.length + ' → ' + uniqueEvts.length);
  }

  /* Bacterio : dédoublonner par date seulement (un seul résultat par date) */
  const bacts = loadBacterio();
  if (Array.isArray(bacts)) {
    const seenBacts = new Set();
    const uniqueBacts = bacts.filter(b => {
      const key = (b.date||b.date_prelevement||'');
      if (seenBacts.has(key)) return false;
      seenBacts.add(key);
      return true;
    });
    if (uniqueBacts.length < bacts.length) {
      saveBacterio(uniqueBacts);
      console.log('[Salufolio] Dedup bacterio: ' + bacts.length + ' → ' + uniqueBacts.length);
    }
  }

  /* Meds : dédoublonner par nom+date+dose (garder la dernière entrée avec le plus d'infos) */
  const meds = loadMeds();
  const seenMeds = new Set();
  const uniqueMeds = [];
  function _normMed(s) { return (s||'').replace(/\s*\(.*?\)/g,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
  meds.forEach(function(m) {
    var key = _normMed(m.nom) + '|' + (m.date||'') + '|' + _normMed(m.dose);
    if (!seenMeds.has(key)) {
      seenMeds.add(key);
      uniqueMeds.push(m);
    } else {
      /* Si doublon, mettre à jour l'existant avec les champs supplémentaires */
      var existing = uniqueMeds.find(function(u) { return _normMed(u.nom) + '|' + (u.date||'') + '|' + _normMed(u.dose) === key; });
      if (existing) {
        if (m.motif && !existing.motif) existing.motif = m.motif;
        if (m.date_fin && !existing.date_fin) existing.date_fin = m.date_fin;
        if (m.date_debut && !existing.date_debut) existing.date_debut = m.date_debut;
        if (m.remplace_par && !existing.remplace_par) existing.remplace_par = m.remplace_par;
        if (m.source && !existing.source) existing.source = m.source;
      }
    }
  });
  if (uniqueMeds.length < meds.length) {
    saveMeds(uniqueMeds);
    console.log('[Salufolio] Dedup meds: ' + meds.length + ' → ' + uniqueMeds.length);
  }
}

const JOURNAL_KEY = 'mt_import_journal';

function addJournalEntry(entry) {
  const j = loadJournal();
  /* horodatage local aaaa-mm-dd hh:mn:ss */
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  entry.ts = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' +
             pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());

async function handleFiles(files) {

  const plog = document.getElementById('progress-log');

    plog.innerHTML += `<br><b>📦 Batch: ${total} archivos PDF</b><br>`;

  for (let i = 0; i < total; i++) {

/* ================================================================
   EXTRACTION v2026.6b — Gère PDF natif, PDF scanné et images
   NOUVEAUTÉS v2026.6 :
   1. appelClaudeAvecRetry : retry/backoff sur coupures réseau,
      timeout, 429/500/529.
   2. parseJsonTolerant + repairJsonViaClaude (JSON cassés).
   NOUVEAUTÉ v2026.6b (correctif HCR001) :
   3. STREAMING (stream: true) : les longues générations (Resumida,
      altas denses) gardaient la connexion muette pendant 60-100 s
      → coupée par un intermédiaire → "Failed to fetch". En flux,
      des octets arrivent en continu : plus rien à couper. Bonus :
      progression réelle affichée pendant la génération.
================================================================ */

/* ── Lecture du flux SSE Anthropic : accumule les text_delta ──
   Timeout d'inactivité : si AUCUN octet n'arrive pendant IDLE_MS,
   on abandonne (remplace le timeout global, inadapté au flux). */
async function lireFluxSSE(resp, onProgress) {
  const IDLE_MS = 60000;
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '', texte = '', erreurFlux = null, stop = null;
  while (true) {
    const lecture = await Promise.race([
      reader.read(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('Flux inactif depuis ' + IDLE_MS / 1000 + ' s')), IDLE_MS))
    ]);
    const { done, value } = lecture;
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n')) >= 0) {
      const ligne = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 1);
      if (!ligne.startsWith('data:')) continue;
      const payload = ligne.slice(5).trim();
      let ev = null;
      try { ev = JSON.parse(payload); } catch (_) { continue; } /* ligne non-JSON : ignorer */
      if (ev.type === 'content_block_delta' && ev.delta && typeof ev.delta.text === 'string') {
        texte += ev.delta.text;
        if (onProgress) onProgress(texte.length);
      } else if (ev.type === 'message_delta' && ev.delta && ev.delta.stop_reason) {
        stop = ev.delta.stop_reason;   /* 'end_turn' | 'max_tokens' | ... */
      } else if (ev.type === 'error') {
        erreurFlux = new Error((ev.error && ev.error.message) || 'Erreur de flux API');
      }
    }
  }
  if (erreurFlux) throw erreurFlux;
  return { texte: texte, stop: stop };
}

/* ── Appel API en streaming, avec timeout de connexion + retry/backoff ──
   Retourne { ok:true, texte } ou { ok:false, status, errMsg } (erreurs 4xx
   non-réessayables, que l'appelant traite : fallback OCR, etc.).
   Réessaie sur : coupure réseau, timeout, flux inactif, 429, 500, 529. */
async function appelClaudeAvecRetry(corpsRequete, apiKey, plog, maxTentatives = 3) {
  const delais = [0, 3000, 8000];   /* backoff : immédiat, 3 s, 8 s */
  const CONNECT_MS = 30000;         /* 30 s max pour obtenir les en-têtes */
  let derniereErreur;

  for (let i = 0; i < maxTentatives; i++) {
    if (i > 0) {
      if (plog) plog.innerHTML += `↻ Nouvelle tentative ${i + 1}/${maxTentatives} dans ${delais[i] / 1000} s...<br>`;
      await new Promise(r => setTimeout(r, delais[i]));
    }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONNECT_MS);
    try {
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({ ...corpsRequete, stream: true }),
        signal: ctrl.signal
      });
      clearTimeout(timer);   /* en-têtes reçus : le flux prend le relais (timeout d'inactivité) */

      if ([429, 500, 529].includes(resp.status)) {
        derniereErreur = new Error('HTTP ' + resp.status + ' (API surchargée ou limitée)');
        continue;            /* réessayable */
      }
      if (!resp.ok) {
        const errData = await resp.json().catch(() => ({}));
        return { ok: false, status: resp.status, errMsg: (errData.error && errData.error.message) || ('Erreur API HTTP ' + resp.status) };
      }
      const flux = await lireFluxSSE(resp, nCar => {
        if (plog) {
          const marqueur = plog.querySelector('.sse-progress') ||
            (() => { const s = document.createElement('span'); s.className = 'sse-progress'; plog.appendChild(s); return s; })();
          marqueur.textContent = '⇣ génération : ' + nCar + ' car reçus';
        }
      });
      if (plog) { const m = plog.querySelector('.sse-progress'); if (m) m.textContent = '⇣ génération : terminée (' + flux.texte.length + ' car)'; }
      /* Troncature par max_tokens : signaler BRUYAMMENT — un JSON amputé
         puis "réparé" serait une perte silencieuse (anti-Lavoisier). */
      if (flux.stop === 'max_tokens' && plog)
        plog.innerHTML += '⚠ GÉNÉRATION TRONQUÉE (max_tokens atteint) — augmenter Max tokens dans ⚙️ et relancer ce document.<br>';
      return { ok: true, texte: flux.texte, tronque: flux.stop === 'max_tokens' };

    } catch (e) {
      clearTimeout(timer);
      /* Coupure réseau, timeout connexion, flux inactif → réessayable */
      derniereErreur = (e.name === 'AbortError')
        ? new Error('Timeout de connexion après ' + CONNECT_MS / 1000 + ' s')
        : e;
    }
  }
  throw derniereErreur;
}

/* ── Parse JSON tolérant ── */
function parseJsonTolerant(text) {
  let t = text.replace(/```json|```/g, '').trim();
  /* Isoler du premier { au dernier } (préambule/postambule parasites) */
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  try { return JSON.parse(t); } catch (e1) {
    /* Réparations mécaniques des casses observées au batch du 12/07 */
    const r = t
      .replace(/,\s*([}\]])/g, '$1')                                /* virgules traînantes */
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, ' ')    /* caractères de contrôle */
      .replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)(\s*:)/g, '$1"$2"$3'); /* clés sans guillemets (cas ICU005) */
    try { return JSON.parse(r); } catch (e2) {
      const err = new Error(e1.message);
      err.reparable = true;   /* signal : tenter la réparation via Claude */
      err.brut = t;
      throw err;
    }
  }
}

/* ── Réparation du JSON via Claude (dernier recours) ── */
async function repairJsonViaClaude(jsonCasse, apiKey, cfg, plog) {
  if (plog) plog.innerHTML += '🔧 JSON invalide — passe de réparation via Claude...<br>';
  const r = await appelClaudeAvecRetry({
    model: cfg.model,
    max_tokens: cfg.maxTokens,
    messages: [{ role: 'user', content: [{ type: 'text',
      text: 'Le JSON suivant est syntaxiquement invalide. Retourne-le corrigé, '
          + 'STRICTEMENT valide, sans rien changer au contenu, sans markdown, '
          + 'sans backticks, sans commentaire :\n\n' + jsonCasse }]}]
  }, apiKey, plog);
  if (!r.ok) throw new Error(r.errMsg || 'Erreur API (réparation)');
  return parseJsonTolerant(r.texte);  /* si ça casse encore, l'erreur remonte au journal */
}

/* ── Extraction principale ── */
async function extractPdf(file) {
  verifierPromptCharge();
  const _t0 = Date.now();  /* Brique 2 : chrono pour la durée au journal */
  const apiKey = localStorage.getItem('mt_apikey') || document.getElementById('api-key-input').value;
  if (!apiKey) { customAlert(t('no_api_key'), '', '🔑', 'var(--warn)'); return; }

  const pb = document.getElementById('progress-box');
  const pbar = document.getElementById('progress-bar');
  const plog = document.getElementById('progress-log');
  const ptitle = document.getElementById('progress-title');

  pb.style.display = 'block';
  pbar.style.background = 'var(--accent)';
  ptitle.textContent = t('extracting') + ' ' + file.name;
  pbar.style.width = '5%';
  plog.innerHTML = '';

  try {
    let messageContent;

    if (isImageFile(file)) {
      /* ── CAS 1 : IMAGE DIRECTE → OCR puis texte à Claude ── */
      plog.innerHTML += `📷 Image détectée : ${file.name}<br>`;
      const ocr = await ocrFromImage(file, plog, pbar);

      if (ocr.text.trim().length < 20) {
        throw new Error('OCR : texte trop court (' + ocr.text.length + ' car). Image illisible ou non-texte.');
      }

      plog.innerHTML += '→ Envoi du texte OCR à Claude pour extraction...<br>';
      messageContent = [{
        type: 'text',
        text: pickExtractionPrompt(ocr.text) + '\n\n--- TEXTE EXTRAIT PAR OCR (confiance ' + Math.round(ocr.confidence) + '%) ---\n\n' + ocr.text
      }];

    } else {
      /* ── CAS 2 : PDF ── */
      plog.innerHTML += `📄 PDF détecté : ${file.name}<br>`;
      plog.innerHTML += '→ Lecture du PDF...<br>';

      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(',')[1]);
        r.onerror = () => rej(new Error('Lecture échouée'));
        r.readAsDataURL(file);
      });

      pbar.style.width = '20%';

      /* Envoi direct du PDF à Claude (PDF natif).
         pickExtractionPrompt('') → prompt AUTO : la détection
         Resumida est faite par Claude (correctif bug HCR001). */
      plog.innerHTML += '→ Envoi du PDF à Claude...<br>';
      messageContent = [{
        type: 'document',
        source: { type: 'base64', media_type: 'application/pdf', data: b64 }
      }, {
        type: 'text', text: pickExtractionPrompt('')
      }];
    }

    pbar.style.width = '55%';

    /* ── Brique 1 : config + confirmation avant envoi ── */
    const _cfg = getApiConfig();
    /* ── Ce document a-t-il DÉJÀ été extrait ? Alors on ne paie pas deux fois.
       (P-H 16/07 : « il faut préserver le traitement API ».) La réponse brute
       est gardée par document (nom + taille) et voyage dans le .mf. ── */
    const _yaHecho = (typeof extBuscar === 'function') ? extBuscar(file) : null;
    let appel;
    if (_yaHecho) {
      plog.innerHTML += '♻️ <b>Ya extraído el ' + _yaHecho.fecha + '</b> (' + (_yaHecho.modelo || 'API') +
        ') — se reutiliza la respuesta guardada, <b>sin llamar a la API</b>.<br>';
      appel = { ok: true, texte: _yaHecho.respuesta };
    } else {
      const _sendOK = await confirmBeforeSend(file.name, _cfg.model);
      if (!_sendOK) {
        plog.innerHTML += '✗ ' + t('send_cancelled') + '<br>';
        pb.style.display = 'none';
        return;
      }

      /* ── APPEL CLAUDE (streaming + timeout + retry) ── */
      const _waitId = startWaitIndicator(file.name);
      try {
        appel = await appelClaudeAvecRetry({
          model: _cfg.model,
          max_tokens: _cfg.maxTokens,
          messages: [{ role: 'user', content: messageContent }]
        }, apiKey, plog);
      } finally {
        stopWaitIndicator();
      }
    }

    pbar.style.width = '75%';

    let texteReponse;
    if (!appel.ok) {
      const errMsg = appel.errMsg;

      /* Si Claude ne peut pas lire le PDF (scanné), fallback OCR */
      if (!isImageFile(file) && (errMsg.includes('Could not process') || errMsg.includes('no text') || errMsg.includes('image'))) {
        plog.innerHTML += '⚠ Claude ne peut pas lire ce PDF directement — lancement OCR...<br>';
        pbar.style.width = '10%';

        const ocr = await ocrFromPdfFallback(file, plog, pbar);
        if (ocr.text.trim().length < 20) {
          throw new Error('OCR : texte trop court. Document probablement non-texte.');
        }

        plog.innerHTML += '→ Renvoi du texte OCR à Claude...<br>';
        const _waitId2 = startWaitIndicator(file.name);
        let appelOcr;
        try {
          appelOcr = await appelClaudeAvecRetry({
            model: _cfg.model,
            max_tokens: _cfg.maxTokens,
            messages: [{ role: 'user', content: [{
              type: 'text',
              text: pickExtractionPrompt(ocr.text) + '\n\n--- TEXTE EXTRAIT PAR OCR (confiance ' + Math.round(ocr.confidence) + '%) ---\n\n' + ocr.text
            }]}]
          }, apiKey, plog);
        } finally {
          stopWaitIndicator();
        }

        if (!appelOcr.ok) throw new Error(appelOcr.errMsg || 'Erreur API (retry OCR)');
        texteReponse = appelOcr.texte;
        plog.innerHTML += '✓ Extraction via OCR réussie<br>';
      } else {
        throw new Error(errMsg);
      }
    } else {
      texteReponse = appel.texte;
      /* le trésor : ce que l'API a coûté, gardé pour toujours */
      if (!_yaHecho && typeof extGuardar === 'function') {
        extGuardar(file, texteReponse, _cfg.model);
        plog.innerHTML += '💾 Extracción guardada — este documento no volverá a pasar por la API.<br>';
      }
    }

    /* Parse tolérant, puis réparation via Claude en dernier recours */
    let parsed;
    try {
      parsed = parseJsonTolerant(texteReponse);
    } catch (ePrs) {
      if (!ePrs.reparable) throw ePrs;
      parsed = await repairJsonViaClaude(ePrs.brut, apiKey, _cfg, plog);
      plog.innerHTML += '✓ JSON réparé<br>';
    }

    /* Brique 2bis : provenance dans le JSON (version + date import + modèle + fichier) */
    ajouterTrazabilidad(parsed, { modelo: _cfg.model, fichero_origen: file.name,
      prompt: (typeof PROMPT_VERSION !== 'undefined' ? PROMPT_VERSION : 'inline') });

    /* Brique Normalisation (écriture) : enregistrer le PDF dans sources_pdf → pdf_id court */
    const _pdfId = resolveOrCreatePdf(file.name);

    /* ── VOIE RESUMIDA : la Historia Clínica Resumida n'est pas un épisode
       daté à mesures — c'est un instantané transversal. Rayonnage dédié :
       un événement daté FECHA DE ACTUALIZACIÓN, problèmes actifs (avec
       codes CIE) en diagnostics, inactifs en antécédents, traitements dans
       l'historique des médicaments. Les tableaux complets (vacunas, NANDA,
       NIC...) restent intégralement dans le journal (json). ── */

/* ── Resumida → tables normalisées du .mf (schéma v3 : dictionnaire + registre daté).
   Alimente vacunas/vacunaciones, enfermeria_dx/_registro, enfermeria_int/_registro,
   antecedentes — le PANEL VACUNAS · ENFERMERÍA s'en nourrit. Idempotent (dédup). ── */
function poblarTablasResumida(parsed, fechaHCR, fileName, pdfId) {
  const bilan = { vac: 0, nanda: 0, nic: 0, ant: 0 };
  function verserDictRegistre(items, loadDict, saveDict, loadReg, saveReg) {
    if (!items || !items.length) return 0;
    const dict = loadDict(), reg = loadReg();
    let ajoutes = 0;
    items.forEach(it => {
      if (!it || !it.codigo) return;
      if (!dict[it.codigo]) dict[it.codigo] = it.descripcion || it.codigo;
      const fecha = it.fecha || fechaHCR;
      if (!reg.some(r => r.codigo === it.codigo && r.fecha === fecha)) {
        reg.push({ fecha: fecha, codigo: String(it.codigo), pdf: fileName, pdf_id: pdfId });
        ajoutes++;
      }
    });
    reg.sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
    saveDict(dict); saveReg(reg);
    return ajoutes;
  }
  bilan.vac = verserDictRegistre(parsed.vacunas, loadVacunas, saveVacunas, loadVacunaciones, saveVacunaciones);
  bilan.nanda = verserDictRegistre(parsed.diagnosticos_enfermeria, loadEnfermeriaDx, saveEnfermeriaDx, loadEnfermeriaDxRegistro, saveEnfermeriaDxRegistro);
  bilan.nic = verserDictRegistre(parsed.intervenciones_enfermeria, loadEnfermeriaInt, saveEnfermeriaInt, loadEnfermeriaIntRegistro, saveEnfermeriaIntRegistro);
  /* antecedentes : actifs + inactifs, via la fusion existante (clé codificacion:codigo) */
  if (typeof mergeAntecedentes === 'function') {
    const ants = [];
    (parsed.problemas_activos || []).forEach(p => ants.push({
      codificacion: p.codificacion || 'CIE', codigo: p.codigo || p.descripcion,
      descripcion: p.descripcion, estado: 'activo',
      fechas: p.fecha ? [p.fecha] : [], pdf: fileName, pdf_id: pdfId }));
    (parsed.problemas_inactivos || []).forEach(p => ants.push({
      codificacion: p.codificacion || 'CIE', codigo: p.codigo || p.descripcion,

/* ══════════════════════════════════════════════════════════════════════
   LES DOUBLONS DE LA GVA (P-H, 09/09/2026)

   « je peux avoir des documents en double ou triple, différenciés
     seulement par une date d'impression ! ça, ça ne va pas du tout »

   Le portail donne le même rapport autant de fois qu'on le télécharge,
   avec un nom qui ne diffère que par la seconde d'impression. Rien dans
   le nom ne dit que c'est le même document.

   Ce qui les distingue vraiment, ce sont les numéros que le prompt
   relève maintenant : n_informe, n_episodio, n_solicitud. Deux
   documents qui portent le même numéro SONT le même document.

   Faute de numéro, on se rabat sur la signature du contenu : le centre,
   la date de l'informe et le type. Deux rapports du même service, du
   même jour, du même type, sont très probablement le même — on le dit
   dans le journal et on laisse P-H trancher.
   ══════════════════════════════════════════════════════════════════════ */
function huellaDe(parsed){
  var doc = parsed.documento || {}, idf = parsed.identificacion || {};
  /* le numéro, quand le document en porte un : c'est le plus sûr */
  if(idf.n_informe)   return 'inf:'   + String(idf.n_informe).trim();
  if(idf.n_episodio)  return 'epi:'   + String(idf.n_episodio).trim();
  if(idf.n_solicitud) return 'sol:'   + String(idf.n_solicitud).trim();
  /* faute de numéro : centre + date + type */
  var f = doc.fecha_informe || doc.fecha_ingreso || parsed.date || '';
  if(!f) return null;                    /* sans date, on ne juge pas */
  return 'sig:' + [ (doc.centro||'').toLowerCase().trim(),
                    (doc.servicio||'').toLowerCase().trim(),
                    f, (doc.tipo||'').toLowerCase().trim() ].join('|');
}

function yaLeido(huella){
  if(!huella) return null;
  var D = diario();
  for(var i=0;i<D.length;i++){
    if(D[i].huella === huella && !D[i].error && !D[i].repetido) return D[i];
  }
  return null;
}

         avant qu'on ait rien demandé. Le message vient au moment de lire

      PROMPT_TEXTO = null;
    });
