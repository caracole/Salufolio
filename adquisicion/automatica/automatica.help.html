es:`<h1>⚙️ Adquisición automática</h1>
<div class="sub">Leer los PDF con la clave API</div>

<div class="aviso"><b>Este modo no es gratuito y necesita una «clave» para funcionar.</b> Cada documento que Claude lee cuesta unos céntimos. Si prefiere no usar clave, el modo <b>asistida</b> hace lo mismo sin coste: se copia el texto en claude.ai y se trae la respuesta.</div>

<h2>La clave</h2>
<p>La clave es una larga cadena de letras y números —empieza por <code>sk-ant-</code>— que da permiso a Salufolio para pedir a Claude que lea sus documentos. Funciona como una contraseña: es suya, y no se comparte con nadie.</p>
<p>Se guarda en su aparato, en ningún otro sitio. Ni Salufolio ni nadie la ve pasar.</p>

<h2>Cómo conseguirla, paso a paso</h2>
<ol>
<li><b>Abra la consola de Claude</b> en una pestaña nueva: {consola}. Es un sitio distinto del chat de claude.ai.</li>
<li><b>Cree una cuenta</b> (o entre, si ya tiene una) con su correo electrónico.</li>
<li><b>Si la consola se lo pide</b>, añada un medio de pago o crédito. Este modo cuesta unos céntimos por documento (vea el aviso de arriba).</li>
<li><b>Entre en «Settings» y luego en «API keys»</b> — o vaya directamente: {claves}.</li>
<li><b>Pulse «Create key»</b> y póngale un nombre que reconozca, por ejemplo «Salufolio».</li>
<li><b>Copie la clave enseguida.</b> Solo se muestra una vez: si cierra la ventana sin copiarla, tendrá que crear otra.</li>
<li><b>Péguela aquí</b>, en el campo de la clave de esta pantalla.</li>
</ol>
<p>Si cree que alguien la ha visto, cree una clave nueva en la misma página y deje de usar la anterior.</p>
<div class="nota">Guía oficial de Anthropic, paso a paso: {guia} (en castellano).</div>

<h2>Leer documentos</h2>
<p>Suelte los PDF en la zona, o tóquela para elegirlos. Se leen uno tras otro, y cada uno deja su línea en el diario.</p>

<h2>El diario</h2>
<p>Cuándo, qué fichero, con qué modelo, qué se sacó — y las <b>dudas</b> que Claude devuelve cuando algo no estaba claro. Esas dudas valen oro: señalan lo que hay que comprobar.</p>
<p>El diario vive en el expediente del paciente. No se mezclan los diarios de dos personas.</p>`,

fr:`<h1>⚙️ Acquisition automatique</h1>
<div class="sub">Lire les PDF avec la clé API</div>

<div class="aviso"><b>Ce mode n'est pas gratuit et il lui faut une « clé » pour fonctionner.</b> Chaque document lu par Claude coûte quelques centimes. Si vous préférez ne pas utiliser de clé, le mode <b>assisté</b> fait la même chose sans frais : on copie le texte dans claude.ai et on rapporte la réponse.</div>

<h2>La clé</h2>
<p>La clé est une longue suite de lettres et de chiffres — elle commence par <code>sk-ant-</code> — qui donne à Salufolio la permission de demander à Claude de lire vos documents. Elle fonctionne comme un mot de passe : elle est à vous, et ne se partage avec personne.</p>
<p>Elle est gardée sur votre appareil, nulle part ailleurs. Ni Salufolio ni personne ne la voit passer.</p>

<h2>Comment l'obtenir, pas à pas</h2>
<ol>
<li><b>Ouvrez la console Claude</b> dans un nouvel onglet : {consola}. C'est un site distinct du chat claude.ai.</li>
<li><b>Créez un compte</b> (ou connectez-vous si vous en avez déjà un) avec votre courriel.</li>
<li><b>Si la console vous le demande</b>, ajoutez un moyen de paiement ou du crédit. Ce mode coûte quelques centimes par document (voir l'avis ci-dessus).</li>
<li><b>Allez dans « Settings » puis « API keys »</b> — ou directement : {claves}.</li>
<li><b>Cliquez sur « Create key »</b> et donnez-lui un nom que vous reconnaîtrez, par exemple « Salufolio ».</li>
<li><b>Copiez la clé tout de suite.</b> Elle ne s'affiche qu'une fois : si vous fermez la fenêtre sans la copier, il faudra en créer une autre.</li>
<li><b>Collez-la ici</b>, dans le champ de la clé de cet écran.</li>
</ol>
<p>Si vous pensez que quelqu'un l'a vue, créez une nouvelle clé sur la même page et cessez d'utiliser l'ancienne.</p>
<div class="nota">Guide officiel d'Anthropic, pas à pas : {guia} (en anglais).</div>

<h2>Lire des documents</h2>
<p>Déposez les PDF dans la zone, ou touchez-la pour les choisir. Ils sont lus l'un après l'autre, et chacun laisse sa ligne dans le journal.</p>

<h2>Le journal</h2>
<p>Quand, quel fichier, avec quel modèle, ce qui en a été tiré — et les <b>doutes</b> que Claude renvoie quand quelque chose n'était pas clair. Ces doutes valent de l'or : ils signalent ce qu'il faut vérifier.</p>
<p>Le journal vit dans le dossier du patient. On ne mélange pas les journaux de deux personnes.</p>`,

<p>El diari viu a l'expedient del pacient. No es barregen els diaris de dues persones.</p>`,

en:`<h1>⚙️ Automatic acquisition</h1>
<div class="sub">Reading PDFs with the API key</div>

<div class="aviso"><b>This mode is not free and needs a “key” to work.</b> Every document Claude reads costs a few cents. If you would rather not use a key, the <b>assisted</b> mode does the same at no cost: you copy the text into claude.ai and bring back the answer.</div>

<h2>The key</h2>
<p>The key is a long string of letters and numbers — it starts with <code>sk-ant-</code> — that gives Salufolio permission to ask Claude to read your documents. It works like a password: it is yours, and you share it with nobody.</p>
<p>It is kept on your device, nowhere else. Neither Salufolio nor anyone else sees it go by.</p>

<h2>How to get it, step by step</h2>
<ol>
<li><b>Open the Claude console</b> in a new tab: {consola}. It is a different site from the claude.ai chat.</li>
<li><b>Create an account</b> (or sign in, if you already have one) with your email address.</li>
<li><b>If the console asks for it</b>, add a payment method or credit. This mode costs a few cents per document (see the notice above).</li>
<li><b>Go to “Settings” and then “API keys”</b> — or go straight there: {claves}.</li>
<li><b>Click “Create key”</b> and give it a name you will recognise, for example “Salufolio”.</li>
<li><b>Copy the key straight away.</b> It is shown only once: if you close the window without copying it, you will have to create another.</li>
<li><b>Paste it here</b>, in the key field on this screen.</li>
</ol>
<p>If you think someone has seen it, create a new key on the same page and stop using the old one.</p>
<div class="nota">Official Anthropic guide, step by step: {guia} (in English).</div>

<h2>Reading documents</h2>
<p>Drop the PDFs into the zone, or tap it to choose them. They are read one after another, and each leaves its line in the log.</p>

<h2>The log</h2>
<p>When, which file, with which model, what was extracted — and the <b>doubts</b> Claude sends back when something was unclear. Those doubts are gold: they point to what needs checking.</p>
<p>The log lives in the patient's record. Two people's logs are never mixed.</p>`

function liga(t, l){
  return t.replace(/\{(\w+)\}/g, function(m, k){
    var u = ENLACES[k]; if(!u) return m;
    if(typeof u === 'object') u = u[l] || u.en;
    return '<a href="' + u + '" target="_blank" rel="noopener">' + u.replace(/^https:\/\//, '') + '</a>';
  });
}
Object.keys(A).forEach(function(l){ A[l] = liga(A[l], l); });
SF_AYUDA.arranca(A);
